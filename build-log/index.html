<meta charset="utf-8">
<title>Vegas Sidekick — Build Log</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

  :root{
    --void:#0b0518; --night:#160a30; --night2:#241048; --panel:#170b32; --panel2:#1e0f3e;
    --line:rgba(198,163,255,.16); --line2:rgba(198,163,255,.28);
    --text:#f3eeff; --muted:#a99fce; --dim:#7d75a3;
    --blue:#5b95ff; --blue-deep:#3b82f6; --pink:#ff2e7e; --lime:#c6f22e; --purple:#a855f7; --teal:#22c7db;
    --radius:16px;
    --disp:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--void); color:var(--text); font-family:var(--body);
    line-height:1.65; -webkit-font-smoothing:antialiased; overflow-x:hidden;
    background-image:
      radial-gradient(900px 500px at 82% -8%, rgba(124,58,237,.38), transparent 60%),
      radial-gradient(760px 460px at 8% 8%, rgba(255,46,126,.16), transparent 55%),
      radial-gradient(700px 620px at 50% 108%, rgba(15,181,201,.14), transparent 60%);
    background-attachment:fixed;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  h1,h2,h3,.disp{font-family:var(--disp);letter-spacing:-.02em;line-height:1.03;text-wrap:balance}
  a{color:var(--blue);text-decoration:none}
  ::selection{background:var(--pink);color:#12061f}

  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--purple)}

  /* HERO */
  header.hero{position:relative;padding:96px 0 60px;text-align:center;overflow:hidden}
  .mark{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.8rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--line);border-radius:100px;padding:8px 16px;margin-bottom:30px;background:rgba(255,255,255,.03)}
  .mark b{color:var(--lime);letter-spacing:.24em}
  .wordmark{font-family:var(--disp);font-weight:800;font-size:clamp(3.1rem,10vw,6.6rem);letter-spacing:-.03em;line-height:.92}
  .wordmark .v{color:#fff;text-shadow:0 0 26px rgba(91,149,255,.55)}
  .wordmark .s{color:var(--pink);text-shadow:0 0 30px rgba(255,46,126,.65),0 0 60px rgba(255,46,126,.35)}
  .tagline{font-family:var(--disp);font-weight:700;font-size:clamp(1.15rem,3vw,1.7rem);margin-top:22px;
    background:linear-gradient(90deg,var(--pink),var(--lime));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .lede{max-width:56ch;margin:16px auto 0;color:var(--muted);font-size:1.05rem}
  .updated{margin-top:26px;font-family:var(--mono);font-size:.74rem;color:var(--dim);letter-spacing:.06em}
  .glowline{height:2px;width:min(680px,86%);margin:44px auto 0;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--blue),var(--pink),var(--lime),transparent);opacity:.8}

  section{padding:64px 0}
  .sec-head{display:flex;flex-direction:column;gap:8px;margin-bottom:34px}
  .sec-head h2{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800}

  /* STATS */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .stat{border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px;background:linear-gradient(180deg,var(--panel),rgba(23,11,50,.4))}
  .stat .n{font-family:var(--disp);font-weight:800;font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
  .stat:nth-child(1) .n{color:var(--lime)} .stat:nth-child(2) .n{color:var(--pink)}
  .stat:nth-child(3) .n{color:var(--blue)} .stat:nth-child(4) .n{color:var(--teal)}
  .stat .l{margin-top:8px;color:var(--muted);font-size:.9rem}

  /* BRAND SNAPSHOT */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .card{border:1px solid var(--line);border-radius:var(--radius);padding:26px;background:linear-gradient(180deg,var(--panel),rgba(20,10,44,.35))}
  .card h3{font-size:1.15rem;margin-bottom:14px}
  .swatches{display:flex;flex-wrap:wrap;gap:10px}
  .sw{flex:1 1 92px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.2)}
  .sw .chip{height:46px}
  .sw .meta{padding:7px 9px;font-family:var(--mono);font-size:.66rem;color:var(--muted);line-height:1.3}
  .sw .meta b{display:block;color:var(--text);font-size:.72rem;letter-spacing:.02em}
  .typerow{display:flex;flex-direction:column;gap:14px}
  .typ{border-bottom:1px dashed var(--line);padding-bottom:12px}
  .typ:last-child{border:0;padding:0}
  .typ .big{font-family:var(--disp);font-weight:800;font-size:1.7rem}
  .typ .big.body{font-family:var(--body);font-weight:600}
  .typ .big.mono{font-family:var(--mono);font-weight:500;font-size:1.3rem}
  .typ .cap{font-family:var(--mono);font-size:.68rem;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
  .voice li{list-style:none;padding:9px 0 9px 26px;position:relative;color:var(--muted)}
  .voice li::before{content:"";position:absolute;left:0;top:15px;width:11px;height:2px;background:var(--lime);box-shadow:0 0 8px var(--lime)}
  .voice li b{color:var(--text);font-weight:600}

  /* FOUNDER */
  .founder{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;
    border:1px solid var(--line2);border-radius:var(--radius);padding:26px;
    background:radial-gradient(400px 200px at 12% 0,rgba(255,46,126,.12),transparent 60%),linear-gradient(180deg,var(--panel2),rgba(20,10,44,.5))}
  .founder img{width:132px;height:132px;border-radius:16px;display:block;
    box-shadow:0 0 0 1px rgba(91,149,255,.4),0 12px 34px rgba(124,58,237,.5),0 0 40px rgba(34,199,219,.28)}
  .founder h3{font-size:1.35rem}
  .founder .role{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:4px 0 12px}
  .founder p{color:var(--muted);font-size:.98rem}
  .founder .favs{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
  .tag{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line2);border-radius:100px;padding:5px 12px;color:var(--text);background:rgba(255,255,255,.03)}

  /* TIMELINE */
  .tl{position:relative;margin-top:8px;padding-left:30px}
  .tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;
    background:linear-gradient(180deg,var(--blue),var(--pink),var(--lime))}
  .ev{position:relative;padding:0 0 30px 8px}
  .ev::before{content:"";position:absolute;left:-30px;top:4px;width:16px;height:16px;border-radius:50%;
    background:var(--void);border:2px solid var(--pink);box-shadow:0 0 12px var(--pink)}
  .ev.blue::before{border-color:var(--blue);box-shadow:0 0 12px var(--blue)}
  .ev.lime::before{border-color:var(--lime);box-shadow:0 0 12px var(--lime)}
  .ev.teal::before{border-color:var(--teal);box-shadow:0 0 12px var(--teal)}
  .ev .date{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .ev h4{font-family:var(--disp);font-weight:700;font-size:1.12rem;margin:3px 0 5px}
  .ev p{color:var(--muted);font-size:.95rem;max-width:64ch}
  .ev .metric{display:inline-block;margin-top:7px;font-family:var(--mono);font-size:.72rem;color:var(--lime);
    border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:rgba(198,242,46,.06)}
  .era{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--purple);
    margin:8px 0 18px;padding-left:8px}

  /* PRIMER */
  .primer{border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden;background:#0a0416}
  .primer .bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:.74rem;color:var(--muted);background:rgba(255,255,255,.02)}
  .primer .dot{width:11px;height:11px;border-radius:50%}
  .primer .body{padding:22px 24px;font-family:var(--mono);font-size:.82rem;line-height:1.85;color:#d7cff2}
  .primer .body .k{color:var(--teal)} .primer .body .p{color:var(--pink)} .primer .body .g{color:var(--lime)}
  .primer .body .c{color:var(--dim)}
  .files{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}
  .file{font-family:var(--mono);font-size:.76rem;border:1px solid var(--line2);border-radius:8px;padding:8px 13px;color:var(--text);background:rgba(255,255,255,.03)}
  .file b{color:var(--lime)}

  footer{padding:50px 0 70px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:.76rem;letter-spacing:.06em}
  footer .glowline{margin-bottom:30px}

  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}

  @media(max-width:820px){
    .stats{grid-template-columns:1fr 1fr}
    .grid2{grid-template-columns:1fr}
    .founder{grid-template-columns:1fr;text-align:center}
    .founder img{margin:0 auto}
    .founder .favs{justify-content:center}
  }
  @media(prefers-reduced-motion:reduce){.reveal{transition:none;opacity:1;transform:none}*{animation:none!important}}

  #lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  #lock .box{width:100%;max-width:420px;text-align:center;border:1px solid var(--line2);border-radius:20px;padding:38px 30px;background:radial-gradient(320px 160px at 50% 0,rgba(255,46,126,.14),transparent 60%),linear-gradient(180deg,var(--panel2),rgba(20,10,44,.6))}
  #lock .cactus{font-size:2.2rem}
  #lock h1{font-family:var(--disp);font-size:1.9rem;font-weight:800;margin:12px 0 4px}
  #lock h1 .s{color:var(--pink)}
  #lock .sub{font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  #lock form{margin-top:26px;display:flex;flex-direction:column;gap:12px}
  #lock input{font-family:var(--body);font-size:1rem;padding:13px 16px;border-radius:11px;border:1px solid var(--line2);background:rgba(0,0,0,.35);color:var(--text);outline:none}
  #lock input:focus{border-color:var(--blue-deep);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
  #lock button{font-family:var(--disp);font-weight:700;font-size:1rem;padding:13px 16px;border:none;border-radius:11px;cursor:pointer;background:var(--blue-deep);color:#fff;box-shadow:0 10px 26px rgba(59,130,246,.4);transition:transform .15s,box-shadow .15s}
  #lock button:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(59,130,246,.5)}
  #lock button:disabled{opacity:.6;cursor:default;transform:none}
  #lock .err{min-height:20px;color:#ff5a6a;font-size:.86rem}
  #lock .note{margin-top:18px;font-size:.76rem;color:var(--dim)}
  #content{display:none}
  @media(prefers-reduced-motion:reduce){#lock button{transition:none}}
</style>

  <h1>Vegas <span class="s">Sidekick</span></h1>
  <div class="sub">Build Log · Confidential</div>
  <form id="f" autocomplete="off">

    <button id="btn" type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div class="note">This page is private. If you don't have the passphrase, you're not meant to be here.</div>
</div></div>
