<html lang="en">
<head>

<style>
  :root{
    --navy:#0A0F2C;
    --blue:#1A6BFF;
    --orange:#FF6B2B;
    --paper:#F4F6FF;
    --dim:#8b96c4;
  }
  *{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{height:100%}
  body{
    background: radial-gradient(circle at 50% 0%, #1a1450 0%, #0A0F2C 60%);
    color:var(--paper);
    font-family:'Nunito',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-user-select:none;
    user-select:none;
    padding-top:100px;
  }
  #vs-header, #vs-footer{ align-self:stretch; width:100%; }
  @media(max-width:900px){ body{ padding-top:88px; } }
  #game-app{
    width:100%;
    max-width:560px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    height:calc(100vh - 100px);
    overflow:hidden;
    touch-action:none;
  }
  @media(max-width:900px){ #game-app{ height:calc(100vh - 88px); } }
  header{
    width:100%;
    max-width:560px;
    padding:14px 16px 2px;
    text-align:center;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(30px,8vw,46px);
    letter-spacing:.1em;
    line-height:1;
    background: linear-gradient(90deg, #FF6B2B, #FFD23F, #1A6BFF, #FF3CAC);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: hueSlide 6s linear infinite;
  }
  @keyframes hueSlide {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  .tagline{
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--dim);
    margin-top:2px;
  }
  .hud{
    width:100%;
    max-width:560px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 18px 4px;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:22px;
  }
  .hud .label{
    font-size:9px;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    color:var(--dim);
    letter-spacing:.1em;
    text-transform:uppercase;
    display:block;
    margin-bottom:-2px;
  }
  .hud .val{ color:#fff; }
  .hud .val.orange{ color:var(--orange); }
  .hud .val.gold{ color:#FFD23F; }
  #soundBtn{
    background:none; border:1px solid rgba(255,255,255,0.25); color:var(--dim);
    border-radius:20px; padding:4px 10px; font-size:14px; cursor:pointer;
  }

  #stage{
    position:relative;
    width:100%;
    max-width:560px;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2px 8px 6px;
  }
  canvas{
    background: linear-gradient(180deg, #120c38 0%, #0A0F2C 70%, #150a24 100%);
    border-radius:10px;
    box-shadow:0 0 0 1px rgba(255,210,63,0.25), 0 20px 60px rgba(0,0,0,0.5);
    max-height:100%;
    max-width:100%;
    touch-action:none;
    display:block;
  }

  #dropBar{
    width:100%;
    max-width:560px;
    display:flex;
    justify-content:center;
    padding:8px 16px 14px;
  }
  #dropBtn{
    background: linear-gradient(90deg, #FF6B2B, #FFD23F);
    color:var(--navy);
    border:none;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:20px;
    padding: 14px 44px;
    border-radius: 50px;
    cursor:pointer;
    box-shadow: 0 4px 0 #b8501a, 0 8px 24px rgba(255,107,43,0.45);
    letter-spacing:.04em;
  }
  #dropBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #b8501a; }
  #dropBtn:disabled{ opacity:0.5; cursor:default; }

  #overlay{
    position:absolute; inset:0;
    background:rgba(10,15,44,0.94);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:24px;
    z-index:10;
    border-radius:10px;
  }
  #overlay.hidden{ display:none; }
  #overlay .badge{
    display:inline-block;
    background: rgba(255,210,63,0.15);
    border: 1px solid #FFD23F;
    color:#FFD23F;
    font-size:10px;
    padding: 4px 10px;
    border-radius:20px;
    margin-bottom:14px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  #overlay h2{
    font-family:'Bebas Neue',sans-serif;
    font-size:34px;
    letter-spacing:.08em;
    color:var(--orange);
    margin-bottom:6px;
  }
  #overlay .sub{
    color:var(--dim);
    font-size:14px;
    max-width:280px;
    line-height:1.5;
    margin-bottom:18px;
  }
  #overlay button{
    background: linear-gradient(90deg, #FF6B2B, #FFD23F);
    color:var(--navy);
    border:none;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:17px;
    padding: 13px 34px;
    border-radius: 40px;
    cursor:pointer;
    box-shadow: 0 4px 0 #b8501a;
    letter-spacing:.03em;
  }
  #overlay button:active{ transform:translateY(3px); box-shadow:0 1px 0 #b8501a; }

  #toast{
    position:absolute;
    top:12px; left:50%;
    transform:translate(-50%,-10px) scale(0.9);
    background:linear-gradient(90deg,#FF6B2B,#FFD23F);
    color:var(--navy);
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:17px;
    padding:8px 20px;
    border-radius:24px;
    opacity:0;
    transition:opacity .2s, transform .2s;
    pointer-events:none;
    z-index:8;
    white-space:nowrap;
    box-shadow: 0 6px 20px rgba(255,107,43,0.5);
  }
  #toast.show{ opacity:1; transform:translate(-50%,0) scale(1); }

  #cactusMark{
    position:absolute; bottom:6px; right:10px;
    font-size:14px; opacity:0.5; z-index:5;
  }

:root{--navy:#160d29;--blue:#7c3aed;--orange:#ffb000;--paper:#fff;--dim:#d4c2e2}
body{background:radial-gradient(circle at 50% 0%,#482265 0%,#160d29 72%);padding-top:72px}
@media(max-width:900px){body{padding-top:70px}}
#game-app{height:calc(100dvh - 72px)}
@media(max-width:900px){#game-app{height:calc(100dvh - 70px)}}
header{padding:9px 12px 3px}
h1{letter-spacing:.07em;background:none;color:#fff;animation:none;font-size:clamp(32px,8vw,48px)}
.tagline{color:#c6f22e;font-size:10px;letter-spacing:.06em}
.hud{padding:8px 14px 7px;background:#ffffff08;border-top:1px solid #ffffff13;border-bottom:1px solid #ffffff13}
.hud .val.gold{color:#ffca46}.hud .val.orange{color:#c6f22e}
.hud .val{font-size:clamp(17px,5vw,23px);font-variant-numeric:tabular-nums}
#stage{min-height:0}canvas{background:linear-gradient(180deg,#291443 0%,#160d29 75%,#23123a 100%);border-radius:15px}
#dropBar{padding:8px 12px max(12px,env(safe-area-inset-bottom))}
#dropBtn,#overlay button{background:#ffb000;color:#241332;box-shadow:0 4px 0 #ac7412;font-weight:800}
#dropBtn{width:min(390px,100%);padding:11px 18px}
#overlay{background:#1a102ded}
#overlay .badge{display:flex;align-items:center;justify-content:center;gap:8px;color:#c6f22e;border-color:#c6f22e;padding:6px 12px}
.spike-badge{width:42px;height:42px;object-fit:cover;border-radius:50%}
#overlay h2{color:#ffb000}#overlay .sub{color:#e1d3ed;max-width:320px}
#cactusMark{bottom:10px;right:14px;opacity:.85}#cactusMark img{width:33px;height:33px;border-radius:50%;object-fit:cover}
#toast{background:#ffb000;color:#241332}
#overlay .bigscore{font-size:clamp(32px,9vw,46px)!important;overflow-wrap:anywhere}
#overlay .spike-line{font-size:13px;color:#e9deef;line-height:1.45;max-width:290px;margin:12px auto}
#overlay .share-score{margin:0 0 12px;background:transparent;color:#c6f22e;border:1px solid #c6f22e;box-shadow:none;padding:9px 23px}
@media(max-width:420px){.hud{gap:10px}.hud .label{font-size:8px}#soundBtn{padding:4px 8px}}
@media(prefers-reduced-motion:reduce){h1{animation:none}}

.game-title{display:flex;justify-content:center;align-items:center;gap:12px}
.title-spike{width:48px;height:48px;object-fit:cover;border-radius:50%;border:2px solid #ffb000;box-shadow:0 0 13px #ffb00055}
#game-app{min-height:0}#stage{overflow:hidden;padding:1px 8px 3px}
#dropBar{flex-shrink:0;padding:7px 12px max(10px,env(safe-area-inset-bottom))}
#dropBtn{min-height:48px}
@media(max-width:480px){.game-title{gap:9px}.title-spike{width:39px;height:39px}h1{font-size:clamp(27px,7.5vw,39px)}header{padding:5px 8px 2px}.hud{padding:5px 12px}#dropBar{padding:5px 10px max(8px,env(safe-area-inset-bottom))}}

/* Never let the canvas push the gold drop control below the mobile viewport. */
#game-app{height:auto;min-height:0;overflow:hidden}
#game-app>header,.hud,#dropBar{flex-shrink:0}
#stage{flex:1 1 auto;min-height:0;overflow:hidden}
#dropBar{position:relative;z-index:11;background:#160d29;padding:8px 12px max(12px,env(safe-area-inset-bottom))}
#dropBtn{min-height:50px;width:min(390px,100%);display:block}
@media(max-width:480px){#dropBar{padding:7px 10px max(12px,env(safe-area-inset-bottom))}}
</style>

<body>
<div id="vs-header"></div>

<div id="game-app">
<header>
  <div class="game-title"><img src="/images/brand/spike-podcast-badge.webp" alt="Spike the cactus" class="title-spike"><h1>SPIKE’S PLINKO</h1></div>
  <div class="tagline">Five golden drops · Millions of imaginary points</div>
</header>

<div class="hud">
  <div><span class="label">Score</span><span class="val gold" id="scoreVal">0</span></div>
  <div><span class="label">Balls left</span><span class="val" id="dropsVal">5</span></div>
  <div><span class="label">Best</span><span class="val orange" id="bestVal">0</span></div>
  <button id="soundBtn">🔇</button>
</div>

<div id="stage">
  <canvas id="game"></canvas>
  <div id="toast"></div>
  <div id="overlay">
    <div class="badge"><img class="spike-badge" src="/images/brand/spike-podcast-badge.webp" alt="Spike"> SPIKE’S PLINKO</div>
    <h2 id="overlayTitle">SPIKE’S PLINKO</h2>
    <div class="sub" id="overlaySub">Aim the glowing gold ball, then release. Or tap the board to choose a drop position. Five balls per round. No cash value.</div>
    <button id="mainBtn">START DROPPING</button>
  </div>

</div>

<div id="dropBar">
  <button id="dropBtn">DROP GOLD BALL ↓</button>
</div>
</div>

<div id="vs-footer"></div>
<script src="/components/header.js?v=21"></script>
<script src="/components/footer.js?v=16"></script>

<script>
const fmt=n=>Number(n).toLocaleString('en-US');
const spikeBallImage=new Image();
spikeBallImage.src='/images/brand/spike-podcast-badge.webp';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlaySub = document.getElementById('overlaySub');
const mainBtn = document.getElementById('mainBtn');
const scoreVal = document.getElementById('scoreVal');
const dropsVal = document.getElementById('dropsVal');
const bestVal = document.getElementById('bestVal');
const soundBtn = document.getElementById('soundBtn');
const toast = document.getElementById('toast');
const dropBtn = document.getElementById('dropBtn');

function safeGet(k){ try{ return localStorage.getItem(k);}catch(e){return null;} }
function safeSet(k,v){ try{ localStorage.setItem(k,v);}catch(e){} }

// ---------- Board layout ----------
const ROWS = 7;       // peg rows
const SLOT_COUNT = 9;  // bottom slots
let W, H, CELL;
const chipR = 16;
let chipX = 0;
let chipY = 30;
let dragging = false;
let dragOffsetX = 0;

function computeSize(){
  const app = document.getElementById('game-app');
  const viewport = window.visualViewport;
  // Header height varies by device; use the game's actual on-screen position.
  // Reserve the bottom button BEFORE sizing the canvas.
  const viewportBottom = viewport ? viewport.offsetTop + viewport.height : window.innerHeight;
  const top = app.getBoundingClientRect().top;
  const available = Math.max(310, viewportBottom - top - 8);
  app.style.height = Math.round(available) + 'px';
  const stage = document.getElementById('stage');
  const title = app.querySelector('header');
  const hud = app.querySelector('.hud');
  const controls = document.getElementById('dropBar');
  const stageHeight = available - title.offsetHeight - hud.offsetHeight - controls.offsetHeight;
  W = Math.max(250, Math.min(560, window.innerWidth) - 16);
  H = Math.max(170, Math.min(620, stageHeight - 8));
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  if (!chipX) chipX = W/2;
  chipX = Math.max(chipR+2, Math.min(W-chipR-2, chipX));
  buildPegs();
}
window.addEventListener('resize', computeSize);
if(window.visualViewport)window.visualViewport.addEventListener('resize',computeSize);
window.addEventListener('load',computeSize);
// The shared site header is inserted after initial parsing, so remeasure when it appears.
if(window.ResizeObserver){
  const header = document.getElementById('vs-header');
  if(header)new ResizeObserver(()=>requestAnimationFrame(computeSize)).observe(header);
}

// ---------- Glowing gold ball rendering ----------
// Gold balls are drawn with canvas gradients.

// ---------- Audio ----------
let audioCtx = null;
let soundOn = false;
function initAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq, dur, type='sine', vol=0.06){
  if (!soundOn || !audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(audioCtx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.stop(audioCtx.currentTime + dur);
}
function sfxPeg(){ beep(500 + Math.random()*300, 0.05, 'triangle', 0.035); }
function sfxLand(mult){
  if (mult >= 20) { [660,880,1100,1320].forEach((f,i)=> setTimeout(()=>beep(f,0.18,'triangle',0.08), i*70)); }
  else if (mult >= 5) { [660,880].forEach((f,i)=> setTimeout(()=>beep(f,0.15,'triangle',0.06), i*70)); }
  else { beep(400,0.15,'square',0.05); }
}
soundBtn.onclick = () => {
  initAudio();
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) beep(660,0.1,'triangle',0.05);
};

// ---------- Slots ----------
// symmetric multiplier distribution, center low, edges high (classic plinko risk curve)
const SLOTS = [
{mult:1,label:'POINTS',color:'#9566e9'},
{mult:2,label:'SOLID',color:'#0fb5c9'},
{mult:5,label:'NICE',color:'#c6f22e'},
{mult:10,label:'BIG WIN',color:'#ff2e7e'},
{mult:50,label:'JACKPOT',color:'#ffb000'},
{mult:10,label:'BIG WIN',color:'#ff2e7e'},
{mult:5,label:'NICE',color:'#c6f22e'},
{mult:2,label:'SOLID',color:'#0fb5c9'},
{mult:1,label:'POINTS',color:'#9566e9'}
];

const PEG_COLORS = ['#c6f22e','#ffb000','#9566e9','#0fb5c9','#ff2e7e'];

let pegs = [];
function buildPegs(){
 pegs=[];
 const top=78,bottom=Math.max(top+90,H-123),dy=(bottom-top)/(ROWS-1);
 const cols=7,spacing=(W-64)/(cols-1);
 for(let row=0;row<ROWS;row++){
  const y=top+row*dy,offset=(row%2)*spacing*.5;
  for(let col=0;col<cols;col++){
   const x=32+col*spacing+offset;
   if(x>W-23)continue;
   pegs.push({x,y,r:4.4,hitFlash:0,color:PEG_COLORS[(row+col)%PEG_COLORS.length]});
  }
 }
 for(const y of [top+dy*1.5,top+dy*4.5]){
  pegs.push({x:13,y,r:5,hitFlash:0,color:'#ffb000'});
  pegs.push({x:W-13,y,r:5,hitFlash:0,color:'#ffb000'});
 }
}

// ---------- Game state ----------
let state = 'menu';
let score = 0;
let best = parseInt(safeGet('spike_plinko_best_v1') || '0');
let dropsLeft = 5;
bestVal.textContent = fmt(best);
dropsVal.textContent = dropsLeft;

let balls = []; // active falling balls
let confetti = [];
let slotFlash = new Array(SLOT_COUNT).fill(0);

function resetGame(){
  score = 0;
  dropsLeft = 5;
  balls = [];
  confetti = [];
  slotFlash = new Array(SLOT_COUNT).fill(0);
  scoreVal.textContent = fmt(score);
  dropsVal.textContent = dropsLeft;
  updateDropBtn();
}

function updateDropBtn(){
  dropBtn.disabled = (dropsLeft <= 0) || (state !== 'playing') || balls.some(b=>!b.settled);
  dropBtn.textContent = dropsLeft > 1 ? `DROP GOLD BALL (${dropsLeft} LEFT)` : dropsLeft===1 ? 'DROP THE WILD SPIKE BALL 🌵' : 'ROUND COMPLETE';
  dropsVal.textContent = Math.max(0, dropsLeft);
}

function dropBall(atX){
  if (state !== 'playing' || dropsLeft <= 0 || balls.some(b=>!b.settled)) return;
  initAudio();
  dropsLeft--;
  updateDropBtn();
  const startX = (atX !== undefined) ? atX : chipX;
  const clampedX = Math.max(chipR+2, Math.min(W-chipR-2, startX));
  if(dropsLeft===0)showToast('FINAL BALL: SPIKE UNLEASHED!');
  balls.push({
    x: clampedX, y: chipY,
    vx: (Math.random()-0.5)*3,
    vy: 0,
    r: 14,
    trail: [],
    settled: false,
    squashX: 1, squashY: 1, spin: 0, spinV: (Math.random()-0.5)*0.4,
    phase: 'falling',wild:dropsLeft===0,wildTicks:0,
    wildSeed:Math.random()*Math.PI*2,
    wildLandingX:Math.max(chipR+4,Math.min(W-chipR-4,clampedX+(Math.random()-.5)*W*.72))
  });
}
dropBtn.onclick = () => dropBall();

// ---------- Drag-to-aim chip ----------
function canvasPoint(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  return { x: (clientX-rect.left)*scaleX, y: (clientY-rect.top)*scaleY };
}
function chipHit(px, py){
  return Math.hypot(px-chipX, py-chipY) < chipR + 14;
}
function startDrag(clientX, clientY){
  if (state !== 'playing' || dropsLeft <= 0 || balls.some(b=>!b.settled)) return;
  const p = canvasPoint(clientX, clientY);
  dragging=true;
  dragOffsetX=chipHit(p.x,p.y)?chipX-p.x:0;
  chipX=Math.max(chipR+2,Math.min(W-chipR-2,p.x+dragOffsetX));
  initAudio();
}
function moveDrag(clientX, clientY){
  if (!dragging) return;
  const p = canvasPoint(clientX, clientY);
  chipX = Math.max(chipR+2, Math.min(W-chipR-2, p.x + dragOffsetX));
}
function endDrag(){
  if (!dragging) return;
  dragging = false;
  dropBall(chipX);
}
canvas.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
window.addEventListener('mouseup', endDrag);
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  startDrag(t.clientX, t.clientY);
}, {passive:true});
canvas.addEventListener('touchmove', e => {
  if (dragging) e.preventDefault();
  const t = e.touches[0];
  moveDrag(t.clientX, t.clientY);
}, {passive:false});
canvas.addEventListener('touchend', endDrag, {passive:true});

// ---------- Toast ----------
let toastTimer = null;
function showToast(text){
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove('show'), 1400);
}

function spawnConfettiBurst(x,y,color,scale=1){
  const count = Math.round(26 * scale);
  for (let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = (2 + Math.random()*4) * Math.min(1.8, scale);
    confetti.push({
      x, y,
      vx: Math.cos(ang)*spd,
      vy: Math.sin(ang)*spd - 2,
      life: 1,
      size: (3+Math.random()*4) * Math.min(1.5, scale),
      color: Math.random() < 0.5 ? color : ['#FF6B2B','#FFD23F','#1A6BFF','#FF3CAC','#3FE0C5'][Math.floor(Math.random()*5)],
      rot: Math.random()*Math.PI*2,
      vrot: (Math.random()-0.5)*0.3
    });
  }
}

// ---------- Screen shake (big wins) ----------
let shakeMag = 0;
function triggerShake(mag){ shakeMag = Math.max(shakeMag, mag); }

// ---------- Physics update ----------
const GRAVITY = 0.66;
function updateBalls(){
  const slotAreaTop = H - 70;
  const slotW = W / SLOT_COUNT;
  const chaosZoneBottom = Math.min(H*0.32, 170);

  for (const b of balls) {
    if (b.settled) continue;

    b._stuckTimer = (b._stuckTimer || 0);
    b._age = (b._age || 0) + 1;

    // ---- CHAOS PRE-DROP PHASE ----
    // ball zips around a bounded top zone at high erratic speed for ~3s,
    // randomly changing direction, before releasing into normal gravity fall
    if (b.phase === 'chaos') {
      b.chaosT += 1/60;

      // random erratic direction changes — total madness
      if (Math.random() < 0.18) {
        b.chaosVX = (Math.random()-0.5)*16;
        b.chaosVY = (Math.random()-0.5)*14;
        sfxPeg();
      }

      b.x += b.chaosVX;
      b.y += b.chaosVY;

      // bounce off the chaos zone bounds (top strip of the board)
      const zoneTop = b.r+4;
      const zoneBottom = chaosZoneBottom;
      if (b.x < b.r) { b.x = b.r; b.chaosVX = Math.abs(b.chaosVX); squashBall(b,1); }
      if (b.x > W-b.r) { b.x = W-b.r; b.chaosVX = -Math.abs(b.chaosVX); squashBall(b,1); }
      if (b.y < zoneTop) { b.y = zoneTop; b.chaosVY = Math.abs(b.chaosVY); squashBall(b,1); }
      if (b.y > zoneBottom) { b.y = zoneBottom; b.chaosVY = -Math.abs(b.chaosVY); squashBall(b,1); }

      b.spinV = (b.spinV||0) + (Math.random()-0.5)*2.2;
      b.spin = (b.spin||0) + b.spinV;
      b.spinV *= 0.9;
      b.squashX = b.squashX === undefined ? 1 : b.squashX + (1 - b.squashX)*0.3;
      b.squashY = b.squashY === undefined ? 1 : b.squashY + (1 - b.squashY)*0.3;

      b.trail.push({x:b.x, y:b.y, color: PEG_COLORS[Math.floor(b.chaosT*8) % PEG_COLORS.length]});
      if (b.trail.length > 14) b.trail.shift();

      if (b.chaosT >= b.chaosDur) {
        // release into normal fall from current (random) position
        b.phase = 'falling';
        b.vx = b.chaosVX * 0.4;
        b.vy = Math.max(0, b.chaosVY * 0.3);
      }
      continue; // skip normal gravity/peg physics this frame while in chaos
    }

    if(b.wild){
      b.wildTicks++;
      const t=b.wildTicks;
      // Spike gets 2.5 seconds of scripted, impossible movement.
      // It changes direction, hovers, teleports, then returns to real Plinko physics.
      if(t<=150){
        const span=Math.max(20,W-b.r*2);
        if(t===1){b.y=H*.32;b.x=Math.max(b.r,Math.min(W-b.r,b.wildLandingX));showToast('SPIKE HAS LOST CONTROL');}
        if(t<35){b.x+=Math.min(14,span*.04)*Math.cos(b.wildSeed);b.y+=Math.sin(t*.4+b.wildSeed)*2;}
        else if(t<65){b.x-=Math.min(20,span*.055)*Math.cos(b.wildSeed);b.y-=3.6;}
        else if(t===65){b.x=Math.max(b.r,Math.min(W-b.r,W-b.wildLandingX));b.y=H*.43;spawnConfettiBurst(b.x,b.y,'#c6f22e',1.2);triggerShake(6);}
        else if(t<97){b.x+=Math.sin(t*.5+b.wildSeed)*9;b.y+=Math.sin(t*.28+b.wildSeed)*1.1;}
        else if(t===97){b.x=b.wildLandingX;b.y=H*.53;triggerShake(7);}
        else {b.x+=Math.cos(t*.4+b.wildSeed)*7;b.y+=2.5;}
        b.x=Math.max(b.r,Math.min(W-b.r,b.x));
        b.y=Math.max(b.r,Math.min(H-105,b.y));
        b.trail.push({x:b.x,y:b.y,color:'#c6f22e'});
        if(b.trail.length>22)b.trail.shift();
        if(t%18===0)triggerShake(2.5);
        if(t===150){
          // Relaunch through several real peg rows from a randomized lateral position.
          b.x=Math.max(b.r,Math.min(W-b.r,b.wildLandingX));
          b.y=Math.min(H-205,Math.max(65,H*.37));
          b.vx=(Math.random()-.5)*7;b.vy=2+Math.random()*2;
        }
        continue;
      }
    }
    const pace=b.wild?1:.8;
    b.vy += GRAVITY*(b.wild?1.3:1);
    b.x += b.vx*pace;
    b.y += b.vy*pace;
    b.vx *= 0.995;

    // squash/stretch decay back to normal
    b.squashX = b.squashX === undefined ? 1 : b.squashX + (1 - b.squashX)*0.25;
    b.squashY = b.squashY === undefined ? 1 : b.squashY + (1 - b.squashY)*0.25;
    b.spin = (b.spin || 0) + (b.spinV || 0);
    b.spinV = (b.spinV || 0) * 0.96;

    // trail
    b.trail.push({x:b.x, y:b.y});
    if (b.trail.length > 12) b.trail.shift();

    // wall bounds — comical hard bounce
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx)*0.9 + 1.2; squashBall(b,1); }
    if (b.x > W-b.r) { b.x = W-b.r; b.vx = -Math.abs(b.vx)*0.9 - 1.2; squashBall(b,1); }

    // peg collisions — big comic bounce with strong randomized kick
    for (const p of pegs) {
      const dx = b.x - p.x, dy = b.y - p.y;
      const dist = Math.hypot(dx,dy);
      const minDist = b.r + p.r;
      if (dist < minDist) {
        let nx, ny;
        if (dist > 0.001) { nx = dx/dist; ny = dy/dist; }
        else { const a = Math.random()*Math.PI*2; nx = Math.cos(a); ny = Math.sin(a); }

        b.x = p.x + nx*(minDist+0.5);
        b.y = p.y + ny*(minDist+0.5);

        // proper reflection off the peg normal with restitution >1 for comic bounce energy;
        // sideways randomness only — vy is never re-randomized directly so gravity always
        // wins over time and the ball can't loop forever between two pegs
        const dot = b.vx*nx + b.vy*ny;
        const restitution = b.wild && b.wildTicks < 115 ? .72 : .48;
        b.vx -= (1+restitution)*dot*nx;
        b.vy -= (1+restitution)*dot*ny;
        b.vx += (Math.random()-0.5)*(b.wild?2.2:1.25);
        if(!b.wild)b.vy=Math.max(1.6,b.vy);

        const spd = Math.hypot(b.vx, b.vy);
        if(spd<1.8)b.vy=Math.max(2,b.vy);
        if (spd > 15) { const cap = 15/spd; b.vx*=cap; b.vy*=cap; }

        b.spinV = (b.spinV||0) + (Math.random()-0.5)*1.4;
        squashBall(b, Math.min(1, spd/8));
        p.hitFlash = 1;
        sfxPeg();
      }
    }

    // anti-stuck watchdog
    const speed = Math.hypot(b.vx, b.vy);
    if (speed < 1.5 && b.y < slotAreaTop - 10) {
      b._stuckTimer++;
      if (b._stuckTimer > 18) {
        b.vx += (Math.random()-0.5)*6;
        b.vy += 2 + Math.random()*2;
        b._stuckTimer = 0;
      }
    } else {
      b._stuckTimer = 0;
    }

    // absolute failsafe
    if(b._age>220 && b.y<H-96){b.vy=Math.max(b.vy,5);b.vx*=.92;}
    if (b._age > 410) {
      b.y = H - b.r - 6;
      b.settled = true;
      const slotIdx = Math.max(0, Math.min(SLOT_COUNT-1, Math.floor(b.x / slotW)));
      landBall(b, slotIdx);
      continue;
    }

    if (b.y > slotAreaTop && !b.settled) {
      b.vy = Math.min(b.vy, 8);
      if (b.y > H - b.r - 6) {
        b.y = H - b.r - 6;
        b.settled = true;
        const slotIdx = Math.max(0, Math.min(SLOT_COUNT-1, Math.floor(b.x / slotW)));
        landBall(b, slotIdx);
      }
    }
  }

  for(const b of balls) if(b.settled)b._settledAge=(b._settledAge||0)+1;
  balls=balls.filter(b=>!b.settled||b._settledAge<35);
  updateDropBtn();

  for (const p of pegs) p.hitFlash *= 0.9;
  for (let i=0;i<SLOT_COUNT;i++) slotFlash[i] *= 0.92;

  for (const c of confetti) {
    c.vy += 0.12;
    c.x += c.vx; c.y += c.vy;
    c.rot += c.vrot;
    c.life -= 0.014;
  }
  confetti = confetti.filter(c => c.life > 0);

  shakeMag *= 0.88;
  if (shakeMag < 0.05) shakeMag = 0;
}

function squashBall(b, intensity){
  b.squashX = 1 + intensity*0.5;
  b.squashY = 1 - intensity*0.35;
}

function landBall(b, slotIdx){
  const slot = SLOTS[slotIdx];
  const gained = slot.mult * 100000;
  score += gained;
  scoreVal.textContent = fmt(score);
  slotFlash[slotIdx] = 1;
  sfxLand(slot.mult);
  showToast(`${slot.label}! +${fmt(gained)} pts`);
  const burstScale = b.wild ? 2.3 : slot.mult >= 20 ? 2.2 : slot.mult >= 5 ? 1.4 : 1;
  spawnConfettiBurst(b.x, H-40, slot.color, burstScale);
  if (slot.mult >= 5) triggerShake(slot.mult >= 20 ? 14 : 6);


  if (score > best) {
    best = score;
    safeSet('spike_plinko_best_v1', best);
    bestVal.textContent = fmt(best);
  }

  updateDropBtn();
  if (dropsLeft <= 0) {
    setTimeout(checkGameEnd, 450);
  }
}

function checkGameEnd(){
  if (state === 'playing' && dropsLeft <= 0 && balls.every(b => b.settled)) {
    gameOver();
   } else if (state === 'playing' && dropsLeft <= 0) {
    // some ball still mid-chaos or falling — check again shortly instead of giving up
    setTimeout(checkGameEnd, 400);
  }
}

// ---------- Render ----------
function drawPegs(){
  for (const p of pegs) {
    const glow = p.hitFlash;
    ctx.save();
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 4 + glow*14;
    ctx.fillStyle = glow > 0.05 ? '#fff' : p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + glow*2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawSlots(){
  const slotW = W / SLOT_COUNT;
  const slotY = H - 64;
  for (let i=0;i<SLOT_COUNT;i++){
    const s = SLOTS[i];
    const x = i*slotW;
    ctx.save();
    const flash = slotFlash[i];
    ctx.fillStyle = s.color;
    ctx.globalAlpha = 0.22 + flash*0.6;
    ctx.fillRect(x+2, slotY, slotW-4, 64);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2;
    ctx.strokeRect(x+2, slotY, slotW-4, 64);

    ctx.fillStyle = '#fff';
    ctx.font = `800 ${Math.max(9, slotW*0.16)}px 'Barlow Condensed', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(s.mult+'x', x+slotW/2, slotY+22);

    ctx.font = `800 ${Math.max(6.5, slotW*0.1)}px 'Nunito', sans-serif`;
    ctx.fillStyle = s.color;
    // wrap label if needed by shrinking further for narrow slots
    ctx.fillText(s.label, x+slotW/2, slotY+40);
    ctx.textAlign = 'left';
    ctx.restore();
  }
  // divider pegs between slots
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i=1;i<SLOT_COUNT;i++){
    ctx.beginPath();
    ctx.arc(i*slotW, slotY, 3, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawBallTrail(b){
  for (let i=0;i<b.trail.length;i++){
    const t = b.trail[i];
    const alpha = (i/b.trail.length) * (t.color ? 0.65 : 0.5);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = t.color || '#FFD23F';
    ctx.beginPath();
    ctx.arc(t.x, t.y, b.r*0.5*(i/b.trail.length), 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawGoldBall(x,y,r){
 ctx.save();ctx.shadowColor='#ffce43';ctx.shadowBlur=20;
 const g=ctx.createRadialGradient(x-r*.4,y-r*.5,1,x,y,r);
 g.addColorStop(0,'#fff');g.addColorStop(.25,'#fff5b3');g.addColorStop(.6,'#ffd040');g.addColorStop(1,'#a6650b');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;ctx.strokeStyle='#fff0a0';ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
}
function drawBall(b){
 drawBallTrail(b);
 if(b.wild&&spikeBallImage.complete&&spikeBallImage.naturalWidth){
 ctx.save();ctx.shadowColor='#c6f22e';ctx.shadowBlur=24;ctx.beginPath();ctx.arc(b.x,b.y,b.r+2,0,Math.PI*2);ctx.fillStyle='#ffb000';ctx.fill();
 ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.clip();ctx.drawImage(spikeBallImage,b.x-b.r,b.y-b.r,b.r*2,b.r*2);ctx.restore();
 }else drawGoldBall(b.x,b.y,b.r);
}
function drawConfetti(){
  for (const c of confetti) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, c.life);
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size/2, -c.size/2, c.size, c.size*0.6);
    ctx.restore();
  }
}

function drawAimLine(){
  if (!dragging) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,210,63,0.35)';
  ctx.lineWidth = 2;
  ctx.setLineDash([4,6]);
  ctx.beginPath();
  ctx.moveTo(chipX, chipY+chipR);
  ctx.lineTo(chipX, H-70);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawChip(){
 if(state!=='playing'||dropsLeft<=0||balls.some(b=>!b.settled))return;
 if(dropsLeft===1&&spikeBallImage.complete&&spikeBallImage.naturalWidth){
 ctx.save();ctx.shadowColor='#c6f22e';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(chipX,chipY,chipR+1,0,Math.PI*2);ctx.fillStyle='#ffb000';ctx.fill();
 ctx.beginPath();ctx.arc(chipX,chipY,chipR,0,Math.PI*2);ctx.clip();ctx.drawImage(spikeBallImage,chipX-chipR,chipY-chipR,chipR*2,chipR*2);ctx.restore();
 }else drawGoldBall(chipX,chipY,chipR*(1+Math.sin(Date.now()/260)*.06));
 ctx.save();ctx.fillStyle='#e2c779';ctx.font="800 10px Nunito,sans-serif";ctx.textAlign='center';ctx.fillText(dropsLeft===1?'WILD SPIKE BALL':'DRAG TO AIM',chipX,chipY+chipR+17);ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if (shakeMag > 0){
    ctx.translate((Math.random()-0.5)*shakeMag, (Math.random()-0.5)*shakeMag);
  }
  drawSlots();
  drawPegs();
  drawAimLine();
  for (const b of balls) drawBall(b);
  drawConfetti();
  drawChip();
  ctx.restore();
}

function loop(){
  if (state === 'playing') updateBalls();
  render();
  requestAnimationFrame(loop);
}

const overlayBody = document.querySelector('#overlay .badge').parentElement;

function setOverlayMenu(){
  overlayTitle.textContent = 'SPIKE’S PLINKO';
  overlaySub.textContent = "Aim the glowing gold ball, then release. Or tap the board to choose a drop position. Five balls per round. No cash value.";
  overlaySub.style.display = '';
  const extras = overlayBody.querySelectorAll('.bigscore, .best, .spike-line, .share-score');
  extras.forEach(el => el.remove());
  mainBtn.textContent = 'START DROPPING';
}

function setOverlayGameOver(){
  overlayTitle.textContent = 'ALL DROPPED!';
  overlaySub.style.display = 'none';
  const extras = overlayBody.querySelectorAll('.bigscore, .best, .spike-line, .share-score');
  extras.forEach(el => el.remove());

  const bs = document.createElement('div');
  bs.className = 'bigscore';
  bs.style.fontFamily = "'Barlow Condensed', sans-serif";
  bs.style.fontWeight = '800';
  bs.style.fontSize = '46px';
  bs.style.color = '#fff';
  bs.textContent = fmt(score);
  const bestEl = document.createElement('div');
  bestEl.className = 'best';
  bestEl.style.color = '#FFD23F';
  bestEl.style.fontSize = '12px';
  bestEl.style.fontWeight = '800';
  bestEl.style.marginBottom = '20px';
  bestEl.style.letterSpacing = '.05em';
  bestEl.textContent = 'BEST: '+fmt(best)+' · NO CASH VALUE';
  overlaySub.insertAdjacentElement('afterend', bs);
  bs.insertAdjacentElement('afterend', bestEl);

  const quote=document.createElement('p');quote.className='spike-line';
  quote.textContent=score>=10000000?'Spike says: “Call security. The cactus has been robbed.”':score>=3000000?'Spike says: “Look at you. Almost competent.”':'Spike says: “Those points are worth absolutely nothing. Enjoy.”';
  bestEl.insertAdjacentElement('afterend',quote);
  const share=document.createElement('button');share.type='button';share.className='share-score';share.textContent='SHARE SCORE ↗';
  share.onclick=async()=>{
   const result='SPIKE’S PLINKO 🎰\n'+fmt(score)+' jackpot points · Five golden balls · No cash value\nhttps://vegassidekick.com/play/spikes-plinko/';
   try{if(navigator.share){await navigator.share({title:'Spike’s Plinko',text:result});return;}await navigator.clipboard.writeText(result);share.textContent='SCORE COPIED';}
   catch(e){if(e.name!=='AbortError')share.textContent='SHARE UNAVAILABLE';}
  };
  quote.insertAdjacentElement('afterend',share);
  mainBtn.textContent='PLAY ANOTHER ROUND';
}

function gameOver(){
  state = 'gameover';
  setOverlayGameOver();
  overlay.classList.remove('hidden');
  updateDropBtn();
}

mainBtn.onclick = () => {
  initAudio();
  setOverlayMenu();
  overlay.classList.add('hidden');
  resetGame();
  state = 'playing';
  updateDropBtn();
};

computeSize();
resetGame();
render();
requestAnimationFrame(loop);
</script>
</body>
