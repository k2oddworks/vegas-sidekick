<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#14273d;background:#eef3f6;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:#16537c}.top{background:#10263c;color:white;padding:17px max(18px,calc((100vw - 1400px)/2));display:flex;gap:15px;align-items:center;flex-wrap:wrap}.brand{font-weight:850;letter-spacing:-.6px;font-size:22px}.brand span{color:#cce85b}.sub{font-size:12px;color:#b7c8d6}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}.nav button{border:1px solid #45617a;background:transparent;color:#fff;border-radius:9px;padding:10px 14px;font-weight:700}.nav button.active{background:#d4ef69;color:#172d3f;border-color:#d4ef69}main{max-width:1400px;margin:auto;padding:22px 18px 70px}h1{font-size:clamp(24px,4vw,34px);margin:0 0 6px;letter-spacing:-.8px}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.muted{color:#617386;font-size:13px}.notice{background:#fff4da;border-left:4px solid #ffb000;padding:13px 16px;border-radius:8px;margin:14px 0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.card,.panel{background:white;border:1px solid #d9e3eb;border-radius:13px;padding:17px;box-shadow:0 2px 9px #19355008}.stat{font-size:32px;letter-spacing:-1px;font-weight:800}.eyebrow{font-size:12px;font-weight:750;color:#66798b;text-transform:uppercase;letter-spacing:.6px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select,.field input,.field select,.field textarea{min-height:42px;border:1px solid #c9d5df;border-radius:8px;padding:9px;background:white;color:#14273d}.toolbar input{min-width:220px;flex:1}.btn{border:1px solid #b9ccd9;background:white;border-radius:8px;padding:10px 13px;color:#12314a;font-weight:700}.btn.primary{background:#ffb000;border-color:#ffb000;color:#142435}.btn.dark{background:#14314b;color:white}.btn:disabled{opacity:.5}.rowitem{background:#fff;border:1px solid #dce5eb;border-radius:11px;padding:14px;margin:9px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.rowitem strong{font-size:16px}.pills{display:flex;gap:5px;flex-wrap:wrap}.pill{font-size:11px;font-weight:750;border-radius:5px;background:#eaf0f4;color:#42586a;padding:5px 7px}.pill.warn{background:#fff0d2;color:#765100}.pill.ok{background:#eaf4cf;color:#435b15}.pill.error{background:#f9e7e3;color:#863d36}.section{margin:18px 0}.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,1fr);gap:16px;align-items:start}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:750;margin:10px 0}.field input,.field textarea,.field select{width:100%;font-size:14px;font-weight:450}.field textarea{min-height:72px}.check{padding:11px 0;border-bottom:1px solid #e6edf2;display:flex;justify-content:space-between;gap:10px;align-items:center}.check select{max-width:150px}.check em{font-style:normal;color:#657485;font-size:11px}.media{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid #e6edf2}.media img{width:90px;height:70px;object-fit:contain;background:#eef3f6;border-radius:7px}.media select{max-width:180px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.tabs .btn.active{background:#173651;color:white}.detailHead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.empty{padding:32px;text-align:center;color:#6b8090}.hidden{display:none!important}.list{max-height:67vh;overflow:auto}.small{font-size:12px}.danger{color:#922e27}.foot{font-size:12px;color:#6c7a8b;margin-top:20px}.month{display:flex;align-items:center;justify-content:space-between;background:#17314a;color:white;border-radius:11px;padding:16px;margin:14px 0}.month strong{font-size:22px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{border:1px solid #d9e3eb;border-radius:7px;background:white;min-height:94px;padding:6px;font-size:12px;overflow:hidden}.day .num{font-weight:800}.event{display:block;background:#eaf3d3;border-radius:4px;padding:4px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.weekday{text-align:center;color:#6d8091;font-size:11px;font-weight:700;padding:8px 0}.log{border-bottom:1px solid #e5ebf0;padding:12px 0}.filterline{display:flex;gap:10px;flex-wrap:wrap}.kpi{font-weight:800}.line{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.progress{height:8px;border-radius:99px;background:#e4eaf0;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:#a5ce45}.footernote{padding:12px;background:#eaf0f5;border-radius:8px;font-size:12px}.right{margin-left:auto}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.top{padding:14px}.nav{margin:0;width:100%}.nav button{flex:1}.grid2{grid-template-columns:1fr}.list{max-height:none}.day{min-height:72px;font-size:10px;padding:3px}.event{font-size:9px;padding:2px}.month strong{font-size:18px}}@media(max-width:430px){.card{padding:12px}.stat{font-size:26px}.toolbar input{min-width:100%}.rowitem{align-items:flex-start}.calendar{gap:2px}.day{min-height:58px}.media{grid-template-columns:62px minmax(0,1fr)}.media img{width:62px;height:54px}}

<body><header class="top"><div><div class="brand">VEGAS <span>SIDEKICK</span> / HUB</div><div class="sub">Internal operations · Not connected to production publishing</div></div><nav class="nav"><button id="n-index" onclick="tab('index')">Index Desk</button><button id="n-qa" onclick="tab('qa')">Show-page QA</button><button id="n-log" onclick="tab('log')">Change log</button></nav></header><main><div id="root"></div></main>
<script>
"use strict";
const RAW="https://raw.githubusercontent.com/k2oddworks/vegas-sidekick/main/";
const QA=["event","offers","price","availability","ticket_urls","venue","performer","organizer","breadcrumbs","faq","freshness","price_schedule","affiliate","photos","trailer_verified","trailer_installed"];
const QA_LABEL={event:"Event / EventSeries",offers:"Offers",price:"Numeric offers.price",availability:"Availability",ticket_urls:"Ticket and source URLs",venue:"Venue",performer:"Performer",organizer:"Organizer",breadcrumbs:"BreadcrumbList",faq:"FAQ consistency",freshness:"Freshness metadata",price_schedule:"Price and schedule consistency",affiliate:"Affiliate link accuracy",photos:"Five approved show-specific photos",trailer_verified:"Trailer verification",trailer_installed:"Trailer installation"};
let view="qa",layout="list",qa=[],ix=[],selected=null,filter="",qstatus="active",qsort="name",month=new Date().toLocaleDateString("en-CA",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit"}).slice(0,7),ixView="headliners",ixFilter="",ixMonth="all",ixVenue="all",ixType="all",ixStatus="all",changeLog=read("vsh:log",[]);
function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}
function store(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(d){if(!d)return "Pending";return d}
function now(){return new Date().toISOString()}
function todayLV(){return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function log(section,id,category,before,after,notes){changeLog.unshift({at:now(),section,id,category,notes:notes||"",before,after});store("vsh:log",changeLog)}
function download(name,type,contents){const a=document.createElement("a"),u=URL.createObjectURL(new Blob([contents],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csv(rows){return rows.map(r=>r.map(x=>'"'+String(x??"").replaceAll('"','""')+'"').join(",")).join("\r\n")}
function tab(s){view=s;selected=null;render()}
function title(s){return '<h1>'+s+'</h1>'}
function badge(t,kind){return '<span class="pill '+(kind||"")+'">'+esc(t)+'</span>'}
function btn(text,fn,cl){return '<button class="btn '+(cl||"")+'" onclick="'+fn+'">'+text+'</button>'}
function evidence(s,k){return s.checks&&s.checks[k]===true?"Detected":s.checks&&s.checks[k]===false?"Not detected":"Not scanned"}
function qaSummary(s){let x=QA.map(k=>s.reviews[k]||{});return {verified:x.filter(v=>v.status==="verified"||v.status==="na"&&v.reason).length,unresolved:x.filter(v=>v.status!=="verified"&&!(v.status==="na"&&v.reason)).length,photos:s.photos.filter(p=>p.status==="approved").length}}
function priority(s){let z=qaSummary(s);return z.unresolved*10+(z.photos<5?15:0)}
async function init(){renderLoading();try{let a=await Promise.all([1,2,3,4,5].map(i=>fetch("scan-0"+i+".json").then(r=>{if(!r.ok)throw Error("QA snapshot unavailable");return r.json()})));const old=read("vsh:qa",{});qa=a.flat().map(s=>{let o=old[s.slug]||{};return {...s,photos:(o.photos||s.photo_candidates.map(url=>({url,source:"Detected in page HTML",status:"candidate",notes:""}))),reviews:o.reviews||{},trailer:o.trailer||{url:"",upload_date:"",duration:"",source:"",verification_date:"",verification:"pending",installation:"pending"},notes:o.notes||"",priority:o.priority||"normal",reviewed_at:o.reviewed_at||null}});const db=await fetch(RAW+"data/show-database.json").then(r=>r.json());qa.push(...db.records.filter(x=>x.status!=="active").map(s=>({...s,repo_path:s.page_path.slice(1)+"index.html",photos:[],reviews:{},trailer:{},notes:"",scanned:false})));}catch(e){qa=Object.values(read("vsh:qa",{}));window.loadError=String(e)}try{const d=await Promise.all(["headliners-residencies","touring-shows-concerts"].map(x=>fetch(RAW+"data/reference/"+x+".json").then(r=>r.json())));ix=normalize(d);const old=read("vsh:ix",{});ix=ix.map(x=>old[x.id]?{...x,...old[x.id],dates:[...new Set([...x.dates,...old[x.id].dates])].sort(),sources:[...new Set([...x.sources,...old[x.id].sources])]}:x)}catch(e){ix=Object.values(read("vsh:ix",{}))}render()}
function searchQA(v){filter=v;let p=document.activeElement?.selectionStart??v.length;renderQA();let el=document.querySelector('input[aria-label="Search shows"]');if(el){el.focus();el.setSelectionRange(p,p)}}
function searchIX(v){ixFilter=v;let p=document.activeElement?.selectionStart??v.length;renderIndex();let el=document.querySelector('input[aria-label="Index search"]');if(el){el.focus();el.setSelectionRange(p,p)}}
function renderLoading(){document.getElementById("root").innerHTML='<div class="panel">Loading repository snapshots…</div>'}
function saveQA(s,category,prev){s.reviewed_at=now();store("vsh:qa",Object.fromEntries(qa.filter(x=>x.status==="active").map(x=>[x.slug,{photos:x.photos,reviews:x.reviews,trailer:x.trailer,notes:x.notes,priority:x.priority,reviewed_at:x.reviewed_at}])));log("QA",s.slug,category,prev,{photos:s.photos,reviews:s.reviews,trailer:s.trailer,notes:s.notes,priority:s.priority},"Manual editor update")}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.id==="n-"+view));if(view==="qa")renderQA();else if(view==="index")renderIndex();else renderLog()}
function renderQA(){const root=document.getElementById("root"),active=qa.filter(s=>s.status==="active"),total=active.length,approved=active.filter(s=>qaSummary(s).photos>=5).length,trailers=active.filter(s=>s.trailer?.verification==="verified"&&s.trailer?.installation==="installed").length,outstanding=active.reduce((n,s)=>n+qaSummary(s).unresolved,0);let html=title("Show-page QA")+'<p class="muted">Media and editorial quality · Source: k2oddworks/vegas-sidekick · Detection is not verification.</p>'+ (window.loadError?'<div class="notice">Repository scan could not load: '+esc(window.loadError)+'</div>':"")+'<div class="notice">Private deployment required. Saving in this preview is browser-local, not cross-device. Nothing here edits production show pages.</div><div class="cards">'+[['Active shows',total],['5-photo goal',approved+" / "+total],['Verified + installed trailers',trailers+" / "+total],['Unresolved QA checks',outstanding]].map(c=>'<div class="card"><div class="eyebrow">'+c[0]+'</div><div class="stat">'+c[1]+'</div></div>').join("")+'</div>';
if(selected){const s=qa.find(x=>x.slug===selected);if(s){root.innerHTML=html+detailQA(s);return}}
let found=qa.filter(s=>(qstatus==="all"||s.status===qstatus)&&((s.name||"").toLowerCase().includes(filter.toLowerCase())||(s.category||"").includes(filter.toLowerCase()))).sort((a,b)=>qsort==="priority"?priority(b)-priority(a):qsort==="photos"?qaSummary(a).photos-qaSummary(b).photos:a.name.localeCompare(b.name));
html+='<div class="toolbar"><input aria-label="Search shows" placeholder="Search performers or show names" value="'+esc(filter)+'" oninput="searchQA(this.value)"><select aria-label="Status" onchange="qstatus=this.value;renderQA()">'+["active","closed","needs_review","all"].map(s=>'<option '+(qstatus===s?"selected":"")+'>'+s+'</option>').join("")+'</select><select onchange="qsort=this.value;renderQA()"><option value="name">Name</option><option value="priority" '+(qsort==="priority"?"selected":"")+'>Priority first</option><option value="photos" '+(qsort==="photos"?"selected":"")+'>Fewest approved photos</option></select>'+btn("Export queue","exportQA('queue')")+btn("Export media","exportQA('media')")+btn("Export summary","exportQA('summary')")+'</div>';
html+='<div class="panel"><h2>Shows <span class="muted">('+found.length+')</span></h2><div class="list">'+found.map(s=>{let z=qaSummary(s);return '<div class="rowitem"><div><strong>'+esc(s.name)+'</strong><div class="muted">'+esc(s.category||s.status)+' · '+z.photos+'/5 photos · '+z.unresolved+' checks open</div><div class="pills">'+badge(s.status,s.status==="active"?"ok":"warn")+badge(s.scanned?"Markup scanned":"Scan pending")+(z.unresolved===0&&z.photos>=5?badge("Checks complete","ok"):badge("Needs review","warn"))+'</div></div>'+btn("Review","selected="+JSON.stringify(s.slug)+";renderQA()","primary")+'</div>'}).join("")+'</div></div>';root.innerHTML=html}
function detailQA(s){let z=qaSummary(s),closed=s.status!=="active";let h='<div class="panel"><div class="detailHead"><div>'+btn("← All shows","selected=null;renderQA()")+'<h2 style="margin-top:14px">'+esc(s.name)+'</h2><div class="pills">'+badge(s.status)+badge(z.unresolved+' open checks',"warn")+'</div></div><div><a target="_blank" rel="noopener" href="https://vegassidekick.com'+esc(s.page_path)+'">Live page</a> · <a target="_blank" rel="noopener" href="https://github.com/k2oddworks/vegas-sidekick/blob/main/'+esc(s.repo_path)+'">Repository HTML</a></div></div><p class="muted">Catalog verification: '+esc(fmt(s.verified_on))+' · Last manual review: '+esc(fmt(s.reviewed_at))+' · Automated evidence only</p></div>';
h+='<div class="split section"><div><div class="panel"><h2>Editorial + structured-data QA</h2><p class="muted">A detected field means the HTML contains it, not that its value is correct. Every check requires a manual decision.</p>'+QA.map(k=>{let rv=s.reviews[k]||{},evidenceName={event:"event",offers:"offers",price:"price",availability:"availability",venue:"venue",performer:"performer",organizer:"organizer",breadcrumbs:"breadcrumbs",faq:"faq",freshness:"freshness",affiliate:"affiliate"}[k];return '<div class="check"><div><strong>'+QA_LABEL[k]+'</strong><div><em>'+(evidenceName?esc(evidence(s,evidenceName)):"Manual verification required")+'</em></div></div><select aria-label="'+QA_LABEL[k]+'" onchange="reviewCheck('+JSON.stringify(s.slug)+','+JSON.stringify(k)+',this.value)">'+["pending","needs_review","verified","na"].map(v=>'<option value="'+v+'" '+((rv.status||"pending")===v?"selected":"")+'>'+({pending:"Pending",needs_review:"Needs review",verified:"Verified",na:"N/A"}[v])+'</option>').join("")+'</select></div>'+((rv.status==="na")?'<div class="muted">Reason: '+esc(rv.reason||"Required")+'</div>':"")}).join("")+'</div><div class="panel section"><h2>Photo inventory · '+z.photos+'/5 approved</h2><p class="muted">Candidates are not approved. Exclude charts, logos, related shows and duplicates.</p>'+s.photos.map((p,i)=>'<div class="media"><img loading="lazy" src="'+esc(p.url.startsWith("http")?p.url:"https://vegassidekick.com"+p.url)+'" alt=""><div><div class="small" style="overflow-wrap:anywhere">'+esc(p.url)+'</div><div class="muted">'+esc(p.source||"Detected")+' · '+esc(p.notes||"")+'</div><select aria-label="Image review" onchange="photoStatus('+JSON.stringify(s.slug)+','+i+',this.value)">'+["candidate","approved","rejected"].map(v=>'<option '+(p.status===v?"selected":"")+'>'+v+'</option>').join("")+'</select></div></div>').join("")+'<h3 style="margin-top:18px">Add source-backed photo</h3><div class="field"><label>Image URL</label><input id="photoURL" placeholder="https://…"></div><div class="field"><label>Source URL</label><input id="photoSource" placeholder="https://…"></div>'+btn("Add candidate","addPhoto("+JSON.stringify(s.slug)+")","primary")+'</div></div>';
h+='<div><div class="panel"><h2>Trailer inventory</h2>'+["url","upload_date","duration","source","verification_date"].map(k=>'<div class="field"><label>'+({url:"Trailer URL",upload_date:"Upload date (if known)",duration:"Duration (if known)",source:"Official source URL",verification_date:"Verified on"}[k])+'</label><input data-trailer="'+k+'" value="'+esc(s.trailer?.[k]||"")+'" placeholder="Pending"></div>').join("")+'<div class="grid2"><div class="field"><label>Verified?</label><select data-trailer="verification">'+["pending","needs_review","verified"].map(v=>'<option '+((s.trailer?.verification||"pending")===v?"selected":"")+'>'+v+'</option>').join("")+'</select></div><div class="field"><label>Installed?</label><select data-trailer="installation">'+["pending","not_installed","installed"].map(v=>'<option '+((s.trailer?.installation||"pending")===v?"selected":"")+'>'+v+'</option>').join("")+'</select></div></div>'+btn("Save trailer","saveTrailer("+JSON.stringify(s.slug)+")","primary")+'</div><div class="panel section"><h2>Review notes</h2><div class="field"><label>Priority</label><select id="priority">'+["normal","high","critical"].map(v=>'<option '+((s.priority||"normal")===v?"selected":"")+'>'+v+'</option>').join("")+'</select></div><div class="field"><label>Notes and source links</label><textarea id="qaNotes">'+esc(s.notes||"")+'</textarea></div>'+btn("Save review","saveNotes("+JSON.stringify(s.slug)+")","primary")+'<p class="foot">Saved reviews are local to this browser until an authenticated persistent backend is deployed. A rescan must compare evidence changes before retaining approvals.</p></div></div></div>';return h}
function clone(v){return JSON.parse(JSON.stringify(v))}
function reviewCheck(slug,k,status){let s=qa.find(x=>x.slug===slug),before=clone(s.reviews);let reason="";if(status==="na"){reason=prompt("Why is this check not applicable?")||"";if(!reason.trim()){alert("N/A requires a reason.");renderQA();return}}s.reviews[k]={status,reason,reviewed_at:now()};saveQA(s,"Checklist: "+k,{reviews:before});renderQA()}
function photoStatus(slug,i,status){let s=qa.find(x=>x.slug===slug),before=clone(s.photos);s.photos[i].status=status;s.photos[i].reviewed_at=now();saveQA(s,"Photo review",{photos:before});renderQA()}
function addPhoto(slug){let s=qa.find(x=>x.slug===slug),url=document.getElementById("photoURL").value.trim(),source=document.getElementById("photoSource").value.trim();if(!/^https:\/\//.test(url)||!/^https:\/\//.test(source)){alert("Both image and source must be HTTPS URLs.");return}let before=clone(s.photos);s.photos.push({url,source,status:"candidate",notes:"",added_at:now()});saveQA(s,"Add photo candidate",{photos:before});renderQA()}
function saveTrailer(slug){let s=qa.find(x=>x.slug===slug),before=clone(s.trailer),t={...s.trailer};document.querySelectorAll("[data-trailer]").forEach(e=>t[e.dataset.trailer]=e.value.trim());if(t.verification==="verified"&&(!t.url||!t.source||!t.verification_date)){alert("Verified trailer needs URL, source and verification date.");return}s.trailer=t;saveQA(s,"Trailer inventory",{trailer:before});renderQA()}
function saveNotes(slug){let s=qa.find(x=>x.slug===slug),before={notes:s.notes,priority:s.priority};s.notes=document.getElementById("qaNotes").value;s.priority=document.getElementById("priority").value;saveQA(s,"Review notes",before);renderQA()}
function exportQA(type){let rows=qa.filter(s=>s.status==="active");if(type==="queue")rows=rows.filter(s=>qaSummary(s).unresolved>0).sort((a,b)=>priority(b)-priority(a));if(type==="media"){download("vegas-sidekick-media.csv","text/csv",csv([["Show","Image URL","Source","Review status","Notes"],...rows.flatMap(s=>s.photos.map(p=>[s.name,p.url,p.source,p.status,p.notes]))]));return}download("vegas-sidekick-"+type+".csv","text/csv",csv([["Show","Status","Page","Approved photos","Outstanding checks","Trailer verification","Trailer installation","Priority","Last manual review"],...rows.map(s=>[s.name,s.status,s.page_path,qaSummary(s).photos,qaSummary(s).unresolved,s.trailer?.verification,s.trailer?.installation,s.priority,s.reviewed_at])] ))}
function normalize(datasets){let m=new Map();datasets.forEach((data,k)=>{let venues=Object.fromEntries((data.venues||[]).map(v=>[v.id,v]));(data.entries||[]).forEach(e=>{let name=e.act||e.name,venue=venues[e.venue_id]?.name||e.venue_id||"",key=(name+"|"+venue+"|"+(e.subtitle||"")).toLowerCase().replace(/[^a-z0-9|]/g,""),dates=e.dates||[e.date].filter(Boolean);let ex=m.get(key);if(!ex){ex={id:key,name,venue,category:e.type||"",subtitle:e.subtitle||"",dates:[],sources:[],views:[],status:"scheduled",price:"",on_sale:"",notes:"",verification_dates:[],originals:[]};m.set(key,ex)}ex.dates.push(...dates);ex.sources.push(...[e.official_url,...(e.sources||[])].filter(Boolean));ex.verification_dates.push(data.verified_on||"");ex.views.push(k===0?"headliners":"touring");ex.originals.push({dataset:data.name,record:e,snapshot_verified_on:data.verified_on})})});return [...m.values()].map(x=>({...x,dates:[...new Set(x.dates)].sort(),sources:[...new Set(x.sources)],verification_dates:[...new Set(x.verification_dates)],views:[...new Set(x.views)]}))}
function saveIX(x,category,before){store("vsh:ix",Object.fromEntries(ix.map(y=>[y.id,y])));log("Index",x.id,category,before,x,"Manual editor update")}
function showIndex(x){selected=x.id;renderIndex()}
function renderIndex(){let root=document.getElementById("root"),h=title("Sidekick Index Desk")+'<p class="muted">One record store · Headliners & Residencies / More Touring Shows & Concerts · Las Vegas date archive</p><div class="notice">Imported snapshot dates remain historical. Edits here do not publish to vegassidekick.com. Browser-local persistence only in this preview.</div>';if(selected){let x=ix.find(y=>y.id===selected);if(x){root.innerHTML=h+indexDetail(x);return}}
let filtered=ix.filter(x=>(ixView==="all"||x.views.includes(ixView))&&((x.name+" "+x.venue).toLowerCase().includes(ixFilter.toLowerCase()))&&(ixMonth==="all"||x.dates.some(d=>d.startsWith(ixMonth)))&&(ixVenue==="all"||x.venue===ixVenue)&&(ixType==="all"||x.category===ixType)&&(ixStatus==="all"||x.status===ixStatus)),active=filtered.filter(x=>x.dates.some(d=>d>=todayLV())&&x.status!=="closed"),archived=filtered.filter(x=>!x.dates.some(d=>d>=todayLV())||x.status==="closed");h+='<div class="cards">'+[['Engagements',filtered.length],['Upcoming',active.length],['Archived',archived.length],['Needs verification',filtered.filter(x=>!x.sources.length||!x.verification_dates.filter(Boolean).length).length]].map(c=>'<div class="card"><div class="eyebrow">'+c[0]+'</div><div class="stat">'+c[1]+'</div></div>').join("")+'</div><div class="tabs">'+[["headliners","Headliners & Residencies"],["touring","More Touring Shows & Concerts"],["all","All records"]].map(v=>btn(v[1],"ixView="+JSON.stringify(v[0])+";renderIndex()",ixView===v[0]?"dark":"")).join("")+'</div><div class="toolbar"><input aria-label="Index search" placeholder="Find performer or venue" value="'+esc(ixFilter)+'" oninput="searchIX(this.value)">'+btn("List","layout='list';renderIndex()",layout==="list"?"dark":"")+btn("Calendar","layout='calendar';renderIndex()",layout==="calendar"?"dark":"")+btn("Export Markdown","exportIndex('md')")+btn("Export CSV","exportIndex('csv')")+btn("Export JSON","exportIndex('json')")+btn("+ New engagement","newIndex()","primary")+'</div>';
if(layout==="list")h+='<div class="panel">'+filtered.sort((a,b)=>(a.dates.find(d=>d>=todayLV())||"9999").localeCompare(b.dates.find(d=>d>=todayLV())||"9999")).map(x=>'<div class="rowitem"><div><strong>'+esc(x.name)+'</strong><div class="muted">'+esc(x.venue)+' · '+x.dates.length+' performance dates · '+esc(x.dates.filter(d=>d>=todayLV())[0]||"Archived")+'</div><div class="pills">'+x.views.map(v=>badge(v)).join("")+badge(x.status)+badge(x.verification_dates.filter(Boolean).join(", ")||"Verification pending","warn")+'</div></div>'+btn("Edit","selected="+JSON.stringify(x.id)+";renderIndex()")+'</div>').join("")+'</div>';
else{let [y,m]=month.split("-").map(Number),first=new Date(Date.UTC(y,m-1,1)),n=new Date(Date.UTC(y,m,0)).getUTCDate(),offset=first.getUTCDay();h+='<div class="month">'+btn("←","moveMonth(-1)")+'<strong>'+first.toLocaleString("en-US",{month:"long",year:"numeric",timeZone:"UTC"})+'</strong>'+btn("→","moveMonth(1)")+'</div><div class="calendar">'+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>'<div class="weekday">'+d+'</div>').join("")+Array.from({length:offset},()=>'<div></div>').join("")+Array.from({length:n},(_,i)=>{let day=month+"-"+String(i+1).padStart(2,"0"),ev=filtered.filter(x=>x.dates.includes(day));return '<div class="day"><div class="num">'+(i+1)+'</div>'+ev.slice(0,4).map(x=>'<span class="event" title="'+esc(x.name)+'">'+esc(x.name)+'</span>').join("")+(ev.length>4?'<span class="muted">+'+(ev.length-4)+' more</span>':"")+'</div>'}).join("")+'</div>'}root.innerHTML=h}
function moveMonth(n){let [y,m]=month.split("-").map(Number),d=new Date(Date.UTC(y,m-1+n,1));month=d.toISOString().slice(0,7);renderIndex()}
function indexDetail(x){return '<div class="panel">'+btn("← All entries","selected=null;renderIndex()")+'<h2 style="margin-top:15px">'+esc(x.name)+'</h2><div class="grid2"><div class="field"><label>Performer / show</label><input id="inName" value="'+esc(x.name)+'"></div><div class="field"><label>Venue</label><input id="inVenue" value="'+esc(x.venue)+'"></div></div><div class="field"><label>Performance dates, one YYYY-MM-DD per line</label><textarea id="inDates">'+esc(x.dates.join("\n"))+'</textarea></div><div class="grid2"><div class="field"><label>Type</label><input id="inType" value="'+esc(x.category)+'"></div><div class="field"><label>Status</label><select id="inStatus">'+["scheduled","changed","cancelled","closed","on_sale","needs_review"].map(v=>'<option '+(x.status===v?"selected":"")+'>'+v+'</option>').join("")+'</select></div></div><div class="field"><label>Show in</label><div class="filterline"><label><input type="checkbox" id="inHead" '+(x.views.includes("headliners")?"checked":"")+'> Headliners & Residencies</label><label><input type="checkbox" id="inTour" '+(x.views.includes("touring")?"checked":"")+'> More Touring Shows & Concerts</label></div></div><div class="grid2"><div class="field"><label>Optional price</label><input id="inPrice" value="'+esc(x.price||"")+'"></div><div class="field"><label>On-sale details</label><input id="inSale" value="'+esc(x.on_sale||"")+'"></div></div><div class="field"><label>Source URLs, one per line</label><textarea id="inSources">'+esc(x.sources.join("\n"))+'</textarea></div><div class="field"><label>Historical verification dates (preserved)</label><input disabled value="'+esc(x.verification_dates.filter(Boolean).join(", ")||"Pending")+'"></div><div class="field"><label>Notes</label><textarea id="inNotes">'+esc(x.notes||"")+'</textarea></div><div class="field"><label>Update category</label><select id="inCategory">'+["New announcement","Date change","Closure","Venue move","Added dates","Price change","On-sale update","Editorial correction"].map(v=>'<option>'+v+'</option>').join("")+'</select></div>'+btn("Save changes","saveIndex("+JSON.stringify(x.id)+")","primary")+'</div><div class="panel section"><h3>Imported provenance</h3><p class="muted">'+x.originals.length+' original record(s) retained · Source snapshots: '+esc(x.verification_dates.join(", ")||"Unknown")+'</p></div>'}
function saveIndex(id){let x=ix.find(y=>y.id===id),before=clone(x),dates=document.getElementById("inDates").value.split(/\s+/).filter(Boolean);if(dates.some(d=>!/^\d{4}-\d{2}-\d{2}$/.test(d))){alert("Use YYYY-MM-DD dates.");return}let views=[document.getElementById("inHead").checked?"headliners":null,document.getElementById("inTour").checked?"touring":null].filter(Boolean);if(!views.length){alert("Select at least one Index view.");return}Object.assign(x,{name:document.getElementById("inName").value.trim(),venue:document.getElementById("inVenue").value.trim(),dates:[...new Set(dates)].sort(),category:document.getElementById("inType").value.trim(),status:document.getElementById("inStatus").value,views,price:document.getElementById("inPrice").value,on_sale:document.getElementById("inSale").value,sources:[...new Set(document.getElementById("inSources").value.split(/\s+/).filter(Boolean))],notes:document.getElementById("inNotes").value});saveIX(x,document.getElementById("inCategory").value,before);selected=null;renderIndex()}
function newIndex(){let x={id:"manual-"+Date.now(),name:"New engagement",venue:"",dates:[],sources:[],verification_dates:[],views:[ixView==="touring"?"touring":"headliners"],status:"needs_review",category:"",price:"",on_sale:"",notes:"",originals:[]};ix.push(x);saveIX(x,"New announcement",null);selected=x.id;renderIndex()}
function exportIndex(t){let a=ix.filter(x=>(ixView==="all"||x.views.includes(ixView))&&((x.name+" "+x.venue).toLowerCase().includes(ixFilter.toLowerCase())));if(t==="json"){download("sidekick-index.json","application/json",JSON.stringify({attribution:"Vegas Sidekick · CC BY 4.0 factual dataset",records:a},null,2));return}if(t==="csv"){download("sidekick-index.csv","text/csv",csv([["Act","Venue","Dates","Type","Status","Sources","Original verification"],...a.map(x=>[x.name,x.venue,x.dates.join("; "),x.category,x.status,x.sources.join("; "),x.verification_dates.join("; ")])]));return}download("sidekick-index-reddit.md","text/markdown","# Vegas Sidekick Index\n\n"+a.map(x=>"- **"+x.name+"** — "+x.dates.join(", ")+" · "+x.venue+" · "+x.status).join("\n")+"\n\nSource: https://vegassidekick.com/sidekick-index/ · Historical verification: see source records · Vegas Sidekick (CC BY 4.0 factual data).")}
function renderLog(){document.getElementById("root").innerHTML=title("Change log")+'<p class="muted">Timestamped manual edits, including before and after snapshots. Browser-local until private cloud sync is configured.</p><div class="toolbar">'+btn("Export complete log","download('sidekick-hub-log.json','application/json',JSON.stringify(changeLog,null,2))","primary")+'</div><div class="panel">'+(changeLog.length?changeLog.map(l=>'<div class="log"><div class="line"><strong>'+esc(l.section)+' · '+esc(l.category)+'</strong>'+badge(l.at)+'</div><div class="muted">'+esc(l.id)+' · '+esc(l.notes)+'</div><details><summary class="small">Before / after evidence</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px">'+esc(JSON.stringify({before:l.before,after:l.after},null,2))+'</pre></details></div>').join(""):'<div class="empty">No manual changes recorded.</div>')+'</div>'}
init();
</script></body></html>
