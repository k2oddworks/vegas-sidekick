<meta charset="utf-8">
<title>Vegas Sidekick — Brand Bible</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

  :root{
    --void:#0b0518; --panel:#160a30; --panel2:#1e0f3e; --ink:#f3eeff; --muted:#a99fce; --dim:#7d75a3;
    --line:rgba(198,163,255,.16); --line2:rgba(198,163,255,.30);
    --blue:#5b95ff; --blue-deep:#3b82f6; --pink:#ff2e7e; --lime:#c6f22e; --purple:#a855f7; --teal:#22c7db;
    --do:#3ddc84; --no:#ff5a6a; --radius:16px;
    --disp:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--void);color:var(--ink);font-family:var(--body);line-height:1.68;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 500px at 85% -8%,rgba(124,58,237,.34),transparent 60%),radial-gradient(720px 460px at 5% 4%,rgba(255,46,126,.14),transparent 55%);background-attachment:fixed}
  h1,h2,h3,h4,.disp{font-family:var(--disp);letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
  a{color:var(--blue);text-decoration:none}
  ::selection{background:var(--pink);color:#12061f}
  code{font-family:var(--mono);font-size:.86em;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:#e7ddff}
  .wrap{max-width:960px;margin:0 auto;padding:0 26px}
  .eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--purple)}

  .cover{padding:88px 0 44px;border-bottom:1px solid var(--line)}
  .badge{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:100px;padding:8px 16px;background:rgba(255,255,255,.03)}
  .badge b{color:var(--lime);letter-spacing:.22em}
  .cover h1{font-size:clamp(2.6rem,7vw,4.4rem);font-weight:800;margin:26px 0 6px}
  .cover h1 .s{color:var(--pink);text-shadow:0 0 28px rgba(255,46,126,.5)}
  .cover .sub{font-family:var(--disp);font-weight:700;font-size:clamp(1.1rem,2.6vw,1.5rem);background:linear-gradient(90deg,var(--pink),var(--lime));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .cover .meta{margin-top:20px;font-family:var(--mono);font-size:.74rem;color:var(--dim);letter-spacing:.05em;display:flex;gap:18px;flex-wrap:wrap}

  section.s{padding:46px 0;border-bottom:1px solid var(--line)}
  .s > .wrap > .eyebrow{display:block;margin-bottom:6px}
  .s h2{font-size:clamp(1.5rem,3.6vw,2.1rem);font-weight:800;margin-bottom:8px}
  .s h2 .num{font-family:var(--mono);font-size:.8rem;color:var(--teal);margin-right:12px;vertical-align:middle;letter-spacing:.1em}
  .s p{color:var(--muted);margin-top:12px;max-width:70ch}
  .s p strong,.s li strong{color:var(--ink);font-weight:600}
  .lead{font-size:1.12rem;color:var(--ink)!important}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
  .card{border:1px solid var(--line);border-radius:var(--radius);padding:22px;background:linear-gradient(180deg,var(--panel),rgba(20,10,44,.4))}
  .card h4{font-size:1.05rem;margin-bottom:8px}
  .card p{margin-top:6px;font-size:.94rem}

  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
  .sw{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.2)}
  .sw .chip{height:60px}
  .sw .m{padding:9px 11px;font-family:var(--mono);font-size:.68rem;color:var(--muted);line-height:1.4}
  .sw .m b{display:block;color:var(--ink);font-size:.76rem}

  .typ{border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-top:14px;background:linear-gradient(180deg,var(--panel),rgba(20,10,44,.35))}
  .typ .big{font-family:var(--disp);font-weight:800;font-size:1.9rem;line-height:1.1}
  .typ .big.b{font-family:var(--body);font-weight:600}
  .typ .big.m{font-family:var(--mono);font-weight:500;font-size:1.4rem}
  .typ .cap{font-family:var(--mono);font-size:.68rem;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-top:6px}

  ul.clean{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:10px}
  ul.clean li{position:relative;padding-left:24px;color:var(--muted)}
  ul.clean li::before{content:"";position:absolute;left:0;top:12px;width:10px;height:2px;background:var(--lime);box-shadow:0 0 8px var(--lime)}

  .dd{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
  .dd .col{border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:linear-gradient(180deg,var(--panel),rgba(20,10,44,.35))}
  .dd .col.do{border-color:rgba(61,220,132,.35)} .dd .col.no{border-color:rgba(255,90,106,.32)}
  .dd .hd{font-family:var(--mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}
  .dd .do .hd{color:var(--do)} .dd .no .hd{color:var(--no)}
  .dd ul{list-style:none;display:flex;flex-direction:column;gap:9px}
  .dd li{position:relative;padding-left:22px;color:var(--muted);font-size:.93rem}
  .dd .do li::before{content:"\2713";position:absolute;left:0;color:var(--do)}
  .dd .no li::before{content:"\2715";position:absolute;left:0;color:var(--no)}

  .founder{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;border:1px solid var(--line2);border-radius:var(--radius);padding:24px;margin-top:20px;
    background:radial-gradient(360px 180px at 10% 0,rgba(255,46,126,.1),transparent 60%),linear-gradient(180deg,var(--panel2),rgba(20,10,44,.5))}
  .founder img{width:120px;height:120px;border-radius:14px;box-shadow:0 0 0 1px rgba(91,149,255,.4),0 12px 30px rgba(124,58,237,.45),0 0 34px rgba(34,199,219,.25)}
  .founder .role{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:4px 0 10px}
  .founder p{margin-top:0;font-size:.95rem}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;margin-top:20px;font-size:.95rem}
  .kv dt{font-family:var(--mono);font-size:.76rem;color:var(--teal);letter-spacing:.06em;padding-top:2px}
  .kv dd{color:var(--muted)}
  .callout{border-left:3px solid var(--pink);background:rgba(255,46,126,.06);border-radius:0 12px 12px 0;padding:14px 18px;margin-top:20px;color:var(--muted);font-size:.94rem}
  .callout b{color:var(--ink)}

  @media(max-width:760px){.grid2,.grid3,.dd{grid-template-columns:1fr}.swatches{grid-template-columns:repeat(2,1fr)}.founder{grid-template-columns:1fr;text-align:center}.founder img{margin:0 auto}}

  /* unlock screen */
  #lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  #lock .box{width:100%;max-width:420px;text-align:center;border:1px solid var(--line2);border-radius:20px;padding:38px 30px;
    background:radial-gradient(320px 160px at 50% 0,rgba(255,46,126,.14),transparent 60%),linear-gradient(180deg,var(--panel2),rgba(20,10,44,.6))}
  #lock .cactus{font-size:2.2rem}
  #lock h1{font-size:1.9rem;font-weight:800;margin:12px 0 4px}
  #lock h1 .s{color:var(--pink)}
  #lock .sub{font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  #lock form{margin-top:26px;display:flex;flex-direction:column;gap:12px}
  #lock input{font-family:var(--body);font-size:1rem;padding:13px 16px;border-radius:11px;border:1px solid var(--line2);
    background:rgba(0,0,0,.35);color:var(--ink);outline:none}
  #lock input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
  #lock button{font-family:var(--disp);font-weight:700;font-size:1rem;padding:13px 16px;border:none;border-radius:11px;cursor:pointer;
    background:var(--blue-deep);color:#fff;box-shadow:0 10px 26px rgba(59,130,246,.4);transition:transform .15s,box-shadow .15s}
  #lock button:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(59,130,246,.5)}
  #lock button:disabled{opacity:.6;cursor:default;transform:none}
  #lock .err{min-height:20px;color:var(--no);font-size:.86rem}
  #lock .note{margin-top:18px;font-size:.76rem;color:var(--dim)}
  #content{display:none}
  @media(prefers-reduced-motion:reduce){#lock button{transition:none}}
</style>

<div id="lock">
  <div class="box">
    <div class="cactus">🌵</div>
    <h1>Vegas <span class="s">Sidekick</span></h1>
    <div class="sub">Brand Bible · Confidential</div>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" placeholder="Passphrase" aria-label="Passphrase" autofocus />
      <button id="btn" type="submit">Unlock</button>
      <div class="err" id="err" role="alert"></div>
    </form>
    <div class="note">This page is private. If you don't have the passphrase, you're not meant to be here.</div>
  </div>
</div>

<div id="content"></div>
