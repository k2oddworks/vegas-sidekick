    <path d="M390 420 Q500 390 610 420 L565 560 Q500 540 435 560 Z"/>
    <path d="M390 430 Q305 420 230 455 L185 575 Q265 625 385 650 L435 560 Z"/>
  </g>
  <g fill="#16c7e8" stroke="#2fe0ff" stroke-width="4">
    <path d="M615 860 L800 860 L790 700 Q735 690 650 705 L620 770 Z"/>
    <path d="M380 770 L350 705 Q265 690 210 700 L200 860 H385 Z"/>
  </g>
  <g fill="#d61b68" stroke="#ff3d89" stroke-width="4">
    <path d="M825 800 L955 820 L945 575 L865 500 L800 575 L820 655 Z"/>
    <path d="M40 675 L180 720 L175 835 L35 850 Z"/>
  </g>
  <path d="M400 860 H600 V790 C600 720 565 680 500 680 C435 680 400 720 400 790 Z" fill="#22242b" stroke="#2f3038" stroke-width="4"/>
  <g fill="#fff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800" text-anchor="middle" dominant-baseline="middle">
    <text x="710" y="780">101</text><text x="685" y="540">102</text><text x="500" y="495">103</text><text x="315" y="540">104</text><text x="290" y="780">105</text>
    <text x="885" y="665">201</text><text x="710" y="260">202</text><text x="500" y="205">203</text><text x="290" y="260">204</text><text x="120" y="515">205</text><text x="105" y="770">206</text>
  </g>
  <text x="500" y="790" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle" letter-spacing="8">STAGE</text>
</g>
<text x="600" y="1085" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="800" text-anchor="middle">Cirque du Soleil Mystère Seating Chart</text>
<text x="600" y="1128" fill="#e4dde9" font-family="Inter,Arial,sans-serif" font-size="25" text-anchor="middle">TI / Treasure Island</text>
<text x="600" y="1168" fill="#ffb000" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" text-anchor="middle">VegasSidekick.com</text>
