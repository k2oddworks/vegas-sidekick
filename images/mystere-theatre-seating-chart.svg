<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Mystère seating chart at TI Las Vegas</title>
<desc id="desc">Mystère Theatre sections 101 through 206 with Vegas Sidekick sweet spots in sections 102 through 104 and 202 through 205.</desc>
<defs>
