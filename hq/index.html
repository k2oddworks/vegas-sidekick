<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0518;--panel:#160a30;--panel2:#201044;--line:rgba(198,163,255,.16);--line2:rgba(198,163,255,.28);--text:#f5f1ff;--muted:#aaa0c8;--dim:#786e98;--pink:#ff2e7e;--amber:#ffb000;--lime:#c6f22e;--blue:#5b95ff;--teal:#22c7db;--green:#42d392;--shadow:0 22px 70px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(900px 560px at 88% -8%,rgba(124,58,237,.27),transparent 60%),radial-gradient(760px 480px at 0 0,rgba(255,46,126,.11),transparent 58%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body{-webkit-font-smoothing:antialiased}a{color:inherit}button,input{font:inherit}.eyebrow{font:600 .68rem 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
#lock{min-height:100vh;display:grid;place-items:center;padding:24px}#lock[hidden]{display:none}.lock-card{width:min(440px,100%);text-align:center;border:1px solid var(--line2);border-radius:22px;padding:38px 30px;background:radial-gradient(320px 170px at 50% 0,rgba(255,46,126,.13),transparent 60%),linear-gradient(180deg,var(--panel2),rgba(20,10,44,.72));box-shadow:var(--shadow)}.cactus{font-size:2.4rem}.lock-card h1{font:800 2rem 'Plus Jakarta Sans',sans-serif;margin:10px 0 4px;letter-spacing:-.04em}.lock-card h1 .s{color:var(--pink)}.lock-card .sub{color:var(--muted);font:.72rem 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase}#f{display:flex;flex-direction:column;gap:10px;margin-top:24px}#pw{border:1px solid var(--line2);border-radius:11px;background:#0d0617;color:#fff;padding:13px 15px;outline:none}#pw:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,149,255,.2)}#btn{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:13px 15px;font-weight:800;cursor:pointer}#btn:disabled{opacity:.6}.err{min-height:20px;color:#ff9898;font-size:.85rem}.note{margin-top:16px;color:var(--dim);font-size:.76rem}
#hub{display:none}.hub{max-width:1220px;margin:0 auto;padding:34px 24px 56px}.hub-header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;padding:22px 0 30px;border-bottom:1px solid var(--line)}.hub-header h1{font:800 clamp(2.8rem,6vw,5rem) 'Plus Jakarta Sans',sans-serif;letter-spacing:-.06em;margin:3px 0}.lede{margin:0;color:var(--muted);font-size:1.05rem}.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pill,.button{border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:.76rem;font-weight:800;text-decoration:none}.pill.live{color:var(--lime);background:rgba(198,242,46,.07)}.button.ghost{background:rgba(255,255,255,.04)}
.section{padding:34px 0;border-bottom:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:16px}.section-head h2{font:800 clamp(1.6rem,3vw,2.2rem) 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em;margin:4px 0 0}.section-head p{margin:0;color:var(--muted);max-width:52ch;text-align:right;font-size:.9rem}.grid{display:grid;gap:12px}.grid.tools{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.products{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{position:relative;display:flex;gap:14px;border:1px solid var(--line);border-radius:16px;padding:18px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));text-decoration:none;transition:.15s ease}.card:hover{transform:translateY(-2px);border-color:var(--line2);background:rgba(255,255,255,.06)}.card.featured{border-color:rgba(255,176,0,.32);background:linear-gradient(180deg,rgba(255,176,0,.09),rgba(255,255,255,.02))}.card-icon{flex:0 0 auto;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-weight:800;color:var(--teal)}.card h3{font:800 1.08rem 'Plus Jakarta Sans',sans-serif;margin:4px 0 5px}.card p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.55}.card p strong{color:#fff}.kicker{font:.64rem 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}.arrow{position:absolute;right:14px;top:14px;color:var(--dim)}.card.product{display:block;min-height:180px}.card.product .num{display:block;color:var(--pink);font:700 .72rem 'IBM Plex Mono',monospace;letter-spacing:.1em;margin-bottom:28px}
.docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.docs a,.ops-grid a{display:flex;justify-content:space-between;gap:18px;align-items:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:rgba(255,255,255,.025)}.docs a:hover,.ops-grid a:hover{background:rgba(255,255,255,.055);border-color:var(--line2)}.docs strong,.ops-grid strong{font-size:.86rem}.docs span,.ops-grid span{color:var(--muted);font-size:.76rem;text-align:right}.ops-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
footer{display:flex;justify-content:space-between;gap:16px;padding:24px 0 0;color:var(--dim);font:.68rem 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
@media(max-width:900px){.grid.products{grid-template-columns:repeat(2,1fr)}.hub-header,.section-head{align-items:flex-start;flex-direction:column}.section-head p{text-align:left}.header-actions{justify-content:flex-start}}
@media(max-width:650px){.hub{padding:22px 14px 40px}.grid.tools,.grid.products,.docs,.ops-grid{grid-template-columns:1fr}.card.product{min-height:150px}.docs a,.ops-grid a{align-items:flex-start;flex-direction:column;gap:4px}.docs span,.ops-grid span{text-align:left}footer{flex-direction:column}}
</style>
</head>
