<meta charset="utf-8">
<title>Vegas Sidekick — HQ</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

  :root{
    --void:#0b0518;--panel:#160a30;--panel2:#1e0f3e;--ink:#f3eeff;--muted:#a99fce;--dim:#7d75a3;
    --line:rgba(198,163,255,.16);--line2:rgba(198,163,255,.30);
    --blue:#5b95ff;--blue-deep:#3b82f6;--pink:#ff2e7e;--lime:#c6f22e;--purple:#a855f7;--teal:#22c7db;
    --do:#3ddc84;--no:#ff5a6a;--radius:16px;
    --disp:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--void);color:var(--ink);font-family:var(--body);line-height:1.65;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 500px at 85% -8%,rgba(124,58,237,.30),transparent 60%),radial-gradient(700px 440px at 4% 3%,rgba(255,46,126,.12),transparent 55%);background-attachment:fixed}
  h1,h2,h3,h4,.disp{font-family:var(--disp);letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
  a{color:var(--blue)}
  code{font-family:var(--mono);font-size:.85em;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:#e7ddff}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px}
  .eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--purple);display:block;margin-bottom:6px}

  /* hub header + tabs */
  .hub-top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(30,15,62,.5),transparent);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
  .hub-top .wrap{padding-top:20px;padding-bottom:0}
  .brandline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brandline .name{font-family:var(--disp);font-weight:800;font-size:1.3rem}
  .brandline .name .s{color:var(--pink)}
  .brandline .tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab-btn{flex:0 0 auto;font-family:var(--disp);font-weight:600;font-size:.9rem;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:11px 15px;cursor:pointer;white-space:nowrap;transition:color .15s}
  .tab-btn:hover{color:var(--ink)}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--pink)}
  .panel{display:none;padding:40px 0 70px}
  .panel.active{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .panel h2{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:800;margin-bottom:6px}
  .panel h3{font-size:1.2rem;margin:30px 0 4px}
  .panel p{color:var(--muted);margin-top:12px;max-width:72ch}
  .panel p strong,.panel li strong{color:var(--ink);font-weight:600}
  .lead{font-size:1.12rem;color:var(--ink)!important}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
  .card{border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:linear-gradient(180deg,var(--panel),rgba(20,10,44,.4))}
  .card h4{font-size:1.02rem;margin-bottom:6px}.card p{margin-top:6px;font-size:.93rem}
  ul.clean{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:9px}
  ul.clean li{position:relative;padding-left:22px;color:var(--muted)}
  ul.clean li::before{content:"";position:absolute;left:0;top:12px;width:9px;height:2px;background:var(--lime);box-shadow:0 0 8px var(--lime)}
  ol.steps{list-style:none;counter-reset:s;margin-top:16px;display:flex;flex-direction:column;gap:12px}
  ol.steps li{position:relative;padding-left:40px;color:var(--muted)}
  ol.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:.78rem;color:var(--teal);border:1px solid var(--line2);background:rgba(34,199,219,.08)}
  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
  .sw{border:1px solid var(--line);border-radius:12px;overflow:hidden}.sw .chip{height:48px}.sw .m{padding:8px 10px;font-family:var(--mono);font-size:.64rem;color:var(--muted)}.sw .m b{display:block;color:var(--ink);font-size:.72rem}
  .dd{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .dd .col{border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .dd .do{border-color:rgba(61,220,132,.3)}.dd .no{border-color:rgba(255,90,106,.3)}
  .dd .hd{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
  .dd .do .hd{color:var(--do)}.dd .no .hd{color:var(--no)}
  .dd ul{list-style:none;display:flex;flex-direction:column;gap:8px}.dd li{position:relative;padding-left:20px;color:var(--muted);font-size:.92rem}
  .dd .do li::before{content:"\2713";position:absolute;left:0;color:var(--do)}.dd .no li::before{content:"\2715";position:absolute;left:0;color:var(--no)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;margin-top:16px;font-size:.94rem}
  .kv dt{font-family:var(--mono);font-size:.75rem;color:var(--teal);letter-spacing:.04em;padding-top:2px}.kv dd{color:var(--muted)}
  .callout{border-left:3px solid var(--pink);background:rgba(255,46,126,.06);border-radius:0 12px 12px 0;padding:13px 16px;margin-top:18px;color:var(--muted);font-size:.92rem}
  .callout.warn{border-left-color:var(--no);background:rgba(255,90,106,.07)}.callout b{color:var(--ink)}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
  .stat{border:1px solid var(--line);border-radius:12px;padding:16px 14px;background:linear-gradient(180deg,var(--panel),rgba(20,10,44,.4))}
  .stat .n{font-family:var(--disp);font-weight:800;font-size:1.7rem}.stat .l{color:var(--muted);font-size:.82rem;margin-top:4px}
  .stat:nth-child(1) .n{color:var(--lime)}.stat:nth-child(2) .n{color:var(--pink)}.stat:nth-child(3) .n{color:var(--blue)}.stat:nth-child(4) .n{color:var(--teal)}
  .tl{position:relative;margin-top:18px;padding-left:26px}
  .tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--blue),var(--pink),var(--lime))}
  .ev{position:relative;padding:0 0 22px 6px}
  .ev::before{content:"";position:absolute;left:-26px;top:4px;width:13px;height:13px;border-radius:50%;background:var(--void);border:2px solid var(--pink);box-shadow:0 0 10px var(--pink)}
  .ev.b::before{border-color:var(--blue);box-shadow:0 0 10px var(--blue)}.ev.l::before{border-color:var(--lime);box-shadow:0 0 10px var(--lime)}.ev.t::before{border-color:var(--teal);box-shadow:0 0 10px var(--teal)}
  .ev h4{font-size:1.05rem;margin-bottom:3px}.ev p{margin-top:3px;font-size:.92rem}.ev .date{font-family:var(--mono);font-size:.68rem;color:var(--dim);text-transform:uppercase}
  .founder{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;border:1px solid var(--line2);border-radius:var(--radius);padding:20px;margin-top:16px;background:linear-gradient(180deg,var(--panel2),rgba(20,10,44,.5))}
  .founder img{width:104px;height:104px;border-radius:12px;box-shadow:0 0 0 1px rgba(91,149,255,.4),0 10px 26px rgba(124,58,237,.4)}
  .founder .role{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin:3px 0 8px}
  .check{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:10px}
  .check li{position:relative;padding-left:30px;color:var(--muted)}
  .check li::before{content:"";position:absolute;left:0;top:2px;width:17px;height:17px;border-radius:5px;border:1px solid var(--line2);background:rgba(255,255,255,.03)}
  .check li.done{color:var(--dim);text-decoration:line-through}
  .check li.done::before{background:var(--do);border-color:var(--do);content:"\2713";color:#06210f;font-size:.72rem;font-weight:700;display:grid;place-items:center;line-height:17px}
  .pill{display:inline-block;font-family:var(--mono);font-size:.68rem;padding:3px 9px;border-radius:100px;border:1px solid var(--line2);color:var(--muted);margin:2px 4px 2px 0}
  @media(max-width:760px){.grid2,.grid3,.dd{grid-template-columns:1fr}.swatches,.stat-row{grid-template-columns:repeat(2,1fr)}.founder{grid-template-columns:1fr;text-align:center}.founder img{margin:0 auto}}

  #lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  #lock .box{width:100%;max-width:420px;text-align:center;border:1px solid var(--line2);border-radius:20px;padding:38px 30px;background:radial-gradient(320px 160px at 50% 0,rgba(255,46,126,.14),transparent 60%),linear-gradient(180deg,var(--panel2),rgba(20,10,44,.6))}
  #lock .cactus{font-size:2.2rem}#lock h1{font-family:var(--disp);font-size:1.9rem;font-weight:800;margin:12px 0 4px}#lock h1 .s{color:var(--pink)}
  #lock .sub{font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  #lock form{margin-top:26px;display:flex;flex-direction:column;gap:12px}
  #lock input{font-family:var(--body);font-size:1rem;padding:13px 16px;border-radius:11px;border:1px solid var(--line2);background:rgba(0,0,0,.35);color:var(--ink);outline:none}
  #lock input:focus{border-color:var(--blue-deep);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
  #lock button{font-family:var(--disp);font-weight:700;font-size:1rem;padding:13px 16px;border:none;border-radius:11px;cursor:pointer;background:var(--blue-deep);color:#fff;box-shadow:0 10px 26px rgba(59,130,246,.4);transition:transform .15s}
  #lock button:hover{transform:translateY(-1px)}#lock button:disabled{opacity:.6}
  #lock .err{min-height:20px;color:#ff5a6a;font-size:.86rem}#lock .note{margin-top:18px;font-size:.76rem;color:var(--dim)}
  #hub{display:none}
</style>
