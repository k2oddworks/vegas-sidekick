<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Las Vegas Shows | Vegas Sidekick</title>
  <meta name="description" content="Search all Las Vegas shows — comedy, magic, Cirque du Soleil, production shows and more. Find discount tickets with no hidden fees." />
  <link rel="canonical" href="https://vegassidekick.com/search/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:#171225; --bg:#ffffff; --soft:#f5f4fb; --line:#ece9f6; --muted:#6c6883;
      --purple:#7c3aed; --pink:#ff2e7e; --lime:#c6f22e; --blue:#3b82f6; --blue-dk:#2563eb; --teal:#0fb5c9;
      --hero-1:#1c0a3a; --hero-2:#2b0f5c; --hero-3:#12061f; --radius:18px;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; }
    h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -.02em; line-height: 1.08; }
    a { text-decoration: none; color: var(--blue); }
    button { font-family: inherit; cursor: pointer; }
    img { max-width: 100%; display: block; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 22px; }

    /* HERO */
    .hero { position: relative; overflow: hidden; color: #fff; text-align: center; padding: 104px 0 62px;
      background: radial-gradient(1200px 600px at 80% -10%, rgba(124,58,237,.55), transparent 60%),
                  radial-gradient(900px 520px at 8% 120%, rgba(255,46,126,.32), transparent 55%),
                  linear-gradient(160deg, var(--hero-1), var(--hero-2) 60%, var(--hero-3)); }
    .hero::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:.8;
      background-image: radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.6), transparent),
                        radial-gradient(1.5px 1.5px at 75% 25%, rgba(198,242,46,.7), transparent),
                        radial-gradient(1.5px 1.5px at 40% 75%, rgba(255,95,160,.6), transparent); }
    .hero .in { position: relative; z-index: 2; }
    .eyebrow { font-weight: 700; font-size: .76rem; letter-spacing: .16em; text-transform: uppercase; color: #c9b8ff; margin-bottom: 14px; }
    .hero h1 { font-size: clamp(2.6rem, 6vw, 4rem); font-weight: 800; margin-bottom: 14px; }
    .hero h1 span { background: linear-gradient(90deg, var(--pink), var(--lime)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .hero .sub { color: rgba(255,255,255,.82); max-width: 54ch; margin: 0 auto; font-size: 1.06rem; }

    /* SEARCH BOX */
    .searchbox { display: flex; max-width: 640px; margin: 30px auto 0; border-radius: 100px; overflow: hidden; box-shadow: 0 16px 44px rgba(10,4,25,.4); }
    .searchbox input { flex: 1; min-width: 0; border: none; padding: 17px 24px; background: #fff; color: var(--ink); font-family: 'Inter', sans-serif; font-size: 1.05rem; outline: none; }
    .searchbox input::placeholder { color: var(--muted); }
    .searchbox button { border: none; background: var(--blue); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 1rem; padding: 17px 30px; white-space: nowrap; transition: background .15s; }
    .searchbox button:hover { background: var(--blue-dk); }

    /* RESULTS SECTION */
    .results { padding: 34px 0 80px; }

    /* CHIPS */
    .vs-chips-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin-bottom: 24px; }
    .vs-chips-label { font-weight: 700; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--purple); margin-right: 4px; }
    .vs-chip { background: var(--soft); border: 1px solid var(--line); border-radius: 100px; padding: 7px 16px; font-size: .84rem; color: var(--ink); font-weight: 600; transition: all .16s; }
    .vs-chip:hover { border-color: var(--blue); color: var(--blue); background: #fff; }

    .vs-stats { font-size: .9rem; color: var(--muted); margin-bottom: 18px; font-weight: 500; }

    /* RESULTS GRID */
    .vs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; list-style: none; }
    .show-hit-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; color: var(--ink); box-shadow: 0 8px 24px rgba(23,18,37,.05); transition: transform .16s, box-shadow .16s; display: flex; flex-direction: column; }
    .show-hit-card:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(23,18,37,.12); }
    .show-hit-img { aspect-ratio: 16/9; background: var(--soft); display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 1.1rem; letter-spacing: .3px; color: var(--muted); position: relative; overflow: hidden; text-align: center; padding: 0 10px; }
    .show-hit-img img { width: 100%; height: 100%; object-fit: cover; }
    .show-hit-category { position: absolute; top: 10px; left: 10px; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-size: .64rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 4px 10px; border-radius: 100px; }
    .show-hit-category[style*="c6f22e"] { color: #171225; }
    .show-hit-body { padding: 15px 16px 8px; flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .show-hit-venue { font-size: .78rem; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .show-hit-name { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 1.12rem; line-height: 1.15; color: var(--ink); }
    .show-hit-name mark { background: rgba(255,46,126,.16); color: var(--pink); border-radius: 3px; padding: 0 2px; }
    .show-hit-footer { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 15px; }
    .show-hit-price { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.18rem; color: var(--blue); }
    .show-hit-price small { font-size: .68rem; font-weight: 600; color: var(--muted); text-transform: none; margin-right: 3px; }
    .show-hit-cta { font-family: 'Plus Jakarta Sans', sans-serif; font-size: .86rem; font-weight: 700; color: var(--pink); }

    /* EMPTY STATE */
    .vs-empty { text-align: center; padding: 40px 20px 10px; }
    .vs-empty-icon { font-size: 2.8rem; margin-bottom: 14px; }
    .vs-empty-head { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.6rem; margin-bottom: 8px; color: var(--ink); }
    .vs-empty-sub { font-size: .96rem; color: var(--muted); margin-bottom: 24px; }
    .vs-empty .vs-chips-wrap { justify-content: center; }
    .vs-browse { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; background: var(--blue); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 1rem; padding: 14px 28px; border-radius: 100px; box-shadow: 0 12px 30px rgba(59,130,246,.35); transition: transform .15s, background .15s; }
    .vs-browse:hover { background: var(--blue-dk); transform: translateY(-2px); }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media (max-width: 600px) {
      .hero { padding: 92px 0 52px; }
      .searchbox button { padding: 17px 18px; }
      .vs-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .show-hit-name { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div id="vs-header"></div>

  <section class="hero">
    <div class="wrap in">
      <div class="eyebrow">Search</div>
      <h1>Find Your <span>Show</span></h1>
      <p class="sub">Search every Las Vegas show we track — comedy, magic, Cirque, music and more. Real prices, no hidden fees.</p>
      <form class="searchbox" id="vs-form" role="search">
        <input id="vs-q" type="search" placeholder="Search shows, venues, categories…" autocomplete="off" aria-label="Search shows" />
        <button type="submit">Search</button>
      </form>
    </div>
  </section>

  <section class="results">
    <div class="wrap">
      <div class="vs-chips-wrap" id="vs-chips"><span class="vs-chips-label">Popular</span></div>
      <div class="vs-stats" id="vs-stats" hidden></div>
      <div class="vs-grid" id="vs-results"></div>
      <div class="vs-empty" id="vs-empty" hidden></div>
    </div>
  </section>

  <div id="vs-footer"></div>

  <script src="/components/header.js?v=13"></script>
  <script src="/components/footer.js?v=10"></script>
  <script src="/components/search-data.js?v=26"></script>
  <script src="/components/search.js?v=1"></script>
  <script>
  (function () {
    var POPULAR = ['Comedy', 'Magic', 'Cirque', 'Cirque du Soleil', 'Carrot Top', 'Family', 'Adult'];
    var CAT_COLOR = { 'Comedy':'#ff2e7e', 'Magic':'#7c3aed', 'Cirque':'#0fb5c9', 'Music':'#3b82f6', 'Family':'#0fb5c9', 'Adult':'#c6f22e', 'Spectaculars':'#0fb5c9' };
    var input   = document.getElementById('vs-q');
    var form    = document.getElementById('vs-form');
    var results = document.getElementById('vs-results');
    var stats   = document.getElementById('vs-stats');
    var empty   = document.getElementById('vs-empty');
    var chips   = document.getElementById('vs-chips');

    function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    // Highlight the matched query inside the show name
    function hl(name, q) {
      if (!q) return esc(name);
      var nn = vsNorm(name), nq = vsNorm(q), i = nn.indexOf(nq);
      if (i < 0) return esc(name);
      return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + q.length)) + '</mark>' + esc(name.slice(i + q.length));
    }

    function card(s, q) {
      var img = s.img
        ? '<img src="' + s.img + '" alt="' + esc(s.name) + '" loading="lazy" onerror="this.remove()">'
        : esc(s.name);
      var price = s.pd ? '<span class="show-hit-price"><small>from</small>' + esc(s.pd) + '</span>'
                       : '<span class="show-hit-price">See Prices</span>';
      var color = CAT_COLOR[s.cat] || '#7c3aed';
      return '<a class="show-hit-card" href="' + s.url + '">' +
        '<div class="show-hit-img">' + img + '<span class="show-hit-category" style="background:' + color + '">' + esc(s.cat) + '</span></div>' +
        '<div class="show-hit-body"><div class="show-hit-venue">📍 ' + esc(s.venue) + '</div>' +
        '<div class="show-hit-name">' + hl(s.name, q) + '</div></div>' +
        '<div class="show-hit-footer">' + price + '<span class="show-hit-cta">View →</span></div></a>';
    }

    function chipRow(label) {
      var html = '<span class="vs-chips-label">' + label + '</span>';
      POPULAR.forEach(function (t) { html += '<button type="button" class="vs-chip" data-q="' + esc(t) + '">' + esc(t) + '</button>'; });
      return html;
    }

    function render(q, pushUrl) {
      chips.innerHTML = chipRow('Popular');
      var list = vsSearch(q);
      if (!q) {
        results.innerHTML = '';
        stats.hidden = true;
        empty.hidden = false;
        empty.innerHTML = '<div class="vs-empty-icon">🎟️</div>' +
          '<div class="vs-empty-head">What are you in the mood for?</div>' +
          '<div class="vs-empty-sub">Search a show, venue, or category — or start with a popular pick.</div>' +
          '<div class="vs-chips-wrap">' + chipRow('Try') + '</div>';
      } else if (list.length) {
        empty.hidden = true;
        stats.hidden = false;
        stats.textContent = list.length + (list.length === 1 ? ' show' : ' shows') + ' matching “' + q + '”';
        results.innerHTML = list.map(function (s) { return card(s, q); }).join('');
      } else {
        results.innerHTML = '';
        stats.hidden = true;
        empty.hidden = false;
        empty.innerHTML = '<div class="vs-empty-icon">🤔</div>' +
          '<div class="vs-empty-head">No shows match “' + esc(q) + '”</div>' +
          '<div class="vs-empty-sub">Check the spelling, or try one of these:</div>' +
          '<div class="vs-chips-wrap">' + chipRow('Try') + '</div>' +
          '<a class="vs-browse" href="/shows/">Browse all shows →</a>';
      }
      var url = q ? '/search/?q=' + encodeURIComponent(q) : '/search/';
      if (pushUrl) history.replaceState(null, '', url);
    }

    // chip clicks (event delegation covers header row + empty-state rows)
    document.addEventListener('click', function (e) {
      var c = e.target.closest('.vs-chip');
      if (!c) return;
      input.value = c.getAttribute('data-q');
      input.focus();
      render(input.value, true);
    });

    input.addEventListener('input', function () { render(input.value, true); });
    form.addEventListener('submit', function (e) { e.preventDefault(); render(input.value, true); });

    // initial: read ?q=
    var q0 = new URLSearchParams(location.search).get('q') || '';
    input.value = q0;
    render(q0, false);
    if (!q0) input.focus();
  })();
  </script>

</body>
</html>
