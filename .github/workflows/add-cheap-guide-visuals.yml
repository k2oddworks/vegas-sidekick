name: Add Cheap Guide Visuals
on:
  push:
    paths:
      - 'scripts/add-cheap-guide-visuals.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply visual upgrade
        run: python scripts/add-cheap-guide-visuals.py
      - name: Commit guide
        run: |
          git config user.name "Kris Kidd"
          git config user.email "k2oddworks@gmail.com"
          git add guides/best-cheap-vegas-shows/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add real show photography to Cheap Shows guide"
          git push
