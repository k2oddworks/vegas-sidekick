name: Ticket CTA Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * 0'
  push:
    branches: [main]
    paths:
      - 'shows/**'
      - 'guides/**'
      - 'news/**'
      - 'venues/**'
      - 'assets/ticket-cta.css'
      - 'scripts/audit-ticket-cta-color.py'
      - 'scripts/canonicalize-show-pages.py'
      - '.github/workflows/ticket-cta-audit.yml'

permissions:
  contents: read

jobs:
  warm-amber-ticket-ctas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit primary ticket CTA treatment
        run: python3 scripts/audit-ticket-cta-color.py
