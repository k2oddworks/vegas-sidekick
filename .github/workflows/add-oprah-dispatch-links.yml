name: Add Oprah Dispatch Links
on:
  push:
    branches: [main]
    paths: [scripts/add-oprah-dispatch-links.py]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/add-oprah-dispatch-links.py
      - run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/index.html index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Feature Oprah AHA in Vegas Dispatch"
          git push origin main
