name: Reorder all active show pages
on:
  push:
    paths:
      - 'scripts/reorder-all-show-pages.py'
      - '.github/workflows/reorder-all-show-pages.yml'
permissions:
  contents: write
jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reorder active show pages
        run: python3 scripts/reorder-all-show-pages.py
      - name: Run show audits
        run: |
          python3 scripts/audit-show-videos.py
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-orphan-ui.py
          git diff --check
      - name: Commit migration and remove one-time files
        run: |
          rm -f .github/workflows/reorder-all-show-pages.yml scripts/reorder-all-show-pages.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorder active show pages around buyer journey"
          git push origin main
