name: Run Full Mobile Hero Audit

on:
  push:
    branches: [ux/full-mobile-hero-audit]
    paths: [.github/workflows/run-full-mobile-hero-audit.yml]

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/full-mobile-hero-audit
          fetch-depth: 0

      - name: Add universal safe-fit mobile hero treatment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob, json, re

          closed = {
              'shows/cirque/mad-apple/index.html',
              'shows/magic/david-goldrake/index.html',
          }
          files = [f for f in sorted(glob.glob('shows/*/*/index.html')) if f not in closed]
          div_re = re.compile(r'<div class="hero-media"[^>]*>')
          img_re = re.compile(r'<img\b[^>]*\bsrc="([^"]+)"')
          changed = 0
          inventory = []

          for f in files:
              p = Path(f)
              s = p.read_text()
              dm = div_re.search(s)
              if not dm:
                  raise SystemExit(f'No hero-media container found: {f}')
              im = img_re.search(s, dm.end(), min(len(s), dm.end() + 1200))
              if not im:
                  raise SystemExit(f'No hero image found after hero-media container: {f}')
              src = im.group(1)
              new_div = f'<div class="hero-media" data-mobile-fit="safe" style="--mobile-hero-image:url(\'{src}\');--mobile-hero-position:center center">'
              if dm.group(0) != new_div:
                  s = s[:dm.start()] + new_div + s[dm.end():]
                  p.write_text(s)
                  changed += 1
              inventory.append((f, src))

          print(f'Active show pages audited: {len(files)}')
          print(f'Hero tags updated: {changed}')
          for f, src in inventory:
              print(f'{f}\t{src}')

          for data_path in sorted(Path('data/shows').glob('*.json')):
              d = json.loads(data_path.read_text())
              canonical = d.get('canonical_path', '').strip('/')
              page = f'{canonical}/index.html' if canonical else ''
              if page not in files:
                  continue
              src = (d.get('media') or {}).get('hero_image')
              if not src:
                  continue
              d.setdefault('media', {})['mobile_hero'] = {'fit': 'safe', 'position': 'center center'}
              provenance = d.setdefault('provenance', {})
              auth = provenance.setdefault('authoritative_fields', [])
              if 'media.mobile_hero' not in auth:
                  auth.append('media.mobile_hero')
              data_path.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Extend generic show sync for safe-fit heroes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/sync-show-from-data.py')
          s = p.read_text()
          s = s.replace('if fit not in {"cover", "contain"}:', 'if fit not in {"cover", "contain", "safe"}:')
          s = s.replace('media.mobile_hero.fit must be cover or contain', 'media.mobile_hero.fit must be cover, contain or safe')

          old_attrs = '''    attrs = f' data-mobile-fit="{fit}" style="--mobile-hero-position:{position}"'\n'''
          new_attrs = '''    hero_src = ((record.get("media") or {}).get("hero_image") or "")\n    bg = f";--mobile-hero-image:url('{hero_src}')" if fit == "safe" and hero_src else ""\n    attrs = f' data-mobile-fit="{fit}" style="--mobile-hero-position:{position}{bg}"'\n'''
          if old_attrs in s:
              s = s.replace(old_attrs, new_attrs, 1)
          elif '--mobile-hero-image:' not in s:
              raise SystemExit('sync_mobile_hero attrs block not found')

          old_pattern = '''    pattern = r'<div class="hero-media"(?: data-mobile-fit="[^\"]+")?(?: style="--mobile-hero-position:[^\"]+")?>'\n'''
          new_pattern = '''    pattern = r'<div class="hero-media"[^>]*>'\n'''
          if old_pattern in s:
              s = s.replace(old_pattern, new_pattern, 1)
          elif '''pattern = r'<div class="hero-media"[^>]*>' ''' not in s:
              # Handle exact current source if escaping differs.
              s = s.replace('    pattern = r\'<div class="hero-media"(?: data-mobile-fit="[^\"]+")?(?: style="--mobile-hero-position:[^\"]+")?>\'\n', '    pattern = r\'<div class="hero-media"[^>]*>\'\n', 1)
          p.write_text(s)
          PY

      - name: Add shared safe-fit CSS
        run: |
          cat >> assets/show-canonical.css <<'CSS'

          /* Catalog-wide mobile hero safe fit: show the whole artwork over a softened fill. */
          @media(max-width:800px){
            .hero-media[data-mobile-fit="safe"]{position:relative;isolation:isolate;overflow:hidden;background:#17082e}
            .hero-media[data-mobile-fit="safe"]::before{content:"";position:absolute;inset:-18px;z-index:0;background-image:var(--mobile-hero-image);background-size:cover;background-position:var(--mobile-hero-position,center center);filter:blur(18px) brightness(.48) saturate(.9);transform:scale(1.08)}
            .hero-media[data-mobile-fit="safe"] img{position:relative;z-index:1;object-fit:contain!important;object-position:var(--mobile-hero-position,center center)}
            .hero-media[data-mobile-fit="safe"]::after{z-index:2;background:linear-gradient(0deg,#2c0b4e 0,rgba(44,11,78,.55) 10%,transparent 30%)}
          }
          CSS

      - name: Add reusable mobile hero audit
        run: |
          cat > scripts/audit-mobile-show-heroes.py <<'PY'
          #!/usr/bin/env python3
          import glob, re, sys
          from pathlib import Path

          CLOSED = {
              'shows/cirque/mad-apple/index.html',
              'shows/magic/david-goldrake/index.html',
          }
          DIV = re.compile(r'<div class="hero-media"[^>]*data-mobile-fit="([^"]+)"[^>]*style="([^"]*)"[^>]*>')
          IMG = re.compile(r'<img\b[^>]*\bsrc="([^"]+)"')
          allowed = {'safe', 'cover', 'contain'}
          issues = 0
          checked = 0
          modes = {}
          for f in sorted(glob.glob('shows/*/*/index.html')):
              if f in CLOSED:
                  continue
              checked += 1
              text = Path(f).read_text()
              dm = DIV.search(text)
              if not dm:
                  print(f'{f}: missing structured mobile hero treatment')
                  issues += 1
                  continue
              im = IMG.search(text, dm.end(), min(len(text), dm.end() + 1200))
              if not im:
                  print(f'{f}: hero image not found after hero-media')
                  issues += 1
                  continue
              mode, style = dm.groups()
              src = im.group(1)
              modes[mode] = modes.get(mode, 0) + 1
              if mode not in allowed:
                  print(f'{f}: invalid mobile hero mode {mode!r}')
                  issues += 1
              if '--mobile-hero-position:' not in style:
                  print(f'{f}: missing mobile hero focal position')
                  issues += 1
              if mode == 'safe' and '--mobile-hero-image:' not in style:
                  print(f'{f}: safe mode missing background image variable')
                  issues += 1
              if not src.startswith('/images/'):
                  print(f'{f}: unexpected hero src {src!r}')
                  issues += 1
          print(f'Checked {checked} active show mobile heroes. Modes: {modes}')
          if issues:
              print(f'{issues} mobile hero issue(s) found.')
              sys.exit(1)
          print('All active show mobile heroes have an explicit safe treatment.')
          PY
          chmod +x scripts/audit-mobile-show-heroes.py

      - name: Add mobile hero check to Operations audits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/operations-audits.yml')
          s = p.read_text()
          if 'mobile-show-heroes:' not in s:
              s += '''\n  mobile-show-heroes:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Audit mobile show hero framing\n        run: python3 scripts/audit-mobile-show-heroes.py\n'''
              p.write_text(s)
          PY

      - name: Validate full catalog
        run: |
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-serp-metadata.py
          python3 scripts/audit-content-link-hygiene.py
          python3 scripts/audit-internal-links.py

      - name: Verify structured-show idempotence
        run: |
          for slug in carrot-top vegas-the-show mystere wizard-of-oz; do
            python3 scripts/sync-show-from-data.py "$slug" --dry-run
          done

      - name: Commit durable audit and fixes
        run: |
          git checkout -- docs/internal-link-audit.md || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/show-canonical.css scripts/sync-show-from-data.py scripts/audit-mobile-show-heroes.py .github/workflows/operations-audits.yml data/shows shows
          if ! git diff --cached --quiet; then
            git commit -m "Standardize mobile hero framing across active shows"
            git push origin HEAD:ux/full-mobile-hero-audit
          fi
