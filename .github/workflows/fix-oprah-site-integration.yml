name: Fix Oprah Site Integration
on:
  push:
    branches: [main]
    paths: [scripts/fix-oprah-site-integration.py]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix-oprah-site-integration.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/oprah-winfrey-aha-sphere-las-vegas/index.html news/index.html index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix Oprah header footer and Dispatch placement"
            git push origin main
          fi
