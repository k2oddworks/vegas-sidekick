name: One-off canonical show layout batch 01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-canonical-batch-01.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild first canonical show batch
        shell: python
        run: |
          from pathlib import Path
          import json, re, html as htmllib

          ROOT = Path('.')
          vegas = Path('shows/music/vegas-the-show/index.html').read_text(encoding='utf-8')
          style_m = re.search(r'<style>(.*?)</style>', vegas, re.S|re.I)
          if not style_m:
              raise RuntimeError('Could not extract VEGAS canonical CSS')
          css = style_m.group(1)
          css += '''
          .author-card{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:22px;background:#fff}.author-card img{width:64px;height:64px;border-radius:50%;object-fit:cover}.author-card strong{font-family:'Plus Jakarta Sans',sans-serif}.author-card p{margin:4px 0 0;color:var(--muted);font-size:.9rem}.gallery.gallery-one{display:block;height:auto}.gallery.gallery-one button{width:100%;height:min(520px,58vw)}.gallery.gallery-two{grid-template-columns:1fr 1fr;grid-template-rows:1fr;height:430px}.gallery.gallery-two button:first-child{grid-row:auto}.gallery.gallery-three{grid-template-columns:1.35fr 1fr;grid-template-rows:1fr 1fr}.gallery.gallery-four{grid-template-columns:1.2fr 1fr;grid-template-rows:1fr 1fr}.video-note{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:.86rem}.seat-zone.center{background:#6d28d9}.seat-zone.close{background:#a855f7;width:82%;margin-left:auto}.seat-zone.wide{background:#31744a;width:68%;margin:auto}.next-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.next-card{border:1px solid var(--line);border-top:7px solid var(--accent,#6d28d9);border-radius:16px;padding:22px;background:#fff}.next-card h3{font-size:1.05rem;margin-bottom:7px}.next-card p{margin:0;color:var(--muted);font-size:.88rem}.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.related-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.related-card img{width:100%;aspect-ratio:4/3;object-fit:cover}.related-card div{padding:14px}.related-card strong{display:block;font-family:'Plus Jakarta Sans',sans-serif}.related-card small{color:var(--muted)}@media(max-width:800px){.next-grid,.related-grid{grid-template-columns:1fr}.author-card{grid-template-columns:54px 1fr}.author-card img{width:54px;height:54px}.gallery.gallery-two,.gallery.gallery-three,.gallery.gallery-four{display:grid;grid-template-columns:1fr;height:auto}.gallery.gallery-two button,.gallery.gallery-three button,.gallery.gallery-four button{height:240px}.gallery.gallery-three button:first-child{grid-row:auto}}
          '''
          Path('assets/show-canonical.css').write_text(css, encoding='utf-8')

          js = r'''(function(){'use strict';
          const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
          const progress=document.querySelector('.progress');
          addEventListener('scroll',()=>{if(!progress)return;const d=document.documentElement;const max=d.scrollHeight-innerHeight;progress.style.width=(max?Math.min(100,scrollY/max*100):0)+'%'},{passive:true});
          if(!reduce){document.querySelectorAll('.fact strong[data-count]').forEach(el=>{const target=parseFloat(el.dataset.count);if(!isFinite(target))return;const prefix=el.dataset.prefix||'',suffix=el.dataset.suffix||'';let done=false;const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting||done)return;done=true;io.disconnect();const start=performance.now(),dur=720;function tick(now){const p=Math.min(1,(now-start)/dur),e=1-Math.pow(1-p,3);el.textContent=prefix+Math.round(target*e)+suffix;if(p<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)}),{threshold:.35});io.observe(el)});}
          const detail=document.querySelector('#seat-detail');
          document.querySelectorAll('.seat-zone').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.seat-zone').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(detail){detail.querySelector('.tag').textContent=btn.dataset.tag||'Seat guide';detail.querySelector('h3').textContent=btn.dataset.title||'';detail.querySelector('p').textContent=btn.dataset.copy||'';}}));
          const light=document.querySelector('.lightbox'),lightImg=light&&light.querySelector('img');
          document.querySelectorAll('.gallery button').forEach(b=>b.addEventListener('click',()=>{if(!light||!lightImg)return;lightImg.src=b.querySelector('img').src;light.hidden=false;document.body.style.overflow='hidden'}));
          if(light)light.addEventListener('click',()=>{light.hidden=true;document.body.style.overflow=''});
          document.querySelectorAll('.faq details').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)document.querySelectorAll('.faq details').forEach(o=>{if(o!==d)o.open=false})}));
          })();'''
          Path('assets/show-canonical.js').write_text(js, encoding='utf-8')

          configs = {
            'shows/cirque/o/index.html': {
              'category':'cirque','category_label':'Cirque & Acrobatic','kicker':'Aquatic Cirque · Bellagio',
              'headline':'“O” by Cirque du Soleil','dek':'An aquatic Cirque production built around a massive pool, synchronized swimming, diving and aerial work at Bellagio.',
              'runtime':90,'age':'5+','ticker':['Aquatic stagecraft','Aerial acrobatics','Bellagio','Center-middle is the easy default'],
              'good':['You want a large-scale Cirque production.','Water, diving and aerial work are the reason you are choosing the show.','You want a polished Bellagio night.'],
              'think':['You actually want a magic show.','You prefer a comedian or singer to be the clear focus.','You want a cheaper, smaller-scale production.'],
              'take':'If the pool and scale are what caught your attention, this is the point. Center-middle is the easiest seating default because you can read both the water choreography and the aerial work without being too close to one element.',
              'seat':[('Sweet spot','Center-middle','The easiest all-around view for the pool, aerial work and full-stage compositions.'),('Closer','Lower orchestra','More immediate performer detail, with a steeper tradeoff between close-up impact and full-stage perspective.'),('Wider view','Rear / balcony','A useful choice if you want to see more of the synchronized patterns across the pool at once.')],
              'venue_link':'/venues/bellagio/','venue_label':'Bellagio','guide':'/guides/'
            },
            'shows/magic/penn-and-teller/index.html': {
              'category':'magic','category_label':'Magic','kicker':'Magic + comedy · Rio',
              'headline':'Penn & Teller','dek':'Magic, skepticism and comedy from one of Las Vegas’s longest-running headliner acts at the Rio.',
              'runtime':90,'age':'5+','ticker':['Magic + comedy','Rio','Long-running Vegas headliners','Center floor is the easy default'],
              'good':['You want personality and comedy mixed into the magic.','You like seeing how classic magic ideas can be turned inside out.','You want a Vegas institution rather than a new production.'],
              'think':['You want a silent, effects-heavy illusion spectacle.','You are shopping for Cirque or a concert.','You want a very short, tightly packaged show.'],
              'take':'This is a personality-first magic show. If you want Penn and Teller specifically, prioritize a clear central view over chasing the closest possible row.',
              'seat':[('Sweet spot','Center floor','A balanced view of the stage and the duo, with enough distance to follow the full method-and-reveal structure.'),('Closer','Front orchestra','Best when facial detail and performer interaction matter most.'),('Wider view','Rear orchestra','Still workable for a stage show built around two performers and clearly framed routines.')],
              'venue_link':'/venues/rio/','venue_label':'Rio','guide':'/guides/best-magic-shows/'
            },
            'shows/adult/atomic-saloon/index.html': {
              'category':'adult','category_label':'Adult','kicker':'Spiegelworld · The Venetian',
              'headline':'Atomic Saloon Show','dek':'A bawdy, circus-heavy Spiegelworld production with comedy, acrobatics and a deliberately chaotic saloon atmosphere.',
              'runtime':90,'age':'18+','ticker':['Adult comedy','Circus acts','Spiegelworld','Closer seats feel more involved'],
              'good':['You want adult comedy mixed with physical circus acts.','You like immersive, messy-in-a-good-way Spiegelworld energy.','You want something more intimate than a giant arena production.'],
              'think':['You need an all-ages show.','You actually want traditional stand-up comedy.','You want a polished, story-led Cirque production.'],
              'take':'The room and the energy are part of the product here. Closer makes sense if you want to feel pulled into the saloon; a little farther back is better if you want to watch the chaos rather than sit inside it.',
              'seat':[('Sweet spot','Center-middle','Close enough to feel the room without sacrificing the full view of acrobatics and staging.'),('Closer','Front tables','More immersive and more exposed to the show’s audience interaction.'),('Wider view','Rear / side','A calmer way to watch the physical acts and comedy if you prefer less direct involvement.')],
              'venue_link':'/venues/venetian/','venue_label':'The Venetian','guide':'/guides/'
            },
            'shows/music/blue-man-group/index.html': {
              'category':'music','category_label':'Music & Variety','kicker':'Visual percussion · Luxor',
              'headline':'Blue Man Group','dek':'Percussion, visual comedy, paint, audience interaction and big sensory set pieces at Luxor.',
              'runtime':90,'age':'3+','ticker':['Percussion','Visual comedy','All-ages option','Poncho-zone energy up front'],
              'good':['You want a show that works without a lot of dialogue.','Your group has mixed ages or mixed comedy tastes.','You like percussion, visual gags and audience interaction.'],
              'think':['You want a singer-led concert.','You are specifically shopping for magic.','You want a quiet, story-driven theater night.'],
              'take':'Blue Man Group is easiest to recommend when the group cannot agree on one genre. The tradeoff is that it is intentionally loud and sensory; that is the show, not background decoration.',
              'seat':[('Sweet spot','Center-middle','Best balance for seeing the visual setups while still feeling the percussion and room energy.'),('Closer','Front / poncho area','The most immersive option and the one most likely to feel messy and immediate.'),('Wider view','Rear center','Good if you want to take in the full visual composition with a little less sensory intensity.')],
              'venue_link':'/venues/luxor/','venue_label':'Luxor','guide':'/guides/'
            },
            'shows/spectaculars/awakening/index.html': {
              'category':'spectaculars','category_label':'Spectaculars','kicker':'Production spectacle · Wynn',
              'headline':'Awakening','dek':'A high-production fantasy spectacle built around a 360-degree theater, large-scale effects, choreography and visual storytelling at Wynn.',
              'runtime':80,'age':'5+','ticker':['360° theater','Large-scale effects','Wynn','Center-middle keeps the whole room in view'],
              'good':['You want the production design to be the star.','You like visual storytelling, choreography and large-scale effects.','You want a premium Wynn theater experience.'],
              'think':['You actually want a magic show.','You want stand-up comedy or a singer-led concert.','You prefer a small intimate room over spectacle.'],
              'take':'This is a production-first choice. The theater itself is part of the reason to book it, so I would favor a balanced view of the whole room rather than treating the closest possible seat as automatically best.',
              'seat':[('Sweet spot','Center-middle','The safest choice for reading the 360-degree staging and large effects as a whole.'),('Closer','Lower / near stage','More performer detail, but some of the room-scale compositions can feel less complete.'),('Wider view','Higher / farther back','Useful for seeing the geometry of the theater and the full visual design at once.')],
              'venue_link':'/venues/wynn/','venue_label':'Wynn','guide':'/guides/'
            }
          }

          DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']
          def json_blocks(text):
              vals=[]
              for raw in re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',text,re.S|re.I):
                  try: vals.append(json.loads(raw.strip()))
                  except: pass
              return vals
          def event_obj(blocks):
              for b in blocks:
                  if isinstance(b,dict) and b.get('@type') in ('Event','EventSeries'): return b
              return {}
          def faq_obj(blocks):
              for b in blocks:
                  if isinstance(b,dict) and b.get('@type')=='FAQPage': return b
              return {'@context':'https://schema.org','@type':'FAQPage','mainEntity':[]}
          def clean(s):
              return re.sub(r'\s+',' ',htmllib.unescape(re.sub(r'<[^>]+>',' ',s or ''))).strip()
          def schedule_map(ev):
              out={d:[] for d in DAYS}
              schedules=ev.get('eventSchedule') or []
              if isinstance(schedules,dict): schedules=[schedules]
              for sch in schedules:
                  if not isinstance(sch,dict): continue
                  by=sch.get('byDay') or []
                  if isinstance(by,str): by=[by]
                  times=sch.get('startTime') or []
                  if isinstance(times,str): times=[times]
                  for d in by:
                      d=d.split('/')[-1]
                      if d in out:
                          for t in times:
                              if t not in out[d]: out[d].append(t)
              return out
          def fmt_time(t):
              try:
                  hh,mm=map(int,t[:5].split(':')); ap='AM' if hh<12 else 'PM'; h=hh%12 or 12
                  return f'{h}:{mm:02d} {ap}'
              except: return t
          def show_images(text,ev):
              hero=ev.get('image') or ''
              if isinstance(hero,list): hero=hero[0] if hero else ''
              hero_name=hero.split('/images/')[-1].split('?')[0]
              stem=re.sub(r'\.(?:jpe?g|png|webp|avif)$','',hero_name,flags=re.I)
              base=re.sub(r'-(?:hero|og)$','',stem,flags=re.I)
              refs=re.findall(r'/images/([^"\'<>?]+\.(?:jpe?g|png|webp|avif))',text,re.I)
              unique=[]; seen=set()
              for ref in [hero_name]+refs:
                  st=re.sub(r'\.(?:jpe?g|png|webp|avif)$','',ref,flags=re.I)
                  if base and not (st==base or st.startswith(base+'-')): continue
                  low=st.lower()
                  if any(x in low for x in ['-og','thumb','video-poster','video-thumb','logo','seat-map','seating-chart','-map']): continue
                  key=st.lower()
                  if key not in seen:
                      seen.add(key); unique.append('/images/'+ref)
              return unique[:5]
          def related_cards(cat,self_path):
              cards=[]
              for p in sorted((Path('shows')/cat).glob('*/index.html')):
                  if str(p)==self_path: continue
                  txt=p.read_text(encoding='utf-8',errors='ignore'); bs=json_blocks(txt); ev=event_obj(bs)
                  if not ev or 'closed' in (ev.get('eventStatus') or '').lower(): continue
                  name=ev.get('name') or p.parent.name.replace('-',' ').title()
                  offer=ev.get('offers') or {}; price=offer.get('price') if isinstance(offer,dict) else ''
                  img=ev.get('image') or ''
                  if isinstance(img,list): img=img[0] if img else ''
                  if not img: continue
                  cards.append((f'/{p.parent.as_posix()}/',name,img,price))
                  if len(cards)==3: break
              return cards
          def build(path,cfg):
              text=Path(path).read_text(encoding='utf-8',errors='replace')
              blocks=json_blocks(text); ev=event_obj(blocks); faq=faq_obj(blocks)
              if not ev: raise RuntimeError(f'No event schema in {path}')
              offer=ev.get('offers') or {}; offer=offer if isinstance(offer,dict) else {}
              try: offer['price']=float(offer.get('price')) if '.' in str(offer.get('price')) else int(float(offer.get('price')))
              except: pass
              ev['offers']=offer
              ev.setdefault('organizer',{'@type':'Organization','name':ev.get('name',cfg['headline']),'url':ev.get('url')})
              ticket=offer.get('url','')
              price=offer.get('price','')
              venue=((ev.get('location') or {}).get('name') if isinstance(ev.get('location'),dict) else '') or cfg['venue_label']
              sched=schedule_map(ev)
              active=[d for d in DAYS if sched[d]]
              first_time=fmt_time(sched[active[0]][0]) if active and sched[active[0]] else 'See schedule'
              imgs=show_images(text,ev)
              hero=imgs[0] if imgs else '/images/'+Path(path).parent.name+'-hero.jpg'
              # Clean FAQ fee claims.
              ents=[]
              for q in faq.get('mainEntity',[]):
                  blob=json.dumps(q).lower()
                  if 'fee' in blob or 'hidden fee' in blob: continue
                  ents.append(q)
              faq['mainEntity']=ents[:7]
              # SEO description without unsupported claims.
              desc=cfg['dek']+' Tickets from $'+str(price)+'. See photos, seating guidance, showtimes and FAQ before you book.'
              canonical=ev.get('url') or ('https://vegassidekick.com/'+path[:-10])
              cat_url=f"/shows/{cfg['category']}/"
              crumbs={'@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'Home','item':'https://vegassidekick.com/'},{'@type':'ListItem','position':2,'name':cfg['category_label'],'item':'https://vegassidekick.com'+cat_url},{'@type':'ListItem','position':3,'name':cfg['headline'],'item':canonical}]}
              gallery_class='gallery-'+str(min(max(len(imgs),1),4))
              gallery=''.join(f'<button type="button" aria-label="Open {cfg["headline"]} photo"><img src="{im}" alt="{cfg["headline"]} Las Vegas show photo" loading="lazy"></button>' for im in imgs)
              seat_buttons=''.join(f'<button class="seat-zone {cl}" data-tag="{tag}" data-title="{title}" data-copy="{copy}"><strong>{title}</strong><small>{copy}</small></button>' for cl,(tag,title,copy) in zip(['center','close','wide'],cfg['seat']))
              seat0=cfg['seat'][0]
              fit_good=''.join(f'<li>{x}</li>' for x in cfg['good']); fit_twice=''.join(f'<li>{x}</li>' for x in cfg['think'])
              day_html=[]
              for d in DAYS:
                  ts=sched[d]
                  if ts:
                      lab=' · '.join(fmt_time(t) for t in ts)
                      day_html.append(f'<div class="day"><a href="{ticket}" target="_blank" rel="noopener sponsored"><strong>{d[:3]}</strong><span>{lab}</span><small>Tickets →</small></a></div>')
                  else: day_html.append(f'<div class="day dark"><strong>{d[:3]}</strong><span>Dark</span></div>')
              faq_html=''.join(f'<details><summary>{htmllib.escape(q.get("name","Question"))}</summary><div>{htmllib.escape(((q.get("acceptedAnswer") or {}).get("text") or ""))}</div></details>' for q in faq['mainEntity'])
              related=related_cards(cfg['category'],path)
              rel_html=''.join(f'<a class="related-card" href="{url}"><img src="{img}" alt="{htmllib.escape(name)}" loading="lazy"><div><strong>{htmllib.escape(name)}</strong><small>{("From $"+str(pr)) if pr!="" else cfg["category_label"]}</small></div></a>' for url,name,img,pr in related)
              ticker=''.join(f'<span class="ticker-item">{htmllib.escape(x)}</span><span class="ticker-sep">✦</span>' for x in cfg['ticker'])
              ticker2=ticker+ticker
              schema='\n'.join('<script type="application/ld+json">'+json.dumps(obj,separators=(',',':'))+'</script>' for obj in [ev,faq,crumbs])
              page=f'''<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.png" type="image/png"><title>{htmllib.escape(cfg['headline'])} Tickets from ${price} & Show Guide | Vegas Sidekick</title><meta name="robots" content="index,follow,max-image-preview:large"><meta name="description" content="{htmllib.escape(desc)}"><link rel="canonical" href="{canonical}"><meta property="og:site_name" content="Vegas Sidekick"><meta property="og:title" content="{htmllib.escape(cfg['headline'])} Tickets & Show Guide | Vegas Sidekick"><meta property="og:description" content="{htmllib.escape(cfg['dek'])}"><meta property="og:image" content="https://vegassidekick.com{hero}"><meta property="og:url" content="{canonical}"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://vegassidekick.com{hero}"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/show-canonical.css?v=1">{schema}</head><body><div class="progress"></div><a class="skip" href="#main">Skip to content</a><div id="vs-header"></div><header class="hero"><div class="hero-grid"><div class="hero-copy"><div class="eyebrow">{htmllib.escape(cfg['kicker'])}</div><h1>{htmllib.escape(cfg['headline'])}</h1><p class="hero-dek">{htmllib.escape(cfg['dek'])}</p><div class="chips"><span class="chip">{cfg['runtime']} minutes</span><span class="chip">{htmllib.escape(cfg['age'])}</span><span class="chip">{htmllib.escape(venue)}</span></div><div class="buybox"><div class="price"><small>Tickets from</small>${price}</div><a class="cta" href="{ticket}" target="_blank" rel="noopener sponsored">Get Tickets →</a></div><div class="updated">Last updated September 2026 · Your date and seat determine the final total.</div></div><div class="hero-media"><img src="{hero}" alt="{htmllib.escape(cfg['headline'])} at {htmllib.escape(venue)}" fetchpriority="high"></div></div></header><section class="facts"><div class="wrap facts-grid"><div class="fact"><strong data-count="{cfg['runtime']}" data-suffix=" min">{cfg['runtime']} min</strong><span>Runtime</span></div><div class="fact"><strong data-count="{price}" data-prefix="$">${price}</strong><span>Tickets from</span></div><div class="fact"><strong>{htmllib.escape(first_time)}</strong><span>Typical start</span></div><div class="fact"><strong>{htmllib.escape(cfg['age'])}</strong><span>Age guidance</span></div></div></section><div class="ticker"><div class="ticker-track"><div class="ticker-set">{ticker2}</div></div></div><nav class="subnav" aria-label="On this page"><div class="wrap"><a href="#quick">Quick take</a><a href="#photos">Photos</a><a href="#seats">Seat guide</a><a href="#fit">Is it for you?</a><a href="#showtimes">Showtimes</a><a href="#faq">FAQ</a></div></nav><main id="main"><section class="section" id="quick"><div class="wrap verdict-grid"><div class="copy"><div class="eyebrow">The 30-second answer</div><h2>Is {htmllib.escape(cfg['headline'])} worth seeing?</h2><p class="lede lede-highlight">{htmllib.escape(cfg['dek'])}</p><div class="take"><span>🌵</span><div><b>Kris’s take</b><p>{htmllib.escape(cfg['take'])}</p></div></div></div><div class="decision"><div class="decision-card"><h3>Book it if…</h3><p>{htmllib.escape(cfg['good'][0])}</p></div><div class="decision-card"><h3>Know this first</h3><p>{htmllib.escape(cfg['think'][0])}</p></div><div class="decision-card"><h3>Best practical angle</h3><p>{htmllib.escape(cfg['seat'][0][2])}</p></div></div></div></section><section class="section alt" id="photos"><div class="wrap"><div class="eyebrow">See the room</div><h2>Photos from {h