name: Clean Mobile Hero PR
on:
  push:
    branches: [ux/mobile-hero-images]
    paths: [.github/workflows/clean-mobile-hero-pr.yml]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/mobile-hero-images
          fetch-depth: 0
      - name: Restore show pages and apply only hero attributes
        run: |
          git checkout origin/main -- shows/comedy/carrot-top/index.html shows/music/vegas-the-show/index.html shows/cirque/mystere/index.html shows/spectaculars/wizard-of-oz/index.html shows/cirque/o/index.html
          python3 - <<'PY'
          from pathlib import Path
          prefs = {
            'shows/comedy/carrot-top/index.html': ('cover','50% 22%'),
            'shows/music/vegas-the-show/index.html': ('contain','center center'),
            'shows/cirque/mystere/index.html': ('cover','center center'),
            'shows/spectaculars/wizard-of-oz/index.html': ('contain','center center'),
            'shows/cirque/o/index.html': ('contain','center center'),
          }
          for path,(fit,pos) in prefs.items():
              p=Path(path); s=p.read_text()
              old='<div class="hero-media">'
              new=f'<div class="hero-media" data-mobile-fit="{fit}" style="--mobile-hero-position:{pos}">'
              if old not in s: raise SystemExit(f'hero target missing: {path}')
              p.write_text(s.replace(old,new,1))
          PY
      - name: Verify focused diffs and audits
        run: |
          for f in shows/comedy/carrot-top/index.html shows/music/vegas-the-show/index.html shows/cirque/mystere/index.html shows/spectaculars/wizard-of-oz/index.html shows/cirque/o/index.html; do
            git diff origin/main -- "$f" | grep -q 'data-mobile-fit'
          done
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-serp-metadata.py
          python3 scripts/audit-content-link-hygiene.py
          python3 scripts/audit-internal-links.py
      - name: Commit focused page changes
        run: |
          git checkout -- docs/internal-link-audit.md || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows/comedy/carrot-top/index.html shows/music/vegas-the-show/index.html shows/cirque/mystere/index.html shows/spectaculars/wizard-of-oz/index.html shows/cirque/o/index.html
          git commit -m "Keep mobile hero page diffs focused"
          git push origin HEAD:ux/mobile-hero-images
