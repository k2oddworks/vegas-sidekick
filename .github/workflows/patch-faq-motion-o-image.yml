name: Patch FAQ motion and O image
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-faq-motion-o-image.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python scripts/patch-faq-motion-o-image.py
      - name: Commit fixes
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add shows/cirque/mystere/index.html shows/music/vegas-the-show/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix O recommendation image and FAQ motion"
          git push origin main
