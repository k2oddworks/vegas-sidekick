name: Fix Good To Know Semantics

on:
  push:
    paths:
      - '.github/workflows/fix-good-to-know-semantics.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove rejection-copy Good to know cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          CLOSED={'shows/cirque/mad-apple/index.html','shows/magic/david-goldrake/index.html'}
          KEEP_GOOD_TO_KNOW={'shows/spectaculars/absinthe/index.html'}
          changed=[]

          card_re = re.compile(
              r'<div class="[^"]*(?:decision-card|fit-card)[^"]*"[^>]*>\s*<h3>Good to know</h3>.*?</div>',
              re.I|re.S,
          )

          for p in sorted(Path('shows').glob('*/*/index.html')):
              rel=p.as_posix()
              if rel in CLOSED or rel in KEEP_GOOD_TO_KNOW:
                  continue
              s=p.read_text(encoding='utf-8', errors='ignore')
              before=s
              s=card_re.sub('', s)

              # If the fit section lost its second card, make the surviving fit
              # guidance read and lay out intentionally rather than looking broken.
              if '<section class="section alt" id="fit">' in s:
                  # Scope the heading replacement to pages where no Good to know
                  # remains in the fit section.
                  m=re.search(r'(<section class="section alt" id="fit">.*?</section>)', s, re.I|re.S)
                  if m and '<h3>Good to know</h3>' not in m.group(1):
                      sec=m.group(1)
                      sec=sec.replace('<h2>Good fit / Good to know</h2>', '<h2>Who it fits best</h2>')
                      sec=sec.replace('<div class="fit-grid">', '<div class="fit-grid solo">', 1)
                      s=s[:m.start()]+sec+s[m.end():]

              if s != before:
                  p.write_text(s, encoding='utf-8')
                  changed.append(rel)

          # Canonical generator: stop producing category-level rejection copy.
          p=Path('scripts/canonicalize-show-pages.py')
          s=p.read_text(encoding='utf-8')
          before=s
          old='<section class="section alt" id="fit"><div class="wrap"><div class="eyebrow">Is it for you?</div><h2>Good fit / Good to know</h2><div class="fit-grid"><div class="fit-card good"><h3>Good fit</h3><ul>{good_html}</ul></div><div class="fit-card twice"><h3>Good to know</h3><ul>{think_html}</ul></div></div></div></section>'
          new='<section class="section alt" id="fit"><div class="wrap"><div class="eyebrow">Is it for you?</div><h2>Who it fits best</h2><div class="fit-grid solo"><div class="fit-card good"><h3>Good fit</h3><ul>{good_html}</ul></div></div></div></section>'
          if old not in s:
              raise SystemExit('Canonical fit-section template target not found')
          s=s.replace(old,new,1)
          if s != before:
              p.write_text(s, encoding='utf-8')
              changed.append(p.as_posix())

          # One-column layout for intentional single-card fit sections.
          p=Path('assets/show-canonical.css')
          s=p.read_text(encoding='utf-8')
          before=s
          marker='.fit-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px;max-width:900px}'
          replacement=marker+'.fit-grid.solo{grid-template-columns:1fr;max-width:720px}'
          if '.fit-grid.solo{' not in s:
              if marker not in s:
                  raise SystemExit('fit-grid CSS target not found')
              s=s.replace(marker,replacement,1)
          if s != before:
              p.write_text(s, encoding='utf-8')
              changed.append(p.as_posix())

          print(f'Changed {len(changed)} files')
          for rel in changed:
              print(rel)
          PY

      - name: Strengthen semantic decision-copy audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/audit-show-decision-copy.py')
          s=p.read_text(encoding='utf-8')
          marker="    if re.search(r'\\bdownsides?\\b', text, re.I):\n        issues.append(f\"{rel}: retired 'downside' framing remains\")\n"
          addition="""    if re.search(r'\\bdownsides?\\b', text, re.I):
        issues.append(f\"{rel}: retired 'downside' framing remains\")

    # A Good to know card should contain useful facts/context, not the old
    # rejection copy with a friendlier heading.
    for m in re.finditer(r'<div class=\"[^\"]*(?:decision-card|fit-card)[^\"]*\"[^>]*>\\s*<h3>Good to know</h3>(.*?)</div>', text, re.I | re.S):
        body = re.sub(r'<[^>]+>', ' ', m.group(1))
        body = re.sub(r'\\s+', ' ', body).strip()
        rejection = (
            r'\\byou need\\b|\\byou actually want\\b|\\byou are actually shopping\\b|'
            r'\\byou are really (?:shopping|looking)\\b|\\byou prefer\\b|\\byou would rather\\b|'
            r'\\byou specifically want\\b|\\byou dislike\\b|\\byou are choosing\\b|'
            r'\\byour group specifically wants\\b|\\ba different show category\\b|'
            r'\\byou want (?:a|an|the)\\b'
        )
        if re.search(rejection, body, re.I):
            issues.append(f\"{rel}: Good to know still contains rejection/mismatch copy: {body}\")
"""
          if marker not in s:
              raise SystemExit('decision audit insertion target not found')
          s=s.replace(marker,addition,1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate decision semantics
        run: python3 scripts/audit-show-decision-copy.py

      - name: Validate Event schema
        run: python3 scripts/audit-event-schema.py

      - name: Validate ticket CTA treatment
        run: python3 scripts/audit-ticket-cta-color.py

      - name: Validate mobile heroes
        run: python3 scripts/audit-mobile-show-heroes.py

      - name: Validate catalog JavaScript
        run: python3 scripts/audit-catalog-js-syntax.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit cleanup
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add shows assets/show-canonical.css scripts/canonicalize-show-pages.py scripts/audit-show-decision-copy.py
          git commit -m 'Remove rejection copy from Good to know cards'
          git push origin HEAD:main
