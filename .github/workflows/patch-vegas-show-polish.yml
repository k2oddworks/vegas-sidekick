name: VEGAS show polish patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-vegas-show-polish.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply page fixes
        run: python scripts/patch-vegas-show-polish.py
      - name: Commit page update
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add shows/music/vegas-the-show/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish VEGAS show mobile UX"
          git push origin main
