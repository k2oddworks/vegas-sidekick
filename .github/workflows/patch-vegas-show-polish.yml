name: VEGAS show polish patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-vegas-show-polish.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep later-date CTA inside the schedule wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('shows/music/vegas-the-show/index.html')
          s=p.read_text(encoding='utf-8')
          old='</p></div><a class="later-date-cta" href="https://spotlight.vegas/shows/music/vegas-the-show/ref/vegassidekick" target="_blank" rel="noopener sponsored">Booking for a later date? See tickets weeks and months ahead →</a></section>'
          new='</p><a class="later-date-cta" href="https://spotlight.vegas/shows/music/vegas-the-show/ref/vegassidekick" target="_blank" rel="noopener sponsored">Booking for a later date? See tickets weeks and months ahead →</a></div></section>'
          if old not in s:
              raise SystemExit('schedule CTA wrapper anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit page update
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add shows/music/vegas-the-show/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Keep VEGAS schedule CTA aligned"
          git push origin main
