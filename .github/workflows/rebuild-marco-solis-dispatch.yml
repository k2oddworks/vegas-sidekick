name: Rebuild Marco Solis Dispatch
on:
  push:
    paths:
      - 'scripts/rebuild-marco-solis-dispatch.py'
      - 'scripts/trigger-marco-solis-rebuild.txt'
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/rebuild-marco-solis-dispatch.py
      - name: Validate
        run: |
          grep -q 'Marco Antonio Solís plays Dolby Live September 11' news/marco-antonio-solis-tour-gratitud-dolby-live-september-11/index.html
          grep -q 'brevo-subscribe.vegassidekickcom.workers.dev' news/marco-antonio-solis-tour-gratitud-dolby-live-september-11/index.html
          grep -q 'FAQPage' news/marco-antonio-solis-tour-gratitud-dolby-live-september-11/index.html
      - name: Commit
        run: |
          git config user.name 'Kris Kidd'
          git config user.email 'k2oddworks@gmail.com'
          git add news/marco-antonio-solis-tour-gratitud-dolby-live-september-11/index.html
          git diff --cached --quiet || git commit -m 'Rebuild Marco Antonio Solis Dispatch article'
          git push
