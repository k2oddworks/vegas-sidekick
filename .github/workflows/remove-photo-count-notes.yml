name: Remove customer-facing photo count notes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-photo-count-notes.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove notes from generator and show pages
        shell: python
        run: |
          from pathlib import Path
          import re

          changed=[]
          generator=Path('scripts/canonicalize-show-pages.py')
          s=generator.read_text(encoding='utf-8')
          old=s
          s=re.sub(r'\n\s*photo_note\s*=\s*"" if len\(imgs\) >= 5 else f\'<p class="media-note">We currently have \{len\(imgs\)\} verified show-specific photo\{.*?</p>\'\n', '\n    photo_note = ""\n', s)
          # Fallback, exact source line shape used by the current generator.
          s=re.sub(r'\n\s*photo_note\s*=.*?gallery\.</p>\'\n', '\n    photo_note = ""\n', s)
          if s!=old:
              generator.write_text(s,encoding='utf-8'); changed.append(str(generator))

          pat=re.compile(r'<p class="media-note">We currently have \d+ verified show-specific photos? in the repo\. We do not duplicate images just to fill the gallery\.</p>',re.I)
          for p in Path('shows').glob('*/*/index.html'):
              text=p.read_text(encoding='utf-8',errors='replace')
              new=pat.sub('',text)
              if new!=text:
                  p.write_text(new,encoding='utf-8'); changed.append(str(p))

          print('Changed files:',len(changed))
          for x in changed: print(x)

          leftovers=[]
          for p in Path('shows').glob('*/*/index.html'):
              t=p.read_text(encoding='utf-8',errors='replace')
              if 'verified show-specific photo' in t or 'We do not duplicate images just to fill the gallery' in t:
                  leftovers.append(str(p))
          if leftovers:
              print('Leftovers:',*leftovers,sep='\n')
              raise SystemExit(1)
      - name: Commit cleanup
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/canonicalize-show-pages.py shows
          if git diff --cached --quiet; then
            echo "No cleanup needed"
          else
            git commit -m "Remove internal photo-count notes from show pages"
            git push origin HEAD:main
          fi
