name: Test VEGAS Data Pilot

on:
  push:
    branches:
      - data/vegas-the-show-record
    paths:
      - data/shows/vegas-the-show.json
      - scripts/sync-show-from-data.py
      - .github/workflows/test-vegas-data-pilot.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/vegas-the-show-record
      - name: Extend generic engine for dated schedules and linked cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/sync-show-from-data.py')
          s = p.read_text()
          s = s.replace('import sys\nfrom pathlib import Path', 'import sys\nfrom datetime import date\nfrom pathlib import Path')
          marker = '''def sync_seo(text: str, record: dict[str, Any], changes: list[str]) -> str:\n'''
          helper = '''def effective_schedule(record: dict[str, Any], on_date: date | None = None) -> dict[str, Any]:\n    schedule = record.get("schedule") or {}\n    phases = schedule.get("phases") or []\n    if not phases:\n        return schedule\n\n    today = on_date or date.today()\n    matches = []\n    for phase in phases:\n        start_raw = phase.get("effective_from")\n        end_raw = phase.get("effective_through")\n        start = date.fromisoformat(start_raw) if start_raw else None\n        end = date.fromisoformat(end_raw) if end_raw else None\n        if (start is None or today >= start) and (end is None or today <= end):\n            matches.append(phase)\n    if len(matches) != 1:\n        raise SyncError(f"{record['slug']}: expected exactly one effective schedule phase for {today.isoformat()}; found {len(matches)}")\n    active = dict(schedule)\n    active.update(matches[0])\n    return active\n\n\n'''
          if helper not in s:
              s = s.replace(marker, helper + marker)
          s = s.replace('''    schedule = record.get("schedule") or {}\n    performances = schedule.get("performances") or []\n    dark_days = set(schedule.get("dark_days") or [])\n''', '''    schedule = effective_schedule(record)\n    performances = schedule.get("performances") or []\n    dark_days = set(schedule.get("dark_days") or [])\n''', 1)
          old = '''        pattern = rf'(<div class="day[^>]*"><strong>{abbr}</strong><span>).*?(</span></div>)'\n        new, found = replace_if_present(text, pattern, rf'\\g<1>{value}\\g<2>', f"{day} schedule card")\n        if found:\n            if new != text:\n                updated += 1\n            text = new\n'''
          new = '''        patterns = [\n            rf'(<div class="day[^>]*"><strong>{abbr}</strong><span>).*?(</span></div>)',\n            rf'(<div class="day[^>]*>\\s*<a[^>]*>\\s*<strong>{abbr}</strong><span>).*?(</span>)',\n        ]\n        found_any = False\n        for pattern in patterns:\n            new, found = replace_if_present(text, pattern, rf'\\g<1>{value}\\g<2>', f"{day} schedule card")\n            if found:\n                found_any = True\n                if new != text:\n                    updated += 1\n                text = new\n                break\n        if not found_any:\n            continue\n'''
          if old not in s:
              raise SystemExit('linked-card patch target not found')
          s = s.replace(old, new, 1)
          s = s.replace('''    schedule = record.get("schedule") or {}\n    performances = schedule.get("performances") or []\n\n    days = [item["day"] for item in performances]\n''', '''    schedule = effective_schedule(record)\n    performances = schedule.get("performances") or []\n\n    days = [item["day"] for item in performances]\n''', 1)
          s = s.replace('''        if isinstance(location, dict) and venue.get("showroom") and venue.get("hotel"):\n            location["name"] = f"{venue['showroom']} at {venue['hotel']}"\n''', '''        if isinstance(location, dict):\n            if venue.get("schema_location_name"):\n                location["name"] = venue["schema_location_name"]\n            elif venue.get("showroom") and venue.get("hotel"):\n                location["name"] = f"{venue['showroom']} at {venue['hotel']}"\n''', 1)
          p.write_text(s)
          PY
      - name: Sync VEGAS from record
        run: python3 scripts/sync-show-from-data.py vegas-the-show
      - name: Confirm current schedule phase
        run: |
          grep -q '<strong>Mon</strong><span>7:00 PM</span>' shows/music/vegas-the-show/index.html
          grep -q '<strong>Sun</strong>' shows/music/vegas-the-show/index.html
          grep -q 'https://spotlight.vegas/shows/production/vegas-the-show/ref/vegassidekick/' shows/music/vegas-the-show/index.html
      - name: Confirm future phase selection
        run: |
          python3 - <<'PY'
          import importlib.util
          from datetime import date
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('syncshow', 'scripts/sync-show-from-data.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          record = mod.load_record(Path('data/shows/vegas-the-show.json'))
          phase = mod.effective_schedule(record, date(2026, 9, 21))
          assert {x['time'] for x in phase['performances']} == {'17:30'}
          assert phase['dark_days'] == ['Sunday']
          print('Future schedule phase: 5:30 PM from 2026-09-21')
          PY
      - name: Confirm Carrot Top regression
        run: python3 scripts/sync-show-from-data.py carrot-top --dry-run
      - name: Validate Event schema
        run: python3 scripts/audit-event-schema.py
      - name: Validate SERP metadata
        run: python3 scripts/audit-serp-metadata.py
      - name: Validate content and links
        run: python3 scripts/audit-content-link-hygiene.py
      - name: Validate internal links
        run: python3 scripts/audit-internal-links.py
      - name: Commit durable pilot changes
        run: |
          git checkout -- docs/internal-link-audit.md || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-show-from-data.py shows/music/vegas-the-show/index.html
          if git diff --cached --quiet; then
            echo "No durable changes to commit"
          else
            git commit -m "Support dated show schedules in generic sync"
            git push origin HEAD:data/vegas-the-show-record
          fi
