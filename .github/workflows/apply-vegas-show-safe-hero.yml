name: VEGAS The Show Safe Hero
on:
  push:
    branches: [main]
    paths: [scripts/apply-vegas-show-safe-hero.py]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/apply-vegas-show-safe-hero.py
      - run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-orphan-ui.py
          git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows/music/vegas-the-show/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Preserve full VEGAS The Show hero artwork"
            git push origin main
          fi
