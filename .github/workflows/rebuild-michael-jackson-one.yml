name: Rebuild Michael Jackson ONE benchmark
on:
  push:
    paths:
      - '.github/workflows/rebuild-michael-jackson-one.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python3 -m pip install beautifulsoup4
      - name: Rebuild page and room assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup, NavigableString
          import json,re

          ROOT=Path('.')
          page=ROOT/'shows/cirque/michael-jackson-one/index.html'
          dbp=ROOT/'data/show-database.json'
          ticket='https://spotlight.vegas/shows/cirque-du-soleil/michael-jackson-one/ref/vegassidekick'
          price=163

          # Source-of-truth data
          db=json.loads(dbp.read_text())
          rec=next(r for r in db['records'] if r['slug']=='michael-jackson-one')
          rec.update({'our_price':163,'regular_price':None,'verified_on':'2026-09-12','freshness_label':'September 2026','verification':'verified_spotlight','savings_amount':None,'savings_percent':None,'is_deal':False})
          rec['spotlight']['our_price']=163
          rec['spotlight']['regular_price']=None
          rec['spotlight']['affiliate_url']=ticket
          rec['spotlight']['spotlight_url']='https://spotlight.vegas/shows/cirque-du-soleil/michael-jackson-one/'
          db['updated_on']='2026-09-12'
          dbp.write_text(json.dumps(db,ensure_ascii=False,indent=2)+'\n')

          # Reusable Mandalay Bay Theatre room geometry, based on supplied seating chart.
          layout={
            'id':'mandalay-bay-theatre','venue':'Mandalay Bay Theatre','address':'3950 S Las Vegas Blvd, Las Vegas, NV 89119',
            'viewBox':'0 0 120 100','stage':{'x':38,'y':86,'w':44,'h':8},
            'zones':[
              {'id':'103','label':'Section 103','badge':'Lower left','our_pick':True,'color':'#ffb000','points':'20,78 38,82 42,52 28,48','description':'Lower left seating with a close view of the performers and strong stage detail. It is part of the Vegas Sidekick Sweet Spot / Our Pick group.'},
              {'id':'102','label':'Section 102','badge':'Lower center','our_pick':True,'color':'#ffb000','points':'42,82 78,82 74,48 46,48','description':'The main lower-center block. It keeps the stage straight ahead and is part of the Vegas Sidekick Sweet Spot / Our Pick group.'},
              {'id':'101','label':'Section 101','badge':'Lower right','our_pick':True,'color':'#ffb000','points':'78,82 100,78 92,48 74,52','description':'Lower right seating with a close view and clear access to the full stage picture. It is part of the Vegas Sidekick Sweet Spot / Our Pick group.'},
              {'id':'205','label':'Section 205','badge':'Upper side','our_pick':False,'color':'#0fb5c9','points':'3,40 27,46 24,18 7,13','description':'The far-left upper section gives you a wider view of the full production and is a strong choice when seeing the whole stage picture matters most.'},
              {'id':'204','label':'Section 204','badge':'Upper left center','our_pick':True,'color':'#ffb000','points':'27,46 46,44 45,12 25,14','description':'Upper left-center seating balances the wider full-stage view with a strong angle toward the center of the production. It is part of the Sweet Spot / Our Pick group.'},
              {'id':'203','label':'Section 203','badge':'Upper center','our_pick':True,'color':'#ffb000','points':'46,44 74,44 72,11 48,11','description':'The central upper block gives you the most symmetrical wide view of the theater. It is part of the Sweet Spot / Our Pick group.'},
              {'id':'202','label':'Section 202','badge':'Upper right center','our_pick':True,'color':'#ffb000','points':'74,44 93,46 95,14 75,12','description':'Upper right-center seating gives you a broad view while keeping the stage comfortably centered. It is part of the Sweet Spot / Our Pick group.'},
              {'id':'201','label':'Section 201','badge':'Upper side','our_pick':False,'color':'#0fb5c9','points':'93,46 117,40 113,13 96,18','description':'The far-right upper section gives you a broad full-production view and can be a smart choice when you prefer to take in the entire stage at once.'}
            ]}
          Path('data/seat-layouts/mandalay-bay-theatre.json').write_text(json.dumps(layout,ensure_ascii=False,indent=2)+'\n')

          css='''.mbt-seat-guide{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(290px,.84fr);gap:22px;align-items:start;margin-top:24px}.mbt-map{background:radial-gradient(circle at 50% 90%,rgba(255,176,0,.13),transparent 35%),linear-gradient(180deg,#160a24,#09060f);border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:18px;box-shadow:0 24px 60px rgba(13,4,24,.24)}.mbt-map svg{display:block;width:100%;height:auto}.mbt-shape{cursor:pointer;stroke:rgba(255,255,255,.46);stroke-width:.7;transition:.18s}.mbt-shape:hover,.mbt-shape:focus{filter:brightness(1.12)}.mbt-shape.is-active{stroke:#fff;stroke-width:1.8;filter:drop-shadow(0 0 5px rgba(255,176,0,.68))}.mbt-stage{fill:#171717;stroke:#ffb000;stroke-width:.7}.mbt-label{font:800 4px Inter,Arial,sans-serif;fill:#171225;pointer-events:none}.mbt-label.side{fill:#fff}.mbt-stage-label{font:900 4.4px Inter,Arial,sans-serif;fill:#fff;letter-spacing:.12em}.mbt-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mbt-card{appearance:none;text-align:left;padding:13px 14px;border-radius:15px;border:1px solid #e9e2f2;background:#fff;cursor:pointer}.mbt-card.is-active{border-color:#ffb000;box-shadow:0 0 0 2px rgba(255,176,0,.16)}.mbt-card h3{margin:0;font-size:.95rem}.mbt-badge{display:block;margin-top:4px;font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:#7a7080}.mbt-card.is-pick .mbt-badge{color:#8d6100}.mbt-detail{margin-top:14px;padding:18px;border:1px solid #e9e2f2;border-radius:18px;background:#fff}.mbt-detail .tag{font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#7a7080}.mbt-detail h3{margin:5px 0 8px}.mbt-detail p{margin:0 0 14px}.mbt-detail .cta{width:100%}.mbt-mobile{display:none}.mbt-chart-gallery img{object-fit:contain!important;background:#09060f}.mbt-lb-nav{position:absolute!important;top:50%!important;transform:translateY(-50%);z-index:3;width:52px!important;height:52px!important;border-radius:50%!important;background:#fff!important;color:#17082e!important;font-size:2rem!important}.mbt-lb-prev{left:18px!important;right:auto!important}.mbt-lb-next{right:18px!important}.mbt-lb-count{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;background:rgba(23,8,46,.82);color:#fff;padding:6px 11px;border-radius:999px;font-size:.8rem;font-weight:800}@media(max-width:820px){.mbt-seat-guide{grid-template-columns:1fr}.mbt-cards,.mbt-detail{display:none}.mbt-map{padding:10px}.mbt-mobile{position:fixed;left:14px;right:14px;bottom:98px;z-index:1100;display:block;padding:14px 48px 14px 15px;background:rgba(20,9,35,.97);color:#fff;border:1px solid rgba(255,176,0,.7);border-radius:16px;opacity:0;pointer-events:none;transform:translateY(16px);transition:.2s}.mbt-mobile.is-open{opacity:1;pointer-events:auto;transform:none}.mbt-mobile button{position:absolute;right:9px;top:8px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff}.mbt-mobile p{margin:5px 0 0;color:#ded7e4;font-size:.84rem}.mbt-lb-prev{left:8px!important}.mbt-lb-next{right:8px!important}.mbt-lb-count{bottom:100px}#photos .gallery.gallery-4{height:auto;grid-template-columns:1fr}.mbt-chart-gallery img{object-fit:contain!important}}@media(min-width:821px){#photos .gallery.gallery-4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));height:560px}#photos .gallery.gallery-4 button{min-width:0;min-height:0}#photos .gallery.gallery-4 img{width:100%;height:100%;object-fit:cover}.mbt-chart-gallery img{object-fit:contain!important}}'''
          Path('assets/seat-layouts/mandalay-bay-theatre.css').write_text(css+'\n')

          js='''(()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function mount(root){try{const data=await fetch(root.dataset.layoutUrl,{credentials:'same-origin'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),ticket=root.dataset.ticketUrl,by=Object.fromEntries(data.zones.map(z=>[z.id,z]));const polys=data.zones.map(z=>`<polygon tabindex="0" role="button" aria-label="${esc(z.label)}" class="mbt-shape" data-zone="${esc(z.id)}" points="${esc(z.points)}" fill="${esc(z.color)}"/>`).join('');const labels=data.zones.map(z=>{const pts=z.points.split(' ').map(p=>p.split(',').map(Number)),x=pts.reduce((a,p)=>a+p[0],0)/pts.length,y=pts.reduce((a,p)=>a+p[1],0)/pts.length;return`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" class="mbt-label ${z.our_pick?'':'side'}">${esc(z.id)}</text>`}).join('');root.innerHTML=`<div class="mbt-map"><svg width="1200" height="1000" viewBox="${esc(data.viewBox)}" aria-label="Mandalay Bay Theatre seating layout"><rect width="120" height="100" rx="4" fill="#0d0815"/><rect class="mbt-stage" x="${data.stage.x}" y="${data.stage.y}" width="${data.stage.w}" height="${data.stage.h}" rx="2"/><text x="60" y="91" text-anchor="middle" class="mbt-stage-label">STAGE</text>${polys}${labels}</svg></div><div><div class="mbt-cards">${data.zones.map(z=>`<button type="button" class="mbt-card ${z.our_pick?'is-pick':''}" data-zone="${esc(z.id)}"><h3>${esc(z.label)}</h3><span class="mbt-badge">${z.our_pick?'Sweet Spot / Our Pick':esc(z.badge)}</span></button>`).join('')}</div><div class="mbt-detail" aria-live="polite"><div class="tag"></div><h3></h3><p></p><a class="cta vs-ticket-primary" href="${esc(ticket)}" target="_blank" rel="noopener sponsored">Check seats →</a></div></div><div class="mbt-mobile" aria-live="polite"><strong></strong><p></p><button type="button" aria-label="Close seat description">×</button></div>`;const detail=root.querySelector('.mbt-detail'),pop=root.querySelector('.mbt-mobile');function activate(id,show){const z=by[id];if(!z)return;root.querySelectorAll('[data-zone]').forEach(x=>x.classList.toggle('is-active',x.dataset.zone===id));detail.querySelector('.tag').textContent=z.our_pick?'Sweet Spot / Our Pick':z.badge;detail.querySelector('h3').textContent=z.label;detail.querySelector('p').textContent=z.description;pop.querySelector('strong').textContent=(z.our_pick?'Sweet Spot · ':'')+z.label;pop.querySelector('p').textContent=z.description;if(show&&matchMedia('(max-width:820px)').matches)pop.classList.add('is-open')}root.addEventListener('click',e=>{const z=e.target.closest('[data-zone]');if(z)activate(z.dataset.zone,true);if(e.target.closest('.mbt-mobile button'))pop.classList.remove('is-open')});root.addEventListener('keydown',e=>{const z=e.target.closest('.mbt-shape');if(z&&(e.key==='Enter'||e.key===' ')){e.preventDefault();activate(z.dataset.zone,true)}});activate('102',false)}catch(e){root.innerHTML='<p>Seat guide unavailable right now. Use the live ticket map to compare sections for your date.</p>'}}function gallery(){const b=[...document.querySelectorAll('#photos .gallery button')],l=document.getElementById('lightbox');if(!b.length||!l)return;const img=l.querySelector('#lightboxImg, img');let i=0,x=null,p=l.querySelector('.mbt-lb-prev'),n=l.querySelector('.mbt-lb-next'),c=l.querySelector('.mbt-lb-count');if(!p){p=document.createElement('button');p.type='button';p.className='mbt-lb-nav mbt-lb-prev';p.textContent='‹';p.setAttribute('aria-label','Previous photo');n=document.createElement('button');n.type='button';n.className='mbt-lb-nav mbt-lb-next';n.textContent='›';n.setAttribute('aria-label','Next photo');c=document.createElement('div');c.className='mbt-lb-count';l.append(p,n,c)}const show=j=>{i=(j+b.length)%b.length;const t=b[i].querySelector('img');img.src=t.currentSrc||t.src;img.alt=t.alt||'Michael Jackson ONE photo';c.textContent=`${i+1} of ${b.length}`};b.forEach((q,j)=>q.addEventListener('click',()=>show(j)));p.onclick=e=>{e.stopPropagation();show(i-1)};n.onclick=e=>{e.stopPropagation();show(i+1)};addEventListener('keydown',e=>{if(!l.classList.contains('open'))return;if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});l.addEventListener('touchstart',e=>x=e.changedTouches[0]?.clientX??null,{passive:true});l.addEventListener('touchend',e=>{if(x==null)return;const d=(e.changedTouches[0]?.clientX??x)-x;x=null;if(Math.abs(d)>45)show(i+(d<0?1:-1))},{passive:true})}document.querySelectorAll('[data-seat-layout="mandalay-bay-theatre"]').forEach(mount);gallery()})();'''
          Path('assets/seat-layouts/mandalay-bay-theatre.js').write_text(js+'\n')

          # Static chart generated from the same JSON geometry.
          zones=''.join(f'<polygon points="{z["points"]}" fill="{z["color"]}" stroke="#fff" stroke-opacity=".42" stroke-width=".55"/><text x="{sum(float(p.split(",")[0]) for p in z["points"].split())/len(z["points"].split()):.2f}" y="{sum(float(p.split(",")[1]) for p in z["points"].split())/len(z["points"].split()):.2f}" text-anchor="middle" dominant-baseline="middle" fill="{"#171225" if z["our_pick"] else "#fff"}" font-family="Arial,sans-serif" font-size="4" font-weight="800">{z["id"]}</text>' for z in layout['zones'])
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 120 100"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#140923"/><stop offset="1" stop-color="#07070c"/></linearGradient></defs><rect width="120" height="100" rx="4" fill="url(#bg)"/><text x="6" y="7" fill="#fff" font-family="Arial,sans-serif" font-size="4.4" font-weight="800">vegas <tspan fill="#ff2e7e">sidekick</tspan></text><rect x="38" y="86" width="44" height="8" rx="2" fill="#171717" stroke="#ffb000" stroke-width=".7"/><text x="60" y="91" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="4.4" font-weight="900" letter-spacing="1">STAGE</text>{zones}<rect x="31" y="3" width="58" height="6" rx="3" fill="#ffb000"/><text x="60" y="7.1" text-anchor="middle" fill="#171225" font-family="Arial,sans-serif" font-size="2.6" font-weight="900">SWEET SPOT · 101–103 + 202–204</text><text x="60" y="98" text-anchor="middle" fill="#d7cedd" font-family="Arial,sans-serif" font-size="2.3">Mandalay Bay Theatre · 3950 S Las Vegas Blvd</text></svg>'''
          Path('images/mandalay-bay-theatre-seating-chart.svg').write_text(svg)

          # Rebuild the show page around the current canonical system.
          html=page.read_text(); soup=BeautifulSoup(html,'html.parser')
          soup.title.string='Michael Jackson ONE Las Vegas Tickets from $163 | Seat Guide'
          md=soup.find('meta',attrs={'name':'description'}); md['content']='Michael Jackson ONE by Cirque du Soleil is a 90-minute production at Mandalay Bay. Tickets from $163. Compare showtimes and seating sections before booking.'
          for m in soup.find_all('meta',attrs={'property':'og:description'}): m['content']='Michael Jackson ONE by Cirque du Soleil at Mandalay Bay Theatre pairs Michael Jackson’s original recordings with acrobatics, dance and large-scale production.'
          for script in soup.find_all('script',attrs={'type':'application/ld+json'}):
            try:o=json.loads(script.string or script.get_text())
            except:continue
            if o.get('@type') in ('Event','EventSeries'):
              o['offers']['price']=163;o['offers']['url']=ticket;o['duration']='PT90M';o['audience']={'@type':'Audience','audienceType':'Everyone must be 5 years of age or older to attend the event.'}
            if o.get('@type')=='WebPage': o['dateModified']='2026-09-12';o['lastReviewed']='2026-09-12'
            script.string=json.dumps(o,ensure_ascii=False,separators=(',',':'))

          # Canonical seat CSS and benchmark hero treatment.
          if not soup.find('link',href='/assets/seat-layouts/mandalay-bay-theatre.css?v=1'):
            soup.head.append(BeautifulSoup('<link href="/assets/seat-layouts/mandalay-bay-theatre.css?v=1" rel="stylesheet"/>','html.parser'))
          soup.head.append(BeautifulSoup('<style id="mj-one-benchmark-final">@media (min-width:801px){.hero-grid{grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);overflow:visible}.hero-copy{position:relative;z-index:2;padding-right:72px}.hero-media{position:relative;z-index:1;margin-left:-112px;overflow:hidden}.hero-media:after{background:linear-gradient(90deg,#2c0b4e 0%,rgba(44,11,78,.94) 12%,rgba(44,11,78,.58) 28%,rgba(44,11,78,.16) 46%,transparent 62%)}#quick .verdict-grid{grid-template-columns:1fr;max-width:920px}#quick .decision{max-width:760px;margin-top:18px}#quick .decision-card.good{display:flex;align-items:center;gap:16px;padding:14px 18px;border-top:0;border-left:6px solid var(--gold);min-height:0}#quick .decision-card.good h3{margin:0;white-space:nowrap}#quick .decision-card.good p{margin:0}}</style>','html.parser'))

          buy=soup.select_one('.buybox'); buy.select_one('.price').clear(); buy.select_one('.price').append(BeautifulSoup('<small>Tickets from</small>$163','html.parser'))
          deal=buy.select_one('.vs-deal-line'); deal and deal.decompose()
          soup.select_one('.hero .updated').string='Tickets start at $163. Other price points may be available.'
          facts=soup.select('.facts .fact')
          facts[1].strong.string='$163'; facts[2].strong.string='7:00 & 9:30 PM'; facts[2].span.string='Start times'

          ticker=soup.select_one('.ticker-track'); first=ticker.select_one('.ticker-set')
          for n in list(first.find_all(string=True)):
            if 'Center-middle is the easy seat default' in str(n): n.replace_with(str(n).replace('Center-middle is the easy seat default','Sweet Spot: 101–103 + 202–204'))
          if len(ticker.select('.ticker-set'))==1: ticker.append(BeautifulSoup(str(first),'html.parser'))

          def replace_section(id_,frag):
            old=soup.find(id=id_); new=BeautifulSoup(frag,'html.parser').find('section'); old.replace_with(new)

          replace_section('quick',f'''<section class="section" id="quick"><div class="wrap verdict-grid"><div class="copy"><div class="eyebrow">The 30-second answer</div><h2>Is Michael Jackson ONE worth seeing?</h2><p class="lede lede-highlight">Michael Jackson ONE is Cirque du Soleil built around Michael Jackson’s original recordings — 90 minutes of dance, acrobatics and large-scale stage production at Mandalay Bay.</p><p>The smartest part of the concept is that it does not turn into an impersonator show. Michael’s music stays at the center while the cast handles the movement, aerial work and visual storytelling around it.</p><div class="take"><span>🌵</span><div><b>Kris’s take</b><p>If Michael Jackson’s catalog is already part of the reason you’re shopping, ONE is the easy Cirque pick. You get the music you came for without giving up the scale, choreography and technical production that make a dedicated Vegas room worth seeing.</p></div></div></div><div class="decision"><div class="decision-card good"><h3>Good fit</h3><p>A strong fit for Michael Jackson fans who want a full Cirque production rather than a traditional tribute concert.</p></div></div></div></section>''')

          replace_section('photos','''<section class="section alt" id="photos"><div class="wrap"><div class="eyebrow">See the show</div><h2>Photos from Michael Jackson ONE</h2><div class="gallery gallery-4"><button aria-label="Open Michael Jackson ONE photo" type="button"><img alt="Michael Jackson ONE by Cirque du Soleil at Mandalay Bay" loading="lazy" src="/images/mj-one-hero.jpg"/></button><button aria-label="Open Michael Jackson ONE photo" type="button"><img alt="Michael Jackson ONE Las Vegas show photo" loading="lazy" src="/images/mj-one-show-2.jpg"/></button><button aria-label="Open Michael Jackson ONE photo" type="button"><img alt="Michael Jackson ONE Las Vegas show photo" loading="lazy" src="/images/mj-one-show-3.jpg"/></button><button aria-label="Open Mandalay Bay Theatre seating chart" class="mbt-chart-gallery" type="button"><img alt="Mandalay Bay Theatre seating chart for Michael Jackson ONE showing sections 101 through 103 and 201 through 205" loading="lazy" src="/images/mandalay-bay-theatre-seating-chart.svg"/></button></div><p class="media-caption">Mandalay Bay Theatre · 3950 S Las Vegas Blvd.</p><div class="video-wrap"><button aria-label="Play official Michael Jackson ONE video" class="video-preview" data-video-id="SUw-Fsr5cBE" type="button"><img alt="" src="/images/mj-one-hero.jpg"/><span>▶ Watch official preview</span></button></div></div></section>''')

          replace_section('seats',f'''<section class="section" id="seats"><div class="wrap"><div class="eyebrow">Seat guide</div><h2>Find your seat at Mandalay Bay Theatre</h2><p class="lede">The room has three lower sections facing the stage and five upper sections wrapping behind them. Sections 101, 102, 103, 202, 203 and 204 are the Vegas Sidekick Sweet Spot / Our Pick.</p><div class="mbt-seat-guide" data-layout-url="/data/seat-layouts/mandalay-bay-theatre.json" data-seat-layout="mandalay-bay-theatre" data-ticket-url="{ticket}"></div></div></section>''')
          replace_section('fit','''<section class="section alt" id="fit"><div class="wrap"><div class="eyebrow">Is it for you?</div><h2>Who it fits best</h2><div class="fit-grid solo"><div class="fit-card good"><h3>Good fit</h3><ul><li>You want Michael Jackson’s original recordings paired with Cirque-scale choreography and acrobatics.</li><li>You like visually dense productions where the entire stage picture matters.</li><li>A 90-minute show at Mandalay Bay fits cleanly into your night.</li></ul></div></div></div></section>''')
          replace_section('showtimes',f'''<section class="section" id="showtimes"><div class="wrap"><div class="eyebrow">Plan the night</div><h2>Weekly showtimes</h2><div class="schedule"><div class="day"><a href="{ticket}" rel="noopener sponsored" target="_blank"><strong>Mon</strong><span>7 PM &amp; 9:30 PM</span></a></div><div class="day dark"><strong>Tue</strong><span>Dark</span></div><div class="day dark"><strong>Wed</strong><span>Dark</span></div><div class="day"><a href="{ticket}" rel="noopener sponsored" target="_blank"><strong>Thu</strong><span>7 PM &amp; 9:30 PM</span></a></div><div class="day"><a href="{ticket}" rel="noopener sponsored" target="_blank"><strong>Fri</strong><span>7 PM &amp; 9:30 PM</span></a></div><div class="day"><a href="{ticket}" rel="noopener sponsored" target="_blank"><strong>Sat</strong><span>7 PM &amp; 9:30 PM</span></a></div><div class="day"><a href="{ticket}" rel="noopener sponsored" target="_blank"><strong>Sun</strong><span>7 PM &amp; 9:30 PM</span></a></div></div><a class="later-date-cta" href="{ticket}" rel="noopener sponsored" target="_blank">See available dates &amp; times →</a></div></section>''')

          faqs=[
            ('Does someone play Michael Jackson in the show?','No. The production uses Michael Jackson’s original recordings rather than casting an impersonator.'),
            ('What age is appropriate for Michael Jackson ONE?','Everyone must be 5 years of age or older to attend the event.'),
            ('What nights does Michael Jackson ONE run?','The regular weekly schedule is Monday and Thursday through Sunday at 7:00 PM and 9:30 PM. Tuesday and Wednesday are dark.'),
            ('How long is Michael Jackson ONE?','The current listed runtime is 90 minutes.'),
            ('Where should I sit for Michael Jackson ONE?','Vegas Sidekick’s Sweet Spot / Our Pick includes sections 101, 102, 103, 202, 203 and 204. The side upper sections 201 and 205 give you a wider look at the full production.'),
            ('How much are Michael Jackson ONE tickets?','Tickets currently start at $163. Other price points may be available depending on the performance and seating section.')]
          faq_html='<section class="section alt" id="faq"><div class="wrap"><div class="eyebrow">Before you book</div><h2>Frequently asked questions</h2><div class="faq">'+''.join(f'<details><summary>{q}</summary><div>{a}</div></details>' for q,a in faqs)+'</div></div></section>'
          replace_section('faq',faq_html)
          faq_schema={'@context':'https://schema.org','@type':'FAQPage','mainEntity':[{'@type':'Question','name':q,'acceptedAnswer':{'@type':'Answer','text':a}} for q,a in faqs]}
          for script in soup.find_all('script',attrs={'type':'application/ld+json'}):
            try:o=json.loads(script.string or script.get_text())
            except:continue
            if o.get('@type')=='FAQPage': script.string=json.dumps(faq_schema,ensure_ascii=False,separators=(',',':'))

          # Related cards and next-click modules retain verified repo prices/photos; make next clicks show-specific.
          next_sec=None
          for sec in soup.find_all('section'):
            if sec.find('h2') and 'Make the next click useful' in sec.find('h2').get_text(' ',strip=True): next_sec=sec; break
          if next_sec:
            next_sec.replace_with(BeautifulSoup('''<section class="section alt"><div class="wrap"><div class="eyebrow">Still deciding?</div><h2>Make the next click useful</h2><div class="next-grid"><a class="next-card" href="/guides/best-cirque-shows/" style="--accent:#6d28d9"><h3>Compare the best Cirque shows →</h3><p>See how ONE stacks up against the other big resident productions.</p></a><a class="next-card" href="/venues/excalibur-luxor-mandalay-bay/" style="--accent:#0fb2c7"><h3>Explore Mandalay Bay-area shows →</h3><p>See what else is playing around Mandalay Bay, Luxor and Excalibur.</p></a><a class="next-card" href="/shows/cirque/" style="--accent:#f43f8c"><h3>Browse Cirque &amp; acrobatic shows →</h3><p>Compare current prices and formats across the category.</p></a></div></div></section>''','html.parser').find('section'))

          ac=soup.select_one('.author-card p'); ac.string='Las Vegas show and ticketing guidance. Show info confirmed September 2026'
          final=soup.select_one('.final-section'); final.find('p',class_='lede').string='Tickets start at $163. Other price points may be available.'
          final.find('a',class_='cta')['href']=ticket
          mp=soup.select_one('.mobile-price'); mp.clear(); mp.append(BeautifulSoup('<small>FROM</small>$163','html.parser'))
          for a in soup.select('a[href*="michael-jackson-one/ref/vegassidekick"]'): a['href']=ticket

          # Ensure exactly one freshness line and current seat JS.
          for s in soup.find_all('script',src='/assets/seat-layouts/mandalay-bay-theatre.js?v=1'): s.decompose()
          body=soup.body
          body.append(BeautifulSoup('<script src="/assets/seat-layouts/mandalay-bay-theatre.js?v=1"></script>','html.parser'))
          page.write_text(str(soup))

          # Update denormalized price references on customer-facing surfaces without changing unrelated $115 prices.
          candidates=['components/search-data.js','shows/index.html','shows/cirque/index.html','shows/family/index.html','shows/spectaculars/index.html','guides/best-cirque-shows/index.html','venues/excalibur-luxor-mandalay-bay/index.html','index.html']
          for fp in candidates:
            p=Path(fp)
            if not p.exists(): continue
            t=p.read_text()
            # Work only in local windows that contain the MJ ONE URL/name.
            def fix_obj(m):
              s=m.group(0)
              s=s.replace('$115','$163').replace('"price": 115','"price": 163').replace('"price":115','"price":163').replace("price: 115","price: 163").replace("price:115","price:163")
              s=s.replace(' — save $48','').replace('Save $48','').replace('save $48','')
              return s
            # JSON/JS-ish objects/cards up to 1800 chars around the target identifier.
            t=re.sub(r'(?s)(.{0,900}(?:michael-jackson-one|Michael Jackson ONE).{0,900})',fix_obj,t)
            p.write_text(t)

          # Sitemap freshness.
          sm=Path('sitemap.xml')
          if sm.exists():
            t=sm.read_text(); t=re.sub(r'(<loc>https://vegassidekick\.com/shows/cirque/michael-jackson-one/</loc>\s*<lastmod>)[^<]+',r'\g<1>2026-09-12',t); sm.write_text(t)
          PY
