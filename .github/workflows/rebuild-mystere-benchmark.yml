name: Rebuild Mystere to Current Benchmark

on:
  push:
    paths:
      - '.github/workflows/rebuild-mystere-benchmark.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Mystere page and seating system
        run: python3 .github/tmp/rebuild-mystere.py

      - name: Run show-page audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-content-link-hygiene.py
          node --check assets/seat-layouts/mystere-theatre.js
          git diff --check

      - name: Commit tested rebuild to main
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git rm -f .github/workflows/rebuild-mystere-benchmark.yml .github/tmp/rebuild-mystere.py
          git add shows/cirque/mystere/index.html \
                  data/seat-layouts/mystere-theatre.json \
                  assets/seat-layouts/mystere-theatre.css \
                  assets/seat-layouts/mystere-theatre.js \
                  images/mystere-theatre-seating-chart.svg \
                  sitemap.xml
          git diff --cached --check
          git commit -m 'Rebuild Mystere show page to current benchmark'
          git push origin HEAD:main
