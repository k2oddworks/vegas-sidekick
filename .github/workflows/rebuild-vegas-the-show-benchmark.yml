name: Rebuild VEGAS The Show to Current Benchmark
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-vegas-the-show-benchmark.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild VEGAS The Show page and Saxe seating system
        run: python3 .github/tmp/rebuild-vegas-the-show.py
      - name: Run show-page audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-content-link-hygiene.py
          node --check assets/seat-layouts/saxe-theater.js
          git diff --check
      - name: Commit tested rebuild to main
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git rm -f .github/workflows/rebuild-vegas-the-show-benchmark.yml .github/tmp/rebuild-vegas-the-show.py
          git add shows/music/vegas-the-show/index.html \
                  data/seat-layouts/saxe-theater.json \
                  assets/seat-layouts/saxe-theater.css \
                  assets/seat-layouts/saxe-theater.js \
                  images/saxe-theater-seating-chart.svg \
                  sitemap.xml
          git diff --cached --check
          git commit -m 'Rebuild VEGAS The Show to current benchmark'
          git push origin HEAD:main
