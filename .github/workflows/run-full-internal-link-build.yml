name: Run Full Internal Link Build

on:
  push:
    branches: [main]
    paths:
      - scripts/full-internal-link-build.py
      - scripts/run-full-internal-link-build.py
      - .github/workflows/run-full-internal-link-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply curated internal links
        run: python3 scripts/run-full-internal-link-build.py
      - name: Audit internal link graph
        run: python3 scripts/audit-internal-links.py
      - name: Audit event schema
        run: python3 scripts/audit-event-schema.py
      - name: Commit site changes
        run: |
          if git diff --quiet; then
            echo "No site changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows guides news venues docs/internal-link-audit.md
          git commit -m "Complete full internal link build"
          git push origin HEAD:main
