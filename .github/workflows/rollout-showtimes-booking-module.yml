name: Roll out showtimes booking module
on:
  push:
    paths:
      - '.github/workflows/rollout-showtimes-booking-module.yml'
permissions:
  contents: write
jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python3 -m pip install beautifulsoup4
      - name: Build reusable showtimes system and roll it out
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json, html, re

          root=Path('.')
          db=json.loads((root/'data/show-database.json').read_text())
          weekdays=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']
          short={'Monday':'Mon','Tuesday':'Tue','Wednesday':'Wed','Thursday':'Thu','Friday':'Fri','Saturday':'Sat','Sunday':'Sun'}

          css=r'''/* Vegas Sidekick reusable showtimes conversion module */
          .vs-booking-section{background:linear-gradient(180deg,#f8f4ff 0%,#f1e9ff 100%);overflow:hidden}
          .vs-booking-section .wrap{max-width:980px}
          .vs-booking-shell{position:relative;border:1px solid #e6dcf5;border-radius:28px;padding:28px;background:rgba(255,255,255,.72);box-shadow:0 20px 55px rgba(64,31,94,.10);overflow:hidden}
          .vs-booking-copy{text-align:center}
          .vs-booking-copy h2{margin:.15rem 0 .5rem}
          .vs-booking-summary{display:flex;flex-direction:column;gap:4px;margin:0;color:#25133f}
          .vs-booking-summary span{color:#645a70}
          .vs-day-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:24px 0 18px}
          .vs-day{min-height:64px;border:1px solid #ded4ea;border-radius:14px;background:#fff;color:#24143b;font:800 .92rem/1 Inter,sans-serif;cursor:pointer}
          .vs-day span,.vs-day small{display:block}.vs-day small{margin-top:7px;color:#9b91a5;font-size:.68rem}
          .vs-day.is-active{background:linear-gradient(180deg,#7b35ea,#5d20c9);color:#fff;border-color:#6a26dc;box-shadow:0 8px 20px rgba(105,38,220,.22)}
          .vs-day.is-dark{background:#f3f0f5;color:#99919f;cursor:default}
          .vs-time-panel{max-width:650px;margin:0 auto;padding:24px;border:1px solid #e4d9ee;border-radius:22px;background:#fff;box-shadow:0 10px 30px rgba(68,31,95,.06)}
          .vs-time-panel h3{margin:0 0 15px;font-size:1.25rem}
          .vs-time-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
          .vs-time-grid a{display:flex;align-items:center;justify-content:center;min-height:62px;border:2px solid #7a32e7;border-radius:14px;color:#6422cf;text-decoration:none;font-weight:900;background:#fff}
          .vs-primary-book,.vs-all-dates{display:flex;align-items:center;justify-content:center;min-height:60px;border-radius:14px;margin-top:14px;text-decoration:none;font-weight:900}
          .vs-primary-book{background:#FFB000!important;color:#171225!important;box-shadow:0 10px 24px rgba(255,176,0,.28)}
          .vs-all-dates{border:2px solid #8c52e8;background:linear-gradient(180deg,#eee3ff 0%,#dfccff 100%);color:#4f179f;box-shadow:0 8px 20px rgba(105,38,220,.14)}
          .vs-all-dates:hover,.vs-all-dates:focus-visible{background:linear-gradient(180deg,#e7d7ff 0%,#d5baff 100%);border-color:#7130d1}
          .vs-plan-ahead{display:flex;align-items:center;gap:14px;max-width:650px;margin:18px auto 0;padding:16px 18px;border:1px solid #ddcff1;border-radius:18px;background:rgba(255,255,255,.62)}
          .vs-plan-ahead p{margin:2px 0 0;color:#605668}.vs-calendar-icon{font-size:1.7rem;color:#6c2bd9}
          .vs-booking-art{position:relative;height:170px;margin:24px -28px -28px;background:linear-gradient(180deg,#f0e5ff 0%,#c9a8f5 34%,#5c2f89 65%,#1a0c2c 100%);overflow:hidden;isolation:isolate}
          .vs-booking-art:before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 9% 20%,rgba(255,255,255,.8) 0 1px,transparent 1.8px),radial-gradient(circle at 25% 14%,rgba(255,255,255,.65) 0 1px,transparent 1.7px),radial-gradient(circle at 43% 24%,rgba(255,255,255,.7) 0 1px,transparent 1.8px),radial-gradient(circle at 70% 16%,rgba(255,255,255,.7) 0 1px,transparent 1.8px),radial-gradient(circle at 88% 28%,rgba(255,255,255,.75) 0 1px,transparent 1.8px),linear-gradient(108deg,transparent 0 24%,rgba(255,255,255,.13) 34%,transparent 45%),linear-gradient(72deg,transparent 0 58%,rgba(255,196,57,.13) 68%,transparent 78%)}
          .vs-booking-art:after{content:"";position:absolute;left:7%;right:7%;bottom:15px;height:20px;z-index:3;background:repeating-linear-gradient(90deg,rgba(255,46,126,.8) 0 5px,transparent 5px 11px);mask:linear-gradient(180deg,transparent 0 32%,#000 33%);opacity:.45;transform:skewX(-10deg)}
          .vs-art-moon{position:absolute;width:126px;height:126px;border-radius:50%;right:11%;top:14px;z-index:1;background:radial-gradient(circle at 32% 28%,#fffbe7 0 8%,#ffe28b 34%,#ffbf34 66%,#d98c00 100%);box-shadow:0 0 42px rgba(255,190,35,.42),0 0 90px rgba(255,105,180,.16)}
          .vs-art-sphere{position:absolute;width:102px;height:102px;border-radius:50%;right:13%;bottom:-28px;z-index:4;background:radial-gradient(circle at 40% 28%,#fff5bd 0 7%,#ffd652 31%,#c88f00 66%,#725000 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 0 26px rgba(255,194,0,.32);overflow:hidden}
          .vs-art-sphere:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 8px,rgba(75,48,0,.18) 9px 10px),repeating-linear-gradient(90deg,transparent 0 9px,rgba(75,48,0,.14) 10px 11px);mix-blend-mode:multiply}
          .vs-art-strip{position:absolute;left:0;right:0;bottom:0;height:86px;z-index:2;display:flex;align-items:flex-end;gap:8px;padding:0 18px}
          .vs-art-strip i{position:relative;display:block;flex:1;min-width:0;background:linear-gradient(180deg,#63398d 0%,#3b2058 18%,#13091f 100%);border-radius:5px 5px 0 0;box-shadow:inset 0 5px 0 rgba(255,69,156,.34),0 -5px 15px rgba(74,32,106,.16)}
          .vs-art-strip i:after{content:"";position:absolute;inset:12px 20% 6px;background:repeating-linear-gradient(180deg,rgba(255,205,98,.42) 0 2px,transparent 2px 8px);opacity:.62}
          .vs-art-strip i:nth-child(1){height:40px}.vs-art-strip i:nth-child(2){height:68px}.vs-art-strip i:nth-child(3){height:53px}.vs-art-strip i:nth-child(4){height:82px}.vs-art-strip i:nth-child(5){height:49px}.vs-art-strip i:nth-child(6){height:72px}.vs-art-strip i:nth-child(7){height:58px}.vs-art-strip i:nth-child(8){height:77px}
          .vs-variable-panel{text-align:center}.vs-variable-panel .vs-primary-book{margin-top:0}
          @media(max-width:700px){.vs-booking-section{padding-top:50px;padding-bottom:50px}.vs-booking-shell{padding:22px 16px 0;border-radius:22px}.vs-day-picker{grid-template-columns:repeat(7,minmax(44px,1fr));gap:5px;overflow-x:auto;padding-bottom:4px}.vs-day{min-height:58px;font-size:.8rem;border-radius:12px}.vs-time-panel{padding:18px}.vs-time-grid a{min-height:56px;font-size:.95rem}.vs-plan-ahead{align-items:flex-start}.vs-booking-art{margin:22px -16px 0;height:130px}.vs-primary-book,.vs-all-dates{min-height:58px}}
          '''
          js=r'''(()=>{document.querySelectorAll('.vs-booking-shell[data-ticket-url]').forEach(shell=>{const ticket=shell.dataset.ticketUrl,days=[...shell.querySelectorAll('.vs-day[data-day]')],label=shell.querySelector('[data-selected-day]'),grid=shell.querySelector('.vs-time-grid'),primary=shell.querySelector('.vs-primary-book');if(!days.length||!label||!grid||!primary)return;const render=btn=>{days.forEach(b=>{const on=b===btn;b.classList.toggle('is-active',on);b.setAttribute('aria-selected',on?'true':'false')});const day=btn.dataset.day,times=(btn.dataset.times||'').split('|').filter(Boolean);label.textContent=day;grid.innerHTML=times.map(t=>`<a href="${ticket}" rel="noopener sponsored" target="_blank">${t}</a>`).join('');primary.textContent=`Get Tickets for ${day} →`;};days.forEach(btn=>btn.addEventListener('click',()=>render(btn)));const initial=days.find(b=>b.classList.contains('is-active'))||days[0];if(initial)render(initial);});})();
          '''
          (root/'assets/showtimes-booking.css').write_text(css.strip()+'\n')
          (root/'assets/showtimes-booking.js').write_text(js.strip()+'\n')

          def find_section(soup):
              node=soup.find(id='showtimes') or soup.find(id='times')
              if node:
                  sec=node if node.name=='section' else node.find_parent('section')
                  if sec: return sec
              for h in soup.find_all(['h2','h3']):
                  if 'showtime' in h.get_text(' ',strip=True).lower():
                      sec=h.find_parent('section')
                      if sec: return sec
              return None

          def asset_tag(soup, tag, attr, value):
              return soup.find(tag, attrs={attr:value}) is not None

          changed=[]; skipped=[]; active_total=0; variable_count=0
          for rec in db['records']:
              if rec.get('status')!='active': continue
              active_total+=1
              page_path=rec.get('page_path') or ''
              if not page_path.startswith('/shows/'):
                  skipped.append((rec.get('slug'),'no show page path')); continue
              p=root/page_path.strip('/')/'index.html'
              if not p.exists():
                  skipped.append((rec.get('slug'),'page missing')); continue
              ticket=rec.get('ticket_url') or rec.get('spotlight',{}).get('affiliate_url')
              if not ticket:
                  skipped.append((rec.get('slug'),'no verified ticket URL')); continue
              spotlight=rec.get('spotlight') or {}
              schedule_days=spotlight.get('schedule_days') or {}
              variable=bool(spotlight.get('schedule_variable')) or not schedule_days
              soup=BeautifulSoup(p.read_text(),'html.parser')
              section=find_section(soup)
              if not section:
                  skipped.append((rec.get('slug'),'no showtimes section')); continue

              # Remove one-off MJ implementation now that this is shared.
              for style_id in ['mj-showtimes-conversion']:
                  n=soup.find(id=style_id)
                  if n: n.decompose()
              n=soup.find('script',id='mj-showtimes-js')
              if n: n.decompose()

              # Shared asset links.
              if not soup.find('link',href=re.compile(r'^/assets/showtimes-booking\.css')):
                  link=soup.new_tag('link',rel='stylesheet',href='/assets/showtimes-booking.css?v=1')
                  soup.head.append(link)
              if not soup.find('script',src=re.compile(r'^/assets/showtimes-booking\.js')):
                  script=soup.new_tag('script',src='/assets/showtimes-booking.js?v=1')
                  if soup.body: soup.body.append(script)

              # Keep sticky nav links pointing at the standard ID.
              for a in soup.find_all('a',href='#times'):
                  if 'showtime' in a.get_text(' ',strip=True).lower(): a['href']='#showtimes'

              if variable:
                  variable_count+=1
                  inner=f'''<div class="wrap"><div class="eyebrow">Pick your night</div><div class="vs-booking-shell"><div class="vs-booking-copy"><h2>See available dates &amp; times</h2><p class="vs-booking-summary"><strong>Schedule varies by date</strong><span>Use the live calendar to choose your performance.</span></p></div><div class="vs-time-panel vs-variable-panel"><a class="vs-primary-book vs-ticket-primary" href="{html.escape(ticket)}" rel="noopener sponsored" target="_blank">See available dates &amp; times →</a></div><div class="vs-plan-ahead"><div class="vs-calendar-icon" aria-hidden="true">▦</div><div><strong>Planning ahead?</strong><p>You can book tickets weeks and months in advance.</p></div></div><div class="vs-booking-art" aria-hidden="true"><div class="vs-art-moon"></div><div class="vs-art-sphere"></div><div class="vs-art-strip"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div></div>'''
              else:
                  active_days=[d for d in weekdays if schedule_days.get(d)]
                  first=active_days[0]
                  buttons=[]
                  for d in weekdays:
                      times=schedule_days.get(d) or []
                      if times:
                          buttons.append(f'<button class="vs-day{" is-active" if d==first else ""}" type="button" role="tab" aria-selected="{"true" if d==first else "false"}" data-day="{d}" data-times="{html.escape("|".join(times))}"><span>{short[d]}</span></button>')
                      else:
                          buttons.append(f'<button class="vs-day is-dark" type="button" role="tab" aria-selected="false" disabled><span>{short[d]}</span><small>Dark</small></button>')
                  first_times=''.join(f'<a href="{html.escape(ticket)}" rel="noopener sponsored" target="_blank">{html.escape(t)}</a>' for t in schedule_days[first])
                  summary=html.escape(rec.get('schedule_summary') or spotlight.get('schedule_summary') or '')
                  inner=f'''<div class="wrap"><div class="eyebrow">Pick your night</div><div class="vs-booking-shell" data-ticket-url="{html.escape(ticket)}"><div class="vs-booking-copy"><h2>Find your showtime</h2><p class="vs-booking-summary"><strong>Regular weekly schedule</strong><span>{summary}</span></p></div><div class="vs-day-picker" role="tablist" aria-label="Choose a show day">{''.join(buttons)}</div><div class="vs-time-panel" aria-live="polite"><h3><span data-selected-day>{first}</span> showtimes</h3><div class="vs-time-grid">{first_times}</div><a class="vs-primary-book vs-ticket-primary" href="{html.escape(ticket)}" rel="noopener sponsored" target="_blank">Get Tickets for {first} →</a><a class="vs-all-dates" href="{html.escape(ticket)}" rel="noopener sponsored" target="_blank">View all dates &amp; times →</a></div><div class="vs-plan-ahead"><div class="vs-calendar-icon" aria-hidden="true">▦</div><div><strong>Planning ahead?</strong><p>You can book tickets weeks and months in advance.</p></div></div><div class="vs-booking-art" aria-hidden="true"><div class="vs-art-moon"></div><div class="vs-art-sphere"></div><div class="vs-art-strip"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div></div>'''

              new=BeautifulSoup(f'<section class="section vs-booking-section" id="showtimes">{inner}</section>','html.parser').section
              section.replace_with(new)
              p.write_text(str(soup))
              changed.append(str(p))

          print(f'ACTIVE_RECORDS={active_total}')
          print(f'CHANGED_PAGES={len(changed)}')
          print(f'VARIABLE_PAGES={variable_count}')
          print('SKIPPED='+json.dumps(skipped))
          if skipped:
              # Broad rollout should be complete across active show pages.
              raise SystemExit(f'Skipped active shows: {skipped}')
          if not changed:
              raise SystemExit('No show pages changed')
          PY
      - name: Run required audits and rollout QA
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-content-link-hygiene.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json
          db=json.loads(Path('data/show-database.json').read_text())
          active=[r for r in db['records'] if r.get('status')=='active' and (r.get('page_path') or '').startswith('/shows/')]
          bad=[]
          for r in active:
              p=Path(r['page_path'].strip('/'))/'index.html'
              if not p.exists(): bad.append((r['slug'],'missing page')); continue
              s=p.read_text(); soup=BeautifulSoup(s,'html.parser')
              sec=soup.find('section',id='showtimes')
              if not sec or 'vs-booking-section' not in (sec.get('class') or []): bad.append((r['slug'],'module missing')); continue
              if '/assets/showtimes-booking.css?v=1' not in s or '/assets/showtimes-booking.js?v=1' not in s: bad.append((r['slug'],'assets missing'))
              ticket=r.get('ticket_url') or (r.get('spotlight') or {}).get('affiliate_url')
              links=sec.find_all('a',href=ticket) if ticket else []
              if not links: bad.append((r['slug'],'verified ticket links missing'))
              if (r.get('spotlight') or {}).get('schedule_variable'):
                  if 'Schedule varies by date' not in sec.get_text(' ',strip=True): bad.append((r['slug'],'variable schedule not labeled'))
              else:
                  days=(r.get('spotlight') or {}).get('schedule_days') or {}
                  if days:
                      expected=sum(1 for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] if days.get(d))
                      if len(sec.select('.vs-day[data-day]'))!=expected: bad.append((r['slug'],'day buttons mismatch'))
          assert not bad, bad
          assert Path('assets/showtimes-booking.css').exists()
          assert Path('assets/showtimes-booking.js').exists()
          PY
      - name: Commit rollout
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add assets/showtimes-booking.css assets/showtimes-booking.js shows
          git commit -m 'Roll out conversion showtimes module across active shows'
          git push origin main
