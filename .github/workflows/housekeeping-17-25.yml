name: Apply UI housekeeping 17-25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/housekeeping-17-25.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply housekeeping 17-25
        run: python3 scripts/housekeeping-17-25.py

      - name: Run audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-orphan-ui.py
          git diff --check

      - name: Commit housekeeping pass
        run: |
          rm -f .github/workflows/housekeeping-17-25.yml scripts/housekeeping-17-25.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish shared UI housekeeping 17-25"
          git push origin main
