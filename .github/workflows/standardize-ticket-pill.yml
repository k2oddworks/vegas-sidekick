name: Standardize Ticket Pill
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-option1-ticket-layout.py'
      - '.github/workflows/standardize-ticket-pill.yml'
permissions:
  contents: write
jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Option 1 ticket layout
        run: python3 scripts/apply-option1-ticket-layout.py
      - name: Run safeguards
        run: |
          python3 scripts/audit-savings-system.py
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-content-link-hygiene.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
      - name: Commit standardized layout
        run: |
          git checkout -- docs/internal-link-audit.md || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/show-savings.css shows scripts/implement-savings-system.py scripts/fix-savings-edge-cases.py VS_CHAT_CONTEXT.md
          if ! git diff --cached --quiet; then
            git commit -m "Standardize show ticket modules to Option 1 pill layout"
            git push
          fi
