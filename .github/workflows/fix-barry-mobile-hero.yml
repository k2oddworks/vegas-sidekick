name: Fix Barry Mobile Hero

on:
  push:
    paths:
      - '.github/workflows/fix-barry-mobile-hero.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply structured mobile hero treatment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('shows/music/barry-manilow/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="heroimg"><img src="/images/barry-manilow-hero.webp"'
          new = '<div class="hero-media" data-mobile-fit="safe" style="--mobile-hero-image:url(\'/images/barry-manilow-hero.webp\');--mobile-hero-position:center 26%"><img src="/images/barry-manilow-hero.webp"'
          if old not in s:
              raise SystemExit('Barry hero markup target not found')
          s = s.replace(old, new, 1)
          s = s.replace('.heroimg{height:520px;', '.hero-media{height:520px;', 1)
          s = s.replace('.heroimg img{width:100%;height:100%;object-fit:cover;object-position:center 26%}', '.hero-media img{width:100%;height:100%;object-fit:cover;object-position:center 26%}', 1)
          s = s.replace('.heroimg{height:400px;order:-1}', '.hero-media{height:400px;order:-1}', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Audit mobile show heroes
        run: python3 scripts/audit-mobile-show-heroes.py

      - name: Audit decision copy
        run: python3 scripts/audit-show-decision-copy.py

      - name: Audit Event schema
        run: python3 scripts/audit-event-schema.py

      - name: Audit ticket CTAs
        run: python3 scripts/audit-ticket-cta-color.py

      - name: Commit fix
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add shows/music/barry-manilow/index.html
          git commit -m 'Add Barry Manilow mobile hero safety treatment'
          git push origin HEAD:main
