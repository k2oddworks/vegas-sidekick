name: Rebuild Penn and Teller benchmark v2
on:
  push:
    paths:
      - '.github/workflows/rebuild-penn-teller-benchmark-v2.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python3 -m pip install beautifulsoup4
      - name: Reuse audited rebuild logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,textwrap
          t=Path('.github/workflows/rebuild-penn-teller-benchmark.yml').read_text()
          m=re.search(r"- name: Rebuild Penn and Teller\n\s+run: \|\n\s+python3 - <<'PY'\n(.*?)\n\s+PY\n\s+- name: Run audits and benchmark QA",t,re.S)
          assert m, 'could not extract rebuild logic'
          code=textwrap.dedent(m.group(1))
          exec(compile(code,'<penn-teller-rebuild>','exec'),{})
          PY
      - name: Run audits and benchmark QA
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-content-link-hygiene.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json
          p=Path('shows/magic/penn-and-teller/index.html').read_text()
          soup=BeautifulSoup(p,'html.parser')
          d=json.loads(Path('data/show-database.json').read_text()); r=next(x for x in d['records'] if x['slug']=='penn-and-teller')
          assert r['our_price']==66 and r['regular_price']==107 and r['runtime_minutes']==90 and r['status']=='active'
          assert r['ticket_url']=='https://spotlight.vegas/shows/magic/penn-and-teller/ref/vegassidekick'
          assert r['schedule_summary']=='Thu, Fri, Sat, Sun · Times vary' and r['spotlight']['schedule_variable'] is True
          assert len(soup.select('.ticker-set'))==2
          assert soup.select_one('[data-seat-layout="penn-teller-theater-rio"]')
          assert '/assets/seat-layouts/penn-teller-theater-rio.css?v=1' in p and '/assets/seat-layouts/penn-teller-theater-rio.js?v=1' in p
          assert '/images/penn-teller-theater-rio-seating-chart.svg' in p
          svg=Path('images/penn-teller-theater-rio-seating-chart.svg').read_text(); assert 'width="1200" height="956" viewBox="0 0 108 86"' in svg
          layout=json.loads(Path('data/seat-layouts/penn-teller-theater-rio.json').read_text())
          picks={z['id'] for z in layout['zones'] if z['our_pick']}
          assert picks=={f'section-{i}' for i in range(1,7)}
          assert {z['id'] for z in layout['zones']} >= {f'section-{i}' for i in range(1,10)} | {'amp-1','amp-2','amp-3','booths'}
          cards=soup.select('#showtimes .schedule .day'); assert len(cards)==7
          assert len(soup.select('#showtimes .schedule .day.dark'))==3
          active=[c for c in cards if 'dark' not in (c.get('class') or [])]; assert len(active)==4 and all(c.find('a',href=r['ticket_url']) for c in active)
          assert len(soup.select('.related-card'))>=3 and all(c.find('img') for c in soup.select('.related-card')[:3])
          assert p.count('Show info confirmed September 2026')==1
          assert 'mobile-bar' in p and 'Typical start' not in p and 'Think Twice' not in p and 'tradeoff' not in p.lower()
          assert 'separate post-show Penn &amp; Teller Meet &amp; Greet Experience' in p
          assert 'eventSchedule' not in p
          for f in ['images/penn-and-teller-hero.jpg','images/penn-and-teller-2.jpg','images/penn-and-teller-3.jpg','images/penn-teller-theater-rio-seating-chart.svg','assets/seat-layouts/penn-teller-theater-rio.css','assets/seat-layouts/penn-teller-theater-rio.js']:
              assert Path(f).exists(), f
          PY
      - name: Commit rebuild
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add shows/magic/penn-and-teller/index.html data/show-database.json data/seat-layouts/penn-teller-theater-rio.json assets/seat-layouts/penn-teller-theater-rio.css assets/seat-layouts/penn-teller-theater-rio.js images/penn-teller-theater-rio-seating-chart.svg scripts/reconcile-spotlight.py shows/magic/index.html sitemap.xml
          git commit -m 'Rebuild Penn and Teller to current benchmark'
          git push origin main
