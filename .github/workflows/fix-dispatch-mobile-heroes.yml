name: Fix Dispatch Mobile Heroes
on:
  push:
    paths:
      - 'scripts/trigger-dispatch-mobile-heroes.txt'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix-dispatch-mobile-heroes.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = [
            'news/soda-stereo-ecos-september-13/index.html',
            'news/jo-koy-live-colosseum-caesars-palace-september-19/index.html',
            'news/backstreet-boys-f1-afterparty-sphere-november-21/index.html',
          ]
          rule = '.hero-media img{object-position:center top}'
          for p in pages:
              assert rule in Path(p).read_text(), p
          print('Validated all three Dispatch mobile heroes')
          PY
      - name: Commit
        run: |
          git config user.name 'Kris Kidd'
          git config user.email 'k2oddworks@gmail.com'
          git add news/soda-stereo-ecos-september-13/index.html news/jo-koy-live-colosseum-caesars-palace-september-19/index.html news/backstreet-boys-f1-afterparty-sphere-november-21/index.html
          git diff --cached --quiet || git commit -m 'Fix Dispatch mobile hero image positioning'
          git push
