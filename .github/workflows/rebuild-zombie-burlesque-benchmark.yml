name: Rebuild Zombie Burlesque benchmark
on:
  push:
    paths:
      - '.github/workflows/rebuild-zombie-burlesque-benchmark.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Zombie Burlesque
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, html

          dbp=Path('data/show-database.json')
          db=json.loads(dbp.read_text())
          rec=next(r for r in db['records'] if r['slug']=='zombie-burlesque')
          assert rec['status']=='active'
          assert rec['ticket_url']=='https://spotlight.vegas/shows/adult/zombie-burlesque/ref/vegassidekick'
          assert rec['our_price']==51 and rec['runtime_minutes']==75
          assert '16' in rec['age_summary']
          assert 'V Theater' in rec['venue']

          ticket=rec['ticket_url']
          price=rec['our_price']
          regular=rec.get('regular_price')
          runtime=rec['runtime_minutes']
          schedule=rec['spotlight']['schedule_days']
          age_rule=rec['spotlight'].get('age_rule') or rec['age_summary']
          venue='V Theater • Miracle Mile Shops • Planet Hollywood'
          address='3667 S Las Vegas Blvd, Las Vegas, NV 89109'

          layout={
            'id':'v-theater-miracle-mile',
            'venue':'V Theater',
            'address':address,
            'stage':'Stage',
            'zones':[
              {'id':'vip','label':'VIP','rows':['A','B','C','D','E','F','G','H','I','J','K','L'],'our_pick':True,'badge':'Sweet spot','color':'#f43f8c','description':'Rows A–L put you closest to the stage and make the comedy, choreography and specialty acts easy to read. This is the Vegas Sidekick Sweet Spot / Our Pick for Zombie Burlesque.'},
              {'id':'rear','label':'Rear','rows':['M','N','O','P','Q','R','S','T','U','V'],'our_pick':False,'badge':'Full-stage view','color':'#ffb000','description':'Rows M–V sit farther back with a clean view across the full stage. A good pick when you want to take in the whole production at once.'}
            ]
          }
          Path('data/seat-layouts/v-theater-miracle-mile.json').write_text(json.dumps(layout,indent=2)+"\n")

          css='''
          .vth-seat-guide{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:22px;align-items:start;margin-top:24px}.vth-map{background:radial-gradient(circle at 50% 100%,rgba(244,63,140,.16),transparent 34%),linear-gradient(180deg,#150a23,#09060f);border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:24px;box-shadow:0 24px 60px rgba(13,4,24,.25)}.vth-stage{width:74%;margin:0 auto 24px;padding:22px 12px;text-align:center;color:#fff;font-weight:900;letter-spacing:.2em;background:#111;border:2px solid #ffb000;border-radius:8px 8px 28px 28px}.vth-zone{appearance:none;border:0;background:transparent;width:100%;padding:0;margin:0 0 14px;cursor:pointer}.vth-rows{display:grid;gap:4px}.vth-row{display:block;height:18px;margin-inline:auto;background:var(--zone-color);border:1px solid rgba(255,255,255,.35);border-radius:3px;box-shadow:inset 0 1px 2px rgba(255,255,255,.2)}.vth-zone[data-zone="vip"] .vth-row:nth-child(5),.vth-zone[data-zone="vip"] .vth-row:nth-child(6),.vth-zone[data-zone="vip"] .vth-row:nth-child(7),.vth-zone[data-zone="vip"] .vth-row:nth-child(8){width:100%}.vth-zone[data-zone="vip"] .vth-row{width:90%}.vth-zone[data-zone="rear"] .vth-row{width:82%}.vth-zone[data-zone="rear"] .vth-row:nth-child(1){width:62%}.vth-zone[data-zone="rear"] .vth-row:nth-child(2){width:74%}.vth-zone[data-zone="rear"] .vth-row:nth-child(9){width:74%}.vth-zone[data-zone="rear"] .vth-row:nth-child(10){width:82%}.vth-zone.is-active .vth-row{outline:3px solid #ffb000;outline-offset:2px;box-shadow:0 0 16px rgba(255,176,0,.42)}.vth-zone-label{display:flex;justify-content:center;gap:8px;align-items:center;color:#fff;font-weight:900;margin:8px 0 2px}.vth-badge{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;background:#ffb000;color:#171225;padding:4px 7px;border-radius:999px}.vth-cards{display:grid;gap:12px}.vth-card{appearance:none;text-align:left;padding:18px;border-radius:18px;border:1px solid #e9e2f2;background:#fff;cursor:pointer}.vth-card.is-active{border-color:#ffb000;box-shadow:0 0 0 2px rgba(255,176,0,.16)}.vth-card h3{margin:0 0 6px}.vth-card p{margin:0;color:#62596d}.vth-detail{margin-top:14px;padding:18px;border:1px solid #e9e2f2;border-radius:18px;background:#fff}.vth-detail .tag{font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#7a7080}.vth-detail h3{margin:5px 0 8px}.vth-detail p{margin:0 0 14px}.vth-detail .cta{width:100%}.vth-mobile{display:none}.vth-chart-gallery img{object-fit:contain!important;background:#09060f}.vth-lb-nav{position:absolute!important;top:50%!important;transform:translateY(-50%);z-index:3;width:52px!important;height:52px!important;border-radius:50%!important;background:#fff!important;color:#17082e!important;font-size:2rem!important}.vth-lb-prev{left:18px!important;right:auto!important}.vth-lb-next{right:18px!important}.vth-lb-count{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;background:rgba(23,8,46,.82);color:#fff;padding:6px 11px;border-radius:999px;font-size:.8rem;font-weight:800}@media(max-width:820px){.vth-seat-guide{grid-template-columns:1fr}.vth-cards{display:none}.vth-detail{display:none}.vth-map{padding:18px 12px}.vth-stage{width:78%;padding:17px 8px}.vth-row{height:14px}.vth-mobile{position:fixed;left:14px;right:14px;bottom:98px;z-index:1100;display:block;padding:14px 48px 14px 15px;background:rgba(20,9,35,.97);color:#fff;border:1px solid rgba(255,176,0,.7);border-radius:16px;opacity:0;pointer-events:none;transform:translateY(16px);transition:.2s}.vth-mobile.is-open{opacity:1;pointer-events:auto;transform:none}.vth-mobile button{position:absolute;right:9px;top:8px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff}.vth-mobile p{margin:5px 0 0;color:#ded7e4;font-size:.84rem}.vth-lb-prev{left:8px!important}.vth-lb-next{right:8px!important}.vth-lb-count{bottom:100px}}
          '''.strip()+"\n"
          Path('assets/seat-layouts/v-theater-miracle-mile.css').write_text(css)

          js=r'''(()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function mount(root){const data=await fetch(root.dataset.layoutUrl).then(r=>r.json()),ticket=root.dataset.ticketUrl,by=Object.fromEntries(data.zones.map(z=>[z.id,z]));const row=(z,n)=>`<span class="vth-row" title="Row ${esc(n)}" style="--zone-color:${esc(z.color)}"></span>`;root.innerHTML=`<div class="vth-map"><div class="vth-stage">STAGE</div>${data.zones.map(z=>`<button type="button" class="vth-zone" data-zone="${esc(z.id)}"><div class="vth-zone-label">${esc(z.label)}${z.our_pick?'<span class="vth-badge">Sweet spot</span>':''}</div><div class="vth-rows">${z.rows.map(n=>row(z,n)).join('')}</div></button>`).join('')}</div><div><div class="vth-cards">${data.zones.map(z=>`<button type="button" class="vth-card" data-zone="${esc(z.id)}"><h3>${esc(z.label)} ${z.our_pick?'<span class="vth-badge">Our Pick</span>':''}</h3><p>${esc(z.description)}</p></button>`).join('')}</div><div class="vth-detail" aria-live="polite"><div class="tag"></div><h3></h3><p></p><a class="cta vs-ticket-primary" href="${esc(ticket)}" target="_blank" rel="noopener sponsored">Check seats →</a></div></div><div class="vth-mobile" aria-live="polite"><strong></strong><p></p><button type="button" aria-label="Close seat description">×</button></div>`;const detail=root.querySelector('.vth-detail'),pop=root.querySelector('.vth-mobile');function activate(id,show){const z=by[id];if(!z)return;root.querySelectorAll('[data-zone]').forEach(x=>x.classList.toggle('is-active',x.dataset.zone===id));detail.querySelector('.tag').textContent=z.our_pick?'Sweet spot':'Seat guide';detail.querySelector('h3').textContent=z.label;detail.querySelector('p').textContent=z.description;pop.querySelector('strong').textContent=(z.our_pick?'Sweet spot · ':'')+z.label;pop.querySelector('p').textContent=z.description;if(show&&matchMedia('(max-width:820px)').matches)pop.classList.add('is-open')}root.addEventListener('click',e=>{const z=e.target.closest('[data-zone]');if(z)activate(z.dataset.zone,true);if(e.target.closest('.vth-mobile button'))pop.classList.remove('is-open')});activate('vip',false)}function gallery(){const b=[...document.querySelectorAll('#photos .gallery button')],l=document.getElementById('lightbox');if(!b.length||!l)return;const img=l.querySelector('#lightboxImg, img');let i=0,x=null,p=l.querySelector('.vth-lb-prev'),n=l.querySelector('.vth-lb-next'),c=l.querySelector('.vth-lb-count');if(!p){p=document.createElement('button');p.className='vth-lb-nav vth-lb-prev';p.textContent='‹';p.setAttribute('aria-label','Previous photo');n=document.createElement('button');n.className='vth-lb-nav vth-lb-next';n.textContent='›';n.setAttribute('aria-label','Next photo');c=document.createElement('div');c.className='vth-lb-count';l.append(p,n,c)}const show=j=>{i=(j+b.length)%b.length;const t=b[i].querySelector('img');img.src=t.currentSrc||t.src;img.alt=t.alt||'Zombie Burlesque photo';c.textContent=`${i+1} of ${b.length}`};b.forEach((q,j)=>q.addEventListener('click',()=>show(j)));p.onclick=e=>{e.stopPropagation();show(i-1)};n.onclick=e=>{e.stopPropagation();show(i+1)};addEventListener('keydown',e=>{if(!l.classList.contains('open'))return;if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});l.addEventListener('touchstart',e=>x=e.changedTouches[0]?.clientX??null,{passive:true});l.addEventListener('touchend',e=>{if(x==null)return;const d=(e.changedTouches[0]?.clientX??x)-x;x=null;if(Math.abs(d)>45)show(i+(d<0?1:-1))},{passive:true})}document.querySelectorAll('[data-seat-layout="v-theater-miracle-mile"]').forEach(mount);gallery()})();'''
          Path('assets/seat-layouts/v-theater-miracle-mile.js').write_text(js+"\n")

          vip=layout['zones'][0]; rear=layout['zones'][1]
          def svg_rows(z, ys, widths):
            out=[]
            for idx,(lab,y,w) in enumerate(zip(z['rows'],ys,widths)):
              x=450-w/2
              out.append(f'<rect x="{x:.0f}" y="{y}" width="{w}" height="24" rx="5" fill="{z["color"]}" stroke="#ffffff" stroke-opacity=".32"/><text x="465" y="{y+17}" fill="#fff" font-size="12">{lab}</text>')
            return ''.join(out)
          vip_ys=list(range(250,250+12*30,30)); vip_w=[500,500,500,500,550,550,550,550,500,500,500,450]
          rear_ys=list(range(635,635+10*30,30)); rear_w=[370,450,500,500,500,500,500,500,450,500]
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100"><rect width="900" height="1100" fill="#09060f"/><text x="450" y="72" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700" font-size="34">V Theater</text><path d="M170 160 L730 160 L790 225 L690 235 L610 205 L290 205 L210 235 L110 225 Z" fill="#15131a" stroke="#ffb000" stroke-width="4"/><text x="450" y="208" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700" font-size="28">STAGE</text>{svg_rows(vip,vip_ys,vip_w)}<text x="450" y="430" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800" font-size="42">VIP</text><rect x="285" y="455" width="330" height="38" rx="19" fill="#ffb000"/><text x="450" y="481" text-anchor="middle" fill="#171225" font-family="Arial" font-weight="800" font-size="17">SWEET SPOT / OUR PICK</text>{svg_rows(rear,rear_ys,rear_w)}<text x="450" y="760" text-anchor="middle" fill="#171225" font-family="Arial" font-weight="800" font-size="38">REAR</text><text x="450" y="1040" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="18">Rows shown as room geometry; no individual seat counts inferred.</text></svg>'''
          Path('images/zombie-burlesque-v-theater-seating-chart.svg').write_text(svg)

          days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']
          short={'Monday':'Mon','Tuesday':'Tue','Wednesday':'Wed','Thursday':'Thu','Friday':'Fri','Saturday':'Sat','Sunday':'Sun'}
          cards=[]
          for d in days:
            vals=schedule.get(d,[])
            label=' & '.join(vals) if vals else 'Dark'
            cards.append(f'<div class="day"><a href="{ticket}" rel="noopener sponsored" target="_blank"><strong>{short[d]}</strong><span>{label}</span></a></div>')
          cards=''.join(cards)
          reg=f'<div class="vs-deal-line"><span class="vs-regular-price">Regular ${regular}</span><span class="vs-save-badge">Save ${regular-price}</span></div>' if regular else ''

          event={"@context":"https://schema.org","@type":"EventSeries","name":"Zombie Burlesque","description":"75-minute comedy musical with burlesque, variety acts and a live band at V Theater inside Planet Hollywood.","image":["https://vegassidekick.com/images/zombie-burlesque-hero.jpg","https://vegassidekick.com/images/zombie-burlesque-show-2.jpg","https://vegassidekick.com/images/zombie-burlesque-show-3.jpg"],"url":"https://vegassidekick.com/shows/adult/zombie-burlesque/","eventStatus":"https://schema.org/EventScheduled","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":rec['venue'],"address":{"@type":"PostalAddress","streetAddress":"3667 S Las Vegas Blvd","addressLocality":"Las Vegas","addressRegion":"NV","postalCode":"89109","addressCountry":"US"}},"performer":{"@type":"PerformingGroup","name":"Zombie Burlesque Cast"},"offers":{"@type":"Offer","price":price,"priceCurrency":"USD","availability":"https://schema.org/InStock","url":ticket,"validFrom":"2026-01-01"},"duration":"PT75M","audience":{"@type":"Audience","audienceType":age_rule},"@id":"https://vegassidekick.com/shows/adult/zombie-burlesque/#event"}
          byday=[]
          for d in days:
            if schedule.get(d): byday.append('https://schema.org/'+d)
          times=sorted({t for vals in schedule.values() for t in vals})
          if len(times)==1:
            from datetime import datetime
            event['eventSchedule']={'@type':'Schedule','byDay':byday,'startTime':datetime.strptime(times[0],'%I %p').strftime('%H:%M')}
          faq=[
            ('Is Zombie Burlesque scary?','It is comedy first. The zombie theme is played like a campy 1950s B-movie rather than a haunted attraction, with burlesque, variety acts and a live band.'),
            ('What is the age requirement for Zombie Burlesque?',age_rule),
            ('When does Zombie Burlesque perform?',f"The regular schedule is {rec['schedule_summary']}. Check the available dates and times for your trip."),
            ('Where should I sit for Zombie Burlesque?','VIP is the Vegas Sidekick Sweet Spot / Our Pick. It covers rows A–L closest to the stage, while Rear rows M–V give you a wider full-stage perspective.'),
            ('How much are Zombie Burlesque tickets?',f'Tickets currently start at ${price}. Other price points may be available depending on the performance and seating section.'),
            ('How long is Zombie Burlesque?',f'Zombie Burlesque runs about {runtime} minutes.'),
            ('Where is Zombie Burlesque?',f'The show is at V Theater inside Miracle Mile Shops at Planet Hollywood, {address}.')]
          faq_schema={"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":q,"acceptedAnswer":{"@type":"Answer","text":a}} for q,a in faq]}
          faq_html=''.join(f'<details><summary>{html.escape(q)}</summary><div>{html.escape(a)}</div></details>' for q,a in faq)
          page=f'''<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="/favicon.png" rel="icon" type="image/png"/><title>Zombie Burlesque Las Vegas Tickets from ${price} | Seat Guide</title><meta content="index,follow,max-image-preview:large" name="robots"/><meta content="Zombie Burlesque at V Theater mixes campy zombie comedy, burlesque, specialty acts and live music. Tickets from ${price}. Compare showtimes and seats." name="description"/><link href="https://vegassidekick.com/shows/adult/zombie-burlesque/" rel="canonical"/><meta content="Vegas Sidekick" property="og:site_name"/><meta content="Zombie Burlesque Tickets &amp; Show Guide | Vegas Sidekick" property="og:title"/><meta content="Campy zombie comedy, burlesque, specialty acts and live music at V Theater inside Miracle Mile Shops." property="og:description"/><meta content="https://vegassidekick.com/images/zombie-burlesque-hero.jpg" property="og:image"/><meta content="https://vegassidekick.com/shows/adult/zombie-burlesque/" property="og:url"/><meta content="website" property="og:type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/><link href="/assets/show-canonical.css?v=2" rel="stylesheet"/><link href="/assets/ticket-cta.css" rel="stylesheet"/><link href="/assets/show-savings.css" rel="stylesheet"/><link href="/assets/seat-layouts/v-theater-miracle-mile.css?v=1" rel="stylesheet"/><script type="application/ld+json">{json.dumps(event,separators=(',',':'))}</script><script type="application/ld+json">{json.dumps(faq_schema,separators=(',',':'))}</script><script type="application/ld+json">{{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{{"@type":"ListItem","position":1,"name":"Home","item":"https://vegassidekick.com/"}},{{"@type":"ListItem","