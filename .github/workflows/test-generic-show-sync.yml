name: Test Generic Show Sync

on:
  push:
    branches:
      - data/generic-show-sync
    paths:
      - scripts/sync-show-from-data.py
      - scripts/sync-carrot-top-from-data.py
      - data/shows/carrot-top.json
      - .github/workflows/test-generic-show-sync.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/generic-show-sync
      - name: Run generic engine
        run: python3 scripts/sync-show-from-data.py carrot-top
      - name: Confirm idempotence
        run: |
          cp shows/comedy/carrot-top/index.html /tmp/carrot-top-first.html
          python3 scripts/sync-show-from-data.py carrot-top
          diff -u /tmp/carrot-top-first.html shows/comedy/carrot-top/index.html
      - name: Run compatibility wrapper
        run: python3 scripts/sync-carrot-top-from-data.py --dry-run
      - name: Run all-record dry run
        run: python3 scripts/sync-show-from-data.py --all --dry-run
      - name: Validate Event schema
        run: python3 scripts/audit-event-schema.py
      - name: Validate SERP metadata
        run: python3 scripts/audit-serp-metadata.py
      - name: Validate content and links
        run: python3 scripts/audit-content-link-hygiene.py
      - name: Validate internal links
        run: python3 scripts/audit-internal-links.py
      - name: Ensure generated Carrot Top page matches main
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- shows/comedy/carrot-top/index.html
