name: Fix Fantasy seat guide
on:
  push:
    paths:
      - '.github/workflows/fix-fantasy-seat-guide.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add missing Atrium seat-guide script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('shows/adult/fantasy/index.html')
          text = p.read_text()
          script = '<script src="/assets/seat-layouts/atrium-showroom-luxor.js?v=4"></script>'
          if script not in text:
              needle = '<script src="/assets/show-canonical.js?v=2"></script></body>'
              if needle not in text:
                  raise SystemExit('Fantasy script insertion point not found')
              text = text.replace(needle, '<script src="/assets/show-canonical.js?v=2"></script>' + script + '</body>', 1)
              p.write_text(text)
          if 'data-seat-layout="atrium-showroom-luxor"' not in text:
              raise SystemExit('Fantasy Atrium seat-guide markup missing')
          print('Fantasy now loads the shared Atrium interactive seat-guide script.')
          PY
      - name: Run show-page checks
        shell: bash
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Vegas Sidekick Operations"
          git config user.email "operations@vegassidekick.com"
          git add shows/adult/fantasy/index.html
          if git diff --cached --quiet; then
            echo "No content change needed"
            exit 0
          fi
          git commit -m "Fix Fantasy interactive seating chart"
          git push origin main
