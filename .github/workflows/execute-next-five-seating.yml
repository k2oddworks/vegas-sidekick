name: Execute next five seating rebuilds
on:
  push:
    paths:
      - '.github/workflows/execute-next-five-seating.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run rebuild logic with corrected QA expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,textwrap
          src=Path('.github/workflows/rebuild-next-five-seating.yml').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\n\s+PY",src,re.S)
          assert len(blocks)>=2, len(blocks)
          build=textwrap.dedent(blocks[0])
          qa=textwrap.dedent(blocks[1]).replace("'magic-mike-live-theater-sahara':{'201-202'}", "'magic-mike-live-theater-sahara':{'sweet'}")
          exec(compile(build,'rebuild-five','exec'),{})
          exec(compile(qa,'qa-five','exec'),{})
          PY
      - name: Repository audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          if [ -f scripts/audit-content-link-hygiene.py ]; then python3 scripts/audit-content-link-hygiene.py; fi
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'Kris Kidd'
          git config user.email 'k2oddworks@gmail.com'
          git add assets/seat-layouts/room-map.js data/seat-layouts images shows
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild five more show seating charts'
            git push origin main
          fi
