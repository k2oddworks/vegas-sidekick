name: Normalize Marc Savard Variable Schedule

on:
  push:
    paths:
      - '.github/workflows/fix-marc-variable-schedule.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize master schedule data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('data/show-database.json')
          db=json.loads(p.read_text(encoding='utf-8'))
          found=False
          for show in db.get('shows',[]):
              if show.get('slug')=='marc-savard-comedy-hypnosis':
                  show['schedule_summary']='Times vary · Check live calendar'
                  sp=show.get('spotlight') or {}
                  sp['schedule_summary']='Times vary · Check live calendar'
                  sp['schedule_variable']=True
                  sp['schedule_days']={}
                  sp['schedule_raw']=[]
                  show['spotlight']=sp
                  found=True
                  break
          if not found:
              raise SystemExit('Marc Savard record not found')
          p.write_text(json.dumps(db,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-catalog-js-syntax.py
          git diff --check
      - name: Commit source-of-truth fix
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add data/show-database.json
          git commit -m 'Mark Marc Savard schedule as variable'
          git push origin HEAD:main

# trigger
