name: Update All Shows Casual Copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-all-shows-casual-copy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rewrite all-shows helper copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/category-v2.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "bottomTitle:'How to use the all-shows page',": "bottomTitle:'Don’t overthink the list',",
              "bottomCopy:'Use the category links to move from “everything in Vegas” to the canonical category page that fits your night. Starting price is useful for comparison, but the individual show page is where schedule, venue, age guidance and seating context belong.',": "bottomCopy:'Start with the kind of night you want — comedy, magic, Cirque, music, whatever sounds fun. The price on the card is just the starting number. Open a show page for the useful stuff: dates, venue, age guidance, seating advice and whether it fits your night.',",
              "take:'The fastest way to make a bad Vegas decision is to compare 40 unrelated shows at once. Pick the experience first. Once you are comparing similar nights, the price differences actually mean something.'": "take:'Don’t compare a magic show, a comedy club and a Cirque show like they’re the same thing. Pick the vibe first. Once you’re down to a few shows you’d actually choose between, then start looking at the price.'"
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected copy not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Check JavaScript
        run: node --check components/category-v2.js
      - name: Diff check
        run: git diff --check
      - name: Commit copy update
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/category-v2.js
          git commit -m "Make all-shows helper copy more conversational"
          git push origin main
