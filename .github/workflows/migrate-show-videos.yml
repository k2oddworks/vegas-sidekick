name: Migrate verified show videos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-show-videos.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Migrate verified trailers
        run: python3 scripts/migrate-show-videos.py
      - name: Run audits
        run: |
          python3 scripts/audit-show-videos.py
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-orphan-ui.py
          git diff --check
      - name: Commit migration
        run: |
          rm -f .github/workflows/migrate-show-videos.yml scripts/migrate-show-videos.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate verified show trailers to shared video component"
          git push origin main
