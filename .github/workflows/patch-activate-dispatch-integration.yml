name: Patch Activate Dispatch integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-activate-dispatch-integration.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-activate-dispatch-integration.py
      - name: Validate integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('news/activate-town-square-opens-october-3/index.html')
          s=p.read_text(encoding='utf-8')
          required=[
            '<div id="vs-header"></div>',
            '<div id="vs-footer"></div>',
            '/components/header.js?v=13',
            '/components/footer.js?v=10',
            'id="dispatchEmailForm"',
            'brevo-subscribe.vegassidekickcom.workers.dev',
            '/images/kris-kidd-avatar.jpg',
          ]
          for token in required: assert token in s, f'missing {token}'
          assert '<strong>Update:</strong>' not in s
          assert 'We’ve updated the article' not in s
          assert 'Updated September 5, 2026' not in s
          for b in re.findall(r'<script type="application/ld\+json">(.*?)</script>',s,re.S): json.loads(b)
          idx=Path('news/index.html').read_text(encoding='utf-8')
          assert 'featured-author-with-avatar' in idx and '/images/kris-kidd-avatar.jpg' in idx
          assert Path('images/kris-kidd-avatar.jpg').exists()
          print('Activate integration checks passed.')
          PY
      - name: Commit patch
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/activate-town-square-opens-october-3/index.html news/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore Dispatch chrome and add newsletter signup"
          git push origin main
