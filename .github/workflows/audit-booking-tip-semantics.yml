name: Audit Booking Tip Semantics

on:
  push:
    paths:
      - '.github/workflows/audit-booking-tip-semantics.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan active show Booking tip cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from html import unescape
          from collections import Counter

          CLOSED={'shows/cirque/mad-apple/index.html','shows/magic/david-goldrake/index.html'}
          tips=[]
          for p in sorted(Path('shows').glob('*/*/index.html')):
              rel=p.as_posix()
              if rel in CLOSED:
                  continue
              s=p.read_text(encoding='utf-8', errors='ignore')
              for m in re.finditer(r'<div class="[^"]*decision-card[^"]*"[^>]*>\s*<h3>Booking tip</h3>(.*?)</div>', s, re.I|re.S):
                  txt=re.sub(r'<[^>]+>', ' ', m.group(1))
                  txt=unescape(re.sub(r'\s+', ' ', txt)).strip()
                  tips.append((rel,txt))

          counts=Counter(txt for _,txt in tips)
          print(f'BOOKING_TIP_CARDS={len(tips)}')
          print(f'UNIQUE_TIPS={len(counts)}')
          print('\n--- REPEATED TIPS ---')
          for txt,count in counts.most_common():
              if count > 1:
                  print(f'{count}x :: {txt}')
          print('\n--- ALL TIPS ---')
          for rel,txt in tips:
              print(f'{rel} :: {txt}')
          PY
