name: Final active show catalog audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-show-catalog-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate active show media audit
        run: python3 scripts/audit-show-media.py
      - name: Validate event schema except known closed archive
        shell: bash
        run: |
          set +e
          python3 scripts/audit-event-schema.py > /tmp/audit.txt 2>&1
          code=$?
          cat /tmp/audit.txt
          if [ $code -eq 0 ]; then exit 0; fi
          issues=$(grep -E '^shows/.+:' /tmp/audit.txt || true)
          if [ "$issues" = "shows/cirque/mad-apple/index.html: NO Event/EventSeries JSON-LD found" ]; then exit 0; fi
          exit $code
      - name: Commit refreshed audit
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/show-media-audit-2026-09-07.md
          if git diff --cached --quiet; then echo 'Audit unchanged'; else git commit -m "Refresh active show media audit after canonical rebuild" && git push origin HEAD:main; fi