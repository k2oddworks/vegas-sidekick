name: One-off standalone show runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-show-runtime.yml'

permissions:
  contents: write

jobs:
  patch-standalone-shows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add canonical runtime to standalone show pages
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('shows/adult/zombie-burlesque/index.html'),
              Path('shows/comedy/tape-face/index.html'),
              Path('shows/family/tournament-of-kings/index.html'),
          ]
          tag = '<script src="/components/show-canonical-runtime.js?v=2" data-vs-show-runtime="1"></script>'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if 'data-vs-show-runtime' in text:
                  continue
              if '</body>' not in text:
                  raise RuntimeError(f'Missing </body> in {path}')
              text = text.replace('</body>', tag + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/one-off-show-runtime.yml
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add shows/adult/zombie-burlesque/index.html shows/comedy/tape-face/index.html shows/family/tournament-of-kings/index.html .github/workflows/one-off-show-runtime.yml
          git commit -m "Wire canonical runtime into standalone show pages"
          git push origin HEAD:main
