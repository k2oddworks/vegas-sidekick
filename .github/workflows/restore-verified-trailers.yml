name: Restore verified show trailers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-verified-trailers.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore verified trailer inventory
        run: python3 scripts/restore-verified-trailers.py
      - name: Run audits
        run: |
          python3 scripts/audit-show-videos.py
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-orphan-ui.py
          git diff --check
      - name: Commit restored trailers
        run: |
          rm -f .github/workflows/restore-verified-trailers.yml scripts/restore-verified-trailers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore verified show trailers with shared video component"
          git push origin main
