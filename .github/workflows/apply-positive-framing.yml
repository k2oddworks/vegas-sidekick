name: Apply Positive Framing Cleanup

on:
  push:
    paths:
      - 'scripts/apply-positive-framing.py'
      - '.github/workflows/apply-positive-framing.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply positive framing cleanup
        run: python3 scripts/apply-positive-framing.py

      - name: Validate Event schema
        run: python3 scripts/audit-event-schema.py

      - name: Validate ticket CTA treatment
        run: python3 scripts/audit-ticket-cta-color.py

      - name: Validate catalog JavaScript
        run: python3 scripts/audit-catalog-js-syntax.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit cleaned copy
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add -A
          git commit -m 'Replace downside framing with good-to-know guidance'
          git push origin HEAD:main
