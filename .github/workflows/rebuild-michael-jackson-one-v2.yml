name: Rebuild Michael Jackson ONE benchmark v2
on:
  push:
    paths:
      - '.github/workflows/rebuild-michael-jackson-one-v2.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python3 -m pip install beautifulsoup4
      - name: Reuse rebuild logic and finish price sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,textwrap
          t=Path('.github/workflows/rebuild-michael-jackson-one.yml').read_text()
          m=re.search(r"- name: Rebuild page and room assets\n\s+run: \|\n\s+python3 - <<'PY'\n(.*?)\n\s+PY\n\s+- name: Run required audits and QA",t,re.S)
          assert m, 'could not extract Michael Jackson ONE rebuild logic'
          exec(compile(textwrap.dedent(m.group(1)),'<mj-one-rebuild>','exec'),{})

          # Finish all remaining denormalized MJ ONE price references found by QA.
          paths=[
            'shows/deals/index.html','shows/cirque/ka/index.html','shows/cirque/o/index.html','shows/music/mj-live/index.html',
            'guides/best-shows-for-first-timers/index.html','guides/best-shows-for-couples/index.html','guides/best-shows-for-families/index.html',
            'preview/guide-first-timers-concept/index.html'
          ]
          for fp in paths:
            p=Path(fp)
            if not p.exists(): continue
            s=p.read_text()
            def fix(m):
              x=m.group(0)
              x=x.replace('$115','$163').replace('"price": 115','"price": 163').replace('"price":115','"price":163').replace('price: 115','price: 163').replace('price:115','price:163')
              x=x.replace(' — save $48','').replace('Save $48','').replace('save $48','')
              return x
            s=re.sub(r'(?s)(.{0,1100}(?:michael-jackson-one|Michael Jackson ONE).{0,1100})',fix,s)
            p.write_text(s)
          PY
      - name: Run required audits and benchmark QA
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-content-link-hygiene.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,re
          p=Path('shows/cirque/michael-jackson-one/index.html').read_text(); soup=BeautifulSoup(p,'html.parser')
          d=json.loads(Path('data/show-database.json').read_text()); r=next(x for x in d['records'] if x['slug']=='michael-jackson-one')
          assert r['our_price']==163 and r['regular_price'] is None and r['runtime_minutes']==90 and r['status']=='active'
          assert r['age_summary']=='5+' and r['schedule_summary']=='Mon, Thu, Fri, Sat, Sun · 7 PM & 9:30 PM'
          assert r['ticket_url']=='https://spotlight.vegas/shows/cirque-du-soleil/michael-jackson-one/ref/vegassidekick'
          assert len(soup.select('.facts .fact'))==4 and 'Typical start' not in p
          assert len(soup.select('.ticker-set'))==2
          assert soup.select_one('[data-seat-layout="mandalay-bay-theatre"]')
          assert '/assets/seat-layouts/mandalay-bay-theatre.css?v=1' in p and '/assets/seat-layouts/mandalay-bay-theatre.js?v=1' in p
          assert '/images/mandalay-bay-theatre-seating-chart.svg' in p
          svg=Path('images/mandalay-bay-theatre-seating-chart.svg').read_text(); assert 'width="1200" height="1000" viewBox="0 0 120 100"' in svg
          layout=json.loads(Path('data/seat-layouts/mandalay-bay-theatre.json').read_text())
          assert {z['id'] for z in layout['zones'] if z['our_pick']}=={'101','102','103','202','203','204'}
          assert {z['id'] for z in layout['zones']}=={'101','102','103','201','202','203','204','205'}
          cards=soup.select('#showtimes .schedule .day'); assert len(cards)==7 and len(soup.select('#showtimes .schedule .day.dark'))==2
          active=[c for c in cards if 'dark' not in (c.get('class') or [])]; assert len(active)==5 and all(c.find('a',href=r['ticket_url']) for c in active)
          assert len(soup.select('#photos .gallery button'))==4
          assert len(soup.select('.related-card'))>=3 and all(c.find('img') for c in soup.select('.related-card')[:3])
          assert p.count('Show info confirmed September 2026')==1
          assert 'mobile-bar' in p and 'Think Twice' not in p and 'tradeoff' not in p.lower() and 'The downside' not in p
          assert 'Tickets start at $163. Other price points may be available.' in p
          for f in ['images/mj-one-hero.jpg','images/mj-one-show-2.jpg','images/mj-one-show-3.jpg','images/mandalay-bay-theatre-seating-chart.svg','assets/seat-layouts/mandalay-bay-theatre.css','assets/seat-layouts/mandalay-bay-theatre.js']:
              assert Path(f).exists(), f
          bad=[]
          for f in Path('.').rglob('*'):
            if f.suffix.lower() not in {'.html','.js','.json'} or '.git' in f.parts or 'docs' in f.parts: continue
            try:t=f.read_text()
            except:continue
            for m in re.finditer(r'(?is).{0,500}(?:michael-jackson-one|Michael Jackson ONE).{0,500}',t):
              if '$115' in m.group(0) or re.search(r'\bprice\s*[:=]\s*115\b',m.group(0)): bad.append(str(f)); break
          assert not bad, bad
          PY
      - name: Commit rebuild
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add -A
          git reset .github/workflows/rebuild-michael-jackson-one.yml .github/workflows/rebuild-michael-jackson-one-v2.yml
          git commit -m 'Rebuild Michael Jackson ONE to current benchmark'
          git push origin main
