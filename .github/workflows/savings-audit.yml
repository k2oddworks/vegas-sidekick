name: Vegas Sidekick Savings Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '20 14 * * 0'
  push:
    branches: [main]
    paths:
      - 'data/show-database.json'
      - 'shows/**'
      - 'assets/show-savings.css'
      - 'assets/catalog-savings.css'
      - 'assets/catalog-savings.js'
      - 'scripts/audit-savings-system.py'
      - 'scripts/audit-final-savings-banners.py'
      - 'scripts/audit-price-reconciliation.py'
      - 'scripts/audit-savings-freshness.py'
      - 'scripts/audit-category-catalog-prices.py'

permissions:
  contents: read

jobs:
  savings-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit final purchase savings banners
        run: python3 scripts/audit-final-savings-banners.py
      - name: Audit verified deal listings and price reconciliation
        run: python3 scripts/audit-price-reconciliation.py
      - name: Audit category starting-price parity
        run: python3 scripts/audit-category-catalog-prices.py
      - name: Check savings JavaScript syntax
        run: node --check assets/catalog-savings.js
      - name: Audit savings verification freshness
        run: python3 scripts/audit-savings-freshness.py
      - name: Audit show savings calculations and customer-facing surfaces
        run: python3 scripts/audit-savings-system.py
