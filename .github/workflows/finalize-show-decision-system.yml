name: Finalize Show Decision Card System

on:
  push:
    branches: [fix/show-decision-cards]
    paths:
      - 'scripts/finalize-show-decision-system.py'
      - '.github/workflows/finalize-show-decision-system.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/show-decision-cards
      - name: Finalize system
        run: python3 scripts/finalize-show-decision-system.py
      - name: Validate decision copy and core site
        run: |
          python3 scripts/audit-show-decision-copy.py
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-content-link-hygiene.py
          python3 scripts/audit-internal-links.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
      - name: Commit permanent non-workflow changes
        run: |
          git checkout -- docs/internal-link-audit.md || true
          git checkout -- .github/workflows/operations-audits.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/canonicalize-show-pages.py VS_CHAT_CONTEXT.md SHOW-BUILDER-PROMPT.md
          if ! git diff --cached --quiet; then
            git commit -m "Standardize show decision-card system"
            git push origin HEAD:fix/show-decision-cards
          fi
