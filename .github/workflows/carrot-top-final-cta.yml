name: Carrot Top CTA update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/carrot-top-final-cta.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final CTA redesign
        run: python3 scripts/update-carrot-final-cta.py
      - name: Validate structured data
        run: python3 scripts/audit-event-schema.py
      - name: Commit production page
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add shows/comedy/carrot-top/index.html
          git commit -m "Reimagine Carrot Top final CTA"
          git push origin main
