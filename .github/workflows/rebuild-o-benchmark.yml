name: Rebuild O show page
on:
  push:
    paths: ['.github/workflows/rebuild-o-benchmark.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Write O benchmark files
