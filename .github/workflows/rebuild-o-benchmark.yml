          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(blob)),mode='r:gz') as tf: tf.extractall('.')
          PY2
          python3 scripts/generate-o-theatre-seat-chart.py
      - name: Refresh O source data
        shell: bash
        run: |
          python3 - <<'PY2'
          import json,re
          from pathlib import Path
          p=Path('data/show-database.json'); db=json.loads(p.read_text())
          rec=next((r for r in db.get('records',[]) if r.get('slug')=='o'),None)
          if not rec: raise SystemExit('O record not found')
          exp={'status':'active','our_price':156,'runtime_minutes':90,'ticket_url':'https://spotlight.vegas/shows/cirque-du-soleil/o/ref/vegassidekick'}
          for k,v in exp.items():
              if rec.get(k)!=v: raise SystemExit(f'Unexpected O {k}: {rec.get(k)!r} != {v!r}')
          rec.update(verified_on='2026-09-09',freshness_label='September 2026',venue='O Theatre – Bellagio',age_summary='5+',schedule_summary='Wed, Thu, Fri, Sat, Sun · 6:30 PM & 9 PM')
          spot=rec.setdefault('spotlight',{})
          spot.update(location='O Theatre – Bellagio',our_price=156,regular_price=179,runtime_minutes=90,age_rule='Everyone must be 5 years of age or older to attend the event.',schedule_days={d:['6:30 PM','9 PM'] for d in ['Wednesday','Thursday','Friday','Saturday','Sunday']},schedule_summary='Wed, Thu, Fri, Sat, Sun · 6:30 PM & 9 PM',schedule_variable=False,schedule_raw=[f'{d} - 6:30pm & 9:00pm' for d in ['Wednesday','Thursday','Friday','Saturday','Sunday']],spotlight_url='https://spotlight.vegas/shows/cirque-du-soleil/o/',affiliate_url='https://spotlight.vegas/shows/cirque-du-soleil/o/ref/vegassidekick',age_label='5+')
          note='Schedule reverified 2026-09-09 against Spotlight and Bellagio: Wednesday–Sunday at 6:30 PM and 9 PM. No variable-schedule override applies.'
          notes=(rec.get('notes') or '').strip(); rec['notes']=notes if note in notes else (notes+' '+note).strip()
          db['updated_on']='2026-09-09'; p.write_text(json.dumps(db,ensure_ascii=False,indent=2)+'\n')
          s=Path('sitemap.xml'); txt=s.read_text(); pat=r'(<loc>https://vegassidekick\.com/shows/cirque/o/</loc>\s*<lastmod>)([^<]+)(</lastmod>)'; out,n=re.subn(pat,r'\g<1>2026-09-09\g<3>',txt,count=1)
          if not n: raise SystemExit('O sitemap entry not found')
          s.write_text(out)
          PY2
      - name: Regression checks and audits
        shell: bash
        run: |
          node --check assets/seat-layouts/o-theatre-bellagio.js
          python3 - <<'PY2'
          import json
          from pathlib import Path
          from bs4 import BeautifulSoup
          page=Path('shows/cirque/o/index.html').read_text()
          for x in ['Tickets start at $156. Other price points may be available.','data-seat-layout="o-theatre-bellagio"','/images/o-theatre-bellagio-seating-chart.svg','/assets/seat-layouts/o-theatre-bellagio.js?v=1','Sections 201–205','Show info confirmed September 2026','>Start times<']:
              if x not in page: raise SystemExit('Missing O marker: '+x)
          for x in ['Typical start','Typical weekly','tradeoff','Think Twice','Think twice','Downside','Honest Downside','Last updated September','Your date and seat determine the final total']:
              if x in page: raise SystemExit('Banned/stale O copy: '+x)
          if page.count('class="ticker-set"')!=2: raise SystemExit('Ticker duplication wrong')
          if page.count('Show info confirmed September 2026')!=1: raise SystemExit('Freshness duplication wrong')
          soup=BeautifulSoup(page,'html.parser'); blocks=[json.loads(s.string or s.get_text()) for s in soup.find_all('script',attrs={'type':'application/ld+json'})]
          ev=next(x for x in blocks if x.get('@type')=='EventSeries')
          if ev['offers']['price']!=156 or not isinstance(ev['offers']['price'],(int,float)): raise SystemExit('Bad price schema')
          if ev['offers']['url']!='https://spotlight.vegas/shows/cirque-du-soleil/o/ref/vegassidekick': raise SystemExit('Bad affiliate')
          sched=ev.get('eventSchedule') or []
          if len(sched)!=2 or {x.get('startTime') for x in sched}!={'18:30','21:00'}: raise SystemExit('Schedule schema drift')
          faq=next(x for x in blocks if x.get('@type')=='FAQPage'); vis=[(d.find('summary').get_text(' ',strip=True),d.find('p').get_text(' ',strip=True)) for d in soup.select('#faq details')]; struct=[(x['name'],x['acceptedAnswer']['text']) for x in faq['mainEntity']]
          if vis!=struct: raise SystemExit('FAQ schema mismatch')
          layout=json.loads(Path('data/seat-layouts/o-theatre-bellagio.json').read_text()); picks={s['id'] for s in layout['sections'] if s.get('our_pick')}
          if picks!={'201','202','203','204','205'}: raise SystemExit(f'Wrong picks: {picks}')
          svg=Path('images/o-theatre-bellagio-seating-chart.svg').read_text()
          if 'width="1200"' not in svg or 'height="1440"' not in svg: raise SystemExit('SVG dimensions missing')
          db=json.loads(Path('data/show-database.json').read_text()); rec=next(r for r in db['records'] if r['slug']=='o')
          if rec['spotlight'].get('schedule_variable') is not False: raise SystemExit('O variable state wrong')
          print('O regression checks passed')
          PY2
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-content-link-hygiene.py
          git diff --check
      - name: Commit audited rebuild
        shell: bash
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git rm .github/workflows/rebuild-o-benchmark.yml
          git add shows/cirque/o/index.html data/show-database.json sitemap.xml data/seat-layouts/o-theatre-bellagio.json assets/seat-layouts/o-theatre-bellagio.css assets/seat-layouts/o-theatre-bellagio.js images/o-theatre-bellagio-seating-chart.svg scripts/generate-o-theatre-seat-chart.py
          git diff --cached --check
          git commit -m 'Rebuild O show page to current benchmark'
          git push origin main
