name: Barry Manilow 2027 Polish
on:
  push:
    paths:
      - scripts/polish-barry-manilow-2027.py
      - .github/workflows/polish-barry-manilow-2027.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply polish
        run: python3 scripts/polish-barry-manilow-2027.py
      - name: Run show-page audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-orphan-ui.py
          git diff --check
      - name: Commit changes
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/barry-manilow-adds-2027-las-vegas-dates/index.html shows/music/barry-manilow/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish Barry Manilow mobile article and 2027 dates"
          git push origin main
