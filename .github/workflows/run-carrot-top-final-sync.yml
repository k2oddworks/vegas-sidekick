name: Run Carrot Top Final Sync

on:
  push:
    branches:
      - data/carrot-top-wired
    paths:
      - scripts/sync-carrot-top-from-data.py
      - .github/workflows/run-carrot-top-final-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/carrot-top-wired
      - run: python3 scripts/sync-carrot-top-from-data.py
      - run: python3 scripts/audit-event-schema.py
      - run: python3 scripts/audit-serp-metadata.py
      - run: python3 scripts/audit-content-link-hygiene.py
      - run: python3 scripts/audit-internal-links.py
      - name: Commit Carrot Top page only
        run: |
          git checkout -- docs/internal-link-audit.md || true
          if git diff --quiet -- shows/comedy/carrot-top/index.html; then
            echo "No Carrot Top page changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows/comedy/carrot-top/index.html
          git commit -m "Refine Carrot Top structured data sync output"
          git push origin HEAD:data/carrot-top-wired
