name: One-time image library migration
# Validation rerun: class-safe mobile bar audit

on:
  push:
    branches:
      - image-library-migration-20261004
    paths:
      - scripts/migrate-image-library.py
      - scripts/audit-image-library.py
      - .github/workflows/image-library-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: image-library-migration-20261004
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reorganize image library
        run: python3 scripts/migrate-image-library.py

      - name: Validate image library
        run: python3 scripts/audit-image-library.py

      - name: Run focused site audits
        run: |
          python3 scripts/audit-show-page-benchmark.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-content-link-hygiene.py
          python3 scripts/audit-catalog-js-syntax.py

      - name: Commit migration
        run: |
          git config user.name "Vegas Sidekick Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reorganize Vegas Sidekick image library"
          git push origin HEAD:image-library-migration-20261004
