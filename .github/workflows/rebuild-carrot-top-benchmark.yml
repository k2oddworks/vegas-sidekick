name: Rebuild Carrot Top to Current Benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-carrot-top-benchmark.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild Carrot Top page and Atrium seating system
        run: python3 .github/tmp/rebuild-carrot-top.py
      - name: Run show-page audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-content-link-hygiene.py
          node --check assets/seat-layouts/atrium-showroom-luxor.js
          git diff --check
      - name: Commit tested rebuild to main
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git rm -f .github/workflows/rebuild-carrot-top-benchmark.yml .github/tmp/rebuild-carrot-top.py
          git add shows/comedy/carrot-top/index.html \
                  data/show-database.json \
                  shows/comedy/index.html \
                  index.html \
                  venues/excalibur-luxor-mandalay-bay/index.html \
                  data/seat-layouts/atrium-showroom-luxor.json \
                  assets/seat-layouts/atrium-showroom-luxor.css \
                  assets/seat-layouts/atrium-showroom-luxor.js \
                  images/carrot-top-atrium-showroom-seating-chart.svg \
                  sitemap.xml
          git diff --cached --check
          git commit -m 'Rebuild Carrot Top to current benchmark'
          git push origin HEAD:main
