name: Fix Affiliate URL Normalization

on:
  push:
    branches:
      - data/vegas-the-show-record
    paths:
      - .github/workflows/fix-affiliate-normalization.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/vegas-the-show-record
      - name: Normalize optional trailing referral slashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/sync-show-from-data.py')
          s=p.read_text()
          old="pattern = rf'https://spotlight\\.vegas/shows/[^\"\\s<>]+/{slug}/ref/vegassidekick'"
          new="pattern = rf'https://spotlight\\.vegas/shows/[^\"\\s<>]+/{slug}/ref/vegassidekick/*'"
          if old not in s: raise SystemExit('affiliate pattern target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Re-sync VEGAS page
        run: python3 scripts/sync-show-from-data.py vegas-the-show
      - name: Assert one canonical trailing slash
        run: |
          ! grep -q 'vegassidekick//' shows/music/vegas-the-show/index.html
          grep -q 'https://spotlight.vegas/shows/production/vegas-the-show/ref/vegassidekick/' shows/music/vegas-the-show/index.html
      - name: Idempotence
        run: |
          cp shows/music/vegas-the-show/index.html /tmp/vegas.html
          python3 scripts/sync-show-from-data.py vegas-the-show
          diff -u /tmp/vegas.html shows/music/vegas-the-show/index.html
      - name: Carrot Top regression
        run: python3 scripts/sync-show-from-data.py carrot-top --dry-run
      - run: python3 scripts/audit-event-schema.py
      - run: python3 scripts/audit-serp-metadata.py
      - run: python3 scripts/audit-content-link-hygiene.py
      - run: python3 scripts/audit-internal-links.py
      - name: Commit durable changes
        run: |
          git checkout -- docs/internal-link-audit.md || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-show-from-data.py shows/music/vegas-the-show/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Normalize Spotlight referral URLs in show sync"
            git push origin HEAD:data/vegas-the-show-record
          fi
