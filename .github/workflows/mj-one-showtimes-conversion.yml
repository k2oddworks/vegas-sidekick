name: Michael Jackson ONE showtimes conversion
on:
  push:
    paths:
      - '.github/workflows/mj-one-showtimes-conversion.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python3 -m pip install beautifulsoup4
      - name: Rework showtimes section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('shows/cirque/michael-jackson-one/index.html')
          s=p.read_text()
          ticket='https://spotlight.vegas/shows/cirque-du-soleil/michael-jackson-one/ref/vegassidekick'
          section=f'''<section class="section mj-booking-section" id="showtimes"><div class="wrap"><div class="eyebrow">Pick your night</div><div class="mj-booking-shell"><div class="mj-booking-copy"><h2>Find your showtime</h2><p class="mj-booking-summary"><strong>Shows Mon, Thu–Sun</strong><span>Start times: 7 PM &amp; 9:30 PM</span></p></div><div class="mj-day-picker" role="tablist" aria-label="Choose a show day"><button class="mj-day is-active" type="button" role="tab" aria-selected="true" data-day="Monday"><span>Mon</span></button><button class="mj-day is-dark" type="button" role="tab" aria-selected="false" disabled><span>Tue</span><small>Dark</small></button><button class="mj-day is-dark" type="button" role="tab" aria-selected="false" disabled><span>Wed</span><small>Dark</small></button><button class="mj-day" type="button" role="tab" aria-selected="false" data-day="Thursday"><span>Thu</span></button><button class="mj-day" type="button" role="tab" aria-selected="false" data-day="Friday"><span>Fri</span></button><button class="mj-day" type="button" role="tab" aria-selected="false" data-day="Saturday"><span>Sat</span></button><button class="mj-day" type="button" role="tab" aria-selected="false" data-day="Sunday"><span>Sun</span></button></div><div class="mj-time-panel" aria-live="polite"><h3><span id="mj-selected-day">Monday</span> showtimes</h3><div class="mj-time-grid"><a href="{ticket}" rel="noopener sponsored" target="_blank">7:00 PM</a><a href="{ticket}" rel="noopener sponsored" target="_blank">9:30 PM</a></div><a class="mj-primary-book vs-ticket-primary" href="{ticket}" rel="noopener sponsored" target="_blank">Get Tickets for <span id="mj-cta-day">Monday</span> →</a><a class="mj-all-dates" href="{ticket}" rel="noopener sponsored" target="_blank">View all dates &amp; times →</a></div><div class="mj-plan-ahead"><div class="mj-calendar-icon" aria-hidden="true">▦</div><div><strong>Planning ahead?</strong><p>You can book tickets weeks and months in advance.</p></div></div><div class="mj-booking-art" aria-hidden="true"><div class="mj-art-moon"></div><div class="mj-art-sphere"></div><div class="mj-art-strip"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div></div></section>'''
          s,n=re.subn(r'<section class="section" id="showtimes">.*?</section>',section,s,count=1,flags=re.S)
          assert n==1, 'showtimes section not replaced'
          css='''<style id="mj-showtimes-conversion">#showtimes.mj-booking-section{background:linear-gradient(180deg,#f8f4ff 0%,#f1e9ff 100%);overflow:hidden}#showtimes .wrap{max-width:980px}.mj-booking-shell{position:relative;border:1px solid #e6dcf5;border-radius:28px;padding:28px;background:rgba(255,255,255,.72);box-shadow:0 20px 55px rgba(64,31,94,.10);overflow:hidden}.mj-booking-copy{text-align:center}.mj-booking-copy h2{margin:.15rem 0 .5rem}.mj-booking-summary{display:flex;flex-direction:column;gap:4px;margin:0;color:#25133f}.mj-booking-summary span{color:#645a70}.mj-day-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:24px 0 18px}.mj-day{min-height:64px;border:1px solid #ded4ea;border-radius:14px;background:#fff;color:#24143b;font:800 .92rem/1 Inter,sans-serif;cursor:pointer}.mj-day span,.mj-day small{display:block}.mj-day small{margin-top:7px;color:#9b91a5;font-size:.68rem}.mj-day.is-active{background:linear-gradient(180deg,#7b35ea,#5d20c9);color:#fff;border-color:#6a26dc;box-shadow:0 8px 20px rgba(105,38,220,.22)}.mj-day.is-dark{background:#f3f0f5;color:#99919f;cursor:default}.mj-time-panel{max-width:650px;margin:0 auto;padding:24px;border:1px solid #e4d9ee;border-radius:22px;background:#fff;box-shadow:0 10px 30px rgba(68,31,95,.06)}.mj-time-panel h3{margin:0 0 15px;font-size:1.25rem}.mj-time-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mj-time-grid a{display:flex;align-items:center;justify-content:center;min-height:62px;border:2px solid #7a32e7;border-radius:14px;color:#6422cf;text-decoration:none;font-weight:900;background:#fff}.mj-primary-book,.mj-all-dates{display:flex;align-items:center;justify-content:center;min-height:60px;border-radius:14px;margin-top:14px;text-decoration:none;font-weight:900}.mj-primary-book{background:#FFB000!important;color:#171225!important;box-shadow:0 10px 24px rgba(255,176,0,.28)}.mj-all-dates{border:2px solid #6c2bd9;background:#fff;color:#6422cf}.mj-plan-ahead{display:flex;align-items:center;gap:14px;max-width:650px;margin:18px auto 0;padding:16px 18px;border:1px solid #ddcff1;border-radius:18px;background:rgba(255,255,255,.62)}.mj-plan-ahead p{margin:2px 0 0;color:#605668}.mj-calendar-icon{font-size:1.7rem;color:#6c2bd9}.mj-booking-art{position:relative;height:155px;margin:24px -28px -28px;background:linear-gradient(180deg,#ecdfff 0%,#d6bdfb 38%,#28133f 100%);overflow:hidden}.mj-art-moon{position:absolute;width:110px;height:110px;border-radius:50%;right:12%;top:16px;background:radial-gradient(circle at 35% 30%,#fff8d9,#ffcf59 56%,#f2a700 100%);box-shadow:0 0 35px rgba(255,190,35,.38)}.mj-art-sphere{position:absolute;width:98px;height:98px;border-radius:50%;right:14%;bottom:-25px;background:radial-gradient(circle at 45% 35%,#ffe88c,#c89100 63%,#705000 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 0 24px rgba(255,194,0,.28)}.mj-art-strip{position:absolute;left:0;right:0;bottom:0;height:78px;display:flex;align-items:flex-end;gap:9px;padding:0 22px}.mj-art-strip i{display:block;flex:1;background:linear-gradient(180deg,#56307a,#130b1f);border-radius:4px 4px 0 0;box-shadow:inset 0 5px 0 rgba(255,80,165,.35)}.mj-art-strip i:nth-child(1){height:42px}.mj-art-strip i:nth-child(2){height:65px}.mj-art-strip i:nth-child(3){height:52px}.mj-art-strip i:nth-child(4){height:75px}.mj-art-strip i:nth-child(5){height:48px}.mj-art-strip i:nth-child(6){height:68px}.mj-art-strip i:nth-child(7){height:56px}.mj-art-strip i:nth-child(8){height:72px}@media(max-width:700px){#showtimes.mj-booking-section{padding-top:50px;padding-bottom:50px}.mj-booking-shell{padding:22px 16px 0;border-radius:22px}.mj-day-picker{grid-template-columns:repeat(7,minmax(44px,1fr));gap:5px;overflow-x:auto;padding-bottom:4px}.mj-day{min-height:58px;font-size:.8rem;border-radius:12px}.mj-time-panel{padding:18px}.mj-time-grid a{min-height:56px;font-size:.95rem}.mj-plan-ahead{align-items:flex-start}.mj-booking-art{margin:22px -16px 0;height:130px}.mj-primary-book,.mj-all-dates{min-height:58px}}</style>'''
          s=s.replace('</head>',css+'</head>',1)
          js='''<script id="mj-showtimes-js">(()=>{const days=[...document.querySelectorAll('.mj-day[data-day]')],label=document.getElementById('mj-selected-day'),cta=document.getElementById('mj-cta-day');days.forEach(btn=>btn.addEventListener('click',()=>{days.forEach(b=>{b.classList.toggle('is-active',b===btn);b.setAttribute('aria-selected',b===btn?'true':'false')});label.textContent=btn.dataset.day;cta.textContent=btn.dataset.day}))})();</script>'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Run audits and QA
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-content-link-hygiene.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          p=Path('shows/cirque/michael-jackson-one/index.html').read_text(); s=BeautifulSoup(p,'html.parser')
          sec=s.select_one('#showtimes.mj-booking-section'); assert sec
          assert len(sec.select('.mj-day[data-day]'))==5
          assert len(sec.select('.mj-day.is-dark'))==2
          assert len(sec.select('.mj-time-grid a'))==2
          assert sec.select_one('.mj-primary-book') and sec.select_one('.mj-all-dates')
          assert 'weeks and months in advance' in sec.get_text(' ',strip=True)
          assert 'mj-booking-art' in p and 'Same Vegas' not in sec.get_text(' ',strip=True)
          assert '#FFB000' in p
          assert 'Typical start' not in p
          PY
      - name: Commit changes
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add shows/cirque/michael-jackson-one/index.html
          git commit -m 'Rework Michael Jackson ONE showtimes conversion section'
          git push origin main
