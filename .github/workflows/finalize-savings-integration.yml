name: Finalize Savings Documentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-savings-integration.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Document savings system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ctx=Path('VS_CHAT_CONTEXT.md'); t=ctx.read_text()
          marker='## Savings / Discount System — September 2026'
          if marker not in t:
              t += '''\n\n---\n\n## Savings / Discount System — September 2026\n\nSavings are a first-class Vegas Sidekick conversion feature, but only when they are based on a verified regular/list price.\n\n### Rules\n\n- `data/show-database.json` owns `our_price` and `regular_price`.\n- `savings_amount`, `savings_percent`, and `is_deal` are **derived fields**. Never hand-enter the savings math.\n- A show qualifies for customer-facing deal treatment only when `regular_price > our_price` by at least **$5**.\n- If the difference is under $5, the regular price is missing, or the regular price is not trustworthy, show the normal ticket price without a deal badge.\n- Warm Amber is the customer-facing value/deal language while pink remains brand/accent.\n- Preferred presentation: current price + struck-through regular price + **Save $X**. Dollar savings lead; percentage savings is secondary.\n- Do not use countdowns, fake urgency, inflated comparison prices, or claims of exclusivity unless explicitly verified.\n- Current discounted inventory lives at `/shows/deals/`.\n- Catalogs can show deal badges and sort by **Biggest Savings**; `/shows/` also has a Deals filter.\n- The Show Database UI calculates Savings $ / Savings % automatically as prices are edited.\n- `scripts/audit-savings-system.py` is the permanent consistency guard.\n- `.github/workflows/savings-audit.yml` runs the recurring savings safeguard.\n\nThe September 8 implementation found 54 of 71 active shows meeting the $5 threshold after the Spotlight reconciliation. Treat that count as time-sensitive; the rule and calculation are permanent, the count is not.\n'''
              ctx.write_text(t)
          builder=Path('SHOW-BUILDER-PROMPT.md'); t=builder.read_text()
          marker='## Ticket Savings / Deal Treatment'
          if marker not in t:
              t += '''\n\n---\n\n## Ticket Savings / Deal Treatment\n\nWhen the Show Database contains both a verified Vegas Sidekick price and a verified regular/list price, calculate savings rather than writing a discount manually.\n\n- Minimum customer-facing deal threshold: **$5**.\n- `savings_amount = regular_price - our_price`.\n- `savings_percent = round(savings_amount / regular_price * 100)`.\n- Lead with **Save $X**; percentage savings is secondary.\n- Show the regular price struck through only when the comparison is current and defensible.\n- If no valid regular price exists, do not imply a discount.\n- Never use fake scarcity, countdowns, or “limited time” language unless independently verified.\n- Warm Amber (`#FFB000`) is the sitewide visual language for primary ticket actions and deal/value emphasis. Pink remains brand/accent.\n- Reuse `assets/show-savings.css` and the existing savings system instead of creating page-specific deal styling.\n- Run `python3 scripts/audit-savings-system.py` when show pricing or savings surfaces change.\n'''
              builder.write_text(t)
          PY
      - name: Validate savings audit
        run: python3 scripts/audit-savings-system.py
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VS_CHAT_CONTEXT.md SHOW-BUILDER-PROMPT.md
          if ! git diff --cached --quiet; then
            git commit -m "Document Vegas Sidekick savings system"
            git push
          fi