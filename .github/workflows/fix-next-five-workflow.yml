name: Fix next five seating workflow
on:
  push:
    paths:
      - '.github/workflows/fix-next-five-workflow.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/rebuild-next-five-seating.yml')
          s=p.read_text().replace("'magic-mike-live-theater-sahara':{'201-202'}", "'magic-mike-live-theater-sahara':{'sweet'}")
          p.write_text(s)
          PY
          git config user.name 'Kris Kidd'
          git config user.email 'k2oddworks@gmail.com'
          git add .github/workflows/rebuild-next-five-seating.yml
          git commit -m 'Fix next five seating QA'
          git push origin main
