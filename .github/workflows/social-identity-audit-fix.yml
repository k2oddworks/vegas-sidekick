name: Social Share Identity Fix
on:
  push:
    branches: [main]
    paths: [scripts/social-identity-audit-fix.py]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/social-identity-audit-fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/index.html shows/*/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Standardize social share identity"
            git push origin main
          fi
