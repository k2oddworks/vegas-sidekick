name: Run Mobile Hero Frame Soften

on:
  push:
    branches: [ux/mobile-hero-frame-soften]
    paths: [.github/workflows/run-mobile-hero-frame-soften.yml]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/mobile-hero-frame-soften
          fetch-depth: 0

      - name: Soften safe mobile hero framing
        run: |
          cat >> assets/show-canonical.css <<'CSS'

          /* Mobile safe-fit refinement v2: less card-like, more integrated hero artwork. */
          @media(max-width:800px){
            .hero-media[data-mobile-fit="safe"]{
              height:404px!important;
              min-height:404px!important;
              padding:14px 10px 17px;
              background:linear-gradient(180deg,rgba(70,28,101,.62),rgba(31,8,55,.86));
              box-shadow:none;
            }
            .hero-media[data-mobile-fit="safe"]::before{
              inset:-10px;
              filter:blur(18px) brightness(.42) saturate(.95);
              opacity:.94;
            }
            .hero-media[data-mobile-fit="safe"] img{
              border-radius:8px;
              box-shadow:0 0 0 1px rgba(255,255,255,.07),0 7px 18px rgba(0,0,0,.18);
              transform:translateY(1px);
            }
            .hero-media[data-mobile-fit="safe"]::after{
              background:linear-gradient(0deg,#2c0b4e 0,rgba(44,11,78,.24) 8%,transparent 22%);
            }
          }
          CSS

      - name: Validate hero and site audits
        run: |
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-serp-metadata.py
          python3 scripts/audit-content-link-hygiene.py
          python3 scripts/audit-internal-links.py

      - name: Commit refinement
        run: |
          git checkout -- docs/internal-link-audit.md || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/show-canonical.css
          if ! git diff --cached --quiet; then
            git commit -m "Soften mobile hero frame treatment"
            git push origin HEAD:ux/mobile-hero-frame-soften
          fi
