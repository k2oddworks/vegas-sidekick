name: Optional Think Twice Cleanup
on:
  push:
    branches: [fix/optional-think-twice]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/optional-think-twice
      - name: Remove generic Think twice cards
        run: python3 scripts/make-think-twice-optional.py
      - name: Validate
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-content-link-hygiene.py
          python3 scripts/audit-internal-links.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-show-decision-copy.py
      - name: Commit
        run: |
          git checkout -- docs/internal-link-audit.md || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows/*/*/index.html scripts/canonicalize-show-pages.py SHOW-BUILDER-PROMPT.md VS_CHAT_CONTEXT.md
          if ! git diff --cached --quiet; then
            git commit -m "Make Think twice optional on show pages"
            git push origin HEAD:fix/optional-think-twice
          fi
