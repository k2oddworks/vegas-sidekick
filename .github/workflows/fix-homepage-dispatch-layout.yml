name: Fix homepage Dispatch layout
on:
  push:
    paths:
      - scripts/fix-homepage-dispatch-layout.py
      - .github/workflows/fix-homepage-dispatch-layout.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 scripts/fix-homepage-dispatch-layout.py
      - run: git diff --check
      - name: Commit layout fix
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html news/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix homepage Dispatch placement and sizing"
          git push origin main
