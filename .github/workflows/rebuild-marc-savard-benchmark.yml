name: Rebuild Marc Savard to Current Benchmark

on:
  push:
    paths:
      - '.github/workflows/rebuild-marc-savard-benchmark.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Marc Savard page and data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path('.')
          PAGE = ROOT / 'shows/comedy/marc-savard-comedy-hypnosis/index.html'
          DB = ROOT / 'data/show-database.json'
          CAT = ROOT / 'shows/comedy/index.html'
          RECONCILE = ROOT / 'scripts/reconcile-spotlight.py'
          SITEMAP = ROOT / 'sitemap.xml'
          OLD_WORKFLOW = ROOT / '.github/workflows/fix-marc-variable-schedule.yml'

          TICKET = 'https://spotlight.vegas/shows/comedy/marc-savard-comedy-hypnosis/ref/vegassidekick'
          HERO = '/images/marc-savard-comedy-hypnosis-hero.jpg'
          DATE = '2026-09-09'

          def sub_once(text, pattern, replacement, label, flags=re.S):
              updated, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')
              return updated

          # ---- Marc page: preserve verified facts, rebuild the current benchmark system. ----
          text = PAGE.read_text(encoding='utf-8')

          replacements = {
              '<title>Marc Savard Comedy Hypnosis Las Vegas Tickets from $28 | Showtimes</title>': '<title>Marc Savard Comedy Hypnosis Las Vegas Tickets from $28</title>',
              '<meta content="Marc Savard Comedy Hypnosis is a comedy hypnosis show in Las Vegas. Tickets from $28. See showtimes, seats and what kind of comedy night to expect." name="description"/>': '<meta content="Marc Savard Comedy Hypnosis is a 70-minute all-ages comedy hypnosis show at Nathan Burton Theater in Las Vegas. Tickets from $28. Compare seats and dates." name="description"/>',
              '<meta content="70-minute unscripted comedy hypnosis show at the Nathan Burton Theater inside Showcase Mall. Watch or volunteer — all ages welcome." property="og:description"/>': '<meta content="70-minute comedy hypnosis at Nathan Burton Theater in Showcase Mall. Volunteering is optional. Tickets from $28 and all ages are welcome." property="og:description"/>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected metadata snippet: {old[:80]}')
              text = text.replace(old, new, 1)

          event = {
              '@context': 'https://schema.org',
              '@type': 'EventSeries',
              'name': 'Marc Savard Comedy Hypnosis',
              'description': '70-minute comedy hypnosis show at the Nathan Burton Theater inside Showcase Mall. Hypnosis volunteers opt in; all ages welcome.',
              'image': 'https://vegassidekick.com/images/marc-savard-comedy-hypnosis-hero.jpg',
              'url': 'https://vegassidekick.com/shows/comedy/marc-savard-comedy-hypnosis/',
              'eventStatus': 'https://schema.org/EventScheduled',
              'organizer': {
                  '@type': 'Organization',
                  'name': 'Nathan Burton Theater at Showcase Mall',
                  'url': 'https://vegassidekick.com/shows/comedy/marc-savard-comedy-hypnosis/'
              },
              'location': {
                  '@type': 'Place',
                  'name': 'Nathan Burton Theater - Showcase Mall',
                  'address': {
                      '@type': 'PostalAddress',
                      'streetAddress': '3771 S Las Vegas Blvd, Suite 160',
                      'addressLocality': 'Las Vegas',
                      'addressRegion': 'NV',
                      'postalCode': '89109',
                      'addressCountry': 'US'
                  }
              },
              'performer': {'@type': 'Person', 'name': 'Marc Savard'},
              'offers': {
                  '@type': 'Offer',
                  'url': TICKET,
                  'price': 28,
                  'priceCurrency': 'USD',
                  'availability': 'https://schema.org/InStock',
                  'priceValidUntil': '2027-12-31',
                  'validFrom': '2026-01-01'
              },
              'eventAttendanceMode': 'https://schema.org/OfflineEventAttendanceMode',
              '@id': 'https://vegassidekick.com/shows/comedy/marc-savard-comedy-hypnosis/#event',
              'duration': 'PT70M',
              'audience': {
                  '@type': 'Audience',
                  'audienceType': 'No age restrictions. Lap sitting is allowed for children ages 2 and under.'
              }
          }

          faqs = [
              ('Do I have to volunteer to be hypnotized?', "Not at all. Volunteering is completely optional. Marc will invite anyone who's interested to raise their hand at the start of the show — that's the extent of any pressure. You decide whether to participate. Plenty of people come specifically to watch, and they have just as good a night as anyone who steps on stage."),
              ('What if I volunteer but change my mind?', "You can step back at any point. Raising your hand is expressing interest — it's not a commitment. Marc runs a brief group induction at the start, and the volunteers who respond most naturally are the ones who remain on stage. If it doesn't feel right, sitting back down is completely fine and happens without any awkwardness. The whole show is built around people who genuinely want to be there."),
              ('Is the hypnosis real?', "The volunteers are real audience members — not actors, not pre-screened plants. Marc Savard has 30 years of full-time professional hypnosis and over 7,500 live performances behind him. The show works because hypnosis works on people who are genuinely open to it, and Marc's experience means he knows how to identify and guide the right volunteers in real time. Skeptics who talk to participants after the show tend to leave quieter than when they started."),
              ('Is this show appropriate for kids and families?', 'There are no age restrictions. Children ages 2 and under may sit on a parent’s lap for the duration of the show.'),
              ('Where is the show and how long does it run?', 'Marc Savard performs at the Nathan Burton Theater inside Showcase Mall at 3771 S Las Vegas Blvd, Suite 160. The show runs 70 minutes.'),
              ('When does the show run?', 'Performance times vary by date. Use the live calendar to check the current Marc Savard schedule before purchasing.'),
              ('What is the refund and cancellation policy?', 'Refunds are available for exceptional circumstances such as the unlikely event that a show cancels. Check the full terms and conditions before purchasing.'),
          ]
          faq_schema = {
              '@context': 'https://schema.org',
              '@type': 'FAQPage',
              'mainEntity': [
                  {'@type': 'Question', 'name': q, 'acceptedAnswer': {'@type': 'Answer', 'text': a}}
                  for q, a in faqs
              ]
          }
          webpage = {
              '@context': 'https://schema.org',
              '@type': 'WebPage',
              'url': 'https://vegassidekick.com/shows/comedy/marc-savard-comedy-hypnosis/',
              'dateModified': DATE,
              'lastReviewed': DATE,
              'author': {
                  '@type': 'Person',
                  '@id': 'https://vegassidekick.com/about/kris-kidd/#kris',
                  'name': 'Kris Kidd',
                  'url': 'https://vegassidekick.com/about/kris-kidd/',
                  'image': 'https://vegassidekick.com/images/kris-kidd.webp'
              },
              'mainEntity': {'@id': 'https://vegassidekick.com/shows/comedy/marc-savard-comedy-hypnosis/#event'}
          }

          text = sub_once(
              text,
              r'<script type="application/ld\+json">\{"@context":"https://schema\.org","@type":"EventSeries".*?</script>',
              '<script type="application/ld+json">' + json.dumps(event, ensure_ascii=False, separators=(',', ':')) + '</script>',
              'EventSeries schema'
          )
          text = sub_once(
              text,
              r'<script type="application/ld\+json">\{"@context":"https://schema\.org","@type":"FAQPage".*?</script>',
              '<script type="application/ld+json">' + json.dumps(faq_schema, ensure_ascii=False, separators=(',', ':')) + '</script>',
              'FAQ schema'
          )
          text = sub_once(
              text,
              r'<script type="application/ld\+json">\{"@context":"https://schema\.org","@type":"WebPage".*?</script>',
              '<script type="application/ld+json">' + json.dumps(webpage, ensure_ascii=False, separators=(',', ':')) + '</script>',
              'WebPage schema'
          )

          seat_head = '''<link rel="stylesheet" href="/assets/seat-layouts/nathan-burton-theater.css?v=3"/><style id="marc-benchmark-final">
          @media (min-width:801px){
            .hero-grid{grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);overflow:visible}
            .hero-copy{position:relative;z-index:2;padding-right:72px}
            .hero-media{position:relative;z-index:1;margin-left:-112px;overflow:hidden}
            .hero-media:after{background:linear-gradient(90deg,#2c0b4e 0%,rgba(44,11,78,.94) 12%,rgba(44,11,78,.58) 28%,rgba(44,11,78,.16) 46%,transparent 62%)}
            #quick .verdict-grid{grid-template-columns:1fr;max-width:920px}
            #quick .decision{max-width:760px;margin-top:18px}
            #quick .decision-card.good{display:flex;align-items:center;gap:16px;padding:14px 18px;border-top:0;border-left:6px solid var(--gold);min-height:0}
            #quick .decision-card.good h3{margin:0;white-space:nowrap}
            #quick .decision-card.good p{margin:0}
          }
          </style>'''
          if '/assets/seat-layouts/nathan-burton-theater.css' in text:
              raise SystemExit('Marc page already contains shared seat CSS unexpectedly')
          text = text.replace('</head>', seat_head + '</head>', 1)

          hero = f'''<header class="hero"><div class="hero-grid"><div class="hero-copy"><div class="crumbs"><a href="/">Home</a><span>›</span><a href="/shows/comedy/">Comedy</a><span>›</span>Marc Savard Comedy Hypnosis</div><div class="eyebrow">Vegas comedy · Nathan Burton Theater - Showcase Mall</div><h1>Marc Savard Comedy Hypnosis</h1><p class="hero-dek">70-minute comedy hypnosis at the Nathan Burton Theater inside Showcase Mall. Volunteering for hypnosis is optional, and all ages are welcome.</p><div class="chips"><span class="chip">70 minutes</span><span class="chip">All ages</span><span class="chip">Nathan Burton Theater - Showcase Mall</span></div><div class="buybox"><div class="price"><small>Tickets from</small>$28</div><div class="vs-deal-line"><span class="vs-regular-price">Regular $55</span><span class="vs-save-badge">Save $27</span></div><a class="cta vs-ticket-primary" href="{TICKET}" rel="noopener sponsored" target="_blank">Get Tickets →</a></div><div class="updated">Tickets start at $28. Other price points may be available.</div></div><div class="hero-media" data-mobile-fit="safe" style="--mobile-hero-image:url('{HERO}');--mobile-hero-position:center center"><img alt="Marc Savard Comedy Hypnosis at Nathan Burton Theater in Showcase Mall" fetchpriority="high" src="{HERO}"/></div></div></header>'''
          text = sub_once(text, r'<header class="hero">.*?</header>', hero, 'hero')

          facts = '''<section class="facts"><div class="wrap facts-grid"><div class="fact"><strong>70 min</strong><span>Runtime</span></div><div class="fact"><strong>$28</strong><span>Tickets from</span></div><div class="fact"><strong>Varies</strong><span>Start times</span></div><div class="fact"><strong>All ages</strong><span>Age guidance</span></div></div></section>'''
          text = sub_once(text, r'<section class="facts">.*?</section>', facts, 'quick facts')

          ticker_set = '''<div class="ticker-set"><span class="ticker-item">Comedy hypnosis</span><span class="ticker-sep">✦</span><span class="ticker-item">70 minutes</span><span class="ticker-sep">✦</span><span class="ticker-item">Volunteer-only hypnosis</span><span class="ticker-sep">✦</span><span class="ticker-item">Nathan Burton Theater</span><span class="ticker-sep">✦</span><span class="ticker-item">Comedy hypnosis</span><span class="ticker-sep">✦</span><span class="ticker-item">70 minutes</span><span class="ticker-sep">✦</span><span class="ticker-item">Volunteer-only hypnosis</span><span class="ticker-sep">✦</span><span class="ticker-item">Nathan Burton Theater</span><span class="ticker-sep">✦</span></div>'''
          ticker = '<div class="ticker"><div class="ticker-track">' + ticker_set + ticker_set + '</div></div>'
          text = sub_once(text, r'<div class="ticker">.*?</div><nav aria-label="On this page"', ticker + '<nav aria-label="On this page"', 'ticker')

          quick = '''<section class="section" id="quick"><div class="wrap verdict-grid"><div class="copy"><div class="eyebrow">The 30-second answer</div><h2>Is Marc Savard Comedy Hypnosis worth seeing?</h2><p class="lede lede-highlight">Marc Savard is a 70-minute comedy-hypnosis show built around people who choose to volunteer. You can volunteer or just watch — both are normal ways to see it.</p><p>The specifics change from performance to performance because the volunteers shape the material instead of the show following one locked script. At $28 to start, it also sits near the low end of Vegas Sidekick’s current full-length show catalog.</p><div class="take"><span>🌵</span><div><b>Kris’s take</b><p>At $28, Marc Savard is one of the lowest-priced full-length shows in our current catalog. If your group likes comedy built around real people and the unpredictability of willing volunteers, this is an easy one to put on the shortlist.</p></div></div></div><div class="decision"><div class="decision-card good"><h3>Good fit</h3><p>Groups who want a 70-minute comedy show with volunteer-only hypnosis and a low starting price.</p></div></div></div></section>'''
          text = sub_once(text, r'<section class="section" id="quick">.*?</section>', quick, 'quick take')

          photos = '''<section class="section alt" id="photos"><div class="wrap"><div class="eyebrow">See the show</div><h2>Photos from Marc Savard Comedy Hypnosis</h2><div class="gallery gallery-4"><button aria-label="Open Marc Savard Comedy Hypnosis photo" type="button"><img alt="Marc Savard Comedy Hypnosis Las Vegas show photo" loading="lazy" src="/images/marc-savard-comedy-hypnosis-hero.jpg"/></button><button aria-label="Open Marc Savard Comedy Hypnosis photo" type="button"><img alt="Marc Savard performing Comedy Hypnosis in Las Vegas" loading="lazy" src="/images/marc-savard-comedy-hypnosis-2.jpg"/></button><button aria-label="Open Marc Savard Comedy Hypnosis photo" type="button"><img alt="Marc Savard Comedy Hypnosis show at Nathan Burton Theater" loading="lazy" src="/images/marc-savard-comedy-hypnosis-3.jpg"/></button><button class="nbt-chart-gallery" aria-label="Open Nathan Burton Theater seating chart" type="button"><img alt="Seating chart for Marc Savard Comedy Hypnosis at Nathan Burton Theater in Las Vegas, showing front-side, front-center, middle, value and rear seating areas" loading="lazy" src="/images/nathan-burton-theater-seating-chart.svg"/></button></div><p class="media-caption">Nathan Burton Theater · 3771 S Las Vegas Blvd, Suite 160.</p><div class="video-wrap"><button aria-label="Play official Marc Savard Comedy Hypnosis video" class="video-preview" data-video-id="E0bECqHgo20" type="button"><img alt="" src="/images/marc-savard-comedy-hypnosis-hero.jpg"/><span>▶ Watch official preview</span></button></div></div></section>'''
          text = sub_once(text, r'<section class="section alt" id="photos">.*?</section>', photos, 'photos')

          seats = f'''<section class="section" id="seats"><div class="wrap"><div class="eyebrow">Seat guide</div><h2>Find your seat at the Nathan Burton Theater</h2><p class="lede">The room has two small two-row side sections up front, then straight center rows extending toward the rear. The center section is our pick for a balanced straight-on view.</p><div id="nbt-seat-guide" class="nbt-seat-guide" data-seat-layout="nathan-burton-theater" data-layout-url="/data/seat-layouts/nathan-burton-theater.json" data-ticket-url="{TICKET}"></div></div></section>'''
          text = sub_once(text, r'<section class="section" id="seats">.*?</section>', seats, 'shared seat guide')

          fit = '''<section class="section alt" id="fit"><div class="wrap"><div class="eyebrow">Is it for you?</div><h2>Who it fits best</h2><div class="fit-grid solo"><div class="fit-card good"><h3>Good fit</h3><ul><li>You want a comedy show where hypnosis volunteers opt in.</li><li>You like the unpredictability of different volunteers shaping each performance.</li><li>$28 is a strong starting price for your group.</li></ul></div></div></div></section>'''
          text = sub_once(text, r'<section class="section alt" id="fit">.*?</section>', fit, 'fit')

          showtimes = f'''<section class="section" id="showtimes"><div class="wrap"><div class="eyebrow">Plan the night</div><h2>Start times</h2><div class="schedule-variable"><p class="lede"><strong>Varies.</strong> Marc Savard performance times change by date.</p><a class="later-date-cta" href="{TICKET}" rel="noopener sponsored" target="_blank">See available dates &amp; times →</a></div></div></section>'''
          text = sub_once(text, r'<section class="section" id="showtimes">.*?</section>', showtimes, 'showtimes')

          faq_items = ''.join(f'<details><summary>{q}</summary><div>{a}</div></details>' for q, a in faqs)
          faq = f'''<section class="section alt" id="faq"><div class="wrap"><div class="eyebrow">Before you book</div><h2>Frequently asked questions</h2><div class="faq">{faq_items}</div></div></section>'''
          text = sub_once(text, r'<section class="section alt" id="faq">.*?</section>', faq, 'visible FAQ')

          related = '''<section class="section"><div class="wrap"><div class="eyebrow">Keep comparing</div><h2>You may also like</h2><div class="related-grid"><a class="related-card" href="/shows/comedy/steve-falcons-comedy-hypnosis-hour/"><img alt="Steve Falcon's Comedy Hypnosis Hour" loading="lazy" src="/images/steve-falcons-comedy-hypnosis-hour-hero.webp"/><div><strong>Steve Falcon's Comedy Hypnosis Hour</strong><small>From $58</small></div></a><a class="related-card" href="/shows/magic/nathan-burton-comedy-magic/"><img alt="Nathan Burton Comedy Magic" loading="lazy" src="/images/nathan-burton-comedy-magic-hero.jpg"/><div><strong>Nathan Burton Comedy Magic</strong><small>From $32</small></div></a><a class="related-card" href="/shows/magic/paranormal/"><img alt="Paranormal" loading="lazy" src="/images/paranormal-hero.webp"/><div><strong>Paranormal</strong><small>From $31</small></div></a></div></div></section>'''
          text = sub_once(text, r'<section class="section"><div class="wrap"><div class="eyebrow">Keep comparing</div>.*?</section>', related, 'related shows')

          next_click = '''<section class="section alt"><div class="wrap"><div class="eyebrow">Still deciding?</div><h2>Make the next click useful</h2><div class="next-grid"><a class="next-card" href="/shows/comedy/" style="--accent:#6d28d9"><h3>Compare Comedy →</h3><p>See the full comedy lineup before you lock in the night.</p></a><a class="next-card" href="/shows/magic/nathan-burton-comedy-magic/" style="--accent:#0fb2c7"><h3>See the other show in this room →</h3><p>Nathan Burton Comedy Magic uses the same Nathan Burton Theater seating layout.</p></a><a class="next-card" href="/guides/best-cheap-vegas-shows/" style="--accent:#f43f8c"><h3>Compare lower-priced Vegas shows →</h3><p>See what else earns a spot in our current budget-show guide.</p></a></div></div></section>'''
          text = sub_once(text, r'<section class="section alt"><div class="wrap"><div class="eyebrow">Still deciding\?</div>.*?</section>', next_click, 'next click')

          author = '''<section class="section"><div class="wrap"><a class="author-card" href="/about/kris-kidd/"><img alt="Kris Kidd" loading="lazy" src="/images/kris-kidd.webp"/><div><strong>Kris Kidd · Vegas Sidekick</strong><p>Las Vegas show and ticketing guidance. Show info confirmed September 2026.</p></div></a><p class="disclosure-line">Vegas Sidekick may earn a commission when you buy through our links. <a href="/affiliate-disclosure/">Affiliate disclosure</a>.</p></div></section>'''
          text = sub_once(text, r'<section class="section"><div class="wrap"><a class="author-card".*?</section>', author, 'author card')

          final_cta = f'''<section class="section alt final-section"><div class="wrap"><h2>Marc Savard Comedy Hypnosis tickets</h2><p class="lede">Starting at $28. Check your date, then compare the available seating sections.</p><a class="cta vs-ticket-primary" href="{TICKET}" rel="noopener sponsored" target="_blank">See Tickets →</a></div></section>'''
          text = sub_once(text, r'<section class="section alt final-section">.*?</section>', final_cta, 'final CTA')

          if '/assets/seat-layouts/nathan-burton-theater.js' in text:
              raise SystemExit('Marc page already contains shared seat JS unexpectedly')
          text = text.replace('</body>', '<script src="/assets/seat-layouts/nathan-burton-theater.js?v=3" defer></script></body>', 1)

          PAGE.write_text(text, encoding='utf-8')

          # ---- Source of truth: Marc schedule is explicitly variable. ----
          data = json.loads(DB.read_text(encoding='utf-8'))
          marc = next((r for r in data.get('records', []) if r.get('slug') == 'marc-savard-comedy-hypnosis'), None)
          if not marc:
              raise SystemExit('Marc record not found in show database')
          marc['schedule_summary'] = 'Times vary · Check live calendar'
          marc['verified_on'] = DATE
          marc['freshness_label'] = 'September 2026'
          existing_note = (marc.get('notes') or '').strip()
          schedule_note = 'Schedule explicitly confirmed variable by Kris on 2026-09-09; do not restore a fixed 7 PM pattern.'
          marc['notes'] = schedule_note if not existing_note else existing_note + ' ' + schedule_note
          spot = marc.get('spotlight') or {}
          spot['schedule_summary'] = 'Times vary · Check live calendar'
          spot['schedule_variable'] = True
          spot['schedule_days'] = {}
          spot['schedule_raw'] = []
          marc['spotlight'] = spot
          data['updated_on'] = DATE
          DB.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # ---- Prevent the Spotlight reconciliation job from re-introducing stale fixed times. ----
          rec = RECONCILE.read_text(encoding='utf-8')
          marker = 'DAY_ABBR = {d: d[:3] for d in DAY_ORDER}\n'
          override = '''\n# Explicit editorial/source-of-truth overrides for schedules that cannot safely be\n# represented by the current public Spotlight markup. Do not remove without re-verifying.\nMANUAL_SCHEDULE_OVERRIDES = {\n    "marc-savard-comedy-hypnosis": {\n        "schedule_days": {},\n        "schedule_summary": "Times vary · Check live calendar",\n        "schedule_variable": True,\n        "schedule_raw": [],\n    },\n}\n'''
          if 'MANUAL_SCHEDULE_OVERRIDES' not in rec:
              if marker not in rec:
                  raise SystemExit('Could not locate reconcile constants')
              rec = rec.replace(marker, marker + override, 1)
          else:
              raise SystemExit('Manual schedule override block already exists unexpectedly')

          scrape_line = '            spot = scrape_product(session, url)\n'
          apply_override = '''            manual_schedule = MANUAL_SCHEDULE_OVERRIDES.get(rec.get("slug"))\n            if manual_schedule:\n                spot.update(manual_schedule)\n'''
          if scrape_line not in rec:
              raise SystemExit('Could not locate Spotlight scrape call')
          rec = rec.replace(scrape_line, scrape_line + apply_override, 1)
          RECONCILE.write_text(rec, encoding='utf-8')

          # ---- Customer catalog: remove participation implication and keep schedule variable. ----
          cat = CAT.read_text(encoding='utf-8')
          old_record = "{ order:2, slug:'marc-savard-comedy-hypnosis', name:'Marc Savard', subtitle:'Comedy Hypnosis', venue:'Nathan Burton Theater - Showcase Mall', price:28, pd:'$28', sp:false, pills:['Best for Groups','Interactive & Hilarious'], img:'/images/marc-savard-comedy-hypnosis-hero.jpg', duration:'70 min', age:'All ages', schedule:'Times vary · Check schedule' }"
          new_record = "{ order:2, slug:'marc-savard-comedy-hypnosis', name:'Marc Savard', subtitle:'Comedy Hypnosis', venue:'Nathan Burton Theater - Showcase Mall', price:28, pd:'$28', sp:false, pills:['Best for Groups','Volunteer-Only Hypnosis'], img:'/images/marc-savard-comedy-hypnosis-hero.jpg', duration:'70 min', age:'All ages', schedule:'Times vary · Check live calendar' }"
          if old_record not in cat:
              raise SystemExit('Could not locate Marc comedy catalog record')
          CAT.write_text(cat.replace(old_record, new_record, 1), encoding='utf-8')

          # ---- Exact machine-readable freshness. ----
          site = SITEMAP.read_text(encoding='utf-8')
          site = sub_once(
              site,
              r'(<loc>https://vegassidekick\.com/shows/comedy/marc-savard-comedy-hypnosis/</loc>.*?<lastmod>)[^<]+(</lastmod>)',
              r'\g<1>' + DATE + r'\g<2>',
              'Marc sitemap lastmod'
          )
          SITEMAP.write_text(site, encoding='utf-8')

          # Remove the broken one-off predecessor; the permanent override above replaces it.
          if OLD_WORKFLOW.exists():
              OLD_WORKFLOW.unlink()
          PY

      - name: Run show-page audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-content-link-hygiene.py
          git diff --check

      - name: Marc Savard regression assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          p = Path('shows/comedy/marc-savard-comedy-hypnosis/index.html').read_text(encoding='utf-8')
          lower = p.lower()
          required = [
              'Tickets start at $28. Other price points may be available.',
              '<span>Start times</span>',
              '<strong>Varies</strong>',
              'See available dates &amp; times →',
              'Show info confirmed September 2026',
              '/data/seat-layouts/nathan-burton-theater.json',
              '/assets/seat-layouts/nathan-burton-theater.css?v=3',
              '/assets/seat-layouts/nathan-burton-theater.js?v=3',
              '/images/nathan-burton-theater-seating-chart.svg',
              'Volunteer-only hypnosis',
          ]
          for value in required:
              if value not in p:
                  raise SystemExit(f'Missing Marc benchmark requirement: {value}')
          banned = [
              'V Theater',
              'Typical start',
              'Think twice',
              'The downside',
              'Honest downside',
              'tradeoff',
              'Interactive & Hilarious',
              'in the action',
              'likely to get picked',
              'likely to be selected',
              '7:00 PM',
          ]
          for value in banned:
              if value.lower() in lower:
                  raise SystemExit(f'Banned/stale Marc wording remains: {value}')
          if p.count('<div class="ticker-set">') != 2:
              raise SystemExit('Marc ticker does not contain exactly two duplicated ticker sets')
          if p.count('Show info confirmed September 2026') != 1:
              raise SystemExit('Marc visible freshness is missing or duplicated')
          if '"eventSchedule"' in p:
              raise SystemExit('Marc page must not fabricate EventSchedule for variable dates/times')

          db = json.loads(Path('data/show-database.json').read_text(encoding='utf-8'))
          marc = next(r for r in db['records'] if r['slug'] == 'marc-savard-comedy-hypnosis')
          sp = marc['spotlight']
          if marc['venue'] != 'Nathan Burton Theater - Showcase Mall':
              raise SystemExit('Marc venue drifted')
          if marc['ticket_url'] != 'https://spotlight.vegas/shows/comedy/marc-savard-comedy-hypnosis/ref/vegassidekick':
              raise SystemExit('Marc ticket URL drifted')
          if marc['our_price'] != 28 or marc['runtime_minutes'] != 70 or marc['status'] != 'active':
              raise SystemExit('Marc operational facts drifted')
          if sp.get('schedule_variable') is not True or sp.get('schedule_days') != {} or sp.get('schedule_raw') != []:
              raise SystemExit('Marc stale fixed schedule remains in source of truth')

          reconcile = Path('scripts/reconcile-spotlight.py').read_text(encoding='utf-8')
          if 'MANUAL_SCHEDULE_OVERRIDES' not in reconcile or 'marc-savard-comedy-hypnosis' not in reconcile:
              raise SystemExit('Marc schedule regeneration guard missing')

          cat = Path('shows/comedy/index.html').read_text(encoding='utf-8')
          marc_line = next(line for line in cat.splitlines() if "slug:'marc-savard-comedy-hypnosis'" in line)
          if 'Interactive' in marc_line or '7 PM' in marc_line or 'V Theater' in marc_line:
              raise SystemExit('Marc comedy catalog still contains stale participation/schedule/venue copy')
          print('Marc Savard regression assertions passed')
          PY

      - name: Commit tested rebuild to main
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git rm -f .github/workflows/rebuild-marc-savard-benchmark.yml
          git add shows/comedy/marc-savard-comedy-hypnosis/index.html \
                  data/show-database.json \
                  shows/comedy/index.html \
                  scripts/reconcile-spotlight.py \
                  sitemap.xml
          git add -u .github/workflows/fix-marc-variable-schedule.yml
          git diff --cached --check
          git commit -m 'Rebuild Marc Savard show page to current benchmark'
          git push origin HEAD:main
