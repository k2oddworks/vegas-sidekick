name: Fix Mad Apple Catalog Leak

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Mad Apple from active catalogs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed=[]
          for p in sorted(Path('shows').glob('*/index.html')):
              s=p.read_text()
              original=s
              # Remove active catalog JS object for the closed Mad Apple show.
              s=re.sub(r"^\s*\{[^\n]*slug:'mad-apple'[^\n]*\},\s*\n?",'',s,flags=re.M)
              # Main all-shows catalog has a hard-coded initial count.
              if p.as_posix()=='shows/index.html':
                  s=s.replace('id="show-count">32</strong> shows','id="show-count">31</strong> shows')
              # Remove stale active-Cirque marketing copy if still present.
              if p.as_posix()=='shows/cirque/index.html':
                  s=s.replace('"O" to Mad Apple — five Cirque du Soleil shows, one city.', 'Four current Cirque du Soleil productions, one city.')
                  s=s.replace('"O" to Mad Apple — five Cirque du Soleil shows', 'Four current Cirque du Soleil productions')
              if s!=original:
                  p.write_text(s)
                  changed.append(str(p))
          print('Changed active catalog files:',len(changed))
          for p in changed: print(p)
          PY

      - name: Add closed-show catalog leakage audit
        run: |
          cat > scripts/audit-closed-show-catalog-leaks.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import re,sys

          closed = {
              'mad-apple': 'shows/cirque/mad-apple/index.html',
              'david-goldrake': 'shows/magic/david-goldrake/index.html',
          }
          issues=[]
          # Active catalog hubs only; archive pages themselves are intentionally preserved.
          catalogs=[Path('shows/index.html'), *sorted(Path('shows').glob('*/index.html'))]
          for p in catalogs:
              if not p.exists(): continue
              text=p.read_text(errors='ignore')
              for slug,archive in closed.items():
                  # Flag active JS catalog entries, not historical prose links.
                  if re.search(r"\{[^\n]*slug:'"+re.escape(slug)+r"'[^\n]*\}",text):
                      issues.append(f'{p}: closed show {slug} remains in active catalog data')
          print(f'Active catalog hubs checked: {len(catalogs)}')
          if issues:
              print('\n'.join(issues)); sys.exit(1)
          print('No closed shows remain in active catalog data.')
          PY
          chmod +x scripts/audit-closed-show-catalog-leaks.py

      - name: Validate
        run: |
          python3 scripts/audit-closed-show-catalog-leaks.py
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-content-link-hygiene.py
          python3 scripts/audit-internal-links.py

      - name: Commit directly to main
        run: |
          git checkout -- docs/internal-link-audit.md || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows/index.html shows/*/index.html scripts/audit-closed-show-catalog-leaks.py
          if ! git diff --cached --quiet; then
            git commit -m "Remove Mad Apple from active show catalogs"
            git push origin HEAD:main
          fi
