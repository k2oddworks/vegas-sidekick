name: Spotlight Full Reconcile

on:
  push:
    branches: [data/spotlight-full-reconcile]
    paths:
      - '.github/workflows/spotlight-full-reconcile.yml'
      - 'scripts/reconcile-spotlight.py'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/spotlight-full-reconcile
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Reconcile Spotlight facts and sync customer pages
        run: python3 scripts/reconcile-spotlight.py
      - name: Run Vegas Sidekick audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-serp-metadata.py
          python3 scripts/audit-content-link-hygiene.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-closed-show-catalog-leaks.py
          python3 scripts/audit-ticket-cta-colors.py || true
          python3 scripts/audit-internal-links.py
      - name: Commit reconciled data and pages
        run: |
          git checkout -- docs/internal-link-audit.md || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/show-database.json docs/spotlight-reconciliation-2026-09-08.md shows
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile show facts with Spotlight"
            git push origin HEAD:data/spotlight-full-reconcile
          fi
