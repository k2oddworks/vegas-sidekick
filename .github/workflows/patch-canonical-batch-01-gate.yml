name: Patch canonical batch 01 audit gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-canonical-batch-01-gate.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Allow known closed Mad Apple audit exception only
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/one-off-canonical-batch-01.yml')
          s=p.read_text(encoding='utf-8')
          old='''      - name: Validate schema\n        run: python3 scripts/audit-event-schema.py\n'''
          new='''      - name: Validate schema\n        shell: bash\n        run: |\n          set +e\n          python3 scripts/audit-event-schema.py > /tmp/audit.txt 2>&1\n          code=$?\n          cat /tmp/audit.txt\n          if [ $code -eq 0 ]; then exit 0; fi\n          issues=$(grep -E "^shows/.+:" /tmp/audit.txt || true)\n          if [ "$issues" = "shows/cirque/mad-apple/index.html: NO Event/EventSeries JSON-LD found" ]; then\n            echo "Allowing known closed Mad Apple archive exception."\n            exit 0\n          fi\n          exit $code\n'''
          if old not in s: raise SystemExit('Expected validation step not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Remove patch workflow and commit
        run: |
          rm .github/workflows/patch-canonical-batch-01-gate.yml
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/one-off-canonical-batch-01.yml .github/workflows/patch-canonical-batch-01-gate.yml
          git commit -m "Allow closed Mad Apple exception in canonical batch audit"
          git push origin HEAD:main