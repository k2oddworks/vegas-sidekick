name: Rebuild next six seating charts
on:
  push:
    paths:
      - '.github/workflows/rebuild-next-six-seating.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - name: Build reusable seating layouts and update pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,re,html

          amber='#ffb000'; purple='#7b35ea'; pink='#ff3b8d'; teal='#16b9c8'
          layouts={
            'ka-theatre':{
              'venue':'KÀ Theatre · MGM Grand','address':'3799 S Las Vegas Blvd, Las Vegas, NV 89109','viewBox':'0 0 120 100',
              'stage':{'path':'M30 86 Q60 78 90 86 L84 98 H36 Z','labelX':60,'labelY':91},
              'zones':[
                {'id':'103','label':'Section 103','mapLabel':'103','badge':'Lower left','our_pick':False,'color':pink,'path':'M9 48 Q20 57 39 62 L45 82 Q25 78 12 67 Z','labelX':27,'labelY':66,'description':'Lower-left seating keeps you close to KÀ’s moving stage while giving the action a slightly angled view.'},
                {'id':'102','label':'Section 102','mapLabel':'102','badge':'Lower center','our_pick':True,'color':amber,'path':'M39 62 Q60 67 81 62 L75 84 Q60 87 45 82 Z','labelX':60,'labelY':73,'description':'Section 102 is the lower-center Sweet Spot: a straight-on look at the moving platform with enough distance to read the full stage picture.'},
                {'id':'101','label':'Section 101','mapLabel':'101','badge':'Lower right','our_pick':False,'color':pink,'path':'M81 62 Q100 57 111 48 L108 67 Q95 78 75 84 Z','labelX':93,'labelY':66,'description':'Lower-right seating mirrors Section 103 with close stage detail from the opposite angle.'},
                {'id':'203','label':'Section 203','mapLabel':'203','badge':'Upper left','our_pick':False,'color':teal,'path':'M5 18 Q20 29 41 35 L39 57 Q19 51 8 40 Z','labelX':23,'labelY':37,'description':'Section 203 gives you a broad elevated view of KÀ’s full scenic machinery from the left side.'},
                {'id':'202','label':'Section 202','mapLabel':'202','badge':'Upper center','our_pick':True,'color':amber,'path':'M41 35 Q60 40 79 35 L81 58 Q60 63 39 57 Z','labelX':60,'labelY':48,'description':'Section 202 is the elevated Sweet Spot: centered, wide and especially strong for seeing the scale of KÀ’s moving stage and aerial work.'},
                {'id':'201','label':'Section 201','mapLabel':'201','badge':'Upper right','our_pick':False,'color':teal,'path':'M79 35 Q100 29 115 18 L112 40 Q101 51 81 58 Z','labelX':97,'labelY':37,'description':'Section 201 gives you the matching elevated full-production view from the right side.'}
              ]},
            'criss-angel-theatre':{
              'venue':'Criss Angel Theater · Planet Hollywood','address':'3667 S Las Vegas Blvd, Las Vegas, NV 89109','viewBox':'0 0 120 108',
              'stage':{'path':'M28 91 Q60 84 92 91 L86 104 H34 Z','labelX':60,'labelY':97},
              'zones':[
                {'id':'103','label':'Section 103','mapLabel':'103','badge':'Front left','our_pick':False,'color':pink,'path':'M14 69 Q26 75 43 79 L47 91 Q28 88 15 82 Z','labelX':29,'labelY':81,'description':'Section 103 is a close lower-left option for strong performer detail and an angled look across the production.'},
                {'id':'102','label':'Section 102','mapLabel':'102','badge':'Front center','our_pick':True,'color':amber,'path':'M43 79 Q60 82 77 79 L73 92 Q60 95 47 91 Z','labelX':60,'labelY':86,'description':'Section 102 is the closest centered Sweet Spot, giving you a direct view of the illusions while keeping the video and lighting lined up.'},
                {'id':'101','label':'Section 101','mapLabel':'101','badge':'Front right','our_pick':False,'color':pink,'path':'M77 79 Q94 75 106 69 L105 82 Q92 88 73 92 Z','labelX':91,'labelY':81,'description':'Section 101 mirrors the front-left section with close detail from the right side.'},
                {'id':'203','label':'Section 203','mapLabel':'203','badge':'Mid left','our_pick':False,'color':purple,'path':'M10 48 Q25 56 44 60 L43 76 Q25 72 12 64 Z','labelX':28,'labelY':62,'description':'Section 203 sits in the middle tier on the left and balances production scale with a comfortable viewing distance.'},
                {'id':'202','label':'Section 202','mapLabel':'202','badge':'Mid center','our_pick':True,'color':amber,'path':'M44 60 Q60 64 76 60 L77 77 Q60 81 43 76 Z','labelX':60,'labelY':69,'description':'Section 202 is the main Sweet Spot for MINDFREAK: centered and far enough back to absorb the pyro, screens and full-stage effects together.'},
                {'id':'201','label':'Section 201','mapLabel':'201','badge':'Mid right','our_pick':False,'color':purple,'path':'M76 60 Q95 56 110 48 L108 64 Q95 72 77 77 Z','labelX':92,'labelY':62,'description':'Section 201 is the matching mid-tier option on the right with a wide production view.'},
                {'id':'305','label':'Section 305','mapLabel':'305','badge':'Upper far left','our_pick':False,'color':teal,'path':'M4 19 Q12 27 25 32 L22 47 Q10 42 5 35 Z','labelX':14,'labelY':34,'description':'Section 305 is the widest upper-left value angle for taking in the entire production.'},
                {'id':'304','label':'Section 304','mapLabel':'304','badge':'Upper left','our_pick':False,'color':teal,'path':'M25 32 Q35 37 46 39 L44 55 Q32 52 22 47 Z','labelX':34,'labelY':44,'description':'Section 304 keeps the show in a broad elevated view while moving closer toward center.'},
                {'id':'303','label':'Section 303','mapLabel':'303','badge':'Upper center','our_pick':False,'color':purple,'path':'M46 39 Q60 42 74 39 L76 55 Q60 59 44 55 Z','labelX':60,'labelY':48,'description':'Section 303 is the centered upper tier and a good value when you want the full production framed straight ahead.'},
                {'id':'302','label':'Section 302','mapLabel':'302','badge':'Upper right','our_pick':False,'color':teal,'path':'M74 39 Q85 37 95 32 L98 47 Q88 52 76 55 Z','labelX':86,'labelY':44,'description':'Section 302 mirrors the upper-left section with a broad elevated view from the right.'},
                {'id':'301','label':'Section 301','mapLabel':'301','badge':'Upper far right','our_pick':False,'color':teal,'path':'M95 32 Q108 27 116 19 L115 35 Q110 42 98 47 Z','labelX':106,'labelY':34,'description':'Section 301 is the far-right upper value section with the widest angle across the room.'}
              ]},
            'v2-theatre':{
              'venue':'V2 Theater · Planet Hollywood','address':'3663 S Las Vegas Blvd, Las Vegas, NV 89109','viewBox':'0 0 120 100',
              'stage':{'path':'M33 84 Q60 79 87 84 L82 97 H38 Z','labelX':60,'labelY':90},
              'zones':[
                {'id':'vip-center','label':'VIP Center','mapLabel':'VIP CENTER','badge':'Centered close','our_pick':True,'color':amber,'path':'M38 58 Q60 64 82 58 L78 82 Q60 86 42 82 Z','labelX':60,'labelY':70,'description':'VIP Center is the Sweet Spot: straight-on sightlines for the mind-reading demonstrations and a close view of Gerry McCambridge.'},
                {'id':'vip-side','label':'VIP Side','mapLabel':'VIP SIDE','badge':'Closer side','our_pick':False,'color':pink,'path':'M14 51 Q26 58 38 58 L42 82 Q24 78 13 68 Z M82 58 Q94 58 106 51 L107 68 Q96 78 78 82 Z','labelX':25,'labelY':67,'description':'VIP Side keeps you close to the stage with a more angled view into the room.'},
                {'id':'ga-center','label':'General Rear Center','mapLabel':'GA CENTER','badge':'Centered value','our_pick':False,'color':purple,'path':'M36 27 Q60 34 84 27 L82 52 Q60 58 38 52 Z','labelX':60,'labelY':42,'description':'General Rear Center gives you a centered view at the value tier, useful in a compact room where the stage still reads clearly.'},
                {'id':'ga-side','label':'General Rear Side','mapLabel':'GA SIDE','badge':'Value side','our_pick':False,'color':teal,'path':'M8 18 Q20 27 36 27 L38 52 Q21 48 10 39 Z M84 27 Q100 27 112 18 L110 39 Q99 48 82 52 Z','labelX':21,'labelY':36,'description':'General Rear Side is the budget-focused option with a wider angle across the stage.'},
                {'id':'balcony','label':'Balcony','mapLabel':'BALCONY','badge':'Elevated rear','our_pick':False,'color':'#5f47a8','path':'M7 6 H34 L31 19 Q20 17 9 12 Z','labelX':20,'labelY':12,'description':'The small balcony sits farthest back and gives you an elevated overview of the room.'}
              ]},
            'atrium-showroom-luxor':{
              'venue':'Atrium Showroom · Luxor','address':'3900 S Las Vegas Blvd, Las Vegas, NV 89119','viewBox':'0 0 120 100',
              'stage':{'path':'M29 84 Q60 78 91 84 L86 97 H34 Z','labelX':60,'labelY':90},
              'zones':[
                {'id':'section1','label':'Section 1','mapLabel':'1','badge':'First four rows','our_pick':False,'color':pink,'path':'M25 68 Q60 76 95 68 L89 84 Q60 90 31 84 Z','labelX':60,'labelY':78,'description':'Section 1 is the first four rows, closest to Carrot Top and the prop-heavy stage action.'},
                {'id':'section2','label':'Section 2','mapLabel':'2','badge':'Middle seven rows','our_pick':True,'color':amber,'path':'M17 38 Q60 51 103 38 L96 66 Q60 76 24 66 Z','labelX':60,'labelY':56,'description':'Section 2 is the Sweet Spot: seven middle rows with enough proximity for the props and enough distance to see the whole stage comfortably.'},
                {'id':'section3','label':'Section 3','mapLabel':'3','badge':'Second-last row','our_pick':False,'color':purple,'path':'M12 24 Q60 37 108 24 L104 36 Q60 49 16 36 Z','labelX':60,'labelY':33,'description':'Section 3 is the second-last row and a strong value option in this compact showroom.'},
                {'id':'section4','label':'Section 4','mapLabel':'4','badge':'Back row','our_pick':False,'color':teal,'path':'M9 10 Q60 22 111 10 L109 22 Q60 35 11 22 Z','labelX':60,'labelY':19,'description':'Section 4 is the final row, giving you the lowest-priced way to see the full Carrot Top stage.'}
              ]},
            'harrahs-cabaret':{
              'venue':"Harrah's Cabaret",'address':'3475 S Las Vegas Blvd, Las Vegas, NV 89109','viewBox':'0 0 120 100',
              'stage':{'path':'M31 84 Q60 78 89 84 L84 97 H36 Z','labelX':60,'labelY':90},
              'zones':[
                {'id':'aaa','label':'Section AAA','mapLabel':'AAA','badge':'Front left','our_pick':False,'color':pink,'path':'M14 55 Q28 63 43 66 L46 84 Q27 80 14 70 Z','labelX':29,'labelY':70,'description':'Section AAA is the front-left seating block, close to Tape Face with a slightly angled view of the stage.'},
                {'id':'a','label':'Section A','mapLabel':'A','badge':'Front center','our_pick':True,'color':amber,'path':'M43 66 Q60 70 77 66 L74 85 Q60 88 46 84 Z','labelX':60,'labelY':76,'description':'Section A is the centered Sweet Spot: the cleanest head-on view for Tape Face’s visual comedy and prop work.'},
                {'id':'aa','label':'Section AA','mapLabel':'AA','badge':'Front right','our_pick':False,'color':pink,'path':'M77 66 Q92 63 106 55 L106 70 Q93 80 74 85 Z','labelX':91,'labelY':70,'description':'Section AA is the matching front-right section with a close view from that side.'},
                {'id':'standard-center','label':'Standard Center','mapLabel':'STANDARD','badge':'Middle / rear','our_pick':False,'color':purple,'path':'M27 24 Q60 35 93 24 L87 54 Q60 63 33 54 Z','labelX':60,'labelY':43,'description':'Standard Center keeps the stage aligned straight ahead and is a practical value choice in the intimate cabaret.'},
                {'id':'standard-side','label':'Standard Side / Booths','mapLabel':'SIDE','badge':'Value side','our_pick':False,'color':teal,'path':'M7 18 Q16 25 27 24 L33 54 Q19 50 9 40 Z M93 24 Q104 25 113 18 L111 40 Q101 50 87 54 Z','labelX':18,'labelY':38,'description':'The side and booth areas give you a wider-angle view while keeping the ticket cost focused on the show.'}
              ]},
            'chippendales-theatre-ph':{
              'venue':'Chippendales Theater · Planet Hollywood','address':'3667 S Las Vegas Blvd, Las Vegas, NV 89109','viewBox':'0 0 120 104',
              'stage':{'path':'M27 86 Q60 80 93 86 L88 99 H32 Z M55 58 H65 V88 H55 Z','labelX':60,'labelY':93},
              'zones':[
                {'id':'runway','label':'Runway / Very VIP','mapLabel':'VERY VIP','badge':'Runway-adjacent','our_pick':False,'color':pink,'path':'M44 57 Q50 52 55 50 V78 Q49 80 43 79 Z M65 50 Q70 52 76 57 L77 79 Q71 80 65 78 Z','labelX':38,'labelY':67,'description':'The runway-adjacent Very VIP area prioritizes proximity to the performers and the strongest up-close cabaret feel.'},
                {'id':'hot-center','label':'Hot Seats · Center','mapLabel':'HOT CENTER','badge':'Center floor','our_pick':True,'color':amber,'path':'M30 43 Q60 34 90 43 L82 66 Q60 60 38 66 Z','labelX':60,'labelY':50,'description':'Center Hot Seats are the Sweet Spot: close to the runway while giving you a balanced view of the ensemble choreography and full stage.'},
                {'id':'hot-side','label':'Hot Seats · Side','mapLabel':'HOT SIDE','badge':'Side floor','our_pick':False,'color':purple,'path':'M10 35 Q20 42 30 43 L38 66 Q22 63 11 53 Z M90 43 Q100 42 110 35 L109 53 Q98 63 82 66 Z','labelX':20,'labelY':50,'description':'Side Hot Seats keep you close to the room energy from a wider angle along the runway.'},
                {'id':'rear','label':'Rear Seating','mapLabel':'REAR','badge':'Full-room view','our_pick':False,'color':teal,'path':'M16 12 Q60 24 104 12 L110 33 Q60 46 10 33 Z','labelX':60,'labelY':27,'description':'Rear seating gives you the broadest view of the room and is the value-focused way to watch the full choreography.'}
              ]}
          }

          targets={
            'shows/cirque/ka/index.html':('ka-theatre','images/ka-theatre-seating-chart.svg','KÀ Theatre seating chart'),
            'shows/magic/criss-angel/index.html':('criss-angel-theatre','images/criss-angel-theatre-seating-chart.svg','Criss Angel Theater seating chart'),
            'shows/magic/the-mentalist/index.html':('v2-theatre','images/v2-theatre-seating-chart.svg','V2 Theater seating chart'),
            'shows/comedy/carrot-top/index.html':('atrium-showroom-luxor','images/atrium-showroom-luxor-seating-chart.svg','Atrium Showroom seating chart'),
            'shows/comedy/tape-face/index.html':('harrahs-cabaret','images/harrahs-cabaret-seating-chart.svg',"Harrah's Cabaret seating chart"),
            'shows/adult/chippendales/index.html':('chippendales-theatre-ph','images/chippendales-theatre-ph-seating-chart.svg','Chippendales Theater seating chart'),
          }
          Path('data/seat-layouts').mkdir(parents=True,exist_ok=True); Path('images').mkdir(exist_ok=True)
          def svg_for(d):
            out=[f'<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="{d["viewBox"]}">','<rect width="120" height="108" rx="5" fill="#0d0815"/>']
            for z in d['zones']:
              out.append(f'<path d="{z["path"]}" fill="{z["color"]}" stroke="rgba(255,255,255,.76)" stroke-width=".65"/>')
              fill='#171225' if z.get('our_pick') else '#fff'; label=html.escape(z.get('mapLabel',z['label']))
              out.append(f'<text x="{z["labelX"]}" y="{z["labelY"]}" text-anchor="middle" dominant-baseline="middle" fill="{fill}" font-family="Inter,Arial" font-size="3.35" font-weight="900">{label}</text>')
            out.append(f'<path d="{d["stage"]["path"]}" fill="#17121e" stroke="#ffb000" stroke-width=".7"/><text x="{d["stage"]["labelX"]}" y="{d["stage"]["labelY"]}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-family="Inter,Arial" font-size="4" font-weight="900">STAGE</text>')
            out.append(f'<text x="6" y="102" fill="#fff" font-family="Inter,Arial" font-size="3" font-weight="800">{html.escape(d["venue"])}</text><rect x="78" y="98" width="36" height="4" rx="2" fill="#ffb000"/><text x="96" y="100.7" text-anchor="middle" fill="#171225" font-family="Inter,Arial" font-size="2.2" font-weight="900">OUR PICK · SWEET SPOT</text></svg>')
            return ''.join(out)
          for lid,d in layouts.items():
            Path(f'data/seat-layouts/{lid}.json').write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
            Path(f'images/{lid}-seating-chart.svg').write_text(svg_for(d))

          for page,(lid,svgpath,title) in targets.items():
            p=Path(page)
            if not p.exists(): raise SystemExit('missing '+page)
            s=p.read_text(); soup=BeautifulSoup(s,'html.parser')
            # Remove old seating-specific assets on these targeted legacy pages only.
            for tag in list(soup.find_all(['link','script'])):
              u=tag.get('href') or tag.get('src') or ''
              if '/assets/seat-layouts/' in u: tag.decompose()
            css=soup.new_tag('link',rel='stylesheet',href='/assets/seat-layouts/room-map.css?v=3'); soup.head.append(css)
            sec=soup.find(id='seats')
            if not sec: raise SystemExit(page+' has no #seats')
            ticket=''
            for a in soup.find_all('a',href=True):
              if 'spotlight.vegas' in a['href'] and '/ref/vegassidekick' in a['href']:
                ticket=a['href']; break
            if not ticket: raise SystemExit(page+' no verified affiliate url')
            sec.clear()
            frag=BeautifulSoup(f'<div class="wrap"><div class="eyebrow">Seat guide</div><h2>Find your seat at {html.escape(layouts[lid]["venue"])}</h2><p class="lede">This chart follows the real room layout and ticket sections. Tap a section to see what it offers.</p><div class="vs-room-seat-guide" data-layout-url="/data/seat-layouts/{lid}.json" data-seat-layout="{lid}" data-ticket-url="{html.escape(ticket)}"></div></div>','html.parser')
            for node in list(frag.contents): sec.append(node)
            photos=soup.find(id='photos')
            if photos:
              gallery=photos.select_one('.gallery')
              if gallery and not gallery.find('img',src='/'+svgpath):
                if gallery.find('button'):
                  node=BeautifulSoup(f'<button type="button" class="vs-chart-gallery" aria-label="Open {html.escape(title)}"><img src="/{svgpath}" loading="lazy" alt="{html.escape(title)} showing Vegas Sidekick seating recommendations"/></button>','html.parser').button
                else:
                  node=BeautifulSoup(f'<img class="vs-chart-gallery" src="/{svgpath}" loading="lazy" alt="{html.escape(title)} showing Vegas Sidekick seating recommendations"/>','html.parser').img
                gallery.append(node)
            js=soup.new_tag('script',src='/assets/seat-layouts/room-map.js?v=3'); soup.body.append(js)
            p.write_text(str(soup))
          PY
      - name: QA six seating rebuilds
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          pairs=[
            ('shows/cirque/ka/index.html','ka-theatre'),
            ('shows/magic/criss-angel/index.html','criss-angel-theatre'),
            ('shows/magic/the-mentalist/index.html','v2-theatre'),
            ('shows/comedy/carrot-top/index.html','atrium-showroom-luxor'),
            ('shows/comedy/tape-face/index.html','harrahs-cabaret'),
            ('shows/adult/chippendales/index.html','chippendales-theatre-ph')]
          for page,lid in pairs:
            h=Path(page).read_text(); d=json.loads(Path(f'data/seat-layouts/{lid}.json').read_text()); svg=Path(f'images/{lid}-seating-chart.svg').read_text()
            assert f'data-seat-layout="{lid}"' in h
            assert f'/images/{lid}-seating-chart.svg' in h
            assert '/assets/seat-layouts/room-map.css?v=3' in h and '/assets/seat-layouts/room-map.js?v=3' in h
            assert 'width="1200"' in svg and 'height="1000"' in svg and 'viewBox=' in svg
            assert any(z.get('our_pick') for z in d['zones'])
            assert all(z.get('path') and z.get('label') and z.get('description') for z in d['zones'])
            assert 'spotlight.vegas' in h and '/ref/vegassidekick' in h
          print('six seating rebuild QA passed')
          PY
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          if [ -f scripts/audit-content-link-hygiene.py ]; then python3 scripts/audit-content-link-hygiene.py; fi
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'Kris Kidd'
          git config user.email 'k2oddworks@gmail.com'
          git add data/seat-layouts images shows/cirque/ka/index.html shows/magic/criss-angel/index.html shows/magic/the-mentalist/index.html shows/comedy/carrot-top/index.html shows/comedy/tape-face/index.html shows/adult/chippendales/index.html
          git commit -m 'Rebuild next six show seating charts'
          git push origin main
