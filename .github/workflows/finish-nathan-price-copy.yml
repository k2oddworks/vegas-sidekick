name: Finish Nathan Burton Price Copy

on:
  push:
    paths:
      - '.github/workflows/finish-nathan-price-copy.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove old final-total wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shows/magic/nathan-burton-comedy-magic/index.html')
          s=p.read_text(encoding='utf-8')
          before=s
          variants=[
            'Tickets currently start at $32. Your date and seat determine the final total.',
            'Tickets currently start at $32. Your date and seating section determine the final total.'
          ]
          new='Tickets currently start at $32. Other price points may be available depending on the performance and seating section.'
          hits=0
          for old in variants:
              hits += s.count(old)
              s=s.replace(old,new)
          if hits < 1:
              raise SystemExit('No Nathan final-total price copy found')
          p.write_text(s,encoding='utf-8')
          print('updated occurrences',hits)
          PY
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          git diff --check
      - name: Commit consistency fix
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add shows/magic/nathan-burton-comedy-magic/index.html
          git commit -m 'Align Nathan Burton price copy'
          git push origin HEAD:main
