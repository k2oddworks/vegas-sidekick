name: Polish Nathan Burton Benchmark

on:
  push:
    paths:
      - '.github/workflows/polish-nathan-burton-benchmark.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Polish Nathan Burton page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('shows/magic/nathan-burton-comedy-magic/index.html')
          s=p.read_text(encoding='utf-8')
          before=s

          replacements=[
            ('Last updated September 2026 · Your date and seat determine the final total.','Tickets start at $32. Other price points may be available.'),
            ('<span>Typical start</span>','<span>Start time</span>'),
            ('<h2>Typical weekly showtimes</h2>','<h2>Showtimes</h2>'),
            ('Booking for a later date? Check the live calendar →','See available dates &amp; times →'),
            ('Tap a zone below to compare the tradeoff.','Tap a section to see what it offers.'),
            ('Nathan Burton Comedy Magic makes the most sense when the premise itself is what you want. If your group is actually shopping for a different kind of night, use the comparison links below before you lock it in.','Nathan Burton is an easy afternoon magic pick, especially for families. The 4 PM start and 70-minute runtime leave plenty of room for dinner or another evening plan.'),
            ('/assets/seat-layouts/nathan-burton-theater.css?v=1','/assets/seat-layouts/nathan-burton-theater.css?v=3'),
            ('/assets/seat-layouts/nathan-burton-theater.js?v=1','/assets/seat-layouts/nathan-burton-theater.js?v=3'),
            ('"dateModified":"2026-09-07","lastReviewed":"2026-09-07"','"dateModified":"2026-09-09","lastReviewed":"2026-09-09"'),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit(f'missing Nathan target: {old}')
              s=s.replace(old,new,1)

          # Add visible freshness near the bottom instead of under the buy box.
          stamp='<div class="wrap"><p class="byline"><span class="kris-byline"><img src="/images/kris-kidd.webp" alt="Kris Kidd" width="28" height="28">Reviewed by <a href="/about/kris-kidd/">Kris Kidd</a></span> · Last reviewed September 2026</p></div>'
          if 'Last reviewed September 2026</p></div>' not in s:
              marker='</main>'
              if marker not in s:
                  raise SystemExit('Nathan </main> marker missing')
              s=s.replace(marker,stamp+marker,1)

          # Keep the page-specific chart/gallery stylesheet after savings styles.
          if s==before:
              raise SystemExit('Nathan page did not change')
          p.write_text(s,encoding='utf-8')
          PY

          python3 scripts/generate-seat-layout-assets.py

      - name: Validate Nathan benchmark
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-show-decision-copy.py
          python3 scripts/audit-catalog-js-syntax.py
          git diff --check
          grep -q 'Tickets start at $32. Other price points may be available.' shows/magic/nathan-burton-comedy-magic/index.html
          grep -q '<span>Start time</span>' shows/magic/nathan-burton-comedy-magic/index.html
          grep -q 'See available dates &amp; times' shows/magic/nathan-burton-comedy-magic/index.html
          grep -q 'Tap a section to see what it offers.' shows/magic/nathan-burton-comedy-magic/index.html
          grep -q 'Last reviewed September 2026' shows/magic/nathan-burton-comedy-magic/index.html
          grep -q 'Center section' images/nathan-burton-theater-seating-chart.svg

      - name: Commit Nathan polish
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add shows/magic/nathan-burton-comedy-magic/index.html images/nathan-burton-theater-seating-chart.svg
          git commit -m 'Polish Nathan Burton benchmark experience'
          git push origin HEAD:main
