name: Apply UI housekeeping polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/housekeeping-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply shared polish and Shin Lim cleanup
        run: python3 scripts/housekeeping-polish.py

      - name: Run show-page audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          git diff --check

      - name: Commit housekeeping pass
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/housekeeping-polish.yml scripts/housekeeping-polish.py
          git add assets/site-polish.css assets/site-polish.js components/footer.js shows/magic/shin-lim/index.html
          git commit -m "Polish shared show UI interactions"
          git push origin main
