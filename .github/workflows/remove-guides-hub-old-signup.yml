name: Remove Guides Hub Old Signup
on:
  push:
    paths:
      - 'scripts/remove-guides-hub-old-signup.py'
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/remove-guides-hub-old-signup.py
      - name: Validate
        run: |
          ! grep -q 'Want the Vegas stuff worth knowing?' guides/index.html
          grep -q 'These rankings have a person behind them.' guides/index.html
      - name: Commit
        run: |
          git config user.name 'Kris Kidd'
          git config user.email 'k2oddworks@gmail.com'
          git add guides/index.html
          git diff --cached --quiet || git commit -m 'Remove redundant signup card from Guides hub'
          git push
