name: Vegas Sidekick Operations Audits

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 0'
  push:
    branches: [main]
    paths:
      - 'shows/**'
      - 'guides/**'
      - 'news/**'
      - 'venues/**'
      - 'images/**'
      - 'hq/media-library/**'
      - 'scripts/generate-media-library.py'
      - 'sitemap.xml'
      - '_headers'
      - 'assets/showtimes-booking.css'
      - 'assets/showtimes-booking.js'
      - '_redirects'
      - 'scripts/audit-*.py'
      - '.github/workflows/operations-audits.yml'

permissions:
  contents: read
  issues: write

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Event/EventSeries schema gate
        id: audit
        continue-on-error: true
        run: python3 scripts/audit-event-schema.py 2>&1 | tee /tmp/schema-audit.txt
      - name: Open or update P0 issue on failure
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          title='[P0] Automated Event schema audit failing'
          body=$(printf 'Automated schema gate failed on `%s`.\n\n```text\n%s\n```\n\nFix active-show failures before new editorial work. Closed archive exceptions belong in the audit script explicitly.' "${GITHUB_SHA}" "$(tail -n 120 /tmp/schema-audit.txt)")
          existing=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [[ -n "$existing" ]]; then gh issue comment "$existing" --repo "$REPO" --body "$body"; else gh issue create --repo "$REPO" --title "$title" --label 'P0 Accuracy,schema,automation' --body "$body"; fi
          exit 1

  site-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static site health gate
        id: health
        continue-on-error: true
        run: python3 scripts/audit-site-health.py 2>&1 | tee /tmp/site-health.txt
      - name: Open or update technical issue on hard failure
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          title='[P0] Automated site health audit has hard failures'
          body=$(printf 'Static health gate failed on `%s`.\n\n```text\n%s\n```\n\nResolve hard failures first. Warnings are review signals, not automatic rewrite authority.' "${GITHUB_SHA}" "$(tail -n 160 /tmp/site-health.txt)")
          existing=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [[ -n "$existing" ]]; then gh issue comment "$existing" --repo "$REPO" --body "$body"; else gh issue create --repo "$REPO" --title "$title" --label 'P0 Accuracy,seo,automation' --body "$body"; fi
          exit 1

  serp-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Title and meta-description quality gate
        id: serp
        continue-on-error: true
        run: python3 scripts/audit-serp-metadata.py 2>&1 | tee /tmp/serp-metadata.txt
      - name: Open or update SEO issue on failure
        if: steps.serp.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          title='[P2] SERP metadata audit needs attention'
          body=$(printf 'SERP metadata audit failed on `%s`.\n\n```text\n%s\n```\n\nReview duplicate or missing titles/descriptions before mass rewriting. Preserve page intent and verified facts.' "${GITHUB_SHA}" "$(tail -n 160 /tmp/serp-metadata.txt)")
          existing=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [[ -n "$existing" ]]; then gh issue comment "$existing" --repo "$REPO" --body "$body"; else gh issue create --repo "$REPO" --title "$title" --label 'P2 Growth,seo,automation' --body "$body"; fi
          exit 1

  content-link-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stale copy, local URL and redirect hygiene gate
        id: hygiene
        continue-on-error: true
        run: python3 scripts/audit-content-link-hygiene.py 2>&1 | tee /tmp/content-link-hygiene.txt
      - name: Open or update hygiene issue on failure
        if: steps.hygiene.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          title='[P2] Content and internal URL hygiene needs attention'
          body=$(printf 'Canonical content/link hygiene audit failed on `%s`.\n\n```text\n%s\n```\n\nFix dead local URLs and links to redirect sources first. Review stale urgency, presale and freshness copy without inventing replacement facts.' "${GITHUB_SHA}" "$(tail -n 180 /tmp/content-link-hygiene.txt)")
          existing=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [[ -n "$existing" ]]; then gh issue comment "$existing" --repo "$REPO" --body "$body"; else gh issue create --repo "$REPO" --title "$title" --label 'P2 Growth,seo,internal-links,automation' --body "$body"; fi
          exit 1

  internal-linking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate contextual internal-link graph
        run: python3 scripts/audit-internal-links.py
      - name: Upload internal-link audit
        uses: actions/upload-artifact@v4
        with:
          name: internal-link-audit
          path: docs/internal-link-audit.md
          retention-days: 30

  media-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate current media inventory
        run: python3 scripts/audit-show-media.py
      - name: Upload media audit
        uses: actions/upload-artifact@v4
        with:
          name: show-media-audit
          path: docs/show-media-audit-2026-09-07.md
          retention-days: 30

  image-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit organized image library
        run: python3 scripts/audit-image-library.py

  media-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate generated Media Library inventory
        run: python3 scripts/generate-media-library.py --check
      - name: Audit internal Media Library exposure and structure
        run: python3 scripts/audit-media-library.py
      - name: Check Media Library JavaScript
        run: |
          node --check hq/media-library/app.js
          node - <<'NODE'
          const fs = require('fs');
          const {matchesFilters, groupItems} = require('./hq/media-library/app.js');
          const appSource = fs.readFileSync('./hq/media-library/app.js', 'utf8');
          for (const required of ['thumb.addEventListener("error"', 'openReferenceModal', 'used-on-trigger']) {
            if (!appSource.includes(required)) process.exit(1);
          }
          const item = {
            filename: 'mat-franco-hero.jpg',
            path: '/images/product-photos/mat-franco/mat-franco-hero.jpg',
            publicUrl: 'https://vegassidekick.com/images/product-photos/mat-franco/mat-franco-hero.jpg',
            category: 'product-photos',
            show: 'Mat Franco',
            venue: 'The LINQ',
            usage: ['Hero'],
            referenced: true,
            duplicateHints: ['Hero has multiple format versions']
          };
          const cases = [
            [{category:'product-photos'}, true],
            [{category:'seating-charts'}, false],
            [{category:'all', search:'franco'}, true],
            [{category:'all', show:'mat fran'}, true],
            [{category:'all', venue:'linq'}, true],
            [{category:'all', unusedOnly:true}, false],
            [{category:'all', duplicatesOnly:true}, true]
          ];
          for (const [filters, expected] of cases) {
            if (matchesFilters(item, filters) !== expected) process.exit(1);
          }
          const grouped = groupItems([
            {...item, visualGroupKey:'images/product-photos/mat-franco/mat-franco', variantRole:'Hero', referenceFiles:['shows/magic/mat-franco/index.html'], referencePages:[{title:'Mat Franco',url:'/shows/magic/mat-franco/'}]},
            {...item, filename:'mat-franco-og.jpg', path:'/images/product-photos/mat-franco/mat-franco-og.jpg', publicUrl:'https://vegassidekick.com/images/product-photos/mat-franco/mat-franco-og.jpg', visualGroupKey:'images/product-photos/mat-franco/mat-franco', variantRole:'OG/social', usage:['OG/social'], referenceFiles:['shows/magic/mat-franco/index.html'], referencePages:[{title:'Mat Franco',url:'/shows/magic/mat-franco/'}]}
          ]);
          if (grouped.length !== 1 || grouped[0].variantCount !== 2 || grouped[0].referencePages.length !== 1) process.exit(1);
          NODE

  mobile-show-heroes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit mobile show hero framing
        run: python3 scripts/audit-mobile-show-heroes.py

  closed-show-catalog-leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit closed shows in active catalogs
        run: python3 scripts/audit-closed-show-catalog-leaks.py

  catalog-js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit show catalog JavaScript syntax
        id: catalogjs
        continue-on-error: true
        run: python3 scripts/audit-catalog-js-syntax.py 2>&1 | tee /tmp/catalog-js-syntax.txt
      - name: Open or update P0 catalog issue on failure
        if: steps.catalogjs.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          title='[P0] Show catalog JavaScript is broken'
          body=$(printf 'A show catalog contains invalid inline JavaScript on `%s`. This can zero an entire customer-facing show grid.\n\n```text\n%s\n```' "${GITHUB_SHA}" "$(tail -n 140 /tmp/catalog-js-syntax.txt)")
          existing=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [[ -n "$existing" ]]; then gh issue comment "$existing" --repo "$REPO" --body "$body"; else gh issue create --repo "$REPO" --title "$title" --label 'P0 Accuracy,automation' --body "$body"; fi
          exit 1

  show-decision-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit show decision-card copy
        run: python3 scripts/audit-show-decision-copy.py

  showtimes-booking-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check shared booking JavaScript
        run: node --check assets/showtimes-booking.js
      - name: Audit compact booking coverage across active show pages
        run: python3 scripts/audit-showtimes-booking-ui.py
