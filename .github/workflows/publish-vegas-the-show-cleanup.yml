name: Clean VEGAS The Show Publish Trigger
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-vegas-the-show-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-time publish trigger
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git rm .github/workflows/publish-vegas-the-show-cleanup.yml
          git commit -m 'Remove VEGAS The Show publish trigger'
          git push origin HEAD:main
