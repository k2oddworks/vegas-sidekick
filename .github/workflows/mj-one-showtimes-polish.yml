name: Polish Michael Jackson ONE showtimes module
on:
  push:
    paths:
      - '.github/workflows/mj-one-showtimes-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish secondary CTA and artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shows/cirque/michael-jackson-one/index.html')
          s=p.read_text()

          old='.mj-all-dates{border:2px solid #6c2bd9;background:#fff;color:#6422cf}'
          new='.mj-all-dates{border:2px solid #8c52e8;background:linear-gradient(180deg,#eee3ff 0%,#dfccff 100%);color:#4f179f;box-shadow:0 8px 20px rgba(105,38,220,.14)}.mj-all-dates:hover,.mj-all-dates:focus-visible{background:linear-gradient(180deg,#e7d7ff 0%,#d5baff 100%);border-color:#7130d1}'
          assert old in s
          s=s.replace(old,new,1)

          old='.mj-primary-book{background:#FFB000!important;color:#171225!important;box-shadow:0 10px 24px rgba(255,176,0,.28)}'
          new='.mj-primary-book{background:#FFB000!important;color:#171225!important;box-shadow:0 10px 24px rgba(255,176,0,.28);column-gap:.28em}'
          assert old in s
          s=s.replace(old,new,1)

          start=s.index('.mj-booking-art{')
          end=s.index('@media(max-width:700px)',start)
          art='''.mj-booking-art{position:relative;height:170px;margin:24px -28px -28px;background:linear-gradient(180deg,#f0e5ff 0%,#c9a8f5 34%,#5c2f89 65%,#1a0c2c 100%);overflow:hidden;isolation:isolate}.mj-booking-art:before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 9% 20%,rgba(255,255,255,.8) 0 1px,transparent 1.8px),radial-gradient(circle at 25% 14%,rgba(255,255,255,.65) 0 1px,transparent 1.7px),radial-gradient(circle at 43% 24%,rgba(255,255,255,.7) 0 1px,transparent 1.8px),radial-gradient(circle at 70% 16%,rgba(255,255,255,.7) 0 1px,transparent 1.8px),radial-gradient(circle at 88% 28%,rgba(255,255,255,.75) 0 1px,transparent 1.8px),linear-gradient(108deg,transparent 0 24%,rgba(255,255,255,.13) 34%,transparent 45%),linear-gradient(72deg,transparent 0 58%,rgba(255,196,57,.13) 68%,transparent 78%)}.mj-booking-art:after{content:"";position:absolute;left:7%;right:7%;bottom:15px;height:20px;z-index:3;background:repeating-linear-gradient(90deg,rgba(255,46,126,.8) 0 5px,transparent 5px 11px);mask:linear-gradient(180deg,transparent 0 32%,#000 33%);opacity:.45;transform:skewX(-10deg)}.mj-art-moon{position:absolute;width:126px;height:126px;border-radius:50%;right:11%;top:14px;z-index:1;background:radial-gradient(circle at 32% 28%,#fffbe7 0 8%,#ffe28b 34%,#ffbf34 66%,#d98c00 100%);box-shadow:0 0 42px rgba(255,190,35,.42),0 0 90px rgba(255,105,180,.16)}.mj-art-sphere{position:absolute;width:102px;height:102px;border-radius:50%;right:13%;bottom:-28px;z-index:4;background:radial-gradient(circle at 40% 28%,#fff5bd 0 7%,#ffd652 31%,#c88f00 66%,#725000 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 0 26px rgba(255,194,0,.32);overflow:hidden}.mj-art-sphere:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 8px,rgba(75,48,0,.18) 9px 10px),repeating-linear-gradient(90deg,transparent 0 9px,rgba(75,48,0,.14) 10px 11px);mix-blend-mode:multiply}.mj-art-strip{position:absolute;left:0;right:0;bottom:0;height:86px;z-index:2;display:flex;align-items:flex-end;gap:8px;padding:0 18px}.mj-art-strip i{position:relative;display:block;flex:1;min-width:0;background:linear-gradient(180deg,#63398d 0%,#3b2058 18%,#13091f 100%);border-radius:5px 5px 0 0;box-shadow:inset 0 5px 0 rgba(255,69,156,.34),0 -5px 15px rgba(74,32,106,.16)}.mj-art-strip i:after{content:"";position:absolute;inset:12px 20% 6px;background:repeating-linear-gradient(180deg,rgba(255,205,98,.42) 0 2px,transparent 2px 8px);opacity:.62}.mj-art-strip i:nth-child(1){height:40px}.mj-art-strip i:nth-child(2){height:68px}.mj-art-strip i:nth-child(3){height:53px}.mj-art-strip i:nth-child(4){height:82px}.mj-art-strip i:nth-child(5){height:49px}.mj-art-strip i:nth-child(6){height:72px}.mj-art-strip i:nth-child(7){height:58px}.mj-art-strip i:nth-child(8){height:77px}'''
          s=s[:start]+art+s[end:]

          p.write_text(s)
          PY
      - name: Run relevant audits
        run: |
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-content-link-hygiene.py
          python3 scripts/audit-catalog-js-syntax.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('shows/cirque/michael-jackson-one/index.html').read_text()
          assert 'background:linear-gradient(180deg,#eee3ff 0%,#dfccff 100%)' in s
          assert 'column-gap:.28em' in s
          assert '.mj-art-sphere:before' in s
          assert 'repeating-linear-gradient(90deg,rgba(255,46,126,.8)' in s
          assert 'Same Vegas' not in s
          PY
      - name: Commit changes
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add shows/cirque/michael-jackson-one/index.html
          git commit -m 'Polish Michael Jackson ONE showtimes artwork and CTA'
          git push origin main
