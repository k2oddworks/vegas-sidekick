name: Canonical show batch 01 runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-canonical-batch-01-runner.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute tested batch generator
        shell: python
        run: |
          from pathlib import Path
          src=Path('.github/workflows/one-off-canonical-batch-01.yml').read_text(encoding='utf-8')
          marker='      - name: Rebuild first canonical show batch\n'
          start=src.index(marker)
          run_marker='        run: |\n'
          run=src.index(run_marker,start)+len(run_marker)
          end=src.index('      - name: Validate schema\n',run)
          raw=src[run:end]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          exec(compile(code,'canonical-batch-01-generator','exec'),{})
      - name: Validate schema
        shell: bash
        run: |
          set +e
          python3 scripts/audit-event-schema.py > /tmp/audit.txt 2>&1
          code=$?
          cat /tmp/audit.txt
          if [ $code -eq 0 ]; then exit 0; fi
          issues=$(grep -E '^shows/.+:' /tmp/audit.txt || true)
          if [ "$issues" = "shows/cirque/mad-apple/index.html: NO Event/EventSeries JSON-LD found" ]; then
            echo 'Allowing known closed Mad Apple archive exception.'
            exit 0
          fi
          exit $code
      - name: Commit rebuilt show pages
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/show-canonical.css assets/show-canonical.js shows/cirque/o/index.html shows/magic/penn-and-teller/index.html shows/adult/atomic-saloon/index.html shows/music/blue-man-group/index.html shows/spectaculars/awakening/index.html
          git commit -m "Rebuild five shows with canonical VEGAS layout"
          git push origin HEAD:main