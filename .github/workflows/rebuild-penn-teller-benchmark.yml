name: Rebuild Penn and Teller benchmark
on:
  push:
    paths:
      - '.github/workflows/rebuild-penn-teller-benchmark.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python3 -m pip install beautifulsoup4
      - name: Rebuild Penn and Teller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,re,html
          from datetime import date

          ROOT=Path('.')
          PAGE=ROOT/'shows/magic/penn-and-teller/index.html'
          DBP=ROOT/'data/show-database.json'
          db=json.loads(DBP.read_text())
          rec=next(r for r in db['records'] if r['slug']=='penn-and-teller')
          assert rec['status']=='active'
          assert rec['ticket_url']=='https://spotlight.vegas/shows/magic/penn-and-teller/ref/vegassidekick'
          assert rec['our_price']==66
          assert rec['runtime_minutes']==90
          ticket=rec['ticket_url']; price=66; regular=107
          rec['regular_price']=regular
          rec['verified_on']='2026-09-12'; rec['freshness_label']='September 2026'
          rec['schedule_summary']='Thu, Fri, Sat, Sun · Times vary'
          rec['age_summary']='5+'
          spot=rec.setdefault('spotlight',{})
          spot['regular_price']=regular
          spot['schedule_days']={d:[] for d in ['Thursday','Friday','Saturday','Sunday']}
          spot['schedule_summary']='Thu, Fri, Sat, Sun · Times vary'
          spot['schedule_variable']=True
          spot['schedule_raw']=['Current Rio and Spotlight listings disagree on 8 PM vs 9 PM; verify live calendar.']
          spot['age_rule']='Must be 5 years of age or older.'
          rec['notes']='Schedule times intentionally treated as variable after Rio and Spotlight showed conflicting current start times on 2026-09-12. Keep Thu–Sun days; do not restore a fixed hour without re-verifying both sources.'
          rec['savings_amount']=41; rec['savings_percent']=38; rec['is_deal']=True
          db['updated_on']='2026-09-12'
          DBP.write_text(json.dumps(db,indent=2,ensure_ascii=False)+'\n')

          # Permanent regeneration guard for the verified schedule conflict.
          rp=ROOT/'scripts/reconcile-spotlight.py'; rt=rp.read_text()
          if '"penn-and-teller"' not in rt.split('MANUAL_SCHEDULE_OVERRIDES = {',1)[1].split('}\n\n\ndef money_values',1)[0]:
              needle='MANUAL_SCHEDULE_OVERRIDES = {\n'
              block='    "penn-and-teller": {\n        "schedule_days": {"Thursday": [], "Friday": [], "Saturday": [], "Sunday": []},\n        "schedule_summary": "Thu, Fri, Sat, Sun · Times vary",\n        "schedule_variable": True,\n        "schedule_raw": ["Rio and Spotlight currently disagree on the fixed start hour; verify live calendar."],\n    },\n'
              assert needle in rt
              rp.write_text(rt.replace(needle,needle+block,1))

          # Reusable Penn & Teller Theater geometry from Kris's supplied chart.
          zones=[]
          for n in range(1,10):
              pick=n<=6
              if pick:
                  desc=f'Section {n} is part of the Vegas Sidekick Sweet Spot / Our Pick group. Sections 1–6 keep you in the main sightline of the room with a strong view of the stage and the visual details in the act.'
              else:
                  desc=f'Section {n} sits farther across the room and gives you a wider look at the full stage. It is a good option when you want to take in the whole production from a little more distance.'
              zones.append({'id':f'section-{n}','label':f'Section {n}','our_pick':pick,'badge':'Sweet spot' if pick else 'Wide view','color':'#ffb000' if pick else '#0fb5c9','description':desc})
          zones += [
            {'id':'amp-1','label':'AMP 1','our_pick':False,'badge':'Stage-side','color':'#f43f8c','description':'AMP 1 sits along the stage-side edge of the room. It puts you close to the performance area with a distinct side angle.'},
            {'id':'amp-2','label':'AMP 2','our_pick':False,'badge':'Stage-side','color':'#f43f8c','description':'AMP 2 is a stage-side section with a close view toward the performance area and a more angled perspective than the main center sections.'},
            {'id':'amp-3','label':'AMP 3','our_pick':False,'badge':'Stage-side','color':'#f43f8c','description':'AMP 3 is another stage-side option. It keeps the stage close while giving you a side-on view of the room.'},
            {'id':'booths','label':'Booths','our_pick':False,'badge':'Distinct setup','color':'#7c3aed','description':'The booths run through the central aisle between the main seating blocks. They offer a more separated seating setup with a clear angle toward the stage.'},
          ]
          shapes=[
            {'zone':'section-3','points':'16,11 39,3 49,23 24,30 14,22'},
            {'zone':'section-2','points':'14,30 49,23 49,54 18,48'},
            {'zone':'section-1','points':'18,48 49,54 43,79 23,72 14,60'},
            {'zone':'section-6','points':'44,3 72,3 78,23 51,30 49,16'},
            {'zone':'section-5','points':'51,30 78,23 82,54 51,54'},
            {'zone':'section-4','points':'51,54 82,54 74,79 45,80'},
            {'zone':'section-9','points':'73,5 96,8 99,27 80,33'},
            {'zone':'section-8','points':'80,33 99,27 99,59 84,56'},
            {'zone':'section-7','points':'84,56 99,59 95,78 75,80'},
            {'zone':'amp-3','points':'8,19 17,12 19,25 10,30'},
            {'zone':'amp-2','points':'8,30 19,25 20,47 8,43'},
            {'zone':'amp-1','points':'8,43 20,47 18,61 9,57'},
            {'zone':'booths','points':'47,20 52,20 52,59 47,59'},
          ]
          layout={'id':'penn-teller-theater-rio','venue':'Penn & Teller Theater · Rio Las Vegas','address':'3700 W Flamingo Rd, Las Vegas, NV 89103','stage':'Stage','zones':zones,'shapes':shapes}
          LP=ROOT/'data/seat-layouts/penn-teller-theater-rio.json'; LP.write_text(json.dumps(layout,indent=2,ensure_ascii=False)+'\n')

          css='''.ptr-seat-guide{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(290px,.84fr);gap:22px;align-items:start;margin-top:24px}.ptr-map{background:radial-gradient(circle at 20% 50%,rgba(255,176,0,.12),transparent 30%),linear-gradient(180deg,#160a24,#09060f);border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:18px;box-shadow:0 24px 60px rgba(13,4,24,.24)}.ptr-map svg{display:block;width:100%;height:auto}.ptr-shape{cursor:pointer;stroke:rgba(255,255,255,.42);stroke-width:.55;transition:.18s}.ptr-shape:hover,.ptr-shape:focus{filter:brightness(1.13)}.ptr-shape.is-active{stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 0 5px rgba(255,176,0,.65))}.ptr-stage{fill:#171717}.ptr-label{font:800 3.2px Inter,Arial,sans-serif;fill:#fff;pointer-events:none}.ptr-dark-label{fill:#171225}.ptr-stage-label{font:900 4.2px Inter,Arial,sans-serif;fill:#fff;letter-spacing:.09em}.ptr-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ptr-card{appearance:none;text-align:left;padding:13px 14px;border-radius:15px;border:1px solid #e9e2f2;background:#fff;cursor:pointer}.ptr-card.is-active{border-color:#ffb000;box-shadow:0 0 0 2px rgba(255,176,0,.16)}.ptr-card h3{margin:0;font-size:.95rem}.ptr-badge{display:block;margin-top:4px;font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:#7a7080}.ptr-card.is-pick .ptr-badge{color:#8d6100}.ptr-detail{margin-top:14px;padding:18px;border:1px solid #e9e2f2;border-radius:18px;background:#fff}.ptr-detail .tag{font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#7a7080}.ptr-detail h3{margin:5px 0 8px}.ptr-detail p{margin:0 0 14px}.ptr-detail .cta{width:100%}.ptr-mobile{display:none}.ptr-chart-gallery img{object-fit:contain!important;background:#09060f}.ptr-lb-nav{position:absolute!important;top:50%!important;transform:translateY(-50%);z-index:3;width:52px!important;height:52px!important;border-radius:50%!important;background:#fff!important;color:#17082e!important;font-size:2rem!important}.ptr-lb-prev{left:18px!important;right:auto!important}.ptr-lb-next{right:18px!important}.ptr-lb-count{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;background:rgba(23,8,46,.82);color:#fff;padding:6px 11px;border-radius:999px;font-size:.8rem;font-weight:800}@media(max-width:820px){.ptr-seat-guide{grid-template-columns:1fr}.ptr-cards,.ptr-detail{display:none}.ptr-map{padding:10px}.ptr-mobile{position:fixed;left:14px;right:14px;bottom:98px;z-index:1100;display:block;padding:14px 48px 14px 15px;background:rgba(20,9,35,.97);color:#fff;border:1px solid rgba(255,176,0,.7);border-radius:16px;opacity:0;pointer-events:none;transform:translateY(16px);transition:.2s}.ptr-mobile.is-open{opacity:1;pointer-events:auto;transform:none}.ptr-mobile button{position:absolute;right:9px;top:8px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff}.ptr-mobile p{margin:5px 0 0;color:#ded7e4;font-size:.84rem}.ptr-lb-prev{left:8px!important}.ptr-lb-next{right:8px!important}.ptr-lb-count{bottom:100px}}'''
          (ROOT/'assets/seat-layouts/penn-teller-theater-rio.css').write_text(css+'\n')

          js=r'''(()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function mount(root){try{const data=await fetch(root.dataset.layoutUrl,{credentials:'same-origin'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),ticket=root.dataset.ticketUrl,by=Object.fromEntries(data.zones.map(z=>[z.id,z]));const polys=data.shapes.map(s=>`<polygon tabindex="0" role="button" aria-label="${esc(by[s.zone].label)}" class="ptr-shape" data-zone="${esc(s.zone)}" points="${esc(s.points)}" fill="${esc(by[s.zone].color)}"/>`).join('');const labels=data.shapes.map(s=>{const z=by[s.zone];if(!/^section-/.test(z.id))return'';const pts=s.points.split(' ').map(p=>p.split(',').map(Number)),x=pts.reduce((a,p)=>a+p[0],0)/pts.length,y=pts.reduce((a,p)=>a+p[1],0)/pts.length;return`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" class="ptr-label ${z.our_pick?'ptr-dark-label':''}">${esc(z.label.replace('Section ',''))}</text>`}).join('');root.innerHTML=`<div class="ptr-map"><svg viewBox="0 0 108 86" aria-label="Penn & Teller Theater seating layout"><rect width="108" height="86" rx="4" fill="#0d0815"/><rect class="ptr-stage" x="2" y="26" width="7" height="34" rx="1"/><text x="5.5" y="43" transform="rotate(-90 5.5 43)" text-anchor="middle" class="ptr-stage-label">STAGE</text>${polys}${labels}<text x="13" y="21" class="ptr-label">AMP 3</text><text x="13" y="36" class="ptr-label">AMP 2</text><text x="13" y="52" class="ptr-label">AMP 1</text><text x="49.5" y="42" transform="rotate(90 49.5 42)" text-anchor="middle" class="ptr-label">BOOTHS</text></svg></div><div><div class="ptr-cards">${data.zones.map(z=>`<button type="button" class="ptr-card ${z.our_pick?'is-pick':''}" data-zone="${esc(z.id)}"><h3>${esc(z.label)}</h3><span class="ptr-badge">${z.our_pick?'Sweet Spot / Our Pick':esc(z.badge)}</span></button>`).join('')}</div><div class="ptr-detail" aria-live="polite"><div class="tag"></div><h3></h3><p></p><a class="cta vs-ticket-primary" href="${esc(ticket)}" target="_blank" rel="noopener sponsored">Check seats →</a></div></div><div class="ptr-mobile" aria-live="polite"><strong></strong><p></p><button type="button" aria-label="Close seat description">×</button></div>`;const detail=root.querySelector('.ptr-detail'),pop=root.querySelector('.ptr-mobile');function activate(id,show){const z=by[id];if(!z)return;root.querySelectorAll('[data-zone]').forEach(x=>x.classList.toggle('is-active',x.dataset.zone===id));detail.querySelector('.tag').textContent=z.our_pick?'Sweet Spot / Our Pick':z.badge;detail.querySelector('h3').textContent=z.label;detail.querySelector('p').textContent=z.description;pop.querySelector('strong').textContent=(z.our_pick?'Sweet Spot · ':'')+z.label;pop.querySelector('p').textContent=z.description;if(show&&matchMedia('(max-width:820px)').matches)pop.classList.add('is-open')}root.addEventListener('click',e=>{const z=e.target.closest('[data-zone]');if(z)activate(z.dataset.zone,true);if(e.target.closest('.ptr-mobile button'))pop.classList.remove('is-open')});root.addEventListener('keydown',e=>{const z=e.target.closest('.ptr-shape');if(z&&(e.key==='Enter'||e.key===' ')){e.preventDefault();activate(z.dataset.zone,true)}});activate('section-2',false)}catch(e){root.innerHTML='<p>Seat guide unavailable right now. Use the live ticket map to compare sections for your date.</p>'}}function gallery(){const b=[...document.querySelectorAll('#photos .gallery button')],l=document.getElementById('lightbox');if(!b.length||!l)return;const img=l.querySelector('#lightboxImg, img');let i=0,x=null,p=l.querySelector('.ptr-lb-prev'),n=l.querySelector('.ptr-lb-next'),c=l.querySelector('.ptr-lb-count');if(!p){p=document.createElement('button');p.className='ptr-lb-nav ptr-lb-prev';p.textContent='‹';p.setAttribute('aria-label','Previous photo');n=document.createElement('button');n.className='ptr-lb-nav ptr-lb-next';n.textContent='›';n.setAttribute('aria-label','Next photo');c=document.createElement('div');c.className='ptr-lb-count';l.append(p,n,c)}const show=j=>{i=(j+b.length)%b.length;const t=b[i].querySelector('img');img.src=t.currentSrc||t.src;img.alt=t.alt||'Penn & Teller photo';c.textContent=`${i+1} of ${b.length}`};b.forEach((q,j)=>q.addEventListener('click',()=>show(j)));p.onclick=e=>{e.stopPropagation();show(i-1)};n.onclick=e=>{e.stopPropagation();show(i+1)};addEventListener('keydown',e=>{if(!l.classList.contains('open'))return;if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});l.addEventListener('touchstart',e=>x=e.changedTouches[0]?.clientX??null,{passive:true});l.addEventListener('touchend',e=>{if(x==null)return;const d=(e.changedTouches[0]?.clientX??x)-x;x=null;if(Math.abs(d)>45)show(i+(d<0?1:-1))},{passive:true})}document.querySelectorAll('[data-seat-layout="penn-teller-theater-rio"]').forEach(mount);gallery()})();'''
          (ROOT/'assets/seat-layouts/penn-teller-theater-rio.js').write_text(js+'\n')

          colors={z['id']:z['color'] for z in zones}
          polys=''.join(f'<polygon points="{s["points"]}" fill="{colors[s["zone"]]}" stroke="#fff" stroke-opacity=".42" stroke-width=".55"/>' for s in shapes)
          labels=''
          for s in shapes:
              if not s['zone'].startswith('section-'): continue
              pts=[tuple(map(float,p.split(','))) for p in s['points'].split()]; x=sum(p[0] for p in pts)/len(pts); y=sum(p[1] for p in pts)/len(pts)
              num=s['zone'].split('-')[1]; fill='#171225' if int(num)<=6 else '#fff'
              labels+=f'<text x="{x:.1f}" y="{y:.1f}" text-anchor="middle" dominant-baseline="middle" fill="{fill}" font-family="Arial" font-weight="800" font-size="4">{num}</text>'
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="956" viewBox="0 0 108 86"><rect width="108" height="86" rx="4" fill="#09060f"/><rect x="2" y="26" width="7" height="34" rx="1" fill="#171717"/><text x="5.5" y="43" transform="rotate(-90 5.5 43)" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="900" font-size="4.2">STAGE</text>{polys}{labels}<text x="13" y="21" fill="#fff" font-family="Arial" font-weight="800" font-size="2.6">AMP 3</text><text x="13" y="36" fill="#fff" font-family="Arial" font-weight="800" font-size="2.6">AMP 2</text><text x="13" y="52" fill="#fff" font-family="Arial" font-weight="800" font-size="2.6">AMP 1</text><text x="49.5" y="42" transform="rotate(90 49.5 42)" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800" font-size="2.8">BOOTHS</text><rect x="55" y="35" width="26" height="8" rx="3" fill="#171225"/><text x="68" y="38.5" text-anchor="middle" fill="#ffb000" font-family="Arial" font-weight="800" font-size="2.2"><tspan x="68">SECTIONS 1–6</tspan><tspan x="68" dy="2.5">SWEET SPOT / OUR PICK</tspan></text><text x="54" y="7" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800" font-size="3.5">Penn &amp; Teller Theater · Rio Las Vegas</text></svg>'''
          (ROOT/'images/penn-teller-theater-rio-seating-chart.svg').write_text(svg)

          soup=BeautifulSoup(PAGE.read_text(),'html.parser')
          # Metadata
          soup.title.string='Penn & Teller Las Vegas Tickets from $66 | Seat Guide'
          def meta(attr,key,val):
              t=soup.find('meta',attrs={attr:key})
              if t: t['content']=val
          meta('name','description','Penn & Teller is a 90-minute magic and comedy show at Rio Las Vegas. Tickets from $66. Compare current showtimes and seating sections before booking.')
          meta('property','og:title','Penn & Teller Tickets & Show Guide | Vegas Sidekick')
          meta('property','og:description','90 minutes of magic, comedy and skepticism from Penn & Teller at their dedicated theater inside Rio Las Vegas.')
          meta('property','og:image','https://vegassidekick.com/images/penn-and-teller-hero.jpg')
          meta('property','og:image:alt','Penn & Teller at Rio Las Vegas')
          meta('name','twitter:image','https://vegassidekick.com/images/penn-and-teller-hero.jpg')

          event={"@context":"https://schema.org","@type":"EventSeries","name":"Penn & Teller","description":"90-minute magic and comedy show starring Penn & Teller at their dedicated theater inside Rio Las Vegas. Guests must be age 5 or older.","image":["https://vegassidekick.com/images/penn-and-teller-hero.jpg","https://vegassidekick.com/images/penn-and-teller-2.jpg","https://vegassidekick.com/images/penn-and-teller-3.jpg"],"url":"https://vegassidekick.com/shows/magic/penn-and-teller/","eventStatus":"https://schema.org/EventScheduled","organizer":{"@type":"Organization","name":"Penn & Teller Theater at Rio Las Vegas","url":"https://vegassidekick.com/shows/magic/penn-and-teller/"},"location":{"@type":"Place","name":"Penn & Teller Theater - Rio Hotel","address":{"@type":"PostalAddress","streetAddress":"3700 W Flamingo Rd","addressLocality":"Las Vegas","addressRegion":"NV","postalCode":"89103","addressCountry":"US"}},"performer":[{"@type":"Person","name":"Penn Jillette"},{"@type":"Person","name":"Teller"}],"offers":{"@type":"Offer","url":ticket,"price":66,"priceCurrency":"USD","availability":"https://schema.org/InStock","priceValidUntil":"2027-12-31","validFrom":"2026-01-01"},"eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","@id":"https://vegassidekick.com/shows/magic/penn-and-teller/#event","duration":"PT90M","audience":{"@type":"Audience","audienceType":"Must be 5 years of age or older."}}
          faqs=[
            ('Is there a Penn & Teller meet-and-greet after the show?','Rio currently offers a separate post-show Penn & Teller Meet & Greet Experience. A separate show ticket is required, so do not assume a standard show ticket includes the meet-and-greet.'),
            ('Why doesn’t Teller talk?','Teller performs silently as part of the stage character he developed early in his career. Penn handles most of the spoken material, and that contrast is central to the duo’s performance style.'),
            ('Is Penn & Teller appropriate for children?','Guests must be 5 years of age or older.'),
            ('Can I take photos during Penn & Teller?','Still photos may be allowed as long as they aren’t distracting — please check with your usher on the way in. No flash photography.'),
            ('Where is the Penn & Teller Theater?','Penn & Teller perform at the Penn & Teller Theater inside Rio Las Vegas at 3700 W Flamingo Rd, just west of the Strip.'),
            ('How long is Penn & Teller?','The current listed runtime is 90 minutes.'),
            ('When does Penn & Teller perform?','Current listings agree on Thursday through Sunday performances, but current sources disagree on the fixed start hour. Check the live calendar for the exact time on your date.'),
            ('How much are Penn & Teller tickets?','Tickets currently start at $66. Other price points may be available depending on the performance and seating section.')
          ]
          faqld={"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":q,"acceptedAnswer":{"@type":"Answer","text":a}} for q,a in faqs]}
          webp={"@context":"https://schema.org","@type":"WebPage","url":"https://vegassidekick.com/shows/magic/penn-and-teller/","dateModified":"2026-09-12","lastReviewed":"2026-09-12","author":{"@type":"Person","@id":"https://vegassidekick.com/about/kris-kidd/#kris","name":"Kris Kidd","url":"https://vegassidekick.com/about/kris-kidd/","image":"https://vegassidekick.com/images/kris-kidd.webp"},"mainEntity":{"@id":"https://vegassidekick.com/shows/magic/penn-and-teller/#event"}}
          for s in soup.find_all('script',attrs={'type':'application/ld+json'}):
              try:d=json.loads(s.string or '')
              except:continue
              if d.get('@type') in ('Event','EventSeries'): s.string=json.dumps(event,ensure_ascii=False)
              elif d.get('@type')=='FAQPage': s.string=json.dumps(faqld,ensure_ascii=False)
              elif d.get('@type')=='WebPage': s.string=json.dumps(webp,ensure_ascii=False)

          # Add assets and benchmark hero/fit refinements.
          head=soup.head
          link=soup.new_tag('link',rel='stylesheet',href='/assets/seat-layouts/penn-teller-theater-rio.css?v=1'); head.append(link)
          st=soup.new_tag('style',id='penn-teller-benchmark-final'); st.string='''@media (min-width:801px){.hero-grid{grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);overflow:visible}.hero-copy{position:relative;z-index:2;padding-right:72px}.hero-media{position:relative;z-index:1;margin-left:-112px;overflow:hidden}.hero-media:after{background:linear-gradient(90deg,#2c0b4e 0%,rgba(44,11,78,.94) 12%,rgba(44,11,78,.58) 28%,rgba(44,11,78,.16) 46%,transparent 62%)}#quick .verdict-grid{grid-template-columns:1fr;max-width:920px}#quick .decision{max-width:760px;margin-top:18px}#quick .decision-card.good{display:flex;align-items:center;gap:16px;padding:14px 18px;border-top:0;border-left:6px solid var(--gold);min-height:0}#quick .decision-card.good h3{margin:0;white-space:nowrap}#quick .decision-card.good p{margin:0}}'''; head.append(st)

          def replace_inner(sel, markup):
              el=soup.select_one(sel); assert el, sel
              el.clear(); frag=BeautifulSoup(markup,'html.parser')
              for x in list(frag.contents): el.append(x)

          replace_inner('header.hero',f'''<div class="hero-grid"><div class="hero-copy"><div class="crumbs"><a href="/">Home</a><span>›</span><a href="/shows/magic/">Magic</a><span>›</span>Penn &amp; Teller</div><div class="eyebrow">Vegas magic · Penn &amp; Teller Theater · Rio Las Vegas</div><h1>Penn &amp; Teller</h1><p class="hero-dek">90 minutes of magic, comedy and skepticism from Penn &amp; Teller at their dedicated theater inside Rio Las Vegas.</p><div class="chips"><span class="chip">90 minutes</span><span class="chip">Ages 5+</span><span class="chip">Penn &amp; Teller Theater · Rio Las Vegas</span></div><div class="buybox"><div class="price"><small>Tickets from</small>$66</div><div class="vs-deal-line"><span class="vs-regular-price">Regular $107</span><span class="vs-save-badge">Save $41</span></div><a class="cta vs-ticket-primary" href="{ticket}" rel="noopener sponsored" target="_blank">Get Tickets →</a></div><div class="updated">Tickets start at $66. Other price points may be available.</div></div><div class="hero-media" data-mobile-fit="safe" style="--mobile-hero-image:url('/images/penn-and-teller-hero.jpg');--mobile-hero-position:center center"><img alt="Penn &amp; Teller at Rio Las Vegas" fetchpriority="high" src="/images/penn-and-teller-hero.jpg"/></div></div>''')
          facts=soup.select_one('section.facts'); assert facts
