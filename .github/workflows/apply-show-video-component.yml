name: Apply reusable show video component

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-show-video-component.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply video component
        run: python3 scripts/apply-video-component.py

      - name: Run audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-orphan-ui.py
          python3 scripts/audit-show-videos.py
          git diff --check

      - name: Commit reusable component
        run: |
          rm -f .github/workflows/apply-show-video-component.yml scripts/apply-video-component.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add reusable show video component"
          git push origin main
