name: Sync Nathan Benchmark Docs

on:
  push:
    paths:
      - '.github/workflows/sync-nathan-benchmark-docs.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update governing documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # SHOW-BUILDER-PROMPT.md: preserve useful legacy implementation detail,
          # but make the current benchmark/preference hierarchy explicit.
          p = Path('SHOW-BUILDER-PROMPT.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('`VegasSidekick/vegas-sidekick`', '`k2oddworks/vegas-sidekick`')
          s = s.replace('pure HTML/CSS/JS files deployed via Cloudflare Pages on push to `main`.', 'pure HTML/CSS/JS files deployed through the current Cloudflare production path from `main`.')
          s = s.replace('- **Deploy branch:** `main` — Cloudflare Pages auto-deploys on push', '- **Deploy branch:** `main` — production branch; verify the public site before claiming a deploy is live')
          s = s.replace('**Canonical reference:** `shows/family/v-the-ultimate-variety-show/index.html`', '**Canonical reference / current model:** `shows/magic/nathan-burton-comedy-magic/index.html`')
          s = s.replace('## Current Show-Page Benchmark — Carrot Top', '## Current Show-Page Benchmark — Nathan Burton')
          s = s.replace('**Current benchmark/model:** `shows/comedy/carrot-top/index.html`. For new show pages and major rebuilds, use Carrot Top as the interaction, conversion, motion, mobile UX, and SEO metadata benchmark. Preserve each show\'s own personality; reuse the system, not the skin.', '**Current benchmark/model:** `shows/magic/nathan-burton-comedy-magic/index.html`. For new show pages and major rebuilds, use Nathan Burton as the interaction, conversion, mobile UX, gallery, seating, copy-framing, and SEO benchmark. Read `SHOW-PAGE-BENCHMARK.md` first. Preserve each show\'s own personality and facts; reuse the system, not Nathan-specific copy.')
          s = s.replace('- **Every show page gets exactly one Sweet Spot callout** — no exceptions', '- Use a **Sweet Spot** badge only when there is a defensible seating recommendation. The physical zone keeps a real location name (for example, Center section); Sweet Spot / Our Pick is a recommendation label, not the zone name.')
          notice = '''\n> **CURRENT BENCHMARK OVERRIDE — September 9, 2026**\n>\n> `shows/magic/nathan-burton-comedy-magic/index.html` and `SHOW-PAGE-BENCHMARK.md` now govern active show-page UX and copy. Older V Theater / Carrot Top / Absinthe examples in this long prompt are legacy implementation references only. If anything below conflicts with the Nathan benchmark, **Nathan wins**.\n>\n> Key current rules: no formal downside/Think twice modules; Good to know only for real useful facts; Booking tip is optional and actionable only; no customer-facing “tradeoff”; no interaction/participation claims unless Kris explicitly confirms them; use Start time/Start times; prefer “See available dates & times”; use one visible “Show info confirmed Month YYYY” freshness line near the author card; galleries support arrows/keyboard/swipe; seating charts are room-based, geometrically faithful, slab-row when exact seat counts are unnecessary, and mobile tap feedback must appear immediately in view.\n'''
          if 'CURRENT BENCHMARK OVERRIDE — September 9, 2026' not in s:
              marker = 'Paste this entire document at the start of a new chat session before requesting a new show page.\n'
              s = s.replace(marker, marker + notice, 1)
          p.write_text(s, encoding='utf-8')

          # VS_CHAT_CONTEXT.md: update living context and add the decisions learned from Nathan.
          p = Path('VS_CHAT_CONTEXT.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('**As of:** September 8, 2026', '**As of:** September 9, 2026')
          s = s.replace('compare options, understand tradeoffs, and hand off ticket purchases', 'compare options, understand differences and value, and hand off ticket purchases')
          s = s.replace('Prefer concise freshness such as:\n\n**Last updated September 2026**', 'Prefer one concise visible freshness signal near the Kris author card:\n\n**Show info confirmed September 2026**')
          old = '''The current canonical show-page system uses:\n\n- `vegas-the-show-TEMPLATE.html` as the canonical structural starting point\n- `absinthe-BENCHMARK.html` as a feature / interaction benchmark\n- `scripts/canonicalize-show-pages.py`\n- `assets/show-canonical.css`\n- `assets/show-canonical.js`'''
          new = '''The current canonical show-page system uses:\n\n- `shows/magic/nathan-burton-comedy-magic/index.html` as the current show-page benchmark / model\n- `SHOW-PAGE-BENCHMARK.md` as the governing detailed UX / copy / seating specification\n- `AGENTS.md` as the concise coding-agent execution guide\n- `scripts/canonicalize-show-pages.py` where still applicable\n- `assets/show-canonical.css`\n- `assets/show-canonical.js`\n\nOlder `vegas-the-show-TEMPLATE.html`, `absinthe-BENCHMARK.html`, Carrot Top, and V Theater examples are legacy references only when they do not conflict with the Nathan Burton benchmark.'''
          s = s.replace(old, new)
          section = '''\n\n### Nathan Burton benchmark decisions — locked September 9, 2026\n\nNathan Burton is the new model for active show product pages. The important decisions are system-level, not Nathan-specific facts:\n\n- Keep honesty positive. Do not use recurring **Think twice / downside / honest downside** sections.\n- **Good to know** is optional and only for real useful facts; never relabel rejection copy.\n- **Good Fit** should be positive and compact; do not strand one small card in a huge desktop side rail.\n- **Kris’s take** should reinforce a useful reason to choose the show, not inject generic doubt or tell the customer they may want a different category.\n- Do not use **tradeoff** in customer-facing copy. Explain what each option offers.\n- Do not describe a show or seat as interactive, in the action, likely to be selected, etc. unless Kris explicitly confirms it.\n- **Booking tip** is optional. Keep it only when it gives a concrete show-specific action; remove generic filler.\n- Use **Start time / Start times**, never “Typical start.”\n- Prefer **See available dates & times →** for schedule inventory links.\n- Preferred price line: **Tickets start at $X. Other price points may be available.**\n- Keep one visible freshness signal near the author card: **Show info confirmed Month YYYY**. Exact dates remain in structured metadata.\n- Do not narrate obvious UI behavior (for example, telling users to look at photos).\n- Photo lightboxes should support desktop previous/next, keyboard arrows, mobile swipe, and image count. Odd-aspect images must not break desktop gallery layout.\n- Seating charts are **room-based reusable layouts**: preserve real geometry, reuse one room across shows, use row slabs when exact seat counts are unnecessary, keep physical zone names separate from Sweet Spot / Our Pick labels, and show mobile tap feedback immediately in view.\n- Do not add generic seating disclaimers. Add a warning only when there is a real unusual limitation the customer needs to know.\n- Useful seating layouts may also generate a matching static gallery chart from the same geometry/data.\n- Nathan Burton Theater reusable implementation lives in `data/seat-layouts/nathan-burton-theater.json`, `assets/seat-layouts/nathan-burton-theater.css`, `assets/seat-layouts/nathan-burton-theater.js`, and `images/nathan-burton-theater-seating-chart.svg`.\n'''
          if '### Nathan Burton benchmark decisions — locked September 9, 2026' not in s:
              anchor = '### Structured data\n'
              s = s.replace(anchor, section + '\n' + anchor, 1)
          p.write_text(s, encoding='utf-8')

          # CLAUDE.md is legacy but still present; add a precedence notice instead of trying to
          # surgically rewrite every old implementation example.
          p = Path('CLAUDE.md')
          s = p.read_text(encoding='utf-8')
          notice = '''> **SHOW-PAGE PRECEDENCE UPDATE — September 9, 2026**\n>\n> For active show-page work, `shows/magic/nathan-burton-comedy-magic/index.html` is the current model and `SHOW-PAGE-BENCHMARK.md` is the governing detailed specification. Read `AGENTS.md` first. Any older V Theater, Absinthe, Carrot Top, or prior show-builder guidance in this file is legacy reference only when it does not conflict with the Nathan Burton benchmark.\n>\n> In particular: no formal downside/Think twice framing; Good to know only for real useful facts; no customer-facing “tradeoff”; no unconfirmed interaction/participation language; Booking tip optional/actionable only; Start time/Start times; one “Show info confirmed Month YYYY” freshness line; modern gallery navigation; and room-based geometrically faithful seating charts with immediate mobile tap feedback.\n\n'''
          if 'SHOW-PAGE PRECEDENCE UPDATE — September 9, 2026' not in s:
              s = notice + s
          p.write_text(s, encoding='utf-8')

          # BRAND.md: append the conversion/editorial framing rules that are brand-level decisions.
          p = Path('BRAND.md')
          s = p.read_text(encoding='utf-8')
          block = '''\n\n---\n\n## Show-page decision framing — September 2026\n\nThese are brand/voice rules, not merely layout preferences:\n\n- Be candid without manufacturing objections. Do not use recurring **Think twice**, **downside**, or **honest downside** modules.\n- **Good to know** is for a genuine fact the buyer should know. If there is no useful fact, omit the card.\n- **Kris’s take** should make the customer more confident and informed about why the show is a good choice; do not use it to plant generic doubt.\n- Avoid **tradeoff** in customer-facing copy. Describe the positive value or viewing experience each option offers.\n- Do not imply audience interaction, participation, being selected, or being “in the action” unless Kris has explicitly confirmed that fact for that show.\n- Do not narrate obvious interface behavior. Let good UI explain itself.\n- Fewer useful cards are better than filler cards written to satisfy a template.\n'''
          if '## Show-page decision framing — September 2026' not in s:
              s = s.rstrip() + block + '\n'
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate documentation changes
        run: |
          grep -q 'Nathan Burton' SHOW-BUILDER-PROMPT.md
          grep -q 'SHOW-PAGE-BENCHMARK.md' VS_CHAT_CONTEXT.md
          grep -q 'SHOW-PAGE PRECEDENCE UPDATE' CLAUDE.md
          grep -q 'Show-page decision framing' BRAND.md
          git diff --check

      - name: Commit documentation sync
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add SHOW-BUILDER-PROMPT.md VS_CHAT_CONTEXT.md CLAUDE.md BRAND.md
          git commit -m 'Make Nathan Burton the show-page benchmark'
          git push origin HEAD:main
