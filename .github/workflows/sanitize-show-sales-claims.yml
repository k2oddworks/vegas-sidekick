name: Final show sales-claim sanitizer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sanitize-show-sales-claims.yml'
permissions:
  contents: write
jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch generator and sanitize current show pages
        shell: python
        run: |
          from pathlib import Path
          import json,re
          g=Path('scripts/canonicalize-show-pages.py')
          s=g.read_text(encoding='utf-8')
          old='''BANNED_COPY = (\n    "no hidden fees", "zero hidden fees", "no fees", "secure booking", "instant delivery",\n    "selling fast", "prices may increase", "ticket partner", "spotlight.vegas"\n)'''
          new='''BANNED_COPY = (\n    "no hidden fees", "zero hidden fees", "no fees", "no surprise fees", "no added fees",\n    "secure booking", "instant delivery", "selling fast", "prices may increase",\n    "booking early", "book early", "selling out", "sell out", "fills first",\n    "price shown is the price you pay", "no surprises — ever", "ticket partner", "spotlight.vegas"\n)'''
          if old in s:s=s.replace(old,new,1)
          old2='''        if any(b in blob for b in BANNED_COPY):\n            continue\n'''
          new2='''        if any(b in blob for b in BANNED_COPY) or re.search(r'\\b(?:fee|fees)\\b', blob):\n            continue\n'''
          if old2 in s:s=s.replace(old2,new2,1)
          g.write_text(s,encoding='utf-8')

          patterns=[
            r'no hidden fees?',r'zero hidden fees?',r'no surprise fees?',r'no added fees?',r'\bno fees?\b',
            r'secure booking',r'instant delivery',r'selling fast',r'prices may increase',
            r'booking early',r'book early',r'selling out',r'\bsell out\b',r'fills first',
            r'price shown is the price you pay',r'no surprises\s*[—-]?\s*ever'
          ]
          bad=re.compile('|'.join(patterns),re.I)
          changed=[]
          for p in sorted(Path('shows').glob('*/*/index.html')):
            text=p.read_text(encoding='utf-8',errors='replace')
            original=text
            # Clean FAQPage JSON-LD while preserving all other schema.
            def clean_schema(m):
              raw=m.group(1)
              try:o=json.loads(raw)
              except:return m.group(0)
              if not isinstance(o,dict) or o.get('@type')!='FAQPage':return m.group(0)
              ents=[]
              for q in o.get('mainEntity',[]):
                blob=json.dumps(q,ensure_ascii=False)
                if bad.search(blob):continue
                ents.append(q)
              o['mainEntity']=ents
              return '<script type="application/ld+json">'+json.dumps(o,separators=(',',':'),ensure_ascii=False)+'</script>'
            text=re.sub(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',clean_schema,text,flags=re.I|re.S)
            # Remove visible FAQ details carrying the same unsupported promise/urgency.
            text=re.sub(r'<details\b[^>]*>.*?</details>',lambda m:'' if bad.search(re.sub(r'<[^>]+>',' ',m.group(0))) else m.group(0),text,flags=re.I|re.S)
            # Remove legacy standalone paragraphs/cards only when the prohibited phrase is present.
            text=re.sub(r'<p\b[^>]*>.*?</p>',lambda m:'' if bad.search(re.sub(r'<[^>]+>',' ',m.group(0))) else m.group(0),text,flags=re.I|re.S)
            if text!=original:
              p.write_text(text,encoding='utf-8');changed.append(p.as_posix())
          print('Sanitized pages:',len(changed))
          for x in changed:print(x)
          # Current show pages must now be clean for the explicit prohibited phrases.
          failures=[]
          for p in sorted(Path('shows').glob('*/*/index.html')):
            t=p.read_text(encoding='utf-8',errors='replace')
            # Ignore URLs; none of the prohibited phrases are part of the affiliate URL itself.
            if bad.search(re.sub(r'https?://[^"\'<>\s]+','',t)):
              failures.append(p.as_posix())
          if failures:
            print('Remaining prohibited sales language:',*failures,sep='\n')
            raise SystemExit(1)
      - name: Validate schema except known closed archive
        shell: bash
        run: |
          set +e
          python3 scripts/audit-event-schema.py > /tmp/audit.txt 2>&1
          code=$?
          cat /tmp/audit.txt
          if [ $code -eq 0 ]; then exit 0; fi
          issues=$(grep -E '^shows/.+:' /tmp/audit.txt || true)
          if [ "$issues" = "shows/cirque/mad-apple/index.html: NO Event/EventSeries JSON-LD found" ]; then exit 0; fi
          exit $code
      - name: Commit sanitizer results
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/canonicalize-show-pages.py shows
          if git diff --cached --quiet; then echo 'No cleanup needed'; else git commit -m "Remove unsupported sales claims from show pages" && git push origin HEAD:main; fi