name: Finalize Fantasy
on:
  push:
    paths:
      - '.github/workflows/finalize-fantasy.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore source-of-truth FAQ facts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shows/adult/fantasy/index.html')
          s=p.read_text()
          old="Still photos may be allowed as long as they aren't distracting — please check with your usher on the way in. No flash photography."
          new="Cameras and audio/video recording devices are strictly prohibited during the performance."
          count=s.count(old)
          if count != 2:
              raise SystemExit(f'Expected camera policy twice (JSON-LD + visible FAQ), found {count}')
          s=s.replace(old,new)
          s=s.replace('"name":"How long has Fantasy been running?","acceptedAnswer":{"@type":"Answer","text":"The current listed runtime is 75 minutes."}', '"name":"How long is Fantasy?","acceptedAnswer":{"@type":"Answer","text":"The current listed runtime is 75 minutes."}', 1)
          p.write_text(s)
          PY
      - name: Final Fantasy audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          if [ -f scripts/audit-content-link-hygiene.py ]; then python3 scripts/audit-content-link-hygiene.py; fi
          git diff --check
          grep -q 'Atrium Showroom at Luxor' shows/adult/fantasy/index.html
          grep -q 'data-seat-layout="atrium-showroom-luxor"' shows/adult/fantasy/index.html
          grep -q 'Reserved 2 is the Sweet Spot / Our Pick' shows/adult/fantasy/index.html
          grep -q 'Cameras and audio/video recording devices are strictly prohibited' shows/adult/fantasy/index.html
          grep -q '"name":"How long is Fantasy?"' shows/adult/fantasy/index.html
          grep -q 'Show info confirmed September 2026' shows/adult/fantasy/index.html
          ! grep -q 'Typical start' shows/adult/fantasy/index.html
          ! grep -q 'Atrium Theater - Luxor Hotel' shows/adult/fantasy/index.html
          ! grep -q 'audience-interaction' shows/adult/fantasy/index.html
          ! grep -q 'stronger chance of feeling involved' shows/adult/fantasy/index.html
      - name: Commit factual QA
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add shows/adult/fantasy/index.html
          git commit -m 'Align Fantasy FAQ with source-of-truth restrictions'
          git push origin main
