name: Reorder Carrot Top page
on: push
permissions:
  contents: write
jobs:
  reorder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reorder page
        run: python3 scripts/reorder-carrot-top.py
      - name: Run show audits
        run: |
          python3 scripts/audit-show-videos.py
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-orphan-ui.py
          git diff --check
      - name: Commit page and remove one-time files
        run: |
          rm -f .github/workflows/reorder-carrot-top.yml scripts/reorder-carrot-top.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorder Carrot Top around buyer journey"
          git push origin main
