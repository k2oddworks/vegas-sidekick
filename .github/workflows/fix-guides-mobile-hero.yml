name: Fix Guides Mobile Hero
on:
  push:
    paths:
      - 'scripts/fix-guides-mobile-hero.py'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix-guides-mobile-hero.py
      - name: Validate
        run: grep -q '@media(max-width:760px){.hero{padding:78px 0 48px}' guides/index.html
      - name: Commit
        run: |
          git config user.name 'Kris Kidd'
          git config user.email 'k2oddworks@gmail.com'
          git add guides/index.html
          git diff --cached --quiet || git commit -m 'Fix Guides hub mobile hero clearance'
          git push
