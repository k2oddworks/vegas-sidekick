name: Fix Carrot Top FAQ Alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-carrot-top-faq.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align Carrot Top FAQ with seating system
        run: python3 .github/tmp/fix-carrot-top-faq.py
      - name: Run show-page audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-content-link-hygiene.py
          node --check assets/seat-layouts/atrium-showroom-luxor.js
          git diff --check
      - name: Commit clean FAQ fix to main
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git rm -f .github/workflows/fix-carrot-top-faq.yml .github/tmp/fix-carrot-top-faq.py
          git add shows/comedy/carrot-top/index.html
          git diff --cached --check
          git commit -m 'Align Carrot Top FAQ with Reserved 2 seat guide'
          git push origin HEAD:main
