name: Rebuild next five seating charts
on:
  push:
    paths:
      - '.github/workflows/rebuild-next-five-seating.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild five seating systems
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,html

          # Shared room-map renderer: support venues where the central feature is not called a stage.
          js=Path('assets/seat-layouts/room-map.js')
          s=js.read_text()
          s=s.replace('class="vs-room-stage-label">STAGE</text>', 'class="vs-room-stage-label">${esc(d.stage.label||\'STAGE\')}</text>')
          js.write_text(s)

          layouts={
            'magic-mike-live-theater-sahara':{
              'venue':'MAGIC MIKE LIVE Theater · SAHARA Las Vegas','address':'2535 S Las Vegas Blvd, Las Vegas, NV 89109','viewBox':'0 0 120 100',
              'stage':{'path':'M48 38 Q60 31 72 38 L76 50 Q72 63 60 68 Q48 63 44 50 Z','labelX':60,'labelY':50},
              'zones':[
                {'id':'floor','label':'100 Level','mapLabel':'100','badge':'Closest ring','our_pick':False,'color':'#ff3b8d','path':'M38 28 Q60 15 82 28 L88 37 Q82 29 75 26 L79 36 Q82 48 76 60 Q70 71 60 75 Q50 71 44 60 Q38 48 41 36 L45 26 Q38 29 32 37 Z','labelX':60,'labelY':23,'description':'The 100-level sections sit closest around the central performance space. Choose them when being right next to the room energy matters most.'},
                {'id':'sweet','label':'Sections 201–202','mapLabel':'201–202','badge':'Balanced middle','our_pick':True,'color':'#ffb000','path':'M28 30 Q36 18 48 12 L52 21 Q43 25 37 34 Z M92 30 Q84 18 72 12 L68 21 Q77 25 83 34 Z','labelX':60,'labelY':12,'description':'Sections 201–202 are the Sweet Spot / Our Pick: close enough for performer detail while giving the circular staging room to read as a whole.'},
                {'id':'200','label':'Other 200 Level','mapLabel':'200','badge':'Strong full-room view','our_pick':False,'color':'#8d3cff','path':'M20 38 Q25 23 38 13 L44 22 Q34 30 31 43 L27 64 Q31 76 42 84 L36 91 Q20 80 16 64 Z M100 38 Q95 23 82 13 L76 22 Q86 30 89 43 L93 64 Q89 76 78 84 L84 91 Q100 80 104 64 Z','labelX':20,'labelY':58,'description':'The rest of the 200 level gives you a strong all-around view of the room from the second ring, with a little more distance than our center picks.'},
                {'id':'300','label':'300 Level','mapLabel':'300','badge':'Wider production view','our_pick':False,'color':'#c53cff','path':'M12 34 Q18 16 35 6 L39 13 Q24 23 20 40 L17 66 Q22 84 39 95 L32 99 Q11 87 7 66 Z M108 34 Q102 16 85 6 L81 13 Q96 23 100 40 L103 66 Q98 84 81 95 L88 99 Q109 87 113 66 Z','labelX':11,'labelY':54,'description':'The 300 level pulls back for a wider look at the choreography and room design while keeping the central stage easy to follow.'},
                {'id':'400','label':'400 Level','mapLabel':'400','badge':'Value / lounge ring','our_pick':False,'color':'#19c7dd','path':'M40 4 Q60 -2 80 4 L77 10 Q60 6 43 10 Z M38 94 Q60 102 82 94 L87 99 H33 Z','labelX':60,'labelY':6,'description':'The outer 400-level areas give you the broadest perspective and can be a useful value choice when you want to take in the whole room.'}
              ]},
            'jabbawockeez-theater-mgm':{
              'venue':'Jabbawockeez Theater · MGM Grand','address':'3799 S Las Vegas Blvd, Las Vegas, NV 89109','viewBox':'0 0 120 100',
              'stage':{'path':'M5 7 L39 7 L31 20 L5 27 Z','labelX':19,'labelY':15},
              'zones':[
                {'id':'a','label':'Category A','mapLabel':'A','badge':'Closest','our_pick':False,'color':'#ff3b8d','path':'M29 23 L48 17 L55 28 L35 35 Z M48 38 L70 31 L77 42 L55 49 Z M68 53 L91 46 L98 57 L75 64 Z','labelX':40,'labelY':27,'description':'Category A is the closest ticket tier across the room’s angled seating banks. It keeps you near the dancers and the front edge of the choreography.'},
                {'id':'b','label':'Category B','mapLabel':'B','badge':'Sweet spot','our_pick':True,'color':'#ffb000','path':'M35 36 L55 29 L62 40 L42 47 Z M55 51 L77 44 L84 55 L62 62 Z M75 66 L98 59 L105 70 L82 77 Z','labelX':49,'labelY':39,'description':'Category B is part of our Sweet Spot / Our Pick. You stay close enough for detail while gaining a cleaner view of the full formations.'},
                {'id':'c','label':'Category C','mapLabel':'C','badge':'Sweet spot','our_pick':True,'color':'#8d3cff','path':'M42 49 L62 42 L69 53 L49 60 Z M62 64 L84 57 L91 68 L69 75 Z M82 79 L106 72 L113 83 L89 90 Z','labelX':56,'labelY':52,'description':'Category C is also part of our Sweet Spot. It gives the choreography more breathing room while still feeling connected to the stage.'},
                {'id':'df','label':'Categories D–F','mapLabel':'D–F','badge':'Wider value view','our_pick':False,'color':'#19c7dd','path':'M49 62 L69 55 L76 66 L56 73 Z M69 77 L91 70 L98 81 L76 88 Z M39 64 L48 61 L55 73 L46 77 Z M59 79 L68 76 L75 88 L66 92 Z','labelX':64,'labelY':69,'description':'Categories D–F sit progressively farther back in the angled banks. They are useful when a wider view and lower price matter more than proximity.'}
              ]},
            'battlebots-arena':{
              'venue':'BattleBots Arena','address':'4165 Koval Lane, Las Vegas, NV 89109','viewBox':'0 0 120 100',
              'stage':{'path':'M36 34 H84 V66 H36 Z','labelX':60,'labelY':50,'label':'BATTLEBOX'},
              'zones':[
                {'id':'vip','label':'VIP','mapLabel':'VIP','badge':'Premium center','our_pick':False,'color':'#ff3b8d','path':'M36 19 H84 L80 31 H40 Z M40 69 H80 L84 81 H36 Z','labelX':60,'labelY':25,'description':'VIP seating sits in the center sections facing the BattleBox and is the premium choice when you want a straight-on view and the most upgraded ticket tier.'},
                {'id':'center','label':'Center View','mapLabel':'CENTER','badge':'Best balance','our_pick':True,'color':'#ffb000','path':'M18 18 H34 L30 32 H14 Z M86 18 H102 L106 32 H90 Z M14 68 H30 L34 82 H18 Z M90 68 H106 L102 82 H86 Z','labelX':23,'labelY':25,'description':'Center View is the Sweet Spot / Our Pick: a strong look into the BattleBox without paying for the highest premium tier.'},
                {'id':'side','label':'Side View','mapLabel':'SIDE','badge':'Angled arena view','our_pick':False,'color':'#19c7dd','path':'M5 25 H13 L10 75 H5 Z M107 25 H115 V75 H110 Z','labelX':9,'labelY':50,'description':'Side View seats give you an angled look across the BattleBox and are a practical choice when price matters more than being centered.'},
                {'id':'platinum','label':'Platinum Club','mapLabel':'PLATINUM','badge':'Club upgrade','our_pick':False,'color':'#c53cff','path':'M92 38 H116 V62 H92 L87 50 Z','labelX':103,'labelY':50,'description':'Platinum Club is the upgraded club area beside the arena, aimed at guests who want the premium hospitality experience as much as the view.'},
                {'id':'obstructed','label':'Obstructed View','mapLabel':'VALUE','badge':'Lowest-price area','our_pick':False,'color':'#4dd9c7','path':'M5 10 H26 L22 17 H5 Z M94 83 H115 V90 H98 Z','labelX':15,'labelY':14,'description':'Obstructed View is the budget-focused tier. The angle or arena structure can limit part of the sightline, so choose it primarily when price is the priority.'}
              ]},
            'magicians-room-linq':{
              'venue':'The Magicians Room · LINQ Promenade','address':'3545 S Las Vegas Blvd, Suite L-07B, Las Vegas, NV 89109','viewBox':'0 0 120 100',
              'stage':{'path':'M7 61 L30 35 L38 44 L18 74 Z','labelX':21,'labelY':55},
              'zones':[
                {'id':'1','label':'Section 1','mapLabel':'1','badge':'Closest','our_pick':False,'color':'#ff3b8d','path':'M31 39 L49 28 L61 42 L41 54 Z','labelX':46,'labelY':41,'description':'Section 1 is the closest seating wedge to the stage. Pick it when facial detail and the most immediate view matter most.'},
                {'id':'2','label':'Section 2','mapLabel':'2','badge':'Best balance','our_pick':True,'color':'#ffb000','path':'M43 56 L64 43 L77 57 L54 71 Z','labelX':60,'labelY':57,'description':'Section 2 is the Sweet Spot / Our Pick: centered enough to take in the full routine while staying very close in this intimate room.'},
                {'id':'3','label':'Section 3','mapLabel':'3','badge':'Step-back view','our_pick':False,'color':'#8d3cff','path':'M56 73 L79 59 L92 73 L67 88 Z','labelX':74,'labelY':73,'description':'Section 3 takes one step back, giving you a wider look at the whole presentation while remaining close in the small showroom.'},
                {'id':'4','label':'Section 4','mapLabel':'4','badge':'Widest value view','our_pick':False,'color':'#19c7dd','path':'M69 89 L94 75 L110 88 L88 99 H76 Z','labelX':91,'labelY':89,'description':'Section 4 is the farthest wedge from the stage and gives you the widest view of the room at the value end of the seating plan.'}
              ]},
            'laugh-factory-horseshoe':{
              'venue':'Laugh Factory · Horseshoe Las Vegas','address':'3645 S Las Vegas Blvd, Las Vegas, NV 89109','viewBox':'0 0 120 100',
              'stage':{'path':'M36 88 Q60 80 84 88 L80 98 H40 Z','labelX':60,'labelY':92},
              'zones':[
                {'id':'vip','label':'VIP','mapLabel':'VIP','badge':'Closest','our_pick':False,'color':'#ff3b8d','path':'M42 66 Q60 61 78 66 L76 82 Q60 78 44 82 Z M18 65 L38 61 L41 80 L23 84 Z M82 61 L102 65 L97 84 L79 80 Z','labelX':60,'labelY':72,'description':'VIP is the closest seating tier, including the center-front area and side blocks nearest the stage.'},
                {'id':'premium','label':'Premium','mapLabel':'PREMIUM','badge':'Best balance','our_pick':True,'color':'#ffb000','path':'M38 45 Q60 39 82 45 L79 62 Q60 57 41 62 Z M12 45 L35 41 L38 59 L16 64 Z M85 41 L108 45 L104 64 L82 59 Z','labelX':60,'labelY':51,'description':'Premium is the Sweet Spot / Our Pick: directly behind VIP with enough proximity for the mind-reading to feel personal without paying the top tier.'},
                {'id':'ga','label':'General Admission','mapLabel':'GA','badge':'Centered value','our_pick':False,'color':'#8d3cff','path':'M34 24 Q60 16 86 24 L83 41 Q60 34 37 41 Z M8 25 L31 21 L34 39 L11 43 Z M89 21 L112 25 L109 43 L86 39 Z','labelX':60,'labelY':29,'description':'General Admission sits behind Premium and along the outer room, giving you a solid value view in this compact showroom.'},
                {'id':'garear','label':'GA Rear','mapLabel':'GA REAR','badge':'Rear value','our_pick':False,'color':'#19c7dd','path':'M25 6 Q60 -1 95 6 L89 20 Q60 12 31 20 Z M4 7 H22 L28 21 L6 23 Z M98 7 H116 L114 23 L92 21 Z','labelX':60,'labelY':9,'description':'GA Rear is the farthest value tier. The room is compact, so it still keeps the stage readable while emphasizing price over proximity.'}
              ]}
          }

          for slug,d in layouts.items():
              Path(f'data/seat-layouts/{slug}.json').write_text(json.dumps(d,indent=2))

          def svg_for(d):
              chunks=['<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 120 100">','<rect width="120" height="100" rx="5" fill="#0b0613"/>']
              for z in d['zones']:
                  chunks.append(f'<path d="{html.escape(z["path"],quote=True)}" fill="{z["color"]}" fill-opacity=".72" stroke="#fff" stroke-width=".7"/>')
                  chunks.append(f'<text x="{z["labelX"]}" y="{z["labelY"]}" text-anchor="middle" dominant-baseline="middle" fill="{"#171225" if z.get("our_pick") else "#fff"}" font-family="Inter,Arial" font-size="3.5" font-weight="900">{html.escape(z["mapLabel"])}</text>')
              st=d['stage']; chunks.append(f'<path d="{html.escape(st["path"],quote=True)}" fill="#17121e" stroke="#ffb000" stroke-width=".9"/>'); chunks.append(f'<text x="{st["labelX"]}" y="{st["labelY"]}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-family="Inter,Arial" font-size="3.5" font-weight="900">{html.escape(st.get("label","STAGE"))}</text>')
              picks=[z['label'] for z in d['zones'] if z.get('our_pick')]
              if picks:
                  chunks.append(f'<rect x="61" y="92" width="55" height="5" rx="2.5" fill="#ffb000"/><text x="88.5" y="95.3" text-anchor="middle" fill="#171225" font-family="Inter,Arial" font-size="2.15" font-weight="900">SWEET SPOT · {html.escape(" + ".join(picks))}</text>')
              chunks.append('</svg>'); return ''.join(chunks)

          svg_names={
            'magic-mike-live-theater-sahara':'magic-mike-live-theater-seating-chart.svg',
            'jabbawockeez-theater-mgm':'jabbawockeez-theater-seating-chart.svg',
            'battlebots-arena':'battlebots-arena-seating-chart.svg',
            'magicians-room-linq':'magicians-room-seating-chart.svg',
            'laugh-factory-horseshoe':'laugh-factory-horseshoe-seating-chart.svg'}
          for key,name in svg_names.items(): Path('images',name).write_text(svg_for(layouts[key]))

          shows={
            'shows/adult/magic-mike-live/index.html':('magic-mike-live-theater-sahara','magic-mike-live-theater-seating-chart.svg','MAGIC MIKE LIVE Theater · SAHARA','https://spotlight.vegas/shows/adult/magic-mike-live/ref/vegassidekick','The purpose-built room wraps around the central performance space. Sections 201–202 are our Sweet Spot for balancing proximity with a clean view of the full staging.'),
            'shows/music/jabbawockeez/index.html':('jabbawockeez-theater-mgm','jabbawockeez-theater-seating-chart.svg','Jabbawockeez Theater · MGM Grand','https://spotlight.vegas/shows/production/jabbawockeez/ref/vegassidekick','The room uses angled seating banks with ticket categories running through them. Categories B and C are our Sweet Spot for seeing both performer detail and full-group choreography.'),
            'shows/family/battlebots-destruct-a-thon/index.html':('battlebots-arena','battlebots-arena-seating-chart.svg','BattleBots Arena','https://spotlight.vegas/shows/production/battlebots/ref/vegassidekick','This is an arena around the BattleBox, not a traditional theater. Center View is our Sweet Spot for a strong look into the box without moving all the way up to the premium tiers.'),
            'shows/magic/the-conjurors/index.html':('magicians-room-linq','magicians-room-seating-chart.svg','The Magicians Room · LINQ Promenade','https://spotlight.vegas/shows/magic/the-conjurors/ref/vegassidekick','The Magicians Room uses four fan-shaped seating sections angled toward the stage. Section 2 is our Sweet Spot: very close, but with enough perspective to take in the whole presentation.'),
            'shows/magic/paranormal/index.html':('laugh-factory-horseshoe','laugh-factory-horseshoe-seating-chart.svg','Laugh Factory · Horseshoe Las Vegas','https://spotlight.vegas/shows/magic/paranormal/ref/vegassidekick','The Laugh Factory uses VIP, Premium and General Admission zones around the stage. Premium is our Sweet Spot: close enough for mentalism to feel personal without paying for VIP.')}

          for f,(layout,svg,venue,ticket,lede) in shows.items():
              p=Path(f); s=p.read_text()
              if 'room-map.css' not in s:
                  s=s.replace('</head>','<link href="/assets/seat-layouts/room-map.css?v=4" rel="stylesheet"/></head>')
              else:
                  s=re.sub(r'/assets/seat-layouts/room-map\.css\?v=\d+','/assets/seat-layouts/room-map.css?v=4',s)
              if 'room-map.js' not in s:
                  s=s.replace('</body>','<script defer src="/assets/seat-layouts/room-map.js?v=2"></script></body>')
              else:
                  s=re.sub(r'/assets/seat-layouts/room-map\.js\?v=\d+','/assets/seat-layouts/room-map.js?v=2',s)
              seat=f'<section class="section" id="seats"><div class="wrap"><div class="eyebrow">Seat guide</div><h2>Find your seat at {venue}</h2><p class="lede">{lede}</p><div class="vs-room-seat-guide" data-layout-url="/data/seat-layouts/{layout}.json" data-seat-layout="{layout}" data-ticket-url="{ticket}"></div></div></section>'
              s,n=re.subn(r'<section class="section" id="seats">.*?</section>',seat,s,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'Could not replace seats section: {f}')
              # Add one static chart to the gallery.
              chart=f'<button aria-label="Open {venue} seating chart" class="vs-chart-gallery" type="button"><img alt="{venue} seating chart showing Vegas Sidekick seating recommendations" loading="lazy" src="/images/{svg}"/></button>'
              # Insert before closing gallery div after gallery start.
              gm=re.search(r'(<div class="gallery[^>]*>)(.*?)(</div>)',s,re.S)
              if not gm: raise SystemExit(f'No gallery: {f}')
              if svg not in gm.group(0):
                  new=gm.group(1)+gm.group(2)+chart+gm.group(3)
                  s=s[:gm.start()]+new+s[gm.end():]
              s=s.replace('Typical start','Start time')
              p.write_text(s)

          # Fix two obvious generated ticker errors encountered while updating seating.
          p=Path('shows/family/battlebots-destruct-a-thon/index.html'); s=p.read_text().replace('Animal acts','BattleBox action'); p.write_text(s)
          p=Path('shows/magic/paranormal/index.html'); s=p.read_text().replace('Live horses','Frederic Da Silva'); p.write_text(s)
          PY
      - name: QA five seating rebuilds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          expected={
            'magic-mike-live-theater-sahara':{'201-202'},
            'jabbawockeez-theater-mgm':{'b','c'},
            'battlebots-arena':{'center'},
            'magicians-room-linq':{'2'},
            'laugh-factory-horseshoe':{'premium'}}
          pages={
            'shows/adult/magic-mike-live/index.html':'magic-mike-live-theater-sahara',
            'shows/music/jabbawockeez/index.html':'jabbawockeez-theater-mgm',
            'shows/family/battlebots-destruct-a-thon/index.html':'battlebots-arena',
            'shows/magic/the-conjurors/index.html':'magicians-room-linq',
            'shows/magic/paranormal/index.html':'laugh-factory-horseshoe'}
          svgs={
            'magic-mike-live-theater-sahara':'magic-mike-live-theater-seating-chart.svg',
            'jabbawockeez-theater-mgm':'jabbawockeez-theater-seating-chart.svg',
            'battlebots-arena':'battlebots-arena-seating-chart.svg',
            'magicians-room-linq':'magicians-room-seating-chart.svg',
            'laugh-factory-horseshoe':'laugh-factory-horseshoe-seating-chart.svg'}
          for f,key in pages.items():
              text=Path(f).read_text(); data=json.loads(Path(f'data/seat-layouts/{key}.json').read_text()); svg=Path('images',svgs[key]).read_text()
              picks={z['id'] for z in data['zones'] if z.get('our_pick')}
              assert picks==expected[key],(key,picks)
              assert f'/data/seat-layouts/{key}.json' in text
              assert f'/images/{svgs[key]}' in text
              assert '/assets/seat-layouts/room-map.css?v=4' in text
              assert '/assets/seat-layouts/room-map.js?v=2' in text
              assert '<div class="seat-layout">' not in text
              assert 'Typical start' not in text
              assert 'width="1200"' in svg and 'height="1000"' in svg and 'viewBox="0 0 120 100"' in svg
          assert 'Animal acts' not in Path('shows/family/battlebots-destruct-a-thon/index.html').read_text()
          assert 'Live horses' not in Path('shows/magic/paranormal/index.html').read_text()
          assert "d.stage.label||'STAGE'" in Path('assets/seat-layouts/room-map.js').read_text()
          print('five-show seating QA passed')
          PY
      - name: Repository audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          if [ -f scripts/audit-content-link-hygiene.py ]; then python3 scripts/audit-content-link-hygiene.py; fi
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'Kris Kidd'
          git config user.email 'k2oddworks@gmail.com'
          git add assets/seat-layouts/room-map.js data/seat-layouts images shows
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild five more show seating charts'
            git push origin main
          fi
