name: Rebuild three show seating pages
on:
  push:
    paths:
      - '.github/workflows/rebuild-three-show-seating.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - name: Rebuild pages and seating systems
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,re,html
          root=Path('.')

          layouts={
          'palazzo-theatre':{
            'venue':'Palazzo Theatre','address':'3325 S Las Vegas Blvd, Las Vegas, NV 89109','viewBox':'0 0 120 110',
            'stage':{'path':'M43 94 Q60 88 77 94 L80 102 H40 Z','labelX':60,'labelY':98},
            'zones':[
              {'id':'vip1','label':'VIP 1','badge':'Closest left','our_pick':False,'color':'#ff3b8d','path':'M25 80 Q34 88 45 91 L49 76 Q39 73 31 68 Z','labelX':37,'labelY':81,'rows':[73,77,81,85],'description':'VIP 1 puts you very close on the left side, with strong detail on Shin Lim’s hands and expressions.'},
              {'id':'vip2','label':'VIP 2','badge':'Closest center','our_pick':False,'color':'#ff3b8d','path':'M49 91 Q60 94 71 91 L69 74 Q60 72 51 74 Z','labelX':60,'labelY':83,'rows':[76,80,84,88],'description':'VIP 2 is the closest straight-on view. Pick it when maximum proximity matters more than having a little visual breathing room.'},
              {'id':'vip3','label':'VIP 3','badge':'Closest right','our_pick':False,'color':'#ff3b8d','path':'M71 91 Q82 88 95 80 L89 68 Q81 73 71 76 Z','labelX':83,'labelY':81,'rows':[73,77,81,85],'description':'VIP 3 mirrors VIP 1 on the right side, keeping you close to the sleight-of-hand work.'},
              {'id':'1','label':'Section 1','badge':'Main floor left','our_pick':False,'color':'#7b35ea','path':'M16 55 Q28 66 49 73 L45 31 Q30 29 18 34 Z','labelX':33,'labelY':51,'rows':[36,41,46,51,56,61,66],'description':'Section 1 is a strong main-floor option with a slight left angle and enough distance to take in the full presentation.'},
              {'id':'2','label':'Section 2','badge':'Main floor center','our_pick':True,'color':'#ffb000','path':'M49 73 Q60 76 71 73 L75 30 Q60 27 45 30 Z','labelX':60,'labelY':51,'rows':[34,39,44,49,54,59,64,69],'description':'Section 2 is the Vegas Sidekick Sweet Spot / Our Pick: centered on the main floor, close enough for card detail without sitting on top of the stage.'},
              {'id':'3','label':'Section 3','badge':'Main floor right','our_pick':False,'color':'#7b35ea','path':'M71 73 Q92 66 104 55 L102 34 Q90 29 75 31 Z','labelX':87,'labelY':51,'rows':[36,41,46,51,56,61,66],'description':'Section 3 gives the same main-floor distance as Section 1 from the opposite side, with a clean view into the center of the stage.'},
              {'id':'4','label':'Section 4','badge':'Mid left','our_pick':False,'color':'#8a43e8','path':'M8 28 Q18 31 28 31 L25 15 Q16 14 9 16 Z','labelX':18,'labelY':23,'description':'Section 4 is a wider-value angle on the left while keeping the stage comfortably in view.'},
              {'id':'5','label':'Section 5','badge':'Mid left-center','our_pick':False,'color':'#8a43e8','path':'M29 31 Q38 31 46 29 L45 13 Q35 12 25 15 Z','labelX':36,'labelY':22,'description':'Section 5 moves closer to center and gives a balanced elevated view.'},
              {'id':'6','label':'Section 6','badge':'Mid center','our_pick':False,'color':'#8a43e8','path':'M47 29 Q60 27 73 29 L72 12 Q60 10 48 12 Z','labelX':60,'labelY':21,'description':'Section 6 is the centered middle tier, useful when you want a symmetrical full-stage view.'},
              {'id':'7','label':'Section 7','badge':'Mid right-center','our_pick':False,'color':'#8a43e8','path':'M74 29 Q82 31 91 31 L95 15 Q85 12 75 13 Z','labelX':84,'labelY':22,'description':'Section 7 gives a balanced elevated view just right of center.'},
              {'id':'8','label':'Section 8','badge':'Mid right','our_pick':False,'color':'#8a43e8','path':'M92 31 Q102 31 112 28 L111 16 Q104 14 95 15 Z','labelX':102,'labelY':23,'description':'Section 8 is a wider-value angle on the right with a clear view of the whole stage.'},
              {'id':'9','label':'Section 9','badge':'Upper left','our_pick':False,'color':'#16b9c8','path':'M16 9 Q28 11 42 11 L40 2 Q28 1 18 3 Z','labelX':29,'labelY':7,'description':'Section 9 is an upper-level value option with a broad view of the full production.'},
              {'id':'10','label':'Section 10','badge':'Upper center','our_pick':False,'color':'#16b9c8','path':'M42 11 Q60 9 78 11 L77 2 Q60 0 43 2 Z','labelX':60,'labelY':6,'description':'Section 10 is the centered upper tier and the cleanest straight-on option in the back of the room.'},
              {'id':'11','label':'Section 11','badge':'Upper right','our_pick':False,'color':'#16b9c8','path':'M78 11 Q92 11 104 9 L102 3 Q92 1 80 2 Z','labelX':91,'labelY':7,'description':'Section 11 mirrors Section 9 on the right and works well when price matters more than proximity.'}
            ]},
          'bugsys-cabaret':{
            'venue':"Bugsy's Cabaret",'address':'3555 S Las Vegas Blvd, Las Vegas, NV 89109','viewBox':'0 0 120 105',
            'stage':{'path':'M37 82 L83 82 L94 93 L82 102 H38 L26 93 Z','labelX':60,'labelY':93},
            'structures':[{'path':'M51 37 H69 V61 H51 Z','label':'POLE','labelX':60,'labelY':50}],
            'zones':[
              {'id':'ga-left','label':'General Admission · Left','badge':'Value side','our_pick':False,'color':'#16b9c8','path':'M4 25 L31 8 L43 24 L29 73 L8 62 Z','labelX':21,'labelY':40,'description':'General Admission on the left gives you the widest-angle view and keeps the ticket cost focused on the show rather than proximity.'},
              {'id':'pink2','label':'Pink Circle 2','badge':'Left of pole','our_pick':True,'color':'#ffb000','path':'M31 67 L42 72 L51 60 L47 28 L40 31 Z','labelX':42,'labelY':52,'description':'Pink Circle 2 wraps the left side of the central performance area. It is part of the Vegas Sidekick Sweet Spot / Our Pick group.'},
              {'id':'vip1','label':'VIP 1','badge':'Near-stage left','our_pick':False,'color':'#ff3b8d','path':'M27 72 L34 75 L42 68 L38 58 Z','labelX':34,'labelY':68,'description':'VIP 1 sits very close to the stage on the left, prioritizing proximity and performer detail.'},
              {'id':'vip2','label':'VIP 2','badge':'Left-center','our_pick':False,'color':'#ff3b8d','path':'M35 50 L41 54 L46 42 L43 35 Z','labelX':41,'labelY':45,'description':'VIP 2 is a close left-center option with a direct angle into the central pole area.'},
              {'id':'pink3','label':'Pink Circle 3','badge':'Center rear','our_pick':True,'color':'#ffb000','path':'M45 21 Q60 15 75 21 L70 36 H50 Z','labelX':60,'labelY':26,'description':'Pink Circle 3 is centered behind the pole area and gives the most symmetrical view in the room. It is part of the Sweet Spot / Our Pick group.'},
              {'id':'vip3','label':'VIP 3','badge':'Rear center','our_pick':False,'color':'#ff3b8d','path':'M48 10 Q60 6 72 10 L74 20 Q60 16 46 20 Z','labelX':60,'labelY':14,'description':'VIP 3 is the centered rear VIP row, giving a straight-on look over the central performance area.'},
              {'id':'pink4','label':'Pink Circle 4','badge':'Right of pole','our_pick':True,'color':'#ffb000','path':'M69 60 L78 72 L89 67 L80 31 L73 28 Z','labelX':78,'labelY':52,'description':'Pink Circle 4 wraps the right side of the central performance area. It is part of the Vegas Sidekick Sweet Spot / Our Pick group.'},
              {'id':'vip4','label':'VIP 4','badge':'Right-center','our_pick':False,'color':'#ff3b8d','path':'M74 42 L79 54 L85 50 L77 35 Z','labelX':79,'labelY':45,'description':'VIP 4 is a close right-center option with a direct angle toward the pole and stage.'},
              {'id':'vip5','label':'VIP 5','badge':'Near-stage right','our_pick':False,'color':'#ff3b8d','path':'M78 68 L86 75 L93 72 L82 58 Z','labelX':86,'labelY':68,'description':'VIP 5 is the near-stage right counterpart to VIP 1, emphasizing closeness to the performers.'},
              {'id':'ga-right','label':'General Admission · Right','badge':'Value side','our_pick':False,'color':'#16b9c8','path':'M116 25 L89 8 L77 24 L91 73 L112 62 Z','labelX':99,'labelY':40,'description':'General Admission on the right gives you the widest-angle view from that side and is the value-focused choice.'}
            ]},
          'comedy-cellar-rio':{
            'venue':'Comedy Cellar at Rio','address':'3700 W Flamingo Rd, Las Vegas, NV 89103','viewBox':'0 0 120 100',
            'stage':{'path':'M77 4 H116 V22 H77 Z','labelX':96,'labelY':14},
            'zones':[
              {'id':'vip','label':'VIP','badge':'Closest tables','our_pick':False,'color':'#ff3b8d','path':'M67 18 Q79 23 89 30 L79 45 Q67 36 56 33 Z','labelX':72,'labelY':31,'description':'VIP tables are the closest group to the stage, best when you want facial detail and the strongest small-club feel.'},
              {'id':'preferred','label':'Preferred','badge':'Center room','our_pick':True,'color':'#ffb000','path':'M31 20 Q51 15 68 19 L82 46 Q62 50 44 55 L27 43 Z','labelX':52,'labelY':35,'description':'Preferred is the Vegas Sidekick Sweet Spot / Our Pick: centered in the room, close enough for expressions and crowd work without needing the very nearest tables.'},
              {'id':'ga','label':'GA','badge':'Center value','our_pick':False,'color':'#7b35ea','path':'M43 57 Q62 51 83 48 L100 71 Q73 78 51 82 Z','labelX':70,'labelY':66,'description':'GA keeps you in the main room with a clear sightline and is a strong value choice in an intimate comedy club.'},
              {'id':'ga2','label':'GA 2','badge':'Outer value','our_pick':False,'color':'#16b9c8','path':'M9 24 Q18 19 28 20 L41 57 L50 83 Q30 79 16 67 Z','labelX':27,'labelY':50,'description':'GA 2 runs along the outer side of the room. You trade some centering for a lower-cost seat while still staying in a compact 300-seat club.'}
            ]}
          }
          Path('data/seat-layouts').mkdir(parents=True,exist_ok=True)
          for k,v in layouts.items(): (root/f'data/seat-layouts/{k}.json').write_text(json.dumps(v,indent=2)+'\n')

          css='''/* Shared Vegas Sidekick room seating map */
          .vs-room-guide{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);gap:24px;align-items:start}.vs-room-map{background:#0d0815;border-radius:28px;padding:16px;box-shadow:0 22px 55px rgba(28,10,46,.18)}.vs-room-map svg{display:block;width:100%;height:auto}.vs-room-zone{cursor:pointer;stroke:rgba(255,255,255,.74);stroke-width:.7;transition:filter .18s,opacity .18s,stroke-width .18s}.vs-room-zone:hover,.vs-room-zone.is-active{filter:brightness(1.12);stroke:#fff;stroke-width:1.4}.vs-room-row{fill:none;stroke:rgba(255,255,255,.27);stroke-width:.34;pointer-events:none}.vs-room-label{fill:#fff;font:800 3.6px Inter,sans-serif;pointer-events:none}.vs-room-label.dark{fill:#171225}.vs-room-stage{fill:#17121e;stroke:#ffb000;stroke-width:.7}.vs-room-stage-label{fill:#fff;font:900 4px Inter,sans-serif;letter-spacing:.8px}.vs-room-structure{fill:#25163a;stroke:#ba8cff;stroke-width:.55}.vs-room-structure-label{fill:#dcc8ff;font:800 3px Inter,sans-serif}.vs-room-cards{display:grid;gap:9px}.vs-room-card{width:100%;text-align:left;border:1px solid #ded4ea;border-radius:14px;background:#fff;padding:12px 14px;color:#24143b}.vs-room-card.is-pick{border-color:#ffb000;box-shadow:0 0 0 2px rgba(255,176,0,.15)}.vs-room-card.is-active{outline:3px solid rgba(123,53,234,.18)}.vs-room-card strong{display:block;font-size:.95rem}.vs-room-card span{display:block;margin-top:3px;font-size:.77rem;color:#74677f}.vs-room-detail{margin-top:14px;border-radius:18px;background:#fff;padding:18px;border:1px solid #e4d9ee}.vs-room-detail .tag{display:inline-block;border-radius:999px;padding:5px 9px;background:#f3e9ff;color:#5b22b7;font-size:.72rem;font-weight:900;text-transform:uppercase}.vs-room-detail h3{margin:9px 0 7px}.vs-room-detail p{margin:0 0 14px;color:#5f5568}.vs-room-mobile{display:none}.vs-chart-gallery img{object-fit:contain!important;background:#0d0815}.vs-lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:8;width:54px;height:54px;border:0;border-radius:50%;background:#fff;color:#25133f;font-size:2.2rem;box-shadow:0 8px 30px rgba(0,0,0,.25)}.vs-lb-prev{left:18px}.vs-lb-next{right:18px}.vs-lb-count{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:8;color:#fff;background:rgba(14,8,22,.72);padding:7px 12px;border-radius:999px;font-weight:800}
          @media(max-width:820px){.vs-room-guide{grid-template-columns:1fr}.vs-room-cards{grid-template-columns:repeat(2,1fr)}.vs-room-mobile{position:fixed;left:14px;right:14px;bottom:112px;z-index:90;display:none;background:#160b26;color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px 42px 14px 16px;box-shadow:0 18px 45px rgba(0,0,0,.35)}.vs-room-mobile.is-open{display:block}.vs-room-mobile p{margin:4px 0 0;font-size:.86rem;color:#e9dff2}.vs-room-mobile button{position:absolute;right:10px;top:8px;border:0;background:transparent;color:#fff;font-size:1.5rem}.vs-lb-nav{width:48px;height:48px}.vs-lb-prev{left:10px}.vs-lb-next{right:10px}}
          '''
          Path('assets/seat-layouts').mkdir(parents=True,exist_ok=True)
          (root/'assets/seat-layouts/room-map.css').write_text(css)
          js=r'''(()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function mount(root){const d=await fetch(root.dataset.layoutUrl,{credentials:'same-origin'}).then(r=>r.json()),ticket=root.dataset.ticketUrl,by=Object.fromEntries(d.zones.map(z=>[z.id,z]));const shapes=d.zones.map(z=>{const rows=(z.rows||[]).map(y=>`<path class="vs-room-row" d="M4 ${y} H116" clip-path="url(#c-${esc(z.id)})"/>`).join('');return `<g data-zone="${esc(z.id)}"><clipPath id="c-${esc(z.id)}"><path d="${esc(z.path)}"/></clipPath><path tabindex="0" role="button" aria-label="${esc(z.label)}" data-zone="${esc(z.id)}" class="vs-room-zone" d="${esc(z.path)}" fill="${esc(z.color)}"/>${rows}<text x="${z.labelX}" y="${z.labelY}" text-anchor="middle" dominant-baseline="middle" class="vs-room-label ${z.our_pick?'dark':''}">${esc(z.label.replace('Section ',''))}</text></g>`}).join('');const structs=(d.structures||[]).map(s=>`<path class="vs-room-structure" d="${esc(s.path)}"/><text x="${s.labelX}" y="${s.labelY}" text-anchor="middle" class="vs-room-structure-label">${esc(s.label)}</text>`).join('');root.innerHTML=`<div class="vs-room-guide"><div class="vs-room-map"><svg width="1200" height="1000" viewBox="${esc(d.viewBox)}" aria-label="${esc(d.venue)} seating layout"><rect width="120" height="110" rx="5" fill="#0d0815"/>${shapes}${structs}<path class="vs-room-stage" d="${esc(d.stage.path)}"/><text x="${d.stage.labelX}" y="${d.stage.labelY}" text-anchor="middle" dominant-baseline="middle" class="vs-room-stage-label">STAGE</text></svg></div><div><div class="vs-room-cards">${d.zones.map(z=>`<button type="button" class="vs-room-card ${z.our_pick?'is-pick':''}" data-zone="${esc(z.id)}"><strong>${esc(z.label)}</strong><span>${z.our_pick?'Sweet Spot / Our Pick':esc(z.badge)}</span></button>`).join('')}</div><div class="vs-room-detail" aria-live="polite"><div class="tag"></div><h3></h3><p></p><a class="cta vs-ticket-primary" href="${esc(ticket)}" target="_blank" rel="noopener sponsored">Check seats →</a></div></div></div><div class="vs-room-mobile" aria-live="polite"><strong></strong><p></p><button type="button" aria-label="Close seat description">×</button></div>`;const detail=root.querySelector('.vs-room-detail'),pop=root.querySelector('.vs-room-mobile');function act(id,show){const z=by[id];if(!z)return;root.querySelectorAll('[data-zone]').forEach(x=>x.classList.toggle('is-active',x.dataset.zone===id));detail.querySelector('.tag').textContent=z.our_pick?'Sweet Spot / Our Pick':z.badge;detail.querySelector('h3').textContent=z.label;detail.querySelector('p').textContent=z.description;pop.querySelector('strong').textContent=(z.our_pick?'Sweet Spot · ':'')+z.label;pop.querySelector('p').textContent=z.description;if(show&&matchMedia('(max-width:820px)').matches)pop.classList.add('is-open')}root.addEventListener('click',e=>{const z=e.target.closest('[data-zone]');if(z)act(z.dataset.zone,true);if(e.target.closest('.vs-room-mobile button'))pop.classList.remove('is-open')});root.addEventListener('keydown',e=>{const z=e.target.closest('.vs-room-zone');if(z&&(e.key==='Enter'||e.key===' ')){e.preventDefault();act(z.dataset.zone,true)}});act((d.zones.find(z=>z.our_pick)||d.zones[0]).id,false)}document.querySelectorAll('[data-seat-layout]').forEach(mount);const b=[...document.querySelectorAll('#photos .gallery button')],l=document.getElementById('lightbox');if(b.length&&l){const img=l.querySelector('#lightboxImg, img');let i=0,x=null;let p=l.querySelector('.vs-lb-prev'),n=l.querySelector('.vs-lb-next'),c=l.querySelector('.vs-lb-count');if(!p){p=document.createElement('button');p.type='button';p.className='vs-lb-nav vs-lb-prev';p.textContent='‹';p.setAttribute('aria-label','Previous photo');n=document.createElement('button');n.type='button';n.className='vs-lb-nav vs-lb-next';n.textContent='›';n.setAttribute('aria-label','Next photo');c=document.createElement('div');c.className='vs-lb-count';l.append(p,n,c)}const show=j=>{i=(j+b.length)%b.length;const t=b[i].querySelector('img');img.src=t.currentSrc||t.src;img.alt=t.alt||'Show photo';c.textContent=`${i+1} of ${b.length}`};b.forEach((q,j)=>q.addEventListener('click',()=>show(j)));p.onclick=e=>{e.stopPropagation();show(i-1)};n.onclick=e=>{e.stopPropagation();show(i+1)};addEventListener('keydown',e=>{if(!l.classList.contains('open'))return;if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});l.addEventListener('touchstart',e=>x=e.changedTouches[0]?.clientX??null,{passive:true});l.addEventListener('touchend',e=>{if(x==null)return;const dx=(e.changedTouches[0]?.clientX??x)-x;x=null;if(Math.abs(dx)>45)show(i+(dx<0?1:-1))},{passive:true})}})();'''
          (root/'assets/seat-layouts/room-map.js').write_text(js+'\n')

          def static_svg(d):
            vb=d['viewBox']; W,H=1200,1000
            zones=[]
            for z in d['zones']:
              rows=''.join(f'<path d="M4 {y} H116" clip-path="url(#c-{html.escape(z["id"])})" fill="none" stroke="rgba(255,255,255,.25)" stroke-width=".34"/>' for y in z.get('rows',[]))
              zones.append(f'<clipPath id="c-{html.escape(z["id"])}"><path d="{z["path"]}"/></clipPath><path d="{z["path"]}" fill="{z["color"]}" stroke="rgba(255,255,255,.75)" stroke-width=".7"/>{rows}<text x="{z["labelX"]}" y="{z["labelY"]}" text-anchor="middle" dominant-baseline="middle" fill="{"#171225" if z["our_pick"] else "#fff"}" font-family="Inter,Arial" font-size="3.6" font-weight="800">{html.escape(z["label"].replace('Section ',''))}</text>')
            structs=''.join(f'<path d="{s["path"]}" fill="#25163a" stroke="#ba8cff" stroke-width=".55"/><text x="{s["labelX"]}" y="{s["labelY"]}" text-anchor="middle" fill="#dcc8ff" font-size="3">{html.escape(s["label"])}</text>' for s in d.get('structures',[]))
            return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="{vb}"><rect width="120" height="110" rx="5" fill="#0d0815"/><text x="6" y="107" fill="#fff" font-family="Inter,Arial" font-size="3.1" font-weight="800">{html.escape(d['venue'])}</text>{''.join(zones)}{structs}<path d="{d['stage']['path']}" fill="#17121e" stroke="#ffb000" stroke-width=".7"/><text x="{d['stage']['labelX']}" y="{d['stage']['labelY']}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-family="Inter,Arial" font-size="4" font-weight="900">STAGE</text><rect x="79" y="103" width="35" height="4" rx="2" fill="#ffb000"/><text x="96.5" y="105.7" text-anchor="middle" fill="#171225" font-family="Inter,Arial" font-size="2.3" font-weight="900">OUR PICK · SWEET SPOT</text></svg>'''
          for key,d in layouts.items(): (root/f'images/{key}-seating-chart.svg').write_text(static_svg(d))

          targets={
            'shin-lim':{'path':'shows/magic/shin-lim/index.html','layout':'palazzo-theatre','chart':'palazzo-theatre-seating-chart.svg','seat_heading':'Find your seat at the Palazzo Theatre','seat_lede':'The room fans outward from three VIP blocks into main-floor Sections 1–3, then wider middle and upper tiers. Section 2 is our centered Sweet Spot.','take':'Shin Lim is a strong pick when the technical skill is the reason you are booking. Section 2 keeps the close-up work centered without putting you right on top of the stage, and the 7:30 PM start fits easily after dinner.','fit':'A strong fit for people who want precision sleight of hand and mentalism in a polished theater setting.','age':'4+','start_label':'Start time','faq_price':'Tickets currently start at $67. Other price points may be available.'},
            'x-burlesque':{'path':'shows/adult/x-burlesque/index.html','layout':'bugsys-cabaret','chart':'bugsys-cabaret-seating-chart.svg','seat_heading':"Find your seat at Bugsy's Cabaret",'seat_lede':'Bugsy’s Cabaret wraps around a central pole/performance area, with Pink Circle seats inside the VIP and General Admission zones. Pink Circle 2, 3 and 4 are our Sweet Spot group.','take':'X Burlesque is a straightforward pick when you want a classic adults-only Vegas revue in an intimate room. The 75-minute runtime also makes it easy to pair with dinner or another late-night stop.','fit':'A strong fit for adults who want a compact, late-night Vegas revue with an intimate cabaret setup.','start_label':'Start times','faq_price':'Tickets currently start at $82. Other price points may be available.'},
            'comedy-cellar':{'path':'shows/comedy/comedy-cellar/index.html','layout':'comedy-cellar-rio','chart':'comedy-cellar-rio-seating-chart.svg','seat_heading':'Find your seat at Comedy Cellar','seat_lede':'This is an intimate comedy-club room, not a big theater. VIP hugs the stage, Preferred fills the strongest central sightlines, and GA / GA 2 wrap farther out. Preferred is our Sweet Spot.','take':'Comedy Cellar is one of the easiest picks when you want stand-up instead of a production show: five headliner-level comics in about 90 minutes, with 7 PM and 9:30 PM shows every night.','fit':'A strong fit for adults who want a real comedy-club format with multiple comics and two nightly start times.','start_label':'Start times','faq_price':'Tickets currently start at $38. Other price points may be available.'}
          }
          for slug,cfg in targets.items():
            p=root/cfg['path']; soup=BeautifulSoup(p.read_text(),'html.parser')
            # shared seat assets
            if not soup.find('link',href=re.compile(r'^/assets/seat-layouts/room-map.css')): soup.head.append(soup.new_tag('link',rel='stylesheet',href='/assets/seat-layouts/room-map.css?v=1'))
            if not soup.find('script',src=re.compile(r'^/assets/seat-layouts/room-map.js')): soup.body.append(soup.new_tag('script',src='/assets/seat-layouts/room-map.js?v=1'))
            # price/freshness line in hero
            upd=soup.select_one('.hero-copy .updated')
            price=soup.select_one('.hero-copy .price')
            if upd and price:
              num=re.sub(r'[^0-9.]','',price.get_text(' ',strip=True))
              upd.string=f'Tickets start at ${num}. Other price points may be available.'
            # facts label
            for f in soup.select('.facts .fact'):
              sp=f.find('span')
              if sp and 'Typical start' in sp.get_text(): sp.string=cfg['start_label']
            # shin age official override
            if slug=='shin-lim':
              for t in soup.find_all(string=re.compile(r'No children ages 4 and under')): t.replace_with(t.replace('No children ages 4 and under','4+'))
              for tag in soup.find_all(['script']):
                if tag.get('type')=='application/ld+json' and tag.string:
                  tag.string=tag.string.replace('No children ages 4 and under','4+').replace('Children ages 5 and older are welcome.','Children ages 4 and older are welcome.')
            # quick take positive rewrite
            take=soup.select_one('#quick .take p')
            if take: take.string=cfg['take']
            good=soup.select_one('#quick .decision-card.good p')
            if good: good.string=cfg['fit']
            fit=soup.select_one('#fit .fit-card.good')
            if fit:
              fit.clear(); h=soup.new_tag('h3'); h.string='Good fit'; fit.append(h); pp=soup.new_tag('p'); pp.string=cfg['fit']; fit.append(pp)
            # remove gallery narration
            ph=soup.select_one('#photos h2')
            if ph:
              nxt=ph.find_next_sibling('p')
              if nxt and ('Use the photos' in nxt.get_text() or 'understand the scale' in nxt.get_text()): nxt.decompose()
            # add chart to gallery
            gal=soup.select_one('#photos .gallery')
            if gal and not gal.find('img',src=f'/images/{cfg["chart"]}'):
              btn=soup.new_tag('button',type='button'); btn['class']=['vs-chart-gallery']; btn['aria-label']='Open seating chart'
              im=soup.new_tag('img',src=f'/images/{cfg["chart"]}',loading='lazy',alt=f'{layouts[cfg["layout"]]["venue"]} seating chart for {soup.h1.get_text(strip=True)}')
              btn.append(im); gal.append(btn)
            # seat section replacement
            old=soup.find('section',id='seats')
            ticket=(soup.select_one('.buybox a[href]') or {}).get('href','') if soup.select_one('.buybox a[href]') else ''
            sec=BeautifulSoup(f'''<section class="section" id="seats"><div class="wrap"><div class="eyebrow">Seat guide</div><h2>{html.escape(cfg['seat_heading'])}</h2><p class="lede">{html.escape(cfg['seat_lede'])}</p><div class="vs-room-seat-guide" data-seat-layout="{cfg['layout']}" data-layout-url="/data/seat-layouts/{cfg['layout']}.json" data-ticket-url="{html.escape(ticket)}"></div></div></section>''','html.parser').section
            if old: old.replace_with(sec)
            # FAQ price visible and schema text
            for node in soup.find_all(string=re.compile(r'Tickets currently start at \$')):
              if node.parent and node.parent.name!='script': node.replace_with(cfg['faq_price'])
            for tag in soup.find_all('script',type='application/ld+json'):
              if tag.string: tag.string=re.sub(r'Tickets currently start at \$[0-9]+\. Your date and seat determine the final total\.',cfg['faq_price'],tag.string)
            # dates
            for tag in soup.find_all('script',type='application/ld+json'):
              if tag.string and '"@type":"WebPage"' in tag.string:
                tag.string=re.sub(r'"dateModified":"[^"]+"','"dateModified":"2026-09-12"',tag.string); tag.string=re.sub(r'"lastReviewed":"[^"]+"','"lastReviewed":"2026-09-12"',tag.string)
            # freshness near author only
            text=str(soup)
            text=re.sub(r'Last updated September 2026[^<]*','',text)
            if 'Show info confirmed September 2026' not in text:
              s=BeautifulSoup(text,'html.parser'); author=s.select_one('.author-card,.byline-card,.review-card')
              if author:
                fresh=s.new_tag('div'); fresh['class']=['show-freshness']; fresh.string='Show info confirmed September 2026'; author.append(fresh)
              soup=s
            else: soup=BeautifulSoup(text,'html.parser')
            p.write_text(str(soup))

          # Update Shin top-level data guidance only; preserve Spotlight raw field.
          dbp=root/'data/show-database.json'; db=json.loads(dbp.read_text())
          for r in db['records']:
            if r.get('slug')=='shin-lim':
              r['age_summary']='4+'
              r['verified_on']='2026-09-12';r['freshness_label']='September 2026'
              note=r.get('notes','')
              marker='Official Venetian guidance: audiences 4+ (verified 2026-09-12).'
              if marker not in note:r['notes']=(note+' '+marker).strip()
          dbp.write_text(json.dumps(db,indent=2,ensure_ascii=False)+'\n')
          PY
