name: One-off show runtime compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-runtime-compat.yml'

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime selectors and Fantasy counter speed
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('components/show-canonical-runtime.js')
          text = runtime.read_text(encoding='utf-8')
          old = "document.querySelectorAll('.fact strong,.stat .n,.stat-num,.sv-fact b')"
          new = "document.querySelectorAll('.fact strong,.stat .n,.stat-num,.sv-fact span')"
          if old not in text:
              raise RuntimeError('Expected fact selector not found')
          text = text.replace(old, new, 1)
          old_guard = "var raw=(el.textContent||'').trim(),m=raw.match(/^([^0-9]*)(\\d+(?:\\.\\d+)?)(.*)$/);if(!m)return;"
          new_guard = "var raw=(el.textContent||'').trim();if(el.matches('.sv-fact span')&&!/^\\s*[$]?\\d/.test(raw))return;var m=raw.match(/^([^0-9]*)(\\d+(?:\\.\\d+)?)(.*)$/);if(!m)return;"
          if old_guard not in text:
              raise RuntimeError('Expected counter parse block not found')
          text = text.replace(old_guard, new_guard, 1)
          old_days = "'.schedule .day:not(.dark),.daygrid .day:not(.dark),.sk-row:not(.is-dark),.schedule-grid .day-card:not(.dark)'"
          new_days = "'.schedule .day:not(.dark),.daygrid .day:not(.dark),.sk-row:not(.is-dark),.schedule-grid .day-card:not(.dark),.sv-day:not(.dark)'"
          if old_days not in text:
              raise RuntimeError('Expected schedule selector not found')
          text = text.replace(old_days, new_days, 1)
          runtime.write_text(text, encoding='utf-8')

          fantasy = Path('shows/adult/fantasy/index.html')
          f = fantasy.read_text(encoding='utf-8')
          if '(ts - start) / 1200' in f:
              f = f.replace('(ts - start) / 1200', '(ts - start) / 720', 1)
              fantasy.write_text(f, encoding='utf-8')
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/one-off-runtime-compat.yml
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/show-canonical-runtime.js shows/adult/fantasy/index.html .github/workflows/one-off-runtime-compat.yml
          git commit -m "Normalize show-v2 counters and schedule interactions"
          git push origin HEAD:main
