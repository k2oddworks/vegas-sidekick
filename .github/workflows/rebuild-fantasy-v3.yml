name: Rebuild Fantasy V3
on:
  push:
    paths:
      - '.github/workflows/rebuild-fantasy-v3.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run patched Fantasy rebuild
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/rebuild-fantasy.yml').read_text()
          start=wf.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=wf.index("\n          PY\n",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in wf[start:end].splitlines())
          old_author="""else:\n    raise SystemExit('author/freshness insertion point not found')"""
          new_author="""else:\n    author='''<section class=\"section\"><div class=\"wrap\"><p class=\"freshness-line\">Show info confirmed September 2026</p><div class=\"author-card\"><img src=\"/images/kris-kidd.webp\" alt=\"Kris Kidd\" loading=\"lazy\"/><div><strong>Kris Kidd</strong><p>Las Vegas local since 2005 · in show ticketing since 2006.</p><a href=\"/about/kris-kidd/\">About Kris →</a></div></div><p class=\"disclosure-line\">Vegas Sidekick may earn a commission if you book through our ticket links, at no extra cost to you.</p></div></section>'''\n    final_marker='<section class=\"section\"><div class=\"wrap\"><div class=\"final\">'\n    if final_marker in text:\n        text=text.replace(final_marker,author+final_marker,1)\n    else:\n        text=text.replace('</main>',author+'</main>',1)"""
          old_db="rec=next(x for x in db if x.get('slug')=='fantasy')"
          new_db="records=db.get('shows',[]) if isinstance(db,dict) else db\nrec=next(x for x in records if isinstance(x,dict) and x.get('slug')=='fantasy')"
          if old_author not in code or old_db not in code:
              raise SystemExit('Could not patch source workflow')
          code=code.replace(old_author,new_author,1).replace(old_db,new_db,1)
          exec(compile(code,'rebuild-fantasy-patched-v3','exec'),{})
          PY
      - name: Run show-page audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          if [ -f scripts/audit-content-link-hygiene.py ]; then python3 scripts/audit-content-link-hygiene.py; fi
          git diff --check
          grep -q 'data-seat-layout="atrium-showroom-luxor"' shows/adult/fantasy/index.html
          grep -q 'fantasy-atrium-showroom-seating-chart.svg' shows/adult/fantasy/index.html
          grep -q 'Reserved 2 is the Sweet Spot / Our Pick' shows/adult/fantasy/index.html
          ! grep -q 'Typical start' shows/adult/fantasy/index.html
          ! grep -q 'Atrium Theater - Luxor Hotel' shows/adult/fantasy/index.html
          grep -q 'Show info confirmed September 2026' shows/adult/fantasy/index.html
      - name: Commit rebuilt page
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add shows/adult/fantasy/index.html data/show-database.json images/fantasy-atrium-showroom-seating-chart.svg assets/seat-layouts/atrium-showroom-luxor.js
          git commit -m 'Rebuild Fantasy on shared Atrium Showroom system'
          git push origin main
