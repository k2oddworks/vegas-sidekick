name: Hub API deployment preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hub-api-preflight.yml'
      - 'scripts/hub/preflight.py'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check existing Worker and D1 binding (read only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/hub/preflight.py
      - name: Run local schema smoke tests
        run: python3 scripts/hub/test_schema.py
