name: Rebuild Cirque guide conversion
on:
  push:
    paths:
      - scripts/rebuild-cirque-guide-conversion.py
      - .github/workflows/rebuild-cirque-guide-conversion.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 scripts/rebuild-cirque-guide-conversion.py
      - run: git diff --check
      - name: Commit rebuilt guide
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add guides/best-cirque-shows/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild Cirque guide for photography and conversion"
          git push origin main
