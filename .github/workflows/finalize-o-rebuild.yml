name: Finalize O rebuild
on:
  push:
    branches: [rebuild-o-benchmark]
    paths: ['.github/workflows/finalize-o-rebuild.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-o-benchmark
          fetch-depth: 0
      - name: Generate and refresh
        run: |
          python3 scripts/generate-o-theatre-seat-chart.py
          python3 scripts/finalize-o-rebuild.py
      - name: O regression checks
        run: |
          node --check assets/seat-layouts/o-theatre-bellagio.js
          python3 scripts/audit-o-rebuild.py
      - name: Repository audits
        run: |
          python3 scripts/audit-event-schema.py
          python3 scripts/audit-ticket-cta-color.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-catalog-js-syntax.py
          python3 scripts/audit-content-link-hygiene.py
          git diff --check
      - name: Commit audited rebuild
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git rm .github/workflows/finalize-o-rebuild.yml scripts/finalize-o-rebuild.py scripts/audit-o-rebuild.py
          git add data/show-database.json sitemap.xml images/o-theatre-bellagio-seating-chart.svg
          git diff --cached --check
          git commit -m 'Finalize audited O benchmark rebuild'
          git push origin rebuild-o-benchmark
