name: Run Content Link Hygiene

on:
  push:
    branches:
      - seo/stale-copy-link-hygiene
    paths:
      - scripts/audit-content-link-hygiene.py
      - scripts/fix-content-link-hygiene.py
      - scripts/fix-stale-source-rules.py
      - .github/workflows/run-content-link-hygiene.yml

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/stale-copy-link-hygiene
      - name: Clean stale customer copy
        run: python3 scripts/fix-content-link-hygiene.py
      - name: Align source rules
        run: python3 scripts/fix-stale-source-rules.py
      - name: Audit canonical content and links
        run: python3 scripts/audit-content-link-hygiene.py
      - name: Validate schema
        run: python3 scripts/audit-event-schema.py
      - name: Broad site health informational check
        continue-on-error: true
        run: python3 scripts/audit-site-health.py
      - name: Commit hygiene fixes
        run: |
          if git diff --quiet; then
            echo "No hygiene changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about affiliate-disclosure guides news shows terms BRAND.md SHOW-BUILDER-PROMPT.md VS_CHAT_CONTEXT.md
          git commit -m "Clean stale copy and internal link hygiene"
          git push origin HEAD:seo/stale-copy-link-hygiene
