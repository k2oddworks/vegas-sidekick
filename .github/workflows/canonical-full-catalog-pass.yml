name: Full canonical show layout conversion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonical-full-catalog-pass.yml'
permissions:
  contents: write
jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Canonicalize all remaining active show pages
        run: python3 scripts/canonicalize-show-pages.py
      - name: Validate schema except known closed Mad Apple archive
        shell: bash
        run: |
          set +e
          python3 scripts/audit-event-schema.py > /tmp/audit.txt 2>&1
          code=$?
          cat /tmp/audit.txt
          if [ $code -eq 0 ]; then exit 0; fi
          issues=$(grep -E '^shows/.+:' /tmp/audit.txt || true)
          if [ "$issues" = "shows/cirque/mad-apple/index.html: NO Event/EventSeries JSON-LD found" ]; then
            echo 'Allowing known closed Mad Apple archive exception.'
            exit 0
          fi
          exit $code
      - name: Structural canonical-layout audit
        shell: python
        run: |
          from pathlib import Path
          import json,re
          keep={
            'shows/music/vegas-the-show/index.html',
            'shows/cirque/ka/index.html',
            'shows/magic/mat-franco/index.html',
            'shows/cirque/mystere/index.html',
            'shows/comedy/carrot-top/index.html',
          }
          cats=['adult','cirque','comedy','family','magic','music','spectaculars']
          active=[]; failures=[]; converted=[]
          for cat in cats:
            for p in sorted((Path('shows')/cat).glob('*/index.html')):
              text=p.read_text(encoding='utf-8',errors='replace')
              ev=None
              for raw in re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',text,re.I|re.S):
                try:o=json.loads(raw)
                except:continue
                if isinstance(o,dict) and o.get('@type') in ('Event','EventSeries'):
                  ev=o;break
              if not ev or ev.get('eventStatus')!='https://schema.org/EventScheduled':continue
              rp=p.as_posix();active.append(rp)
              if rp in keep:continue
              converted.append(rp)
              required=[
                'data-canonical-layout="2"','class="facts"','class="ticker"','class="subnav"',
                'id="quick"','id="photos"','id="seats"','id="fit"','id="showtimes"','id="faq"',
                'Good fit','Think twice','You may also like','Make the next click useful','class="mobile-bar"',
                'class="author-card"'
              ]
              missing=[x for x in required if x not in text]
              if missing:failures.append((rp,missing))
              low=text.lower()
              for phrase in ['no hidden fees','zero hidden fees','secure booking','instant delivery','selling fast','prices may increase']:
                if phrase in low:failures.append((rp,['banned copy: '+phrase]))
          print('Active show pages:',len(active))
          print('Generated canonical pages:',len(converted))
          print('Approved benchmark pages:',len([p for p in active if p in keep]))
          if failures:
            for p,m in failures:print(p,'=>',m)
            raise SystemExit(1)
      - name: Commit full catalog conversion
        run: |
          git config user.name "Vegas Sidekick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/show-canonical.css assets/show-canonical.js shows
          if git diff --cached --quiet; then
            echo 'No show changes to commit.'
          else
            git commit -m "Convert active show catalog to canonical VEGAS layout"
            git push origin HEAD:main
          fi