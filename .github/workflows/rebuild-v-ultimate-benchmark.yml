pan><span class="ticker-sep">✦</span><span class="ticker-item">Comedy</span><span class="ticker-sep">✦</span><span class="ticker-item">Magic</span><span class="ticker-sep">✦</span><span class="ticker-item">Juggling</span><span class="ticker-sep">✦</span><span class="ticker-item">All ages</span><span class="ticker-sep">✦</span></div><div class="ticker-set"><span class="ticker-item">Acrobatics</span><span class="ticker-sep">✦</span><span class="ticker-item">Comedy</span><span class="ticker-sep">✦</span><span class="ticker-item">Magic</span><span class="ticker-sep">✦</span><span class="ticker-item">Juggling</span><span class="ticker-sep">✦</span><span class="ticker-item">All ages</span><span class="ticker-sep">✦</span></div></div></div><nav aria-label="On this page" class="subnav"><div class="wrap"><a href="#quick">Quick take</a><a href="#photos">Photos</a><a href="#seats">Seat guide</a><a href="#fit">Is it for you?</a><a href="#showtimes">Showtimes</a><a href="#faq">FAQ</a></div></nav><main id="main"><section class="section" id="quick"><div class="wrap verdict-grid"><div class="copy"><div class="eyebrow">The 30-second answer</div><h2>Is V – The Ultimate Variety Show worth seeing?</h2><p class="lede lede-highlight">One 75-minute show, several different kinds of acts: acrobatics, comedy, magic, juggling, roller skating and rotating specialty performances.</p><p>The variety format is the point. Instead of asking a mixed-age group to agree on one style of show, V moves from act to act and keeps the night changing. The rotating lineup also means the exact mix can evolve while the overall format stays familiar.</p><div class="take"><span>🌵</span><div><b>Kris’s take</b><p>V is an easy pick when one group wants several kinds of Vegas entertainment without committing to one specialty. The 75-minute runtime and all-ages policy also make it simple to fit into a family night at Planet Hollywood.</p></div></div></div><div class="decision"><div class="decision-card good"><h3>Good f