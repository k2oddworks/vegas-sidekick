name: Rebuild V Ultimate Variety benchmark
on:
  push:
    paths:
      - '.github/workflows/rebuild-v-ultimate-benchmark.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild V Ultimate Variety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          dbp=Path('data/show-database.json'); db=json.loads(dbp.read_text())
          rec=next(r for r in db['records'] if r['slug']=='v-the-ultimate-variety-show')
          assert rec['status']=='active'
          assert rec['our_price']==46 and rec['regular_price']==101 and rec['runtime_minutes']==75
          assert rec['ticket_url']=='https://spotlight.vegas/shows/production/v-the-ultimate-variety-show/ref/vegassidekick'
          assert rec['spotlight']['age_rule']=='No age restrictions. Lap sitting is allowed for children ages 2 and under.'
          assert rec['spotlight']['schedule_days']=={d:['7 PM'] for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']}
          ticket=rec['ticket_url']; price=rec['our_price']; regular=rec['regular_price']; venue=rec['venue']; age=rec['spotlight']['age_rule']

          layout={
            'id':'v-theater-main-floor-vip-ga','venue':'V Theater','address':'3667 S Las Vegas Blvd, Las Vegas, NV 89109','stage':'Stage',
            'zones':[
              {'id':'vip','label':'VIP Seating','our_pick':True,'badge':'Sweet spot','color':'#ffb000','description':'VIP Seating wraps the stage across the center and both sides. It is the Vegas Sidekick Sweet Spot / Our Pick for V because it keeps the specialty acts close while still giving you a strong view of the full performance area.'},
              {'id':'ga','label':'General Admission','our_pick':False,'badge':'Full-show view','color':'#6f86a8','description':'General Admission sits behind and beside the VIP areas, giving you a wider look at the full stage and a straightforward way to see the same rotating variety lineup.'}
            ],
            'shapes':[
              {'zone':'ga','points':'10,18 26,4 49,30 34,49'},
              {'zone':'ga','points':'50,4 96,8 97,24 51,24'},
              {'zone':'ga','points':'92,31 98,38 92,47 98,55 91,64 85,59 88,51 84,44'},
              {'zone':'vip','points':'51,24 94,24 92,33 90,33 91,39 87,39 88,45 84,45 85,51 80,51 81,58 55,58 55,63 48,63 48,58 43,58 44,52 39,52 40,46 35,46 37,39 33,39 35,33 31,33 34,24'},
              {'zone':'vip','points':'32,44 39,51 35,57 40,63 34,69 27,61 30,55 26,50'},
              {'zone':'vip','points':'84,44 90,50 87,56 92,61 86,68 79,62 82,56 78,51'},
              {'zone':'vip','points':'39,60 47,68 43,74 38,80 31,72'},
              {'zone':'vip','points':'76,60 82,68 87,75 80,81 73,73'},
              {'zone':'vip','points':'48,58 80,58 77,68 70,68 70,73 57,73 57,68 50,68'}
            ]
          }
          Path('data/seat-layouts/v-theater-main-floor-vip-ga.json').write_text(json.dumps(layout,indent=2)+'\n')

          css='''.vuv-seat-guide{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(280px,.88fr);gap:22px;align-items:start;margin-top:24px}.vuv-map{background:radial-gradient(circle at 50% 78%,rgba(255,176,0,.12),transparent 30%),linear-gradient(180deg,#160a24,#09060f);border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:18px;box-shadow:0 24px 60px rgba(13,4,24,.24)}.vuv-map svg{display:block;width:100%;height:auto}.vuv-shape{cursor:pointer;stroke:rgba(255,255,255,.5);stroke-width:.7;transition:.18s}.vuv-shape:hover,.vuv-shape:focus{filter:brightness(1.12)}.vuv-shape.is-active{stroke:#ffb000;stroke-width:2.2;filter:drop-shadow(0 0 5px rgba(255,176,0,.65))}.vuv-stage{fill:#111}.vuv-map-label{font:800 4px Inter,Arial,sans-serif;fill:#fff;pointer-events:none}.vuv-stage-label{font:900 5px Inter,Arial,sans-serif;fill:#fff;letter-spacing:.12em}.vuv-cards{display:grid;gap:12px}.vuv-card{appearance:none;text-align:left;padding:18px;border-radius:18px;border:1px solid #e9e2f2;background:#fff;cursor:pointer}.vuv-card.is-active{border-color:#ffb000;box-shadow:0 0 0 2px rgba(255,176,0,.16)}.vuv-card h3{margin:0 0 6px}.vuv-card p{margin:0;color:#62596d}.vuv-badge{display:inline-block;margin-left:6px;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;background:#ffb000;color:#171225;padding:4px 7px;border-radius:999px}.vuv-detail{margin-top:14px;padding:18px;border:1px solid #e9e2f2;border-radius:18px;background:#fff}.vuv-detail .tag{font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#7a7080}.vuv-detail h3{margin:5px 0 8px}.vuv-detail p{margin:0 0 14px}.vuv-detail .cta{width:100%}.vuv-mobile{display:none}.vuv-chart-gallery img{object-fit:contain!important;background:#09060f}.vuv-lb-nav{position:absolute!important;top:50%!important;transform:translateY(-50%);z-index:3;width:52px!important;height:52px!important;border-radius:50%!important;background:#fff!important;color:#17082e!important;font-size:2rem!important}.vuv-lb-prev{left:18px!important;right:auto!important}.vuv-lb-next{right:18px!important}.vuv-lb-count{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;background:rgba(23,8,46,.82);color:#fff;padding:6px 11px;border-radius:999px;font-size:.8rem;font-weight:800}@media(max-width:820px){.vuv-seat-guide{grid-template-columns:1fr}.vuv-cards,.vuv-detail{display:none}.vuv-map{padding:10px}.vuv-mobile{position:fixed;left:14px;right:14px;bottom:98px;z-index:1100;display:block;padding:14px 48px 14px 15px;background:rgba(20,9,35,.97);color:#fff;border:1px solid rgba(255,176,0,.7);border-radius:16px;opacity:0;pointer-events:none;transform:translateY(16px);transition:.2s}.vuv-mobile.is-open{opacity:1;pointer-events:auto;transform:none}.vuv-mobile button{position:absolute;right:9px;top:8px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff}.vuv-mobile p{margin:5px 0 0;color:#ded7e4;font-size:.84rem}.vuv-lb-prev{left:8px!important}.vuv-lb-next{right:8px!important}.vuv-lb-count{bottom:100px}}'''
          Path('assets/seat-layouts/v-theater-main-floor-vip-ga.css').write_text(css+'\n')

          js=r'''(()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function mount(root){try{const data=await fetch(root.dataset.layoutUrl,{credentials:'same-origin'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),ticket=root.dataset.ticketUrl,by=Object.fromEntries(data.zones.map(z=>[z.id,z]));const polys=data.shapes.map((s,i)=>`<polygon tabindex="0" role="button" aria-label="${esc(by[s.zone].label)}" class="vuv-shape" data-zone="${esc(s.zone)}" points="${esc(s.points)}" fill="${esc(by[s.zone].color)}"/>`).join('');root.innerHTML=`<div class="vuv-map"><svg viewBox="0 0 100 92" aria-label="V Theater seating layout"><rect width="100" height="92" rx="4" fill="#0d0815"/><path class="vuv-stage" d="M35 84 L42 78 L57 78 L64 84 L77 84 L77 90 L23 90 L23 84 Z"/><text x="50" y="87" text-anchor="middle" class="vuv-stage-label">STAGE</text>${polys}<text x="63" y="43" text-anchor="middle" class="vuv-map-label">VIP SEATING</text><text x="28" y="31" text-anchor="middle" class="vuv-map-label">GENERAL ADMISSION</text><text x="73" y="15" text-anchor="middle" class="vuv-map-label">GENERAL ADMISSION</text></svg></div><div><div class="vuv-cards">${data.zones.map(z=>`<button type="button" class="vuv-card" data-zone="${esc(z.id)}"><h3>${esc(z.label)}${z.our_pick?'<span class="vuv-badge">Our Pick</span>':''}</h3><p>${esc(z.description)}</p></button>`).join('')}</div><div class="vuv-detail" aria-live="polite"><div class="tag"></div><h3></h3><p></p><a class="cta vs-ticket-primary" href="${esc(ticket)}" target="_blank" rel="noopener sponsored">Check seats →</a></div></div><div class="vuv-mobile" aria-live="polite"><strong></strong><p></p><button type="button" aria-label="Close seat description">×</button></div>`;const detail=root.querySelector('.vuv-detail'),pop=root.querySelector('.vuv-mobile');function activate(id,show){const z=by[id];if(!z)return;root.querySelectorAll('[data-zone]').forEach(x=>x.classList.toggle('is-active',x.dataset.zone===id));detail.querySelector('.tag').textContent=z.our_pick?'Sweet spot':'Seat guide';detail.querySelector('h3').textContent=z.label;detail.querySelector('p').textContent=z.description;pop.querySelector('strong').textContent=(z.our_pick?'Sweet spot · ':'')+z.label;pop.querySelector('p').textContent=z.description;if(show&&matchMedia('(max-width:820px)').matches)pop.classList.add('is-open')}root.addEventListener('click',e=>{const z=e.target.closest('[data-zone]');if(z)activate(z.dataset.zone,true);if(e.target.closest('.vuv-mobile button'))pop.classList.remove('is-open')});root.addEventListener('keydown',e=>{const z=e.target.closest('.vuv-shape');if(z&&(e.key==='Enter'||e.key===' ')){e.preventDefault();activate(z.dataset.zone,true)}});activate('vip',false)}catch(e){root.innerHTML='<p>Seat guide unavailable right now. Use the live ticket map to compare sections for your date.</p>'}}function gallery(){const b=[...document.querySelectorAll('#photos .gallery button')],l=document.getElementById('lightbox');if(!b.length||!l)return;const img=l.querySelector('#lightboxImg, img');let i=0,x=null,p=l.querySelector('.vuv-lb-prev'),n=l.querySelector('.vuv-lb-next'),c=l.querySelector('.vuv-lb-count');if(!p){p=document.createElement('button');p.className='vuv-lb-nav vuv-lb-prev';p.textContent='‹';p.setAttribute('aria-label','Previous photo');n=document.createElement('button');n.className='vuv-lb-nav vuv-lb-next';n.textContent='›';n.setAttribute('aria-label','Next photo');c=document.createElement('div');c.className='vuv-lb-count';l.append(p,n,c)}const show=j=>{i=(j+b.length)%b.length;const t=b[i].querySelector('img');img.src=t.currentSrc||t.src;img.alt=t.alt||'V – The Ultimate Variety Show photo';c.textContent=`${i+1} of ${b.length}`};b.forEach((q,j)=>q.addEventListener('click',()=>show(j)));p.onclick=e=>{e.stopPropagation();show(i-1)};n.onclick=e=>{e.stopPropagation();show(i+1)};addEventListener('keydown',e=>{if(!l.classList.contains('open'))return;if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});l.addEventListener('touchstart',e=>x=e.changedTouches[0]?.clientX??null,{passive:true});l.addEventListener('touchend',e=>{if(x==null)return;const d=(e.changedTouches[0]?.clientX??x)-x;x=null;if(Math.abs(d)>45)show(i+(d<0?1:-1))},{passive:true})}document.querySelectorAll('[data-seat-layout="v-theater-main-floor-vip-ga"]').forEach(mount);gallery()})();'''
          Path('assets/seat-layouts/v-theater-main-floor-vip-ga.js').write_text(js+'\n')

          # Static chart from the same shapes/data.
          colors={z['id']:z['color'] for z in layout['zones']}
          polys=''.join(f'<polygon points="{s["points"]}" fill="{colors[s["zone"]]}" stroke="#fff" stroke-opacity=".45" stroke-width=".6"/>' for s in layout['shapes'])
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 100 92"><rect width="100" height="92" rx="4" fill="#09060f"/><path d="M35 84 L42 78 L57 78 L64 84 L77 84 L77 90 L23 90 L23 84 Z" fill="#111" stroke="#ffb000" stroke-width=".7"/><text x="50" y="87" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800" font-size="4.4">STAGE</text>{polys}<text x="63" y="43" text-anchor="middle" fill="#171225" font-family="Arial" font-weight="800" font-size="4.2">VIP SEATING</text><rect x="51" y="47" width="24" height="5" rx="2.5" fill="#171225"/><text x="63" y="50.7" text-anchor="middle" fill="#ffb000" font-family="Arial" font-weight="800" font-size="2.2">SWEET SPOT / OUR PICK</text><text x="28" y="31" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800" font-size="3.2">GENERAL ADMISSION</text><text x="73" y="15" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800" font-size="3.2">GENERAL ADMISSION</text><text x="50" y="6" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800" font-size="3.4">V Theater · Miracle Mile Shops</text></svg>'''
          Path('images/v-the-ultimate-variety-show-v-theater-seating-chart.svg').write_text(svg)

          event={"@context":"https://schema.org","@type":"EventSeries","name":"V – The Ultimate Variety Show","description":"75-minute Las Vegas variety show featuring acrobatics, comedy, magic, juggling, roller skating and rotating specialty acts at V Theater inside Miracle Mile Shops.","image":["https://vegassidekick.com/images/v-the-ultimate-variety-show-hero.jpg","https://vegassidekick.com/images/v-the-ultimate-variety-show-show-2.webp","https://vegassidekick.com/images/v-the-ultimate-variety-show-show-3.webp"],"url":"https://vegassidekick.com/shows/family/v-the-ultimate-variety-show/","eventStatus":"https://schema.org/EventScheduled","organizer":{"@type":"Organization","name":"V – The Ultimate Variety Show","url":"https://vegassidekick.com/shows/family/v-the-ultimate-variety-show/"},"location":{"@type":"Place","name":venue,"address":{"@type":"PostalAddress","streetAddress":"3667 S Las Vegas Blvd","addressLocality":"Las Vegas","addressRegion":"NV","postalCode":"89109","addressCountry":"US"}},"performer":{"@type":"PerformingGroup","name":"V – The Ultimate Variety Show"},"offers":{"@type":"Offer","url":ticket,"price":46,"priceCurrency":"USD","availability":"https://schema.org/InStock","priceValidUntil":"2027-12-31","validFrom":"2026-01-01"},"eventSchedule":{"@type":"Schedule","byDay":["https://schema.org/Monday","https://schema.org/Tuesday","https://schema.org/Wednesday","https://schema.org/Thursday","https://schema.org/Friday","https://schema.org/Saturday","https://schema.org/Sunday"],"startTime":"19:00"},"eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","@id":"https://vegassidekick.com/shows/family/v-the-ultimate-variety-show/#event","duration":"PT75M","audience":{"@type":"Audience","audienceType":age}}
          faq_items=[
            ('Where is V Theater at Planet Hollywood?','V Theater is inside the Miracle Mile Shops at Planet Hollywood on the Las Vegas Strip. The listed address is 3667 S Las Vegas Blvd. Give yourself enough time to navigate the shops before the performance.'),
            ('Is V – The Ultimate Variety Show appropriate for kids?','Yes. There are no age restrictions. Children ages 2 and under may sit on a parent’s lap without their own seat; older children need a ticket.'),
            ('How often does the V show lineup change?','The show uses a rotating variety format, so individual specialty acts can change while the core mix of acrobatics, comedy, magic, juggling and other variety performances remains.'),
            ('Which seats should I get for V – The Ultimate Variety Show?','VIP Seating is the Vegas Sidekick Sweet Spot / Our Pick. It wraps the stage across the center and sides and keeps you close to the rotating specialty acts. General Admission sits farther back and to the sides with a wider view of the full stage.'),
            ('How long is V – The Ultimate Variety Show?','The current listed runtime is 75 minutes.'),
            ('When does V – The Ultimate Variety Show perform?','The current listed schedule is daily at 7 PM. Confirm the exact date and time during checkout.'),
            ('How much are V – The Ultimate Variety Show tickets?','Tickets start at $46. Other price points may be available.')]
          faq={"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":q,"acceptedAnswer":{"@type":"Answer","text":a}} for q,a in faq_items]}
          crumbs={"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://vegassidekick.com/"},{"@type":"ListItem","position":2,"name":"Family Shows","item":"https://vegassidekick.com/shows/family/"},{"@type":"ListItem","position":3,"name":"V – The Ultimate Variety Show","item":"https://vegassidekick.com/shows/family/v-the-ultimate-variety-show/"}]}
          web={"@context":"https://schema.org","@type":"WebPage","url":"https://vegassidekick.com/shows/family/v-the-ultimate-variety-show/","dateModified":"2026-09-10","lastReviewed":"2026-09-10","author":{"@type":"Person","@id":"https://vegassidekick.com/about/kris-kidd/#kris","name":"Kris Kidd","url":"https://vegassidekick.com/about/kris-kidd/","image":"https://vegassidekick.com/images/kris-kidd.webp"},"mainEntity":{"@id":"https://vegassidekick.com/shows/family/v-the-ultimate-variety-show/#event"}}

          p=Path('shows/family/v-the-ultimate-variety-show/index.html'); old=p.read_text()
          head=old.split('<body',1)[0]
          head=re.sub(r'<title>.*?</title>','<title>V – The Ultimate Variety Show Las Vegas Tickets from $46 | Seat Guide</title>',head,1,flags=re.S)
          head=re.sub(r'<meta content="[^"]*" name="description"/>','<meta content="V – The Ultimate Variety Show is a 75-minute all-ages variety show at V Theater. Tickets from $46. Compare showtimes and the VIP Sweet Spot." name="description"/>',head,1)
          head=re.sub(r'<meta content="[^"]*" property="og:description"/>','<meta content="75-minute all-ages variety show with acrobatics, comedy, magic, juggling and rotating specialty acts at V Theater." property="og:description"/>',head,1)
          head=re.sub(r'<script type="application/ld\+json">.*?</script>\s*<script type="application/ld\+json">.*?</script>\s*<script type="application/ld\+json">.*?</script>\s*<script type="application/ld\+json">.*?</script>', ''.join('<script type="application/ld+json">'+json.dumps(x,ensure_ascii=False,separators=(',',':'))+'</script>' for x in [event,faq,crumbs,web]), head, count=1, flags=re.S)
          if 'v-theater-main-floor-vip-ga.css' not in head:
            head=head.replace('</head>','<link rel="stylesheet" href="/assets/seat-layouts/v-theater-main-floor-vip-ga.css?v=1"/><style id="vuv-benchmark-final">@media (min-width:801px){.hero-grid{grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);overflow:visible}.hero-copy{position:relative;z-index:2;padding-right:72px}.hero-media{position:relative;z-index:1;margin-left:-112px;overflow:hidden}.hero-media img{object-position:center center}.hero-media:after{background:linear-gradient(90deg,#2c0b4e 0%,rgba(44,11,78,.94) 12%,rgba(44,11,78,.58) 28%,rgba(44,11,78,.16) 46%,transparent 62%)}#quick .verdict-grid{grid-template-columns:1fr;max-width:920px}#quick .decision{max-width:760px;margin-top:18px}#quick .decision-card.good{display:flex;align-items:center;gap:16px;padding:14px 18px;border-top:0;border-left:6px solid var(--gold);min-height:0}#quick .decision-card.good h3{margin:0;white-space:nowrap}#quick .decision-card.good p{margin:0}}</style></head>')
          schedule=''.join(f'<div class="day"><a href="{ticket}" rel="noopener sponsored" target="_blank"><strong>{d}</strong><span>7 PM</span></a></div>' for d in ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'])
          faqs=''.join(f'<details><summary>{q}</summary><div>{a}</div></details>' for q,a in faq_items)
