name: Fix V seating chart badge
on:
  push:
    paths:
      - '.github/workflows/fix-v-seat-badge.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild readable Sweet Spot badge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          svg=Path('images/v-the-ultimate-variety-show-v-theater-seating-chart.svg')
          s=svg.read_text()
          old='<rect x="51" y="47" width="24" height="5" rx="2.5" fill="#171225"/><text x="63" y="50.7" text-anchor="middle" fill="#ffb000" font-family="Arial" font-weight="800" font-size="2.2">SWEET SPOT / OUR PICK</text>'
          new='<rect x="49" y="46.2" width="28" height="7.8" rx="3" fill="#171225"/><text x="63" y="49.5" text-anchor="middle" fill="#ffb000" font-family="Arial" font-weight="800" font-size="2.25"><tspan x="63" dy="0">SWEET SPOT</tspan><tspan x="63" dy="2.5">OUR PICK</tspan></text>'
          assert old in s, 'current badge markup not found'
          svg.write_text(s.replace(old,new,1))

          page=Path('shows/family/v-the-ultimate-variety-show/index.html')
          p=page.read_text()
          oldsrc='/images/v-the-ultimate-variety-show-v-theater-seating-chart.svg'
          newsrc='/images/v-the-ultimate-variety-show-v-theater-seating-chart.svg?v=2'
          assert oldsrc in p, 'seating chart src not found'
          page.write_text(p.replace(oldsrc,newsrc))
          PY
      - name: QA
        run: |
          python3 scripts/audit-content-link-hygiene.py
          python3 scripts/audit-mobile-show-heroes.py
          python3 scripts/audit-ticket-cta-color.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('images/v-the-ultimate-variety-show-v-theater-seating-chart.svg').read_text()
          p=Path('shows/family/v-the-ultimate-variety-show/index.html').read_text()
          assert 'width="1000" height="920" viewBox="0 0 100 92"' in s
          assert '<tspan x="63" dy="0">SWEET SPOT</tspan>' in s
          assert '<tspan x="63" dy="2.5">OUR PICK</tspan>' in s
          assert 'seating-chart.svg?v=2' in p
          PY
      - name: Commit
        run: |
          git config user.name 'Vegas Sidekick Operations'
          git config user.email 'operations@vegassidekick.com'
          git add images/v-the-ultimate-variety-show-v-theater-seating-chart.svg shows/family/v-the-ultimate-variety-show/index.html
          git commit -m 'Fix V seating chart Sweet Spot badge'
          git push origin main
