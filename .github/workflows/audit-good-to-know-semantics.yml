name: Audit Good To Know Semantics

on:
  push:
    paths:
      - '.github/workflows/audit-good-to-know-semantics.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan active show Good to know blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from html import unescape

          CLOSED={'shows/cirque/mad-apple/index.html','shows/magic/david-goldrake/index.html'}
          suspicious=[]
          all_blocks=[]
          patterns=(
              r'\byou want\b',
              r'\byou actually want\b',
              r'\byou would rather\b',
              r'\byou are really\b',
              r'\byou need\b',
              r'\byou prefer\b',
              r'\ba different show\b',
              r'\byour group is specifically looking\b',
              r'\bif you want\b',
          )

          for p in sorted(Path('shows').glob('*/*/index.html')):
              rel=p.as_posix()
              if rel in CLOSED:
                  continue
              s=p.read_text(encoding='utf-8', errors='ignore')
              # Capture compact decision cards and fit cards headed Good to know.
              for m in re.finditer(r'<div class="[^"]*(?:decision-card|fit-card)[^"]*"[^>]*>\s*<h3>Good to know</h3>(.*?)</div>', s, re.I|re.S):
                  raw=m.group(1)
                  txt=re.sub(r'<[^>]+>', ' ', raw)
                  txt=unescape(re.sub(r'\s+', ' ', txt)).strip()
                  all_blocks.append((rel,txt))
                  low=txt.lower()
                  if any(re.search(pt, low, re.I) for pt in patterns):
                      suspicious.append((rel,txt))

          print(f'GOOD_TO_KNOW_BLOCKS={len(all_blocks)}')
          print(f'SUSPICIOUS_BLOCKS={len(suspicious)}')
          print('\n--- SUSPICIOUS ---')
          for rel,txt in suspicious:
              print(f'{rel} :: {txt}')
          print('\n--- ALL BLOCKS ---')
          for rel,txt in all_blocks:
              print(f'{rel} :: {txt}')
          PY
